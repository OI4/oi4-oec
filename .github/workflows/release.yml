# Generated by oec/ci/cmd/cigen from oec/ci/pipelines (ADR-0032), do not edit:
# cd oec/ci && go run ./cmd/cigen (gate step 11 checks that this file is current).
#
# The release of the OEC deliverables (ADR-0033): on a tag oec-v<version>
# or by hand, every deliverable is built from one commit with
# oec/ci/release.sh and assembled with SHA256SUMS and the release notes
# into one workflow artifact. Nothing is published (no GitHub Release, no
# registry, no package index; Q-011).
name: release
on:
  push:
    tags:
      - oec-v*
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOTOOLCHAIN: auto
  CARGO_TERM_COLOR: never
jobs:
  ffi:
    name: liboec_ffi (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: windows-2025
            target: x86_64-pc-windows-gnu
    env:
      OEC_CI_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Install the system packages (Linux)
        if: "!(matrix.target == 'armv7-unknown-linux-gnueabihf')"
        run: oec/ci/packages.sh
      - name: Install the system packages and the ARMv7 cross toolchain
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: oec/ci/packages.sh --armv7
      - name: Install the Rust toolchain of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh --toolchain
      - name: Build the library (oec/ci/release.sh ffi)
        run: oec/ci/release.sh dist/release ffi
      - name: Upload the part (workflow artifact of this run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-release-ffi-${{ matrix.target }}
          path: dist/release
          if-no-files-found: error
          retention-days: "7"
  dist:
    name: Source, D7/D8, micro SDK, schema bundle, SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go (no cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/ci/go.mod
          cache: "false"
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Install the Rust toolchain of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh --toolchain
      - name: Fetch the crates of every Cargo.lock
        run: oec/ci/fetch.sh
      - name: Build the parts (oec/ci/release.sh)
        run: oec/ci/release.sh dist/release source binaries micro schema sbom
      - name: Upload the part (workflow artifact of this run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-release-dist
          path: dist/release
          if-no-files-found: error
          retention-days: "7"
  images:
    name: Images as OCI archives, judged by D8
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go (no cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/conformance/go.mod
          cache: "false"
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Build the images (oec/ci/release.sh images)
        run: oec/ci/release.sh dist/release images
      - name: Upload the part (workflow artifact of this run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-release-images
          path: dist/release
          if-no-files-found: error
          retention-days: "7"
  release:
    name: Assemble the release (SHA256SUMS, release notes)
    needs:
      - ffi
      - dist
      - images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go (no cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/ci/go.mod
          cache: "false"
      - name: Download the parts of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oec-release-*
          path: dist/release
          merge-multiple: "true"
      - name: Assemble (oec/ci/release.sh assemble)
        run: oec/ci/release.sh dist/release assemble
      - name: Upload the release (workflow artifact, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-release
          path: dist/release
          if-no-files-found: error
          retention-days: "30"
