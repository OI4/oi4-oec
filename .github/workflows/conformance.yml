#
# D7 oec-check and D8 oec-infra: gofmt, vet and the tests of oec/conformance on
# Linux, macOS and Windows (amd64 and arm64), and the binaries for
# windows/linux/darwin x amd64/arm64 as a workflow artifact (no release).
name: conformance
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOTOOLCHAIN: auto
  CARGO_TERM_COLOR: never
jobs:
  test:
    name: oec/conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: macos-15
          - os: macos-15-intel
          - os: windows-2025
          - os: windows-11-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/conformance/go.mod
          cache-dependency-path: oec/conformance/go.sum
      - name: gofmt, vet, test (oec/ci/conformance.sh)
        run: oec/ci/conformance.sh
  binaries:
    name: oec-check and oec-infra binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/conformance/go.mod
          cache-dependency-path: oec/conformance/go.sum
      - name: Cross-build (oec/ci/binaries.sh)
        run: oec/ci/binaries.sh dist/conformance
      - name: Upload the binaries (workflow artifact, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-conformance-binaries
          path: dist/conformance
          if-no-files-found: error
          retention-days: "14"
