# Generated by oec/ci/cmd/cigen from oec/ci/pipelines (ADR-0032), do not edit:
# cd oec/ci && go run ./cmd/cigen (gate step 11 checks that this file is current).
#
# The local gate oec/check.sh on Linux amd64/arm64 and macOS arm64, with the
# guideline repository next to oec/ as in the workspace; actionlint.
name: gate
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOTOOLCHAIN: auto
  CARGO_TERM_COLOR: never
jobs:
  gate:
    name: oec/check.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
          - os: ubuntu-24.04-arm
            cc: clang
          - os: macos-15
            cc: cc
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Check out the guideline (feature/spec-findings)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OI4/oi4-oec-documentation
          ref: feature/spec-findings
          path: oi4-oec-documentation
          fetch-depth: "0"
          persist-credentials: "false"
          token: ${{ secrets.OEC_GUIDELINE_TOKEN || github.token }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/conformance/go.mod
          cache-dependency-path: oec/**/go.sum
      - name: Cache the cargo tools and crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.oec-tools
            ~/.cargo/registry
          key: oec-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/**/Cargo.lock') }}
          restore-keys: oec-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the tools of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh
      - name: Fetch the crates of every Cargo.lock
        run: oec/ci/fetch.sh
      - name: Gate (oec/check.sh)
        run: oec/check.sh
  actionlint:
    name: actionlint (.github/workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/ci/go.mod
          cache-dependency-path: oec/ci/go.mod
      - name: actionlint (oec/ci/lint.sh)
        run: oec/ci/lint.sh
