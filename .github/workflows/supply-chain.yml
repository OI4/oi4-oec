# Generated by oec/ci/cmd/cigen from oec/ci/pipelines (ADR-0032), do not edit:
# cd oec/ci && go run ./cmd/cigen (gate step 11 checks that this file is current).
#
# The SBOM (SPDX 2.3), license texts and license report of every deliverable
# as a workflow artifact (no release, Q-011), and the vulnerability check of
# the dependencies: govulncheck, cargo deny check advisories, npm audit.
name: supply-chain
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOTOOLCHAIN: auto
  CARGO_TERM_COLOR: never
jobs:
  sbom:
    name: SBOM and license report of every deliverable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/demos/go.mod
          cache-dependency-path: oec/**/go.sum
      - name: Cache the crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
          key: oec-supply-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/**/Cargo.lock') }}
          restore-keys: oec-supply-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the Rust toolchain of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh --toolchain
      - name: Fetch the crates of every Cargo.lock
        run: oec/ci/fetch.sh
      - name: SBOM, license texts and license report (oec/ci/sbom.sh)
        run: oec/ci/sbom.sh dist/sbom
      - name: Upload the SBOMs (workflow artifact, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-sbom
          path: dist/sbom
          if-no-files-found: error
          retention-days: "14"
  audit:
    name: Vulnerability check (govulncheck, cargo deny, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/conformance/go.mod
          cache-dependency-path: oec/**/go.sum
      - name: Cache the cargo tools and crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.oec-tools
            ~/.cargo/registry
          key: oec-audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/**/Cargo.lock') }}
          restore-keys: oec-audit-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the tools of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh
      - name: govulncheck, cargo deny check advisories, npm audit (oec/ci/audit.sh)
        run: oec/ci/audit.sh dist/audit
      - name: Upload the outputs of the checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-audit
          path: dist/audit
          if-no-files-found: warn
          retention-days: "14"
