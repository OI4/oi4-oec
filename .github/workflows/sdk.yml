# Generated by oec/ci/cmd/cigen from oec/ci/pipelines (ADR-0032), do not edit:
# cd oec/ci && go run ./cmd/cigen (gate step 11 checks that this file is current).
#
# The SDK platform matrix: the Rust SDK and its C ABI on Linux, macOS and
# Windows (amd64 and arm64, Windows with MSVC), the Go SDK (Windows with
# MinGW), ARMv7 Linux as a cross build (best effort), and the prebuilt
# liboec_ffi of each target as a workflow artifact (no release).
name: sdk
on:
  push:
    branches:
      - main
    paths-ignore:
      - project/**
  pull_request:
    paths-ignore:
      - project/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOTOOLCHAIN: auto
  CARGO_TERM_COLOR: never
jobs:
  rust:
    name: Rust SDK and C ABI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cc: clang
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cc: clang
          - os: macos-15
            target: aarch64-apple-darwin
            cc: cc
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cc: cc
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            cc: clang
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            cc: clang
    env:
      OEC_CI_TARGET: ${{ matrix.target }}
      OEC_CI_CC: ${{ matrix.cc }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Cache the crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
          key: oec-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/sdk/rust/Cargo.lock') }}
          restore-keys: oec-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Install the system packages (Linux)
        run: oec/ci/packages.sh
      - name: Install the Rust toolchain of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh --toolchain
      - name: Build and test (oec/ci/sdk-rust.sh)
        run: oec/ci/sdk-rust.sh dist/sdk
      - name: Upload the prebuilt library (workflow artifact, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liboec_ffi-${{ matrix.target }}
          path: dist/sdk/liboec_ffi-${{ matrix.target }}
          if-no-files-found: error
          retention-days: "14"
  go:
    name: Go SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cc: clang
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cc: clang
          - os: macos-15
            target: aarch64-apple-darwin
            cc: cc
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cc: cc
          - os: windows-2025
            target: x86_64-pc-windows-gnu
            cc: gcc
    env:
      OEC_CI_CC: ${{ matrix.cc }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/sdk/go/go.mod
          cache-dependency-path: |
            oec/sdk/go/go.mod
            oec/conformance/go.sum
      - name: Cache the crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
          key: oec-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/sdk/rust/Cargo.lock') }}
          restore-keys: oec-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Install the system packages (Linux)
        run: oec/ci/packages.sh
      - name: Install the Rust toolchain of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh --toolchain
      - name: Build and test (oec/ci/sdk-go.sh)
        run: oec/ci/sdk-go.sh dist/sdk
      - name: Upload the prebuilt library (workflow artifact, not a release)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liboec_ffi-x86_64-pc-windows-gnu
          path: dist/sdk/liboec_ffi-x86_64-pc-windows-gnu
          if-no-files-found: error
          retention-days: "14"
  armv7:
    name: ARMv7 Linux, best effort (cross build, qemu-arm)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/sdk/go/go.mod
          cache-dependency-path: |
            oec/sdk/go/go.mod
      - name: Cache the crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
          key: oec-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/sdk/rust/Cargo.lock') }}
          restore-keys: oec-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Install the system packages and the ARMv7 cross toolchain
        run: oec/ci/packages.sh --armv7
      - name: Install the Rust toolchain of oec/ci/versions.sh
        run: oec/ci/setup-tools.sh --toolchain
      - name: Cross-build and test (oec/ci/sdk-armv7.sh)
        run: oec/ci/sdk-armv7.sh dist/sdk
      - name: Upload the prebuilt library (workflow artifact, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liboec_ffi-armv7-unknown-linux-gnueabihf
          path: dist/sdk/liboec_ffi-armv7-unknown-linux-gnueabihf
          if-no-files-found: error
          retention-days: "14"
