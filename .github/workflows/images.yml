# Generated by oec/ci/cmd/cigen from oec/ci/pipelines (ADR-0032), do not edit:
# cd oec/ci && go run ./cmd/cigen (gate step 11 checks that this file is current).
#
# The images of the demos, the OEC Registry and the compliance tools for
# linux/amd64 and linux/arm64, judged by D8; Getting started with them, the
# live run of D7/D8 with the registry and Podman. Nothing is pushed: the
# artifact holds the D8 reports and logs only (Q-011).
name: images
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOTOOLCHAIN: auto
  CARGO_TERM_COLOR: never
jobs:
  images:
    name: Images, Getting started, live D7/D8 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/conformance/go.mod
          cache-dependency-path: |
            oec/conformance/go.sum
            oec/dev/go.mod
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Build the images, D8 image and run (oec/ci/images.sh)
        run: oec/ci/images.sh dist/images
      - name: Getting started with the images (oec/ci/getting-started.sh)
        run: oec/ci/getting-started.sh
      - name: Live D7/D8 with the registry (oec/ci/live-infra.sh)
        run: oec/ci/live-infra.sh
      - name: Podman (oec/ci/podman.sh, amd64)
        if: matrix.os == 'ubuntu-24.04'
        run: oec/ci/podman.sh dist/images
      - name: Upload the D8 reports and logs (no image)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oec-images-reports-${{ matrix.os }}
          path: |
            dist/images
            !dist/images/*.oci.tar
          if-no-files-found: warn
          retention-days: "14"
