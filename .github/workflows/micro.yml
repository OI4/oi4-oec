# Generated by oec/ci/cmd/cigen from oec/ci/pipelines (ADR-0032), do not edit:
# cd oec/ci && go run ./cmd/cigen (gate step 11 checks that this file is current).
#
# The micro SDK: the host checks with GCC on Linux amd64/arm64 and Windows
# (MinGW), the ESP-IDF builds and D7 Level 1/2/3 in the Espressif QEMU
# (container pinned by digest), the Arduino library on Arduino-ESP32 3.3 and
# 4.0 (pinned arduino-cli). No artifacts.
name: micro
on:
  push:
    branches:
      - main
    paths-ignore:
      - project/**
  pull_request:
    paths-ignore:
      - project/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOTOOLCHAIN: auto
  CARGO_TERM_COLOR: never
jobs:
  host:
    name: Micro SDK host checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04-arm
            cc: gcc
          - os: windows-2025
            cc: gcc
    env:
      OEC_CI_CC: ${{ matrix.cc }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/sdk/micro/host/go.mod
          cache-dependency-path: |
            oec/sdk/micro/host/go.mod
            oec/conformance/go.sum
      - name: Cache the crates
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
          key: oec-micro-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/sdk/rust/Cargo.lock') }}
          restore-keys: oec-micro-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the system packages (Linux)
        run: oec/ci/packages.sh
      - name: Install the Rust toolchain of oec/ci/versions.sh (go-testbroker, Linux)
        if: runner.os != 'Windows'
        run: oec/ci/setup-tools.sh --toolchain
      - name: Host checks (oec/ci/micro-host.sh)
        run: oec/ci/micro-host.sh
  esp-idf:
    name: ESP-IDF esp32, esp32s3, qemu and QEMU D7 (Espressif container)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: oec/sdk/micro/host/go.mod
          cache-dependency-path: |
            oec/sdk/micro/host/go.mod
            oec/conformance/go.sum
      - name: Cache the crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
          key: oec-micro-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oec/ci/versions.sh', 'oec/sdk/rust/Cargo.lock') }}
          restore-keys: oec-micro-${{ runner.os }}-${{ runner.arch }}-
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Install the Rust toolchain of oec/ci/versions.sh (go-testbroker)
        run: oec/ci/setup-tools.sh --toolchain
      - name: Build and run D7 in QEMU (oec/ci/micro-esp-idf.sh)
        run: oec/ci/micro-esp-idf.sh
  arduino:
    name: Arduino library (Arduino-ESP32 ${{ matrix.core }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            core: "3.3"
          - os: ubuntu-24.04
            core: "4.0"
    env:
      OECM_ARDUINO_CORE: ${{ matrix.core }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Free disk space (hosted Linux runners)
        run: oec/ci/disk.sh
      - name: Build the examples (oec/ci/micro-arduino.sh)
        run: oec/ci/micro-arduino.sh
