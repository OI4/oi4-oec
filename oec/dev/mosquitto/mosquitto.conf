# Mosquitto of the OEC dev environment (oec/dev, C-051). DEVELOPMENT ONLY:
# the PKI and the passwords come from `go run ./pki` (oec/dev/generated/),
# the broker listens on loopback of the host only (compose.yaml).
#
# MG 6.2 / RIG 4.1: MQTT 3.1.1 over TLS only, no plain listener
# (REQ-MQTT-005, REQ-MQTT-006); the broker certificate is signed by the dev
# CA (REQ-MQTT-007); clients authenticate with credentials (listener 8883,
# REQ-MQTT-009) or with a client certificate (listener 8884, REQ-MQTT-010);
# the ACL lets only the probe user request Set, Del and Call (REQ-GEN-001).
# The TLS material is copied to /mosquitto/tls by the entrypoint of
# compose.yaml (owner mosquitto, mode 0600).

# -- logging: connects, disconnects and Wills are visible with
#    `docker compose logs -f mosquitto`
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# -- persistence: sessions with clean session 0 survive a broker restart
#    (interop test "broker restart"); QoS 0 messages are queued for them too
persistence true
persistence_location /mosquitto/data/
queue_qos0_messages true

# -- packet size (RIG 4.1.1 MaxPacketSize = 262144 in the sample broker.json,
#    SF-105): MaxPacketSize limits the MQTT payload (the NetworkMessage);
#    message_size_limit drops larger payloads, max_packet_size limits the
#    whole packet and disconnects, so it needs the largest PUBLISH header on
#    top: fixed header 5 + topic length 2 + topic 65535 + packet id 2 = 65544
message_size_limit 262144
max_packet_size 327688

# -- authentication: no anonymous clients; the password file applies to the
#    credentials listener (use_identity_as_username replaces it on 8884)
allow_anonymous false
password_file /mosquitto/tls/passwd

# -- authorization (MG 9.1, REQ-GEN-001; C-071): only oec-probe may publish
#    Set, Del and Call; every client reads Oi4v2/# and publishes Pub, Get and
#    Reply
#    (mosquitto/acl, copied to /mosquitto/tls by the entrypoint)
acl_file /mosquitto/tls/acl

# -- credentials over TLS 1.2/1.3 (REQ-MQTT-005, REQ-MQTT-009)
listener 8883
protocol mqtt
cafile /mosquitto/tls/ca.pem
certfile /mosquitto/tls/broker.pem
keyfile /mosquitto/tls/broker.key
tls_version tlsv1.2

# -- client certificate over TLS 1.2/1.3 (REQ-MQTT-010): the CN of the
#    certificate (= container name) is the user name
listener 8884
protocol mqtt
cafile /mosquitto/tls/ca.pem
certfile /mosquitto/tls/broker.pem
keyfile /mosquitto/tls/broker.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
