# OEC dev environment (oec/dev, C-051): Mosquitto with TLS 1.2/1.3 only.
# Works with `docker compose` and `podman compose`/podman-compose. Before the
# first start: `go run ./pki` (writes ./generated/, never committed).
# Ports are published on loopback only; change with OEC_DEV_BIND,
# OEC_DEV_MQTT_PORT and OEC_DEV_CERT_PORT (then pass the same ports to
# `go run ./pki -port … -cert-port …`). See README.md.
#
# Profile demos (opt-in, ADR-0028 §5, C-084): the demo services logger,
# weather and config of the local images (oec/demos/images/build.sh, never
# pulled), each with the container storage of `go run ./pki` and its
# container name of generated/demos.env (REQ-CNT-019, REQ-CNT-020):
#   docker compose --env-file generated/demos.env --profile demos up -d
# The Web UIs are published on 127.0.0.1 only (A-305).
#
# Profile registry (opt-in, ADR-0029 §12, C-090): the OEC Registry of the
# local image (oec/registry/images/build.sh, never pulled) with an
# application certificate of the dev CA (listener 8884), which also serves
# its HTTPS ports 5798 (Web UI and API) and 5799 (API), published on
# 127.0.0.1 only (A-417); together with the demos:
#   docker compose --env-file generated/demos.env --profile demos --profile registry up -d
# The demos then start after the registry (A-421): the registry lists an
# asset after its Birth (MG A1), and the config service of Level 1 answers
# no Get MAM (REQ-CMP-017 from Level 2). Started after the config service,
# the registry lists it only after the config service's next Birth.
name: oec-dev

services:
  mosquitto:
    # Mosquitto 2.1.2 (Alpine), multi-arch index digest of 2026-10-23
    image: docker.io/library/eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    hostname: mosquitto
    # copy the read-only TLS material, the password file and the ACL to a directory
    # owned by the broker user with mode 0600 (bind mounts keep the owner of
    # the host, Mosquitto refuses world-readable secrets in future versions)
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        install -d -o mosquitto -g mosquitto -m 0700 /mosquitto/tls &&
        install -o mosquitto -g mosquitto -m 0600 /oec/broker/ca.pem /oec/broker/broker.pem /oec/broker/broker.key /oec/broker/passwd /oec/acl/acl /mosquitto/tls/ &&
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "${OEC_DEV_BIND:-127.0.0.1}:${OEC_DEV_MQTT_PORT:-8883}:8883"
      - "${OEC_DEV_BIND:-127.0.0.1}:${OEC_DEV_CERT_PORT:-8884}:8884"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/oec/acl/acl:ro
      - ./generated/broker:/oec/broker:ro
      - data:/mosquitto/data
    healthcheck:
      # a TCP probe (each one logs an "unexpected eof" of the TLS listener)
      test: ["CMD", "nc", "-z", "127.0.0.1", "8883"]
      start_period: 30s
      start_interval: 1s
      interval: 60s
      timeout: 2s
      retries: 3
    restart: "no"

  oec-logger:
    profiles: [demos]
    image: oi4/oec-logger:${OEC_DEMOS_VERSION:-0.1.0}
    pull_policy: never
    container_name: ${OEC_LOGGER_NAME:-oec-logger}
    hostname: ${OEC_LOGGER_NAME:-oec-logger}
    ports:
      - "127.0.0.1:8781:8781"
    volumes:
      - ./generated/roots/oec-logger/etc/oi4/mqtt:/etc/oi4/mqtt:ro
      - ./generated/roots/oec-logger/etc/oi4/certs:/etc/oi4/certs:ro
      - ./generated/roots/oec-logger/run/secrets/oi4:/run/secrets/oi4:ro
      - oec-logger-etc:/etc/oi4/app
      - oec-logger-opt:/opt/oi4/app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mosquitto:
        condition: service_healthy
      oec-registry:
        condition: service_started
        required: false
    restart: "no"

  # the weather service starts with the provider simulation (offline); met-no
  # only after a Set of provider and userAgentContact (README of the demo)
  oec-weather:
    profiles: [demos]
    image: oi4/oec-weather:${OEC_DEMOS_VERSION:-0.1.0}
    pull_policy: never
    container_name: ${OEC_WEATHER_NAME:-oec-weather}
    hostname: ${OEC_WEATHER_NAME:-oec-weather}
    ports:
      - "127.0.0.1:8782:8782"
    volumes:
      - ./generated/roots/oec-weather/etc/oi4/mqtt:/etc/oi4/mqtt:ro
      - ./generated/roots/oec-weather/etc/oi4/certs:/etc/oi4/certs:ro
      - ./generated/roots/oec-weather/run/secrets/oi4:/run/secrets/oi4:ro
      - oec-weather-etc:/etc/oi4/app
      - oec-weather-opt:/opt/oi4/app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mosquitto:
        condition: service_healthy
      oec-registry:
        condition: service_started
        required: false
    restart: "no"

  oec-config:
    profiles: [demos]
    image: oi4/oec-config:${OEC_DEMOS_VERSION:-0.1.0}
    pull_policy: never
    container_name: ${OEC_CONFIG_NAME:-oec-config}
    hostname: ${OEC_CONFIG_NAME:-oec-config}
    environment:
      # the applications to ask at every connect (written by `go run ./pki`)
      OEC_CONFIG_FILE: /etc/oec-config/config-service.json
    ports:
      - "127.0.0.1:8783:8783"
    volumes:
      - ./generated/roots/oec-config/etc/oi4/mqtt:/etc/oi4/mqtt:ro
      - ./generated/roots/oec-config/etc/oi4/certs:/etc/oi4/certs:ro
      - ./generated/roots/oec-config/run/secrets/oi4:/run/secrets/oi4:ro
      - ./generated/roots/oec-config/etc/oec-config/config-service.json:/etc/oec-config/config-service.json:ro
      - oec-config-etc:/etc/oi4/app
      - oec-config-opt:/opt/oi4/app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mosquitto:
        condition: service_healthy
      oec-registry:
        condition: service_started
        required: false
    restart: "no"

  oec-registry:
    profiles: [registry]
    image: oi4/oec-registry:${OEC_REGISTRY_VERSION:-0.1.0}
    pull_policy: never
    container_name: ${OEC_REGISTRY_NAME:-oec-registry}
    hostname: ${OEC_REGISTRY_NAME:-oec-registry}
    environment:
      # the compose service name (a DNS alias in the compose network) for
      # Host besides localhost, the container name and IP literals; the
      # certificate of `go run ./pki` is valid for the same names
      OEC_REGISTRY_HOSTS: oec-registry
    ports:
      - "127.0.0.1:5798:5798"
      - "127.0.0.1:5799:5799"
    volumes:
      - ./generated/roots/oec-registry/etc/oi4/mqtt:/etc/oi4/mqtt:ro
      - ./generated/roots/oec-registry/etc/oi4/certs:/etc/oi4/certs:ro
      - ./generated/roots/oec-registry/run/secrets/oi4:/run/secrets/oi4:ro
      - oec-registry-etc:/etc/oi4/app
      - oec-registry-opt:/opt/oi4/app
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"

volumes:
  data:
  oec-logger-etc:
  oec-logger-opt:
  oec-weather-etc:
  oec-weather-opt:
  oec-config-etc:
  oec-config-opt:
  oec-registry-etc:
  oec-registry-opt:
