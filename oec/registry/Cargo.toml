# The OEC Registry D5 of P7 (ADR-0029, A-380): an own Cargo package outside
# the SDK workspace, on the Rust SDK `oec` by path, with its own Cargo.lock
# and the cargo-deny policy of the SDK (oec/sdk/rust/deny.toml).
# Dependencies within ADR-0023 (amendment C-086).
[package]
name = "oec-registry"
description = "OEC Registry (D5): collects the MAM and Health of the assets on the OI4 Message Bus and offers them with the Registry services of MG A1."
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
repository = "https://github.com/OI4/oec"

# Its own workspace: not a member of oec/sdk/rust.
[workspace]

[[bin]]
name = "oec-registry"
path = "src/main.rs"

[dependencies]
oec = { path = "../sdk/rust/oec" }
log = "0.4"

[dev-dependencies]
serde_json = "1"
# the pin of ADR-0019 §8; validates the API documents against the
# official meta-schemas (ADR-0029 §11, A-385)
jsonschema = { version = "=0.60.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
