# Capture fixtures of `oec-check monitor --replay` (DESIGN.md §10, C-052).
#
# The .jsonl files are generated from the scenarios in
# internal/monitor/fixtures_test.go (payloads derived from reviewed payload
# vectors; `go test ./internal/monitor -run TestFixtureFiles -update`).
# This index is test data with verdict (G-3.9): it states the expected
# outcome of the monitor tests at level 3 and goes to the PO for review.
#
# expect: test → outcome and the requirements that have this outcome (the
#         other requirements of the test pass or are not applicable).
#         Every implemented T7-MON test not listed passes or is skipped.
# status: draft | reviewed
captures:
  - file: lifecycle-pass.jsonl
    status: reviewed
    positive: true
    expect: {}
    notes: >-
      Two components (OTConnector A, ITConnector B) from Birth to Close over
      128 s. Every implemented monitor test passes; REQ-RES-HEALTH-004 is not
      observable and REQ-CMP-045 has no represented entity on the bus.
  - file: configuration-pass.jsonl
    status: draft
    positive: true
    expect: {}
    notes: >-
      A publishes Data oee and its DataSetMetaData under one DataSetClassId
      with the same fields (T7-MON-09) and its Profile with Data and Event
      plus a Syslog Event (T7-MON-13). MG B1.1.3: B sends Set Config
      (V-PAY-100) with the mandatory objects aut0-r3fr3sh and protocol of
      the published Config V-PAY-099 (T7-MON-17); A answers Status Good,
      publishes the Config V-PAY-114 and its MAM with RevisionCounter 2
      (Birth 1, T7-MON-16). B sets a PublicationList entry and a
      SubscriptionList entry; A answers Status Good and publishes the entry
      again with the ReplyTo of the Set (T7-MON-15, REQ-RES-PUBLIST-017/018,
      REQ-RES-SUBLIST-005/006). New in C-065. The heartbeat cannot be
      judged in 15 s (skip).
  - file: reconnect-pass.jsonl
    status: reviewed
    positive: true
    expect: {}
    notes: >-
      A's Will (MessageId of the connect, before the Birth, REQ-LIFE-016) is
      published by the broker after 20 s; A reconnects with a new Birth.
      T7-MON-03 passes; the heartbeat cannot be judged in 30 s (skip).
  - file: invalid-message.jsonl
    status: reviewed
    expect:
      T7-MON-01: {outcome: fail, reqs: [REQ-RES-HEALTH-001]}
  - file: publisher-mismatch.jsonl
    status: reviewed
    expect:
      T7-MON-01: {outcome: fail, reqs: [REQ-MSG-006, REQ-MSG-007]}
      T7-MON-02: {outcome: fail, reqs: [REQ-TOP-006, REQ-TOP-010]}
  - file: will-then-publish.jsonl
    status: reviewed
    expect:
      T7-MON-03: {outcome: fail, reqs: [REQ-CMP-003, REQ-LIFE-001]}
  - file: birth-mam-differs.jsonl
    status: reviewed
    expect:
      T7-MON-03: {outcome: fail, reqs: [REQ-LIFE-003]}
      T7-MON-08: {outcome: fail, reqs: [REQ-MSG-021]}
  - file: no-health.jsonl
    status: reviewed
    expect:
      T7-MON-04: {outcome: fail, reqs: [REQ-CMP-007]}
      T7-MON-05: {outcome: fail, reqs: [REQ-TOP-017]}
  - file: heartbeat-gap.jsonl
    status: reviewed
    expect:
      T7-MON-05: {outcome: fail, reqs: [REQ-TOP-017]}
  - file: close-then-publish.jsonl
    status: reviewed
    expect:
      T7-MON-05: {outcome: fail, reqs: [REQ-LIFE-014]}
  - file: message-id-duplicate.jsonl
    status: reviewed
    expect:
      T7-MON-06: {outcome: fail, reqs: [REQ-MSG-008]}
  - file: request-id-pending.jsonl
    status: reviewed
    expect:
      T7-MON-07: {outcome: fail, reqs: [REQ-ACT-011]}
  - file: writer-id-conflict.jsonl
    status: reviewed
    expect:
      T7-MON-08: {outcome: fail, reqs: [REQ-MSG-021, REQ-MSG-033, REQ-RES-PUBLIST-005]}
  - file: identity-conflict.jsonl
    status: reviewed
    expect:
      T7-MON-10: {outcome: info, reqs: [REQ-IL-010, REQ-IL-012]}
    notes: >-
      T7-MON-10 is a heuristic: its findings are hints (info), never failures.
  - file: empty-pub.jsonl
    status: reviewed
    expect:
      T7-MON-11: {outcome: fail, reqs: [REQ-CMP-042]}
  - file: retain-qos.jsonl
    status: reviewed
    expect:
      T7-MON-12: {outcome: fail, reqs: [REQ-CMP-009]}
    notes: REQ-MQTT-017 (QoS 0) is a SHOULD and gives warn.
  - file: packet-size.jsonl
    status: reviewed
    expect:
      T7-MON-18: {outcome: fail, reqs: [REQ-PAG-005]}
  - file: pagination-broken.jsonl
    status: reviewed
    expect:
      T7-MON-18: {outcome: fail, reqs: [REQ-PAG-004, REQ-PAG-005]}
    notes: >-
      Two Gets MAM for all pages with PerPage 1 (Page 0). The first answer
      publishes pages 1 and 3 of 3 (page 2 skipped, REQ-PAG-004); the second
      ends with page 1 and HasNext true, no further page follows
      (REQ-PAG-005). Changed in C-063 (back to draft): the Gets requested
      Page 1, for which only the requested page is published
      (REQ-PAG-002), so the second answer was conforming. Reviewed again in
      the C-063 review (R-2).
  - file: debug-event.jsonl
    status: reviewed
    expect:
      T7-MON-19: {outcome: fail, reqs: [REQ-TOP-024]}
  - file: class-id-unstable.jsonl
    status: draft
    expect:
      T7-MON-09: {outcome: fail, reqs: [REQ-MSG-013]}
    notes: >-
      A publishes Data oee (V-PAY-058) under DataSetClassId 1badfd0b-…, then
      with the same fields under another DataSetClassId, then under
      1badfd0b-… with the additional field Scrap: two violations of
      REQ-MSG-013. New in C-065.
  - file: no-data-event.jsonl
    status: draft
    expect:
      T7-MON-13: {outcome: fail, reqs: [REQ-CMP-010, REQ-CMP-036, REQ-CMP-038]}
    notes: >-
      A answers a Get Profile with a Profile about itself without Data and
      Event (V-PAY-032 edited) and publishes neither. B publishes no Profile
      and no Data/Event: its support is not observable (skip). New in C-065.
  - file: list-not-republished.jsonl
    status: draft
    expect:
      T7-MON-15: {outcome: fail, reqs: [REQ-RES-PUBLIST-017]}
    notes: >-
      B sets a PublicationList entry (V-PAY-040); A answers Status Good
      (V-PAY-078) but does not publish its PublicationList again within the
      tolerance of 5 s (observation ends 10.9 s later). New in C-065.
  - file: revision-not-counted.jsonl
    status: draft
    expect:
      T7-MON-16: {outcome: fail, reqs: [REQ-RES-MAM-018]}
    notes: >-
      MG B1.1.3 as in configuration-pass (the Set changes ip_address, port,
      protocol, …); 5.9 s after Status Good A answers a Get MAM with
      RevisionCounter 1, the value of its Birth. New in C-065.
  - file: set-config-mandatory-missing.jsonl
    status: draft
    expect:
      T7-MON-17: {outcome: fail, reqs: [REQ-RES-CONFIG-011]}
    notes: >-
      A publishes its Config V-PAY-099 (device1: aut0-r3fr3sh and protocol
      mandatory); B sends V-PAY-100 without protocol. The violation is B's
      (the requester). A does not answer (not judged). New in C-065.
