  - fault: T7-ADR-02/mixed
    status: reviewed
    expect:
      T7-ADR-02: {outcome: fail, reqs: [REQ-TOP-004]}
    notes: >-
      Like dual-version, but every answer to Get MAM is repeated under Oi4
      with the MessageId of the Oi4v2 request as CorrelationId: a request
      received under Oi4v2 is answered under Oi4 (REQ-TOP-004).
  - fault: T7-ADR-03/case
    status: reviewed
    expect:
      T7-ADR-03: {outcome: fail, reqs: [REQ-IL-015]}
      T7-MON-01: {outcome: fail, reqs: [REQ-MSG-023]}
    notes: >-
      The application compares the Source of a Get case-insensitively: Get
      MAM for groe.mca/DeviceModelB/Ac33.447/20443 (the asset with one
      letter in another case) is answered with the MAM of
      groe.mca/DeviceModelB/AC33.447/20443 (REQ-IL-015: compared character
      by character). The monitor also sees the DataSetWriterName differ
      from the Source of the topic (T7-MON-01, REQ-MSG-023).
  - fault: T7-GET-03/metadata
    status: reviewed
    expect:
      T7-GET-03: {outcome: fail, reqs: [REQ-CMP-008, REQ-CMP-037, REQ-RES-META-002]}
    notes: >-
      Get Metadata for the Data oee (announced in the PublicationList) is not
      answered: the Metadata listed in the Profile (REQ-CMP-008) and required
