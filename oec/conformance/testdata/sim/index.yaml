  - fault: T7-LIFE-02/no-birth
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-01, T7-LIFE-02, T7-LIFE-03]
    expect:
      T7-LIFE-02: {outcome: fail, reqs: [REQ-LIFE-001]}
      T7-MON-03: {outcome: fail, reqs: [REQ-CMP-003, REQ-LIFE-001]}
    notes: >-
      The CUT publishes no Birth after the reconnect (REQ-LIFE-001); the
      monitor sees the Health after the Will without a Birth on that
      connection (T7-MON-03, REQ-LIFE-001 and REQ-CMP-003). Without
      T7-LIFE-04 (C-067): the restart makes the monitor judge the reconnect
      after the Close message (T7-MON-05, REQ-LIFE-014) instead of after
      the Will.
  - fault: T7-LIFE-02/health-first
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-01, T7-LIFE-02, T7-LIFE-03]
    expect:
      T7-LIFE-02: {outcome: warn, reqs: [REQ-LIFE-015]}
    notes: >-
      The CUT publishes its Health before the Birth after the reconnect
      (REQ-LIFE-015, SHOULD: warn). The late Birth still fulfils REQ-
      LIFE-001 (T7-MON-03 passes since the C-066 change of the monitor). Without
      T7-LIFE-04 (C-067): the restart makes the monitor judge the reconnect
      after the Close message (T7-MON-05, REQ-LIFE-014) instead of after
      the Will.
  - fault: T7-LIFE-02/no-rebirth
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    expect:
      T7-LIFE-02: {outcome: fail, reqs: [REQ-LIFE-017]}
    notes: >-
      The CUT reports Health FAILURE_1/0 about itself while connected and
      recovers to NORMAL_0 without a new Birth (REQ-LIFE-017).
  - fault: T7-LIFE-02/recovery
    status: reviewed
    positive: true
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    notes: >-
      The conforming variant of no-rebirth: after FAILURE_1/0 while
      connected the CUT publishes its Birth again, then the normal Health.
      T7-LIFE-02 judges REQ-LIFE-017 (pass); T7-MON-10 does not count the
      recovery Birth as a second Birth (C-066).
  - fault: T7-LIFE-02/late-subscribe
    status: reviewed
    positive: true
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    notes: >-
      Conforming variant: the CUT publishes its Birth and subscribes 300 ms
      later, like the SDK demo (C-066 demo run). Through the proxy D7 waits
      for the CUT's first SUBACK before its discovery Get; the order of
      Birth and subscription is not judged. TestSimLateSubscribe checks
      that every request, the discovery Get included, is answered.
  - fault: T7-LIFE-03/writer-id
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    expect:
      T7-LIFE-03: {outcome: fail, reqs: [REQ-LIFE-009]}
      T7-MON-08: {outcome: fail, reqs: [REQ-MSG-021]}
    notes: >-
      The Will uses DataSetWriterId 3999 instead of the DataSetWriterId of
      the Health of the application (REQ-LIFE-009); T7-MON-08 sees the
      Health with another DataSetWriterId for the same DataSet (REQ-
      MSG-021).
  - fault: T7-LIFE-04/no-close
    status: reviewed
    tests: [T7-LIFE-04]
    expect:
      T7-LIFE-04: {outcome: fail, reqs: [REQ-CMP-046, REQ-LIFE-005]}
      T7-MON-10: {outcome: info, reqs: [REQ-IL-012]}
    notes: >-
      The restart hook stops the CUT; it disconnects gracefully (DISCONNECT)
      without publishing a Close message before (REQ-LIFE-005, graded by
      REQ-CMP-046). REQ-LIFE-006 and REQ-LIFE-007 are skipped: their
      condition (the CUT publishes a Close message) is not met. T7-MON-10
      reports the new Birth without Will or Close in between (REQ-IL-012,
      information).
  - fault: T7-LIFE-04/writer-id
    status: reviewed
    tests: [T7-LIFE-04]
    expect:
      T7-LIFE-04: {outcome: fail, reqs: [REQ-CMP-046, REQ-LIFE-007]}
      T7-MON-08: {outcome: fail, reqs: [REQ-MSG-021]}
    notes: >-
      The Close message (Health NORMAL_0/0 on the Health topic of the
      application) uses DataSetWriterId 3999 instead of the DataSetWriterId
      of the Health of the application, which D7 reads with Get Health
      after the restart (REQ-LIFE-007, graded by REQ-CMP-046); T7-MON-08
      sees the Health with another DataSetWriterId for the same DataSet
      (REQ-MSG-021).
  - fault: T7-LIFE-04/abort
    status: reviewed
    positive: true
    tests: [T7-LIFE-04]
    expect:
      T7-LIFE-04: {outcome: skip, reqs: [REQ-CMP-046, REQ-LIFE-005, REQ-LIFE-006, REQ-LIFE-007]}
    notes: >-
      Variant, not a failure: the restart breaks the connection of the CUT
      without DISCONNECT (the broker publishes its Will). That is no
      graceful disconnect, so REQ-LIFE-005 … 007 do not apply; D7 cannot
      tell whether the CUT or the restart hook is at fault and skips the
      test as inconclusive.
  - fault: T7-SET-10/not-persisted
    status: reviewed
    tests: [T7-SET-10]
    expect:
      T7-SET-10: {outcome: fail, reqs: [REQ-RES-REFDES-002]}
    notes: >-
      The CUT accepts the Set ReferenceDesignation (Status Good) but forgets
      it on the restart: after the restart Get ReferenceDesignation returns
      the object before the Set (REQ-RES-REFDES-002). D7 restores the
      original object afterwards.
  - fault: T7-ADR-01/own-app
    status: draft
    peer: true
    tests: [T7-ADR-01]
    expect:
      T7-ADR-01: {outcome: fail, reqs: [REQ-BUS-002, REQ-TOP-006, REQ-TOP-010]}
    notes: >-
      The CUT asks the peer for its MAM on its own Get topic with the peer
      as Source (Oi4v2/OTConnector/<AppId of the CUT>/Get/MAM/<AppId of the
      peer>) instead of the Get topic of the peer
      (Oi4v2/Utility/<AppId of the peer>/Get/MAM/<AppId of the peer>):
      ServiceType (REQ-TOP-006) and AppId (REQ-TOP-010) are not those of
      the destination, and the request is not published on the Get topic
      of the addressed component (REQ-BUS-002). The CUT answers its own
      request with Event Status Bad (BadNotFound).
  - fault: T7-ADR-01/service-type
    status: draft
    peer: true
    tests: [T7-ADR-01]
    expect:
      T7-ADR-01: {outcome: fail, reqs: [REQ-BUS-002, REQ-TOP-006]}
    notes: >-
      The CUT asks the peer for its MAM under the AppId of the peer, but
      with its own ServiceType OTConnector instead of Utility, the
      ServiceType of the peer (REQ-TOP-006); so the request is not on the
      Get topic of the peer (REQ-BUS-002). The AppId is right
      (REQ-TOP-010 passes). The peer does not see the request.
  - fault: T7-ADR-01/silent
    status: draft
    positive: true
    peer: true
    tests: [T7-ADR-01]
    expect:
      T7-ADR-01: {outcome: skip, reqs: [REQ-BUS-002, REQ-TOP-006, REQ-TOP-010]}
    notes: >-
      Variant, conforming: the CUT requests nothing of other components
      (it does not watch the bus). REQ-BUS-002, REQ-TOP-006 and
      REQ-TOP-010 apply to a requester only, so T7-ADR-01 is skipped (plain
      skip, not inconclusive: the peer was announced during the run).
