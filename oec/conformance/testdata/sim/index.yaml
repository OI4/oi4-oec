    notes: >-
      The CUT connects without user name, password and client certificate;
      the test broker accepts it (REQ-MQTT-009).
  - fault: T7-CON-04/retain
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    expect:
      T7-CON-04: {outcome: fail, reqs: [REQ-MQTT-018]}
    notes: >-
      The CUT publishes its Birth (Pub MAM about itself) with the retain
      flag (REQ-MQTT-018, MUST NOT at level 3), seen in the PUBLISH packet
      on the proxy.
  - fault: T7-LIFE-01/no-will
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    expect:
      T7-LIFE-01: {outcome: fail, reqs: [REQ-CMP-003, REQ-LIFE-008]}
      T7-MON-10: {outcome: info, reqs: [REQ-IL-012]}
    notes: >-
      The CUT registers no Will in its CONNECT (REQ-CMP-003, REQ-LIFE-008).
      After the drop it reconnects and publishes a new Birth without a Will
      in between: T7-MON-10 notes a second Birth (info). T7-LIFE-03 has no
      Will to check (skip).
  - fault: T7-LIFE-01/stale-will
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    expect:
      T7-LIFE-01: {outcome: fail, reqs: [REQ-LIFE-016]}
    notes: >-
      The CUT registers the fixed Will of MG B1.1.2 (MessageId of 2021) on
      every connection instead of creating it anew with the time of the
      connect (REQ-LIFE-016).
  - fault: T7-LIFE-01/timestamp
    status: reviewed
    tests: [T7-MON-*, T7-CON-*, T7-LIFE-*]
    expect:
      T7-LIFE-01: {outcome: warn, reqs: [REQ-LIFE-010]}
    notes: >-
      The DataSetMessage of the Will carries a Timestamp (REQ-LIFE-010,
