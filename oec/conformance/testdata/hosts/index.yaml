# Host roots of `oec-infra host` (DESIGN.md §9, §10; C-072).
#
# Each fixture is a root directory of internal/host/hosttest (the storages
# of RIG 4.1 of an application container with the test PKI of mqtttest,
# created at run time), the facts of a platform host, a mount table, a
# container daemon and – for T8-HST-04 – the test broker of mqtttest with
# the simulated OEC Registry of internal/bus/registrytest; the setup of a
# fault is in internal/host/fixtures_test.go (scenario). The conforming
# root ("none") has:
#   - etc/hostname oec-host-app (the container name);
#   - etc/oi4/mqtt: broker.pem (signed by the CA of the PKI) and
#     broker.json (Address 127.0.0.1, the port of the broker,
#     MaxPacketSize 262144), no broker_ca.pem;
#   - etc/oi4/certs: ca.pem (the CA of the PKI);
#   - run/secrets/oi4: credentials base64("app:app-secret") (0600);
#   - the three storages mounted read-only (mount table of the fixture);
#   - a host: Linux 6.1, x86_64, 2 GB main memory, 16 GB non-volatile
#     memory, eth0 (a device) up, a container daemon at
#     unix:///var/run/docker.sock;
#   - the broker accepts app/app-secret and runs the Registry
#     oi4.org/Registry/SIM/1 (heartbeat every 100 ms);
#   - for T8-HST-03 (C-073) the fake Engine API of
#     internal/engine/enginetest (--daemon) with the inspect documents
#     recorded from Docker 28.4 (testdata/containers/engine): App (own
#     volumes on /etc/oi4/app and /opt/oi4/app, own read-only bind on
#     /run/secrets/oi4, the Message Bus and OI4 certificate storage from
#     the host) and Sidecar (no OI4 storage). The T8-HST-03 scenarios
#     derive further containers from them (App2: a copy of App with its
#     own volumes and secret storage; Host, Stopped: recorded).
# D8 runs with --timeout 1s and --registry-wait 2s. This index is test data
# with verdict (G-3.9): it states the expected outcome of the host tests at
# level 3 and goes to the PO for review.
#
# fault:  the scenario ("none" = the conforming root and host)
# tests:  the tests of the run (patterns); empty: every host test
# expect: test → outcome, the requirements that have this outcome and the
#         requirements with a manual verdict (manual: a measured fact a
#         human judges, e.g. the patch level of REQ-PLT-003; it does not
#         make the test worse than pass); the other requirements of the
#         test have a better outcome or are not applicable. Every selected
#         test not listed passes without a manual verdict.
# status: draft | reviewed
hosts:
  - fault: none
    status: reviewed
    positive: true
    expect:
      T8-HST-04: {outcome: pass, manual: [REQ-PLT-003]}
    notes: >-
      The conforming root (credentials) with mounted storages on a
      conforming Linux host with a container daemon, the broker and the
      Registry: every host test passes; the patch level (REQ-PLT-003) is
      reported for a manual verdict. Since C-073 the run includes T8-HST-03
      against App and Sidecar (pass), re-reviewed in the C-073 review (R-1).
  - fault: T8-HST-01/broker-ca
    status: reviewed
    positive: true
    tests: [T8-HST-01, T8-HST-04]
    expect:
      T8-HST-04: {outcome: pass, manual: [REQ-PLT-003]}
    notes: >-
      The broker certificate is signed by a CA other than ca.pem and
      broker_ca.pem holds that CA; T8-HST-04 connects with broker_ca.pem.
  - fault: T8-HST-01/no-mqtt-storage
