# Test catalog of D7 `oec-check` (ADR-0025, design C-044).
#
# Each test names the requirements it checks. `catalog_test.go` keeps the
# catalog consistent with oec/spec/requirements: every active REQ with the
# verification `d7-monitor` is checked by a monitor test, every REQ with
# `d7-test` by an active test or listed under `manual` (only if its
# verification also contains `manual`).
#
# mode:   monitor – passive rule on the observed traffic (also active during `test`)
#         test    – active test against one component under test (CUT)
# level:  lowest level at which one of its REQs applies; the test runs at every
#         declared level (--level) >= its level (MG 1.3). Each REQ of the test is
#         judged by its own obligation at the declared level: e.g. at level 1 a
#         Get that is not answered is no failure (REQ-CMP-015 applies from
#         level 2), but a wrong answer is (REQ-BUS-003 applies at every level
#         where the CUT answers Get).
# needs:  attachment beyond a plain broker connection; without it the test is
#         skipped and the run is inconclusive for MUST requirements:
#         proxy        – D7 is the CUT's MQTT endpoint and relays to the broker
#         restart-hook – a command that stops and starts the CUT
#         peer         – D7 simulates a peer component that the CUT talks to
# status: planned (P3) | implemented (P5)
tool: oec-check
baseline: "51a0b50"
tests:
  # --- monitor: passive rules -------------------------------------------
  - id: T7-MON-01
    title: Every message in the Oi4v2 namespace is valid
    mode: monitor
    level: 1
    reqs: [REQ-TOP-002, REQ-TOP-003]
    status: implemented
    notes: Every observed message runs through the four layers of `validate`.
  - id: T7-MON-02
    title: Pub topics carry the publisher's ServiceType and AppId
    mode: monitor
    level: 1
    reqs: [REQ-TOP-006, REQ-TOP-010]
    status: implemented
    notes: The ServiceType/AppId of a Pub topic belong to the component whose Birth carried that AppId; the PublisherId names the same component.
  - id: T7-MON-03
    title: Birth message on every connection
    mode: monitor
    level: 1
    reqs: [REQ-CMP-003, REQ-LIFE-001, REQ-LIFE-002, REQ-LIFE-003]
    status: implemented
    notes: After a Close the next message of the component is a Birth; after a Will a Birth follows on the new connection (that it comes first is REQ-LIFE-015, T7-LIFE-02; C-066); the Birth equals the regular Pub MAM about itself and uses its DataSetWriterId.
  - id: T7-MON-04
    title: MAM and Health for the component and every subordinate asset
    mode: monitor
    level: 1
    reqs: [REQ-CMP-006, REQ-CMP-007, REQ-CMP-014, REQ-CMP-045]
    status: implemented
    notes: Every Source seen in a Pub of the component has MAM and Health; represented entities never publish a Birth, Will or Close of their own. For a Registry (ServiceType Registry) the other Sources are listed assets (MG A1), not represented ones; only the Registry itself is judged (C-087).
  - id: T7-MON-05
    title: Health at start, on change and every 60 seconds
    mode: monitor
    level: 1
    reqs: [REQ-TOP-017, REQ-RES-HEALTH-004, REQ-LIFE-014]
    status: implemented
    notes: The heartbeat applies to the Health of the component itself and is restarted by any own Health or the Birth (MG 7.5.1, SF-106). Heartbeat tolerance and the minimum observation time are parameters of the run (default 2 × 60 s + 5 s).
  - id: T7-MON-06
    title: MessageIds are unique
    mode: monitor
    level: 1
    reqs: [REQ-MSG-008, REQ-ACT-004]
    status: implemented
  - id: T7-MON-07
    title: RequestIds are unique among pending requests
    mode: monitor
    level: 1
    reqs: [REQ-ACT-011]
    status: implemented
    notes: Applies when the CUT sends Calls.
  - id: T7-MON-08
    title: DataSetWriterIds are consistent
    mode: monitor
    level: 1
    reqs: [REQ-MSG-021, REQ-MSG-033, REQ-RES-PUBLIST-005]
    status: implemented
  - id: T7-MON-09
    title: DataSetClassId is stable per structure
    mode: monitor
    level: 1
    reqs: [REQ-MSG-013]
    status: implemented
    notes: Publisher-defined DataSetClassIds are those of Data and of the DataSetMetaData; the structure is the set of field names (DataSetMessage payload keys, MetaData Fields). Compared within the observation, also across reconnects of the CUT; a restart across runs needs a recording of the earlier run (`--baseline-recording`, deferred).
  - id: T7-MON-10
    title: Identification Links are unique
    mode: monitor
    level: 1
    reqs: [REQ-IL-010, REQ-IL-012]
    status: implemented
    notes: Heuristic – two live Birth/Health streams or two different MAM for one Identification Link. A unique IL cannot be proven by observation (manual part of the REQs). A late Birth after a Will and the Birth after a reported FAILURE_1/0 (REQ-LIFE-017) are no second Birth (C-066).
  - id: T7-MON-11
    title: No unsolicited publication without content
    mode: monitor
    level: 1
    reqs: [REQ-CMP-042]
    status: implemented
  - id: T7-MON-12
    title: MQTT client behavior visible to a subscriber
    mode: monitor
    level: 1
    reqs: [REQ-CMP-009, REQ-MQTT-017]
    status: implemented
    notes: D7 subscribes with QoS 1, so the delivered QoS shows the publisher's QoS (MQTT 3.1.1 delivers min(publish, subscribe)). ClientId, keep alive and clean session are only visible in proxy mode (T7-CON-01).
  - id: T7-MON-13
    title: Data and Event publications
    mode: monitor
    level: 2
    reqs: [REQ-CMP-010, REQ-CMP-036, REQ-CMP-038]
    status: implemented
    notes: A resource is supported when the CUT publishes it or lists it in its Profile about itself (REQ-CMP-021; also without content, REQ-CMP-041 … 043). REQ-CMP-010 is judged here for Data and Event only. Judged for components that publish about a Source; without Profile and publication not observable (skip; test mode requests the Profile).
  - id: T7-MON-14
    title: Publication rules of the PublicationList
    mode: monitor
    level: 1
    reqs: [REQ-MQTT-019, REQ-RES-PUBLIST-008, REQ-RES-PUBLIST-009, REQ-RES-PUBLIST-010, REQ-RES-PUBLIST-011, REQ-RES-PUBLIST-013, REQ-RES-PUBLIST-014, REQ-RES-PUBLIST-015]
    status: implemented
    notes: The rules are the entries of the last observed Pub PublicationList of the component (Mode, Interval, Precisions); a Set or Del PublicationList makes them uncertain until the next Pub PublicationList, and publications within the tolerance after a changed entry or a connect are not judged. Judged per unsolicited publication - the form against the Mode (REQ-RES-PUBLIST-008 … 011), the gap per form against Interval plus tolerance (013, 014), the deviation against the Precisions with Interval 0 (015); a Get answer that shows a changed content not published within the tolerance violates 013 and REQ-MQTT-019. Not judged - Birth, Will and Close, OFF_0 (T7-SET-08), Event intervals, forms that are never used (completeness) and Get answers with a Locale. Without an observed PublicationList skip (test mode requests it). Implemented in C-067 (A-216).
  - id: T7-MON-15
    title: PublicationList and SubscriptionList are republished on change
    mode: monitor
    level: 1
    reqs: [REQ-RES-PUBLIST-017, REQ-RES-PUBLIST-018, REQ-RES-SUBLIST-005, REQ-RES-SUBLIST-006]
    status: implemented
    notes: A change is a Set or Del of the list addressed to the CUT that the CUT confirms with Status/Good; a republication is a Pub of the list after the request with an empty ReplyTo or the ReplyTo of the request (the latter shows REQ-RES-PUBLIST-018/SUBLIST-006). A Del SubscriptionList without republication is not judged (no remaining entry, REQ-RES-SUBLIST-015). Changes made without a request on the bus are not observable.
  - id: T7-MON-16
    title: RevisionCounter counts configuration changes
    mode: monitor
    level: 1
    reqs: [REQ-RES-MAM-018]
    status: implemented
    notes: The RevisionCounter of a Source never decreases and does not change between -1 and a counter. After a successful Set Config that changes a known, non-sensitive value of the last Pub Config, a later Pub MAM of the Source carries a greater RevisionCounter (inconclusive without such a MAM). Changes of the ReferenceDesignation and changes without a request on the bus are not counted; the increment by exactly one is not judged (several changes may lie between two MAM).
  - id: T7-MON-17
    title: Set Config contains the mandatory objects of its group
    mode: monitor
    level: 1
    reqs: [REQ-RES-CONFIG-011]
    status: implemented
    notes: Applies to Set Config requests sent by the CUT, checked against the last Config the destination published for the same Source and WriterGroupName (Mandatory flags); inconclusive without such a Pub Config. A sensitive mandatory object may carry the mask (REQ-RES-CONFIG-025).
  - id: T7-MON-18
    title: Pagination and MaxPacketSize
    mode: monitor
    level: 1
    reqs: [REQ-PAG-004, REQ-PAG-005]
    status: implemented
    notes: MaxPacketSize from `broker.json` of the bus storage or `--max-packet-size`.
  - id: T7-MON-19
    title: No Syslog Debug by default
    mode: monitor
    level: 1
    reqs: [REQ-TOP-024]
    status: implemented
    notes: Checked from the Birth until the first Set of a log level.

  # --- test: connection (proxy mode) ------------------------------------
  - id: T7-CON-01
    title: MQTT 3.1.1 CONNECT with the required client settings
    mode: test
    level: 1
    needs: [proxy]
    reqs: [REQ-CMP-001, REQ-CMP-009, REQ-MQTT-001]
    status: implemented
    notes: Protocol level ≥ 4, ClientId, keep alive, clean session, as seen in the CONNECT packet.
  - id: T7-CON-02
    title: TLS 1.2 or higher only and broker certificate verified
    mode: test
    level: 1
    needs: [proxy]
    reqs: [REQ-CMP-002, REQ-MQTT-005, REQ-MQTT-008]
    status: implemented
    notes: The proxy offers TLS 1.1 only, then a certificate of an untrusted CA, then a wrong host name; the CUT must not complete an MQTT CONNECT in any of them.
  - id: T7-CON-03
    title: Client authenticates to the broker
    mode: test
    level: 1
    needs: [proxy]
    reqs: [REQ-MQTT-009]
    status: implemented
  - id: T7-CON-04
    title: No retained messages
    mode: test
    level: 1
    needs: [proxy]
    reqs: [REQ-MQTT-018]
    status: implemented
    notes: Without proxy, D7 reports retained deliveries on its own subscribe as evidence (a finding, but no pass).

  # --- test: lifecycle ---------------------------------------------------
  - id: T7-LIFE-01
    title: Will registered on every connection
    mode: test
    level: 1
    needs: [proxy]
    reqs: [REQ-CMP-003, REQ-LIFE-008, REQ-LIFE-010, REQ-LIFE-016]
    status: implemented
    notes: The Will of each CONNECT; its MessageId timestamp is the connect time (tolerance a parameter).
  - id: T7-LIFE-02
    title: Birth first after every connect and after recovery
    mode: test
    level: 1
    needs: [proxy]
    reqs: [REQ-LIFE-001, REQ-LIFE-015, REQ-LIFE-017]
    status: implemented
    notes: The proxy drops the connection; the CUT reconnects and publishes its Birth before anything else.
  - id: T7-LIFE-03
    title: Will published on abnormal disconnect
    mode: test
    level: 1
    needs: [proxy]
    reqs: [REQ-LIFE-009]
    status: implemented
  - id: T7-LIFE-04
    title: Close message before a graceful disconnect
    mode: test
    level: 1
    needs: [restart-hook]
    reqs: [REQ-CMP-046, REQ-LIFE-005, REQ-LIFE-006, REQ-LIFE-007]
    status: implemented
    notes: The restart hook stops the CUT gracefully and starts it again; the Close message is the last Pub Health of the CUT before its DISCONNECT (proxy) or before its new Birth (bus). Without the hook, without DISCONNECT or with the Will on the bus the test is inconclusive. The DataSetWriterId is compared with the answer to Get Health after the restart.

  # --- test: addressing and identification --------------------------------
  - id: T7-ADR-01
    title: Requests sent by the CUT address the destination
    mode: test
    level: 1
    needs: [peer]
    reqs: [REQ-BUS-002, REQ-TOP-006, REQ-TOP-010]
    status: implemented
    notes: >-
      D7 announces a simulated peer (--peer: Utility, Birth MAM + Health,
      heartbeat, Close message, Will; C-068) and publishes its Health once
      the CUT is found. Every request of the CUT whose topic carries the
      AppId of the peer, or the peer as Source, must be on the request topic
      of the peer (ServiceType Utility, AppId of the peer). Applies when the
      CUT sends requests to the peer (plain skip otherwise); without --peer
      inconclusive.
  - id: T7-ADR-02
    title: Versions are not mixed
    mode: test
    level: 1
    reqs: [REQ-TOP-004]
    status: implemented
    notes: D7 sends its requests under Oi4v2 only and watches Oi4/# (best effort); without Oi4 traffic of the CUT the test is skipped. A message under Oi4 that carries the MessageId of a request of D7 answers an Oi4v2 request in the other version.
  - id: T7-ADR-03
    title: Identification Links in requests and answers
    mode: test
    level: 1
    reqs: [REQ-IL-001, REQ-IL-013, REQ-IL-015, REQ-TOP-018]
    status: implemented
    notes: Get with the exact IL of each asset is answered on that Source; a Get with an IL that differs only in case is not answered as the same asset.

  # --- test: Get ---------------------------------------------------------
  - id: T7-GET-01
    title: Get MAM and Health
    mode: test
    level: 1
    reqs: [REQ-BUS-003, REQ-CMP-015, REQ-CMP-017, REQ-MSG-015, REQ-RES-HEALTH-006, REQ-RES-MAM-021]
    status: implemented
  - id: T7-GET-02
    title: Profile lists exactly the supported resources
    mode: test
    level: 1
    reqs: [REQ-CMP-018, REQ-CMP-021, REQ-RES-PROFILE-002, REQ-RES-PROFILE-004]
    status: implemented
    notes: Every resource of the Profile answers a Get; a Get of a resource missing from the Profile gets no Pub.
  - id: T7-GET-03
    title: Get of every supported resource
    mode: test
    level: 1
    reqs: [REQ-CMP-008, REQ-CMP-019, REQ-CMP-020, REQ-CMP-035, REQ-CMP-036, REQ-CMP-037, REQ-CMP-039, REQ-RES-CONFIG-017, REQ-RES-DATA-007, REQ-RES-META-002, REQ-RES-PUBLIST-020, REQ-RES-PUBLIST-027, REQ-RES-REFDES-004, REQ-RES-SUBLIST-008]
    status: implemented
    notes: Each resource is required from the level of its CMP row; at level 2 a missing resource of CMP-035 … CMP-039 is a warning (recommended, REQ-CMP-010). Every PublicationList entry of a requestable resource with a Mode other than OFF_0 is requested with Get, with or without ON_REQUEST in its Mode (REQ-RES-PUBLIST-027, SF-101).
  - id: T7-GET-04
    title: Every represented entity fulfills the level
    mode: test
    level: 1
    reqs: [REQ-CMP-010, REQ-CMP-024, REQ-CMP-045]
    status: implemented
    notes: The Get tests repeat for every Source the CUT represents. A Registry represents none; the other Sources of its answer to Get MAM are listed assets (MG A1, C-087).
  - id: T7-GET-05
    title: Get without content, unknown asset, Metadata without Data
    mode: test
    level: 1
    reqs: [REQ-CMP-041, REQ-CMP-044, REQ-CMP-047]
    status: implemented
  - id: T7-GET-06
    title: Pagination on request and by size
    mode: test
    level: 1
    reqs: [REQ-PAG-002, REQ-PAG-005]
    status: implemented
    notes: Pagination on request with PerPage 1 (pages 1, n+1, 0); the pagination by size is not stimulated, T7-MON-18 judges MaxPacketSize on all traffic.
  - id: T7-GET-07
    title: Query
    mode: test
    level: 1
    reqs: [REQ-QRY-001, REQ-QRY-002, REQ-QRY-003, REQ-RES-REFDES-011, REQ-RES-REFDES-013, REQ-RES-REFDES-014]
    status: implemented
  - id: T7-GET-08
    title: Locale
    mode: test
    level: 1
    reqs: [REQ-LOC-002]
    status: implemented
  - id: T7-GET-09
    title: Unknown keys in requests are ignored
    mode: test
    level: 1
    reqs: [REQ-MSG-046]
    status: implemented

  # --- test: Set and Del -------------------------------------------------
  - id: T7-SET-01
    title: Set and Del are answered with Status events and publications
    mode: test
    level: 1
    reqs: [REQ-BUS-006, REQ-CMP-016, REQ-CMP-023, REQ-CMP-038, REQ-MQTT-019, REQ-MSG-015, REQ-RES-EVENT-005, REQ-RES-SUBLIST-016, REQ-TOP-014, REQ-TOP-015]
    status: implemented
    notes: Runs for every object the CUT offers for modification (from Profile, Config and the own Set subscriptions in its SubscriptionList); the Set writes the current value back where possible, so the CUT state is unchanged. A Data or Config DataSet that accepts the Set must be listed with its Set subscription, a listed one must not answer BadNotWritable (REQ-RES-SUBLIST-016, SF-107).
  - id: T7-SET-02
    title: Set or Del on an unknown or non-modifiable object
    mode: test
    level: 1
    reqs: [REQ-CMP-043]
    status: implemented
  - id: T7-SET-03
    title: Set and Del for all resources
    mode: test
    level: 3
    reqs: [REQ-CMP-033]
    status: implemented
    notes: The application and one represented asset; a Registry represents none (MG A1, C-087).
  - id: T7-SET-04
    title: Del semantics
    mode: test
    level: 1
    reqs: [REQ-BUS-007, REQ-BUS-008]
    status: implemented
  - id: T7-SET-05
    title: Set Config
    mode: test
    level: 1
    reqs: [REQ-RES-CONFIG-005, REQ-RES-CONFIG-021, REQ-RES-CONFIG-022, REQ-RES-CONFIG-023, REQ-RES-CONFIG-024, REQ-RES-CONFIG-025]
    status: implemented
  - id: T7-SET-06
    title: Set Data
    mode: test
    level: 1
    reqs: [REQ-RES-DATA-011, REQ-RES-DATA-012]
    status: implemented
  - id: T7-SET-07
    title: Set Metadata
    mode: test
    level: 1
    reqs: [REQ-RES-META-006, REQ-RES-META-007]
    status: implemented
  - id: T7-SET-08
    title: Set PublicationList
    mode: test
    level: 1
    reqs: [REQ-RES-PUBLIST-007, REQ-RES-PUBLIST-016, REQ-RES-PUBLIST-024, REQ-RES-PUBLIST-025]
    status: implemented
  - id: T7-SET-09
    title: Set and Del ReferenceDesignation
    mode: test
    level: 1
    reqs: [REQ-RES-REFDES-009, REQ-RES-REFDES-010]
    status: implemented
  - id: T7-SET-10
    title: ReferenceDesignation survives a restart
    mode: test
    level: 1
    needs: [restart-hook]
    reqs: [REQ-RES-REFDES-002]
    status: implemented
    notes: Sets a changed ReferenceDesignation of the application (else of the first object), restarts the CUT with the restart hook, reads it again and restores the original. Not applicable if the CUT has no ReferenceDesignation or rejects the Set with Status Bad (the condition of REQ-RES-REFDES-002, the CUT offers Set ReferenceDesignation, is not met).
  - id: T7-SET-11
    title: Set and Del SubscriptionList
    mode: test
    level: 1
    reqs: [REQ-RES-SUBLIST-004, REQ-RES-SUBLIST-013, REQ-RES-SUBLIST-014, REQ-RES-SUBLIST-015]
    status: implemented
    notes: Sets and deletes only CONF_1 entries the CUT lists; a Set with a TopicPath the CUT has not subscribed may be rejected with Status Bad (e.g. BadNotSupported, SF-111) and is then not a failure.
  - id: T7-SET-12
    title: Log level is configurable
    mode: test
    level: 1
    reqs: [REQ-TOP-027]
    status: implemented

  # --- test: Actions -----------------------------------------------------
  - id: T7-ACT-01
    title: NewDataSetWriterId Call and Reply
    mode: test
    level: 1
    reqs: [REQ-ACT-001, REQ-ACT-006, REQ-ACT-007, REQ-ACT-012, REQ-ACT-014, REQ-ACT-015, REQ-ACT-016, REQ-ACT-020, REQ-ACT-022, REQ-CMP-034, REQ-CMP-040, REQ-TOP-016]
    status: implemented
  - id: T7-ACT-02
    title: Provided DataSetWriterId is valid for Ttl seconds
    mode: test
    level: 1
    reqs: [REQ-ACT-023]
    status: implemented
    notes: D7 asks for more ids within the Ttl and checks that a provided id is not provided again. That the CUT accepts the reserved id for an object it creates within the Ttl needs a create, which D7 does not do (T7-SET-11); this part is checked manually.
  - id: T7-ACT-03
    title: No response to undecodable, unaddressable or rejected requests
    mode: test
    level: 1
    reqs: [REQ-ACT-017]
    status: implemented
    notes: D7 sends a request with an unknown DataSetWriterId, one with an unknown ActionTargetId and an undecodable one, and waits for the timeout; any response to them fails. Skipped when the CUT does not answer a valid control request.
  - id: T7-ACT-04
    title: NewDataSetWriterId for an unknown Source is answered with BadNotFound
    mode: test
    level: 1
    reqs: [REQ-ACT-024]
    status: implemented

manual:
  - req: REQ-CMP-011
    reason: A rule for D7 itself, not a test – `--level` defaults to 3 when the manufacturer states no level.
  - req: REQ-LIFE-011
    reason: Subscriber side – how a CUT interprets a Close of another component is not observable on the bus in general.
  - req: REQ-LIFE-012
    reason: Subscriber side – as REQ-LIFE-011 for the Will.
  - req: REQ-LIFE-013
    reason: Subscriber side – as REQ-LIFE-011 for the next Birth.
