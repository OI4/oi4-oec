# Test catalog of D8 `oec-infra` (ADR-0025, design C-044).
#
# Same model as d7.yaml. Every active REQ with the verification `d8` is
# checked by a test here or listed under `manual` (only if its verification
# also contains `manual`).
#
# mode:   image     – offline inspection of an OCI image (OCI layout directory
#                     or oci-archive; a registry reference is read with
#                     docker save / skopeo, C-070); no container daemon needed
#         run       – D8 starts the image in a sandbox with generated test
#                     storages (/etc/oi4/mqtt, /etc/oi4/certs, /run/secrets/oi4,
#                     hostname) and its own MQTT test endpoint, and observes
#                     what the application does with them
#         container – inspection of a running container on an OEC platform
#         host      – checks on the platform host (or in a probe container
#                     with the platform's storages mounted)
#         bus       – MQTT-level checks of the platform's Message Bus
# level:  lowest Service Container level at which one of its REQs applies (as
#         in d7.yaml); absent when the test checks only platform requirements
#         (not graded, MG 1.3)
# needs:  docker        – access to a container engine API (Docker or Podman)
#         host-access   – D8 runs on the platform host (or a probe container)
#         credentials-2 – a second, unprivileged set of bus credentials
tool: oec-infra
baseline: "980cde8"
tests:
  # --- image: offline -----------------------------------------------------
  - id: T8-IMG-01
    title: OCI-compliant image
    mode: image
    level: 1
    reqs: [REQ-CMP-027]
    status: implemented
  - id: T8-IMG-02
    title: Processor architectures and multi-architecture image
    mode: image
    level: 2
    reqs: [REQ-APP-001, REQ-APP-002, REQ-CMP-032]
    status: implemented
    notes: Platforms of the runnable images (attestation manifests excluded); supported are linux/amd64, linux/arm64 (v8) and linux/arm (v7) (RIG 5.1); REQ-APP-002 needs at least two of them. The hardware part of RIG 5.2 is declared by the manufacturer and only reported.
  - id: T8-IMG-03
    title: SBOM and license texts in /opt/oi4/licenses
    mode: image
    level: 2
    reqs: [REQ-CMP-028, REQ-CNT-013, REQ-CNT-014, REQ-CNT-015, REQ-CNT-026, REQ-CNT-027, REQ-LIC-002]
    status: implemented
    notes: Exactly one of sbom.spdx.json / sbom.cdx.json; the version of the format is not restricted (SF-114) – SPDX 2.x JSON, SPDX 3.x JSON-LD and CycloneDX 1.x JSON are read, another version is skipped inconclusive; every component with name and version (REQ-CNT-013) and a stated license, NOASSERTION is none (REQ-CNT-026), a purl or CPE (REQ-CNT-027, warns); every license and license exception embedded or present as <License-ID>.txt; the files are in the file system of every platform image (layers applied with whiteouts, symlinks resolved inside the image); a VOLUME on the folder is a note.
  - id: T8-IMG-04
    title: Image integrity
    mode: image
    level: 2
    reqs: [REQ-CMP-030]
    status: implemented
    notes: Every blob is addressed by a verified SHA256 digest (RIG 4.3 recommends digests, SHA256; it requires no signature). A finding warns and never fails (note of REQ-CMP-030); a digest mismatch fails REQ-CMP-027 in T8-IMG-01 (C-070).

  # --- run: sandbox with test storages --------------------------------------
  - id: T8-RUN-01
    title: Application uses the Message Bus storage
    mode: run
    level: 2
    needs: [docker]
    reqs: [REQ-CMP-029, REQ-CNT-004]
    status: implemented
    notes: broker.json points to the D8 test endpoint (a host name resolved to host-gateway, a non-default SecurePort, MaxPacketSize, an element the application does not know); the application must connect there, verify the endpoint's certificate with ca.pem (phase credentials) or broker_ca.pem (phase certificate), refuse a certificate of an unknown CA (phase untrusted) and publish no payload larger than MaxPacketSize. REQ-CMP-029 repeats the observations of REQ-CNT-004, REQ-CNT-009 and REQ-CNT-021 (C-074).
  - id: T8-RUN-02
    title: Application uses the certificate and secret storages
    mode: run
    level: 2
    needs: [docker]
    reqs: [REQ-CNT-009]
    status: implemented
    notes: The test endpoint accepts only the generated credentials (base64, a password with ":", phase credentials) or the generated client certificate <containername>.pem with the encrypted private key and the base64 passphrase (phase certificate). Using only one of the two means fails (RIG 4.1.3, SF-117 decided in the C-074 review), as do other credentials or neither means (C-074).
  - id: T8-RUN-03
    title: Application uses its container name
    mode: run
    level: 1
    needs: [docker]
    reqs: [REQ-CNT-021, REQ-MQTT-013]
    status: implemented
    notes: D8 sets a container name oec-d8-run-<uuid> as hostname; the MQTT ClientId, the certificate name and, with an Oi4Identifier, the SerialNumber of the Birth message (Pub/MAM about the application) must use it. A URI as Identification Link is noted (C-074).

  # --- container: running container on a platform ----------------------------
  - id: T8-CTR-01
    title: Container networks
    mode: container
    level: 2
    needs: [docker]
    reqs: [REQ-CMP-031, REQ-CNT-023]
    status: implemented
    notes: >-
      The network mode and the driver of every attached network are read through the Engine API (network mode
      container:<id>: the networks of that container). bridge passes; the host network is a warning (RIG 4.4 prefers a
      bridge network; the exception for low-level Ethernet communication is judged manually); none, user-mode networks
      (pasta, slirp4netns) and other drivers are hints.
  - id: T8-CTR-02
    title: Container name and hostname
    mode: container
    needs: [docker]
    reqs: [REQ-CNT-019, REQ-CNT-020]
    status: implemented
    notes: >-
      The container name is at most 63 characters, follows RFC 1123, equals the hostname exactly and is unique among
      the containers of the engine (case-insensitive); other engines of the platform are not seen. REQ-CNT-020:
      <DefaultContainerName>-<uuid> with a default name of at most 26 characters.
  - id: T8-CTR-03
    title: Licenses are not overlaid by a host mount
    mode: container
    needs: [docker]
    reqs: [REQ-CNT-017]
    status: implemented
    notes: >-
      The mounts of the container (including --tmpfs) on, above or below /opt/oi4/licenses: a bind mount or a tmpfs
      fails, a volume is judged manually (allowed if populated from the image, REQ-CNT-018), an image mount is a hint.

  # --- host: platform host --------------------------------------------------
  - id: T8-HST-01
    title: Message Bus storage
    mode: host
    needs: [host-access]
    reqs: [REQ-CNT-001, REQ-CNT-003, REQ-MQTT-003]
    status: implemented
    notes: >-
      broker.json is checked against platform/broker.schema.json (the broker-json vectors of oec/spec, V-BRK-…, are its
      test vectors), broker.pem is verified by broker_ca.pem or else ca.pem of the certificate storage; the storage is
      mounted read-only (Linux mount table; elsewhere reported as unknown). The validity and host name of the broker
      certificate are judged by T8-BUS-01 (REQ-MQTT-007).
  - id: T8-HST-02
    title: Certificate and secret storages
    mode: host
    needs: [host-access]
    reqs: [REQ-CNT-002, REQ-CNT-005, REQ-CNT-006, REQ-CNT-007, REQ-CNT-008, REQ-MQTT-011]
    status: implemented
    notes: >-
      ca.pem, the certificate of the application (<containername>.pem with the key of private_key.pem), credentials,
      private_key.pem and passphrase (decrypted) and the read-only mounts are checked; modes and sizes are reported,
      never the content of a secret.
  - id: T8-HST-03
    title: Application storages are not shared
    mode: host
    needs: [host-access, docker]
    reqs: [REQ-CNT-011, REQ-CNT-024]
    status: implemented
    notes: >-
      Every container of the engine (running or not) with a mount on, below or above /etc/oi4, /opt/oi4 or
      /run/secrets/oi4 is an OI4 container; its secret storage and – if an OI4 container has a bind or volume on
      /etc/oi4/app or /opt/oi4/app (persistent layer) – its application storages must not be reachable through a bind
      or volume of another container (same volume or nested sources as the engine reports them). --self excludes the
      container D8 runs in.
  - id: T8-HST-04
    title: Platform host
    mode: host
    needs: [host-access]
    reqs: [REQ-PLT-001, REQ-PLT-003, REQ-PLT-006, REQ-PLT-007, REQ-PLT-008]
    status: implemented
    notes: >-
      Architecture, RAM, storage, network interface and container daemon are measured on the system D8 runs on; the
      Message Bus and the OEC Registry are reached with the storages of the root. "Current patch level" is reported
      (kernel release, os-release, reboot-required), the verdict is manual; pending updates are not queried.

  # --- bus: the platform's Message Bus ------------------------------------------
  - id: T8-BUS-01
    title: Broker protocol, TLS and certificate
    mode: bus
    reqs: [REQ-MQTT-002, REQ-MQTT-006, REQ-MQTT-007, REQ-CNT-003]
    status: implemented
    notes: >-
      As built (C-071): D8 connects with MQTT 3.1.1 over TLS (REQ-MQTT-002,
      REQ-CNT-003) and probes TLS 1.2 and 1.3 (one of them accepted) and TLS
      1.0/1.1 (refused) with raw handshakes that present the client
      certificate of the run (REQ-MQTT-006); a plain-text MQTT listener on
      --plain-port (default 1883) that accepts a CONNECT fails. The broker
      certificate chains to ca.pem / broker_ca.pem (or --ca), is not
      self-signed, names the broker host and is valid (REQ-MQTT-007; host
      name and validity per MG 6.2.2, SF-115). A PUBLISH of exactly
      MaxPacketSize (broker.json, --max-packet-size, else 262144 with a note)
      on a 65535-octet probe topic is delivered without a disconnect (RIG
      4.1.1, SF-105); a MaxPacketSize above --max-probe-size is
      inconclusive; larger payloads are not checked.
  - id: T8-BUS-02
    title: Write access and Actions restricted by ACL
    mode: bus
    needs: [credentials-2]
    reqs: [REQ-GEN-001, REQ-GEN-002, REQ-RES-CONFIG-020, REQ-RES-CONFIG-026, REQ-RES-DATA-010, REQ-RES-META-005, REQ-RES-PUBLIST-023, REQ-RES-REFDES-008, REQ-RES-SUBLIST-012]
    status: implemented
    notes: >-
      As built (C-071): the unprivileged client (--credentials-2 or
      --bus-storage-2) publishes Set Config/Data/Metadata/PublicationList/
      ReferenceDesignation/SubscriptionList, Del ReferenceDesignation/
      SubscriptionList and Call NewDataSetWriterId to the probe AppId
      of D8; the privileged D8 client must not receive them, while a positive
      control shows that D8 receives its own requests on the same topics. The
      unprivileged client must not read Set/Config (a refused subscription or
      no delivery; SHOULD, warn). Since C-113 (SF-119) it also publishes Pub
      Health and Reply NewDataSetWriterId under the probe AppId; D8 should
      not receive them (REQ-GEN-002, SHOULD, warn). Both clients with the
      same identity are inconclusive.
  - id: T8-BUS-03
    title: OEC Registry
    mode: bus
    reqs: [REQ-REG-001, REQ-REG-002]
    status: implemented
    notes: >-
      As built (C-071): two probe components of D8 announce themselves
      (Birth, Health, Will); the Registry (--registry or the first one seen
      on Oi4v2/Registry/+/Pub/# within --registry-wait) must return their MAM
      and last Health on Get MAM / Get Health, with and without Source, as
      publisher and with the DataSetWriterName of the asset, and must no
      longer return them after the Close message of the first and the Will
      of the second. Without a Registry the test is inconclusive (oec/dev
      until P7); the self-test uses a simulated Registry
      (internal/bus/registrytest).

manual:
  - req: REQ-CMP-012
    reason: A rule for D8 itself, not a test – `--level` defaults to 3 when the manufacturer states no level.
