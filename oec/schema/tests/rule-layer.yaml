# Expectation list of the schema test suite (ADR-0019 §8).
#
# An invalid payload vector of oec/spec is rejected by its entry schema with
# exactly the REQs of its `violates`. A vector whose violation the entry
# schema cannot see completely is listed here with the partition of its
# violated REQs:
#   schema: REQs the entry schema reports (empty = the schema accepts it)
#   rule:   REQs only the rule layer of D7 validate detects (ADR-0019 §5)
#   rules:  rule-layer rules (R-1 … R-4, R-6, ADR-0019 §5) that detect them
#   reason: why JSON Schema cannot express it
# schema + rule must equal `violates`. The reviewed vector files are not
# changed. Lint will check that every rule REQ carries d7-validate.
#
# Example:
#   - vector: V-PAY-0xx
#     schema: []
#     rule: [REQ-MSG-019]
#     rules: [R-2]
#     reason: WriterGroupName differs from the Filter of the topic
expectations:
  - vector: V-PAY-148
    schema: []
    rule: [REQ-MSG-023]
    rules: [R-2]
    reason: The DataSetWriterName is a well-formed Identification Link; that it equals the decoded Source of the topic is an equality with a topic value.
  - vector: V-PAY-159
    schema: []
    rule: [REQ-MSG-038]
    rules: [R-3]
    reason: Unique field names are a relation between array items by one key; uniqueItems compares whole items only.
  - vector: V-PAY-165
    schema: []
    rule: [REQ-MSG-043]
    rules: [R-3]
    reason: Unique StructureField names are a relation between array items by one key; uniqueItems compares whole items only.
  - vector: V-PAY-167
    schema: []
    rule: [REQ-MSG-044]
    rules: [R-3]
    reason: Unique EnumField names are a relation between array items by one key; uniqueItems compares whole items only.
  - vector: V-PAY-171
    schema: []
    rule: [REQ-LIFE-003]
    rules: [R-6]
    reason: A Birth message has exactly one DataSetMessage, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-172
    schema: []
    rule: [REQ-LIFE-007]
    rules: [R-6]
    reason: A Close message has HealthScore 0, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-173
    schema: []
    rule: [REQ-LIFE-007]
    rules: [R-6]
    reason: A Close message has Health NORMAL_0, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-174
    schema: []
    rule: [REQ-LIFE-009]
    rules: [R-6]
    reason: A Will message has Health FAILURE_1, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-175
    schema: []
    rule: [REQ-LIFE-009]
    rules: [R-6]
    reason: A Will message has HealthScore 0, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
