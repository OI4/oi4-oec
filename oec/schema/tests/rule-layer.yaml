# Expectation list of the schema test suite (ADR-0019 §8).
#
# An invalid payload vector of oec/spec is rejected by its entry schema with
# exactly the REQs of its `violates`. A vector whose violation the entry
# schema cannot see completely is listed here with the partition of its
# violated REQs:
#   schema: REQs the entry schema reports (empty = the schema accepts it)
#   rule:   REQs only the rule layer of D7 validate detects (ADR-0019 §5)
#   rules:  rule-layer rules (R-1 … R-4, R-6, ADR-0019 §5) that detect them
#   reason: why JSON Schema cannot express it
# schema + rule must equal `violates`. The reviewed vector files are not
# changed. Lint will check that every rule REQ carries d7-validate.
#
# Example:
#   - vector: V-PAY-0xx
#     schema: []
#     rule: [REQ-MSG-019]
#     rules: [R-2]
#     reason: WriterGroupName differs from the Filter of the topic
expectations:
  - vector: V-PAY-050
    schema: []
    rule: [REQ-PAG-004]
    rules: [R-3]
    reason: The Pagination arithmetic (Page, PerPage, TotalCount and the number of DataSetMessages) relates values across fields and array lengths; JSON Schema cannot compute it.
  - vector: V-PAY-148
    schema: []
    rule: [REQ-MSG-023]
    rules: [R-2]
    reason: The DataSetWriterName is a well-formed Identification Link; that it equals the decoded Source of the topic is an equality with a topic value.
  - vector: V-PAY-159
    schema: []
    rule: [REQ-MSG-038]
    rules: [R-3]
    reason: Unique field names are a relation between array items by one key; uniqueItems compares whole items only.
  - vector: V-PAY-165
    schema: []
    rule: [REQ-MSG-043]
    rules: [R-3]
    reason: Unique StructureField names are a relation between array items by one key; uniqueItems compares whole items only.
  - vector: V-PAY-167
    schema: []
    rule: [REQ-MSG-044]
    rules: [R-3]
    reason: Unique EnumField names are a relation between array items by one key; uniqueItems compares whole items only.
  - vector: V-PAY-171
    schema: []
    rule: [REQ-LIFE-003]
    rules: [R-6]
    reason: A Birth message has exactly one DataSetMessage, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-172
    schema: []
    rule: [REQ-LIFE-007]
    rules: [R-6]
    reason: A Close message has HealthScore 0, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-173
    schema: []
    rule: [REQ-LIFE-007]
    rules: [R-6]
    reason: A Close message has Health NORMAL_0, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-174
    schema: []
    rule: [REQ-LIFE-009]
    rules: [R-6]
    reason: A Will message has Health FAILURE_1, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-175
    schema: []
    rule: [REQ-LIFE-009]
    rules: [R-6]
    reason: A Will message has HealthScore 0, but the role is not visible in the message; it is declared outside (vector field role, D7 validate --role).
  - vector: V-PAY-182
    schema: []
    rule: [REQ-ACT-004]
    rules: [R-3]
    reason: The MessageId has the form of a MessageId; that its PublisherId part is the RequestorId of the same message is an equality between two fields.
  - vector: V-PAY-184
    schema: []
    rule: [REQ-ACT-005]
    rules: [R-2]
    reason: PublisherId and MessageId are well-formed and consistent; that the PublisherId is the Responder of the topic is an equality with a topic value.
  - vector: V-PAY-186
    schema: []
    rule: [REQ-ACT-006]
    rules: [R-2]
    reason: The ResponseAddress is a well-formed Reply topic of NewDataSetWriterId; that it is the Reply topic of the Call topic (same ServiceType and AppId) is an equality with topic values.
  - vector: V-PAY-210
    schema: []
    rule: [REQ-RES-MAM-006]
    rules: [R-3]
    reason: Whether a ProductInstanceUri is a generated Oi4Identifier and matches Model, ProductCode and SerialNumber (plain or dnp-encoded) relates values across fields.
  - vector: V-PAY-211
    schema: []
    rule: [REQ-RES-MAM-016]
    rules: [R-3]
    reason: The ProductInstanceUri equals the DataSetWriterName, an equality between two fields of one DataSetMessage.
  - vector: V-PAY-213
    schema: []
    rule: [REQ-RES-MAM-014]
    rules: [R-2]
    reason: The DeviceClass of the application names its own ServiceType; this is an equality with the ServiceType of the topic, and only for the MAM of the application itself (DataSetWriterName = AppId).
  - vector: V-PAY-151
    schema: [REQ-MSG-025]
    rule: [REQ-RES-PUBLIST-002]
    rules: [R-3]
    reason: The schema sees that the WriterGroupName does not start with a ResourceType; that it equals Resource[/Filter] of the entry is an equality between two fields of one DataSetMessage.
