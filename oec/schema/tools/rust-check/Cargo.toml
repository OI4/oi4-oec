[package]
name = "rust-check"
version = "0.1.0"
edition = "2021"
publish = false
description = "Second, independent JSON Schema 2020-12 validator of the ADR-0019 PoC: runs dist/cases.json with the Rust jsonschema crate."
license = "MIT"

[dependencies]
jsonschema = { version = "=0.60.1", default-features = false }
serde_json = "1"
