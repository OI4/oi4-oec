# Method x Resource matrix – topic columns (C-018) and payload columns (C-028).
#
# One row per Method x Resource/service combination. Source of truth for the
# allowed topic forms together with ../topic/topic.abnf; 'spectool lint' checks
# both against each other (rule names, required/optional/forbidden Source and
# Filter, generated samples). The payload columns (key payload of the allowed
# rows, see method-resource.schema.json) summarize the requirements per
# combination: MessageType, DataSetClassId and DataSetWriterId rule, content,
# helper DataSets and the answer; 'spectool lint' checks them against the
# requirements, the predefined DataSetClassIds and the payload vectors. The
# Config rows got their payload columns with area RES-CONFIG (C-029, draft).
# PO decisions (C-018): SF-041 (forms), SF-042 (closed sets).
# PO review (C-022, 2026-10-17): topic columns reviewed; payload columns
# (C-028) reviewed by the PO (C-028 review 2026-10-21).

