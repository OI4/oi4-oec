# Requirements of area BUS – general rules of the Message Bus communication
# (MG 9, MG 9.1 general part; ADR-0018, schema: catalog.schema.json).
# The allowed topic forms (MG 9) are REQ-TOP-013 (matrix); the resources
# without content (MG 9.1) are REQ-CMP-041 … 044, the support in the Profile
# REQ-CMP-021; the Status events after Set/Del (MG 9.1) are REQ-RES-EVENT-005.
# The per-resource rules are in RES-* (MG 9.1.x), the payload columns of
# matrix/method-resource.yaml summarize them per Method × Resource.
# Drafted in C-028, reviewed in the C-028 review; SF-079 (DataSetMessage
# header of Set/Del requests), SF-080 (d) (publication after Del) and SF-081
# (Filter in Set/Del) resolved in the guideline (baseline b2f0fe7).
# C-034: REQ-BUS-002 verification d7-validate → d7-test, reviewed in the C-034 review (2026-10-24).
area: BUS
baseline: "57ebe91"
requirements:
  - id: REQ-BUS-001
    title: Publishing may start once the request topics are subscribed
    statement: >-
      At startup, a component subscribes to the topics on which a reaction is
      expected from it (Get, Set, Del of its resources, Call of its common
      services); once this is done, it may start publishing.
    keyword: MAY
    domain: messaging
    levels: {L1: MAY, L2: MAY, L3: MAY}
    applies_to: [component]
    refs: [MG 9.1]
    quotes:
      - ref: MG 9.1
        text: Once subscribing to the topics is done, Service A may start publishing.
    verification: [manual]
    inventory: [MG-9.1-49193b6c]
    status: reviewed
    notes: >-
      The first publication after connect is the Birth message
      (REQ-LIFE-015). Messages without subscriber are lost (no retained
      messages, REQ-MQTT-018).

  - id: REQ-BUS-002
    title: A requester publishes on the request topic of the addressed component
    statement: >-
      A component that requests, changes or deletes a resource of another
      component publishes the request on the Get, Set or Del topic of that
      resource under the ServiceType and AppId of the addressed component.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1]
    quotes:
      - ref: MG 9.1
        text: In case Service B want to request a specific resource from Service A, Service B must publish on the Get topic of one of Service A’s resources, optionally providing a Filter.
      - ref: MG 9.1
        text: Service B then must publish on the Del topic of Service A.
    verification: [d7-test]
    inventory: [MG-9.1-2a8cc5e7, MG-9.1-478085b5]
    status: reviewed
    notes: >-
      The topic forms are REQ-TOP-013 (matrix); the PublisherId stays the
      requester's (REQ-MSG-006). Verification d7-validate → d7-test (C-034,
      ADR-0019 §9): a single message shows the ServiceType and AppId of its
      topic, but not whether they belong to the addressed component; D7
      test checks it against the component under test.

  - id: REQ-BUS-003
    title: A Get is answered with a Pub
    statement: >-
      A component that receives a Get of one of its resources answers it with
      a publication on the corresponding Pub topic (same Resource, Source and
      Filter) whose ReplyTo is the MessageId of the Get.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component supports the resource (area CMP).
    refs: [MG 9.1]
    quotes:
      - ref: MG 9.1
        text: Service A receives the Get message from Service B through the Message Bus and must reply with a Pub message over the Message Bus.
    verification: [d7-test]
    inventory: [MG-9.1-c0d352ea]
    status: reviewed
    notes: >-
      ReplyTo per REQ-MSG-015; empty list per REQ-CMP-041; exception Get of
      Metadata without Data (REQ-CMP-044). The per-resource answers are
      in the RES-* areas (e.g. REQ-RES-DATA-007, REQ-RES-SUBLIST-008).

  - id: REQ-BUS-004
    title: A Set carries the updated object on the Set topic
    statement: >-
      A component that changes a resource object of another component
      publishes the complete updated object on the Set topic of that
      resource, addressing the object with Source and – for resources with a
      Filter – Filter. Exception: a Set of Config may contain only a part of
      the Config DataSet (partial update, REQ-RES-CONFIG-003).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1, SF-081, SF-086]
    quotes:
      - ref: MG 9.1
        text: Service B must publish the updated resource object on Service A’s Set topic for this resource (for Config, a partial update is possible, see 9.1.3 Config). Now, Source and – for resources with a Filter – the Filter are required in the topic.
    verification: [d7-validate]
    inventory: [MG-9.1-4a98fe00, MG-9.1-224e1dcc]
    status: reviewed
    notes: >-
      ReferenceDesignation has no Filter (REQ-TOP-013, MG 7.7; MG 9.1 since
      SF-081). The per-resource Set payloads are in the RES-* areas (exactly one
      DataSetMessage, e.g. REQ-RES-DATA-009). The Config exception was added
      to MG 9.1 with SF-086 (a).

  - id: REQ-BUS-005
    title: A Del addresses the object with its Filter
    statement: >-
      A component that deletes a resource object of another component
      addresses it on the Del topic with Source and – for resources with a
      Filter – the Filter of the object.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1, SF-081]
    quotes:
      - ref: MG 9.1
        text: To delete a resource object from Service A, Service B must know the Source and – if the resource has one – the Filter of the resource it aims to delete.
    verification: [d7-validate]
    inventory: [MG-9.1-b36c6821]
    status: reviewed
    notes: Del exists for SubscriptionList (with Filter) and ReferenceDesignation (without Filter) only (REQ-TOP-013; MG 9.1 since SF-081).

  - id: REQ-BUS-006
    title: A successful Set is followed by the publication of the changed object
    statement: >-
      After a successful Set, the component publishes the changed object on
      the Pub topic with the Source and Filter of the Set and the MessageId of
      the Set as ReplyTo; further publications follow the PublicationList.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component offers Set for the resource and the Set was successful.
    refs: [MG 9.1]
    quotes:
      - ref: MG 9.1
        text: In case the Set was successful, Service A must publish the changed resource on the Pub topic in regard to the settings in PublicationList.
    verification: [d7-test]
    inventory: [MG-9.1-77f75f9b]
    status: reviewed
    notes: >-
      Interpretation of "in regard to the settings in PublicationList" as in
      REQ-RES-PUBLIST-025 and REQ-RES-REFDES-010 (reviewed in C-027); per
      resource REQ-RES-DATA-012, REQ-RES-META-007, REQ-RES-SUBLIST-014,
      REQ-RES-CONFIG-022.

  - id: REQ-BUS-007
    title: Nothing is published after the deletion of a whole object
    statement: >-
      After a Del that removed the whole object addressed by Source and
      Filter, the component publishes nothing on the Pub topic of that
      object (the Status event is published on the Event topic).
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [responder]
    condition: The component offers Del for the resource and the Del removed the whole object.
    refs: [MG 9.1, SF-080]
    quotes:
      - ref: MG 9.1
        text: If the whole Filter has been deleted, Service A must not publish anything on the topic of the resource.
    verification: [d7-test]
    inventory: [MG-9.1-43ac5b14]
    status: reviewed
    notes: >-
      A Del of ReferenceDesignation always deletes the whole object
      (REQ-RES-REFDES-007); for SubscriptionList see REQ-RES-SUBLIST-015
      (MG 9.1.9 since SF-080 (d)).

  - id: REQ-BUS-008
    title: A partial deletion is followed by the publication of the changed resource
    statement: >-
      After a Del that removed only a part of the objects addressed by Source
      and Filter (e.g. one subscription out of the SubscriptionList), the
      component publishes the changed resource on the Pub topic with the
      MessageId of the Del as ReplyTo.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component offers Del for the resource and the Del removed only a part of the addressed objects.
    refs: [MG 9.1, SF-080]
    quotes:
      - ref: MG 9.1
        text: In case the Del has deleted only parts of a Filter (e.g., a single subscription out of the SubscriptionList), this is a change to Service A and it must publish the changed resource on the Pub topic regarding to the settings in PublicationList.
    verification: [d7-test]
    inventory: [MG-9.1-da721bd7]
    status: reviewed
    notes: Per resource REQ-RES-SUBLIST-015 (MG 9.1.9 since SF-080 (d)).

  - id: REQ-BUS-009
    title: Use-case-specific reactions beyond the Status event
    statement: >-
      Beyond the Status event, a component reacts to a Set or Del
      use-case-specifically and, if necessary, publishes further Events
      (e.g. Syslog).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    refs: [MG 9.1]
    quotes:
      - ref: MG 9.1
        text: Beyond that, the application should react use case-specific and, if necessary, initiate further events and/or syslog entries.
    verification: [manual]
    inventory: [MG-9.1-bb0018bd]
    status: reviewed

  - id: REQ-BUS-010
    title: DataSetMessage header of Set and Del requests
    statement: >-
      A DataSetMessage (or DataSetMetaData) in a Set or Del request carries
      the DataSetWriterId of the addressed DataSet as published by the
      addressed component (for PublicationList and SubscriptionList the
      common DataSetWriterId of the list), the Source of the topic as
      DataSetWriterName and the Filter of the topic as WriterGroupName (an
      empty string for resources without Filter); it carries no
      SequenceNumber.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 8.2.3, MG 9.1, SF-079]
    quotes:
      - ref: MG 8.2.3
        text: >-
          In a Set or Del request, the DataSetMessage carries the DataSetWriterId of the addressed DataSet as published by the addressed application (for PublicationList and SubscriptionList the common DataSetWriterId of the list), the Source of the topic as DataSetWriterName and the Filter of the topic as WriterGroupName (an empty string for resources without Filter); it carries no SequenceNumber.
    verification: [schema, d7-validate]
    inventory: [MG-8.2.3-00dee0fa]
    status: reviewed
    notes: >-
      Stated in MG 8.2.3 since SF-079; the examples (MG B1.1.4, B1.1.5,
      B1.1.8, B1.1.9, B1.1.10) follow it. Since the C-028 review the
      statement includes "no SequenceNumber" and the empty WriterGroupName
      (hence draft); the payload checker reports a SequenceNumber in a Set or
      Del request. The DataSetWriterId of the addressed DataSet is only
      known to the test against the addressed component (d7-validate).
