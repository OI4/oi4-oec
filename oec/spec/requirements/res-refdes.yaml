# Requirements of area RES-REFDES – resource ReferenceDesignation
# (MG 8.3.10, 9.1.10; ADR-0018, schema: catalog.schema.json).
# Support: REQ-CMP-020 (L2 SHOULD, L3 MUST). The Status event after Set/Del
# belongs to RES-EVENT (C-028). Checked by tools/internal/payload (C-027).
# Reviewed and accepted by the PO in the C-027 review (2026-10-20).
# Children of a ReferenceDesignation ("OneDown"): Query of ReferenceDesignation
# (MG 8.3.13.1, GL-ADR-020, SF-069, SF-073) – REQ-RES-REFDES-011 … 016 (reviewed 2026-10-20);
# the generic Query rules are area QRY.
area: RES-REFDES
baseline: "adc9bbe"
requirements:
  # --- DataSet content (MG 8.3.10) --------------------------------------------
  - id: REQ-RES-REFDES-001
    title: Fields of the ReferenceDesignation DataSet
    statement: >-
      The Payload of a ReferenceDesignation DataSetMessage contains the
      optional objects Function, Product and Location (reference designation
      of the asset according to IEC 81346-1); each object contains the
      mandatory String Value (designation value), the optional String Local
      (local designation value) and the optional object Parent, which
      contains the mandatory String Value, the optional String Local and the
      optional String IdentificationLink (unencoded Identification Link of the
      parent asset); no other field.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component supports the resource ReferenceDesignation (REQ-CMP-020).
    scope: [MG 4]
    refs: [MG 8.3.10, SF-068]
    verification: [schema, d7-validate]
    inventory: [MG-8.3.10-d84c70c5, MG-8.3.10-6fbcf97c, MG-8.3.10-cd52e787, MG-8.3.10-9b0d0262, MG-8.3.10-e56a9465, MG-8.3.10-8193fbf4, MG-8.3.10-b4413780, MG-8.3.10-39f50e4b, MG-8.3.10-fefc7b1d, MG-8.3.10-8851752a, MG-8.3.10-019bdfbb, MG-8.3.10-afcbf2a0, MG-8.3.10-2f17eff0, MG-8.3.10-4a1eeb66, MG-8.3.10-26a4343a, MG-8.3.10-58beecf9, MG-8.3.10-22c4a47c, MG-8.3.10-7929f9e5, MG-8.3.10-9d8f0779, MG-8.3.10-ebee4426, MG-8.3.10-3bbf3213]
    status: reviewed
    notes: >-
      The structure is identical for all three objects (SF-068 (d),
      GL-ADR-019).

  - id: REQ-RES-REFDES-002
    title: ReferenceDesignation is persisted
    statement: >-
      A component that accepts the ReferenceDesignation from outside persists
      it (application specific), so that it survives a restart.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for ReferenceDesignation.
    refs: [MG 8.3.10]
    quotes:
      - ref: MG 8.3.10
        text: Therefore, it must be persisted on an application-specific basis.
    verification: [d7-test]
    inventory: [MG-8.3.10-f5ceed18]
    status: reviewed

  # --- Message Bus (MG 9.1.10) -----------------------------------------------
  - id: REQ-RES-REFDES-003
    title: Get ReferenceDesignation carries no ReferenceDesignation object
    statement: >-
      A Get ReferenceDesignation NetworkMessage contains no
      ReferenceDesignation DataSetMessage; its Messages are empty or contain
      only the helper DataSets PaginationRequest and Locale and – only
      without Source – Query.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    scope: [MG 8.3.11, MG 8.3.12, MG 8.3.13]
    refs: [MG 9.1.10, SF-062, SF-069, SF-073]
    quotes:
      - ref: MG 9.1.10
        text: In combination with the method Get, the payload requires an empty NetworkMessage.
      - ref: MG 9.1.10
        text: The NetworkMessage can alternatively contain DataSetMessages for PaginationRequest (8.3.11.1 PaginationRequest) and Locale (8.3.12 Locale) and, without Source, a DataSetMessage for Query (8.3.13.1 Query of ReferenceDesignation).
      - ref: MG 9.1.10
        text: A ReferenceDesignation object is not included.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.10-d0686981]
    status: reviewed
    notes: Query added by GL-ADR-020 (SF-069, SF-073, C-027 review); its placement rules are REQ-QRY-001 and REQ-RES-REFDES-013.

  - id: REQ-RES-REFDES-004
    title: Get ReferenceDesignation is answered with all addressed objects
    statement: >-
      A Get ReferenceDesignation is answered with the ReferenceDesignation of
      every asset addressed by the topic – without Source all assets of the
      component, with Source only that asset – each in its own DataSetMessage
      of a single NetworkMessage published to the corresponding Pub topic.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component supports the resource ReferenceDesignation (REQ-CMP-020).
    refs: [MG 9.1.10, SF-062]
    quotes:
      - ref: MG 9.1.10
        text: Via the <Method>/<Resource>[/<Source>] combination Get/ReferenceDesignation[/<Source>], the publication of this information to the Pub/ReferenceDesignation[/<Source>] topic can be triggered.
      - ref: MG 9.1.10
        text: A topic, such as Oi4v2/<ServiceType>/<AppId>/Get/ReferenceDesignation, must trigger a publication of all available ReferenceDesignation information, each in its own DataSetMessage added to a single NetworkMessage and published to the topic Oi4v2/<ServiceType>/<AppId>/Pub/ReferenceDesignation.
    verification: [d7-test]
    inventory: [MG-9.1.10-963a219d, MG-9.1.10-a4676341]
    status: reviewed
    notes: Pagination of large answers is REQ-PAG-005, ReplyTo is REQ-MSG-015.

  - id: REQ-RES-REFDES-005
    title: Pub ReferenceDesignation carries objects and optionally Pagination
    statement: >-
      A Pub ReferenceDesignation NetworkMessage contains ReferenceDesignation
      DataSetMessages and optionally the helper DataSet Pagination; it
      contains no PaginationRequest and no DataSetMessage of another resource.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 9.1.10, SF-062]
    quotes:
      - ref: MG 9.1.10
        text: In combination with the method Pub, the payload contains DataSetMessages of type ReferenceDesignation and optional Pagination (8.3.11.2 Pagination).
    verification: [schema, d7-validate]
    inventory: [MG-9.1.10-7175ba83]
    status: reviewed
    notes: A Locale is only meaningful in a Get and ignored in other methods (REQ-LOC-002).

  - id: REQ-RES-REFDES-006
    title: Set ReferenceDesignation addresses exactly one asset
    statement: >-
      A Set ReferenceDesignation is sent to Set/ReferenceDesignation/<Source>
      and its NetworkMessage contains exactly one ReferenceDesignation
      DataSetMessage – the object of the asset addressed by the topic, which
      replaces its complete ReferenceDesignation (aspects not contained are
      removed).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1.10, MG 8.3.10, SF-068]
    quotes:
      - ref: MG 9.1.10
        text: A topic with method Set must contain Resource and Source to be valid.
      - ref: MG 8.3.10
        text: >-
          The ReferenceDesignation object of an asset is always handled as a whole: a Set replaces the complete object, i.e. aspects (Function, Product, Location) which are not contained in the Set are removed, and a Del deletes the complete ReferenceDesignation of the asset (9.1.10 ReferenceDesignation).
      - ref: MG 9.1.10
        text: Each publication, using the method Set must be done explicitly.
      - ref: MG 9.1.10
        text: Setting multiple reference designations at once via Oi4v2/<ServiceType>/<AppId>/Set/ReferenceDesignation is not possible due to security reasons because it can not be validated via an access control list by the Message Bus.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.10-90a987bb, MG-9.1.10-e3d3cf86, MG-9.1.10-c7b9efea, MG-8.3.10-c4dc0834]
    status: reviewed
    notes: Whole-object semantics per SF-068 (f), GL-ADR-019; topic form per REQ-TOP-013 (matrix).

  - id: REQ-RES-REFDES-007
    title: Del ReferenceDesignation addresses exactly one asset
    statement: >-
      A Del ReferenceDesignation is sent to Del/ReferenceDesignation/<Source>
      and its NetworkMessage contains no ReferenceDesignation DataSetMessage;
      it deletes the complete ReferenceDesignation of the asset identified by
      the Source.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1.10, SF-068]
    quotes:
      - ref: MG 9.1.10
        text: In combination with the method Del, a ReferenceDesignation object is not included.
      - ref: MG 9.1.10
        text: A topic with method Del must contain Resource and Source to be valid.
      - ref: MG 9.1.10
        text: Each publication, using the method Del must be done explicitly.
      - ref: MG 9.1.10
        text: Deleting multiple reference designations at once via Oi4v2/<ServiceType>/<AppId>/Del/ReferenceDesignation is not possible due to security reasons because it can not be validated via an access control list by the Message Bus.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.10-f55cfe37, MG-9.1.10-b6c074a3, MG-9.1.10-dfcc5dea]
    status: reviewed
    notes: Whole-object semantics per MG 8.3.10 (REQ-RES-REFDES-006), SF-068 (e), GL-ADR-019.

  - id: REQ-RES-REFDES-008
    title: Set and Del ReferenceDesignation are protected by ACL
    statement: >-
      The operator of the Message Bus prevents Set and Del
      ReferenceDesignation by unauthorized communication participants via the
      ACL of the broker.
    keyword: MUST
    domain: platform
    applies_to: [broker, platform]
    refs: [MG 9.1.10]
    quotes:
      - ref: MG 9.1.10
        text: To prevent write access by unauthorized communication participants, the operator must prevent this via ACL.
    verification: [d8]
    inventory: [MG-9.1.10-65150700, MG-9.1.10-0787e338]
    status: reviewed

  - id: REQ-RES-REFDES-009
    title: Status event after Set and Del ReferenceDesignation
    statement: >-
      After a Set or Del ReferenceDesignation, the component publishes an
      Event of the category Status about the command on
      Pub/Event/<Source>/Status/<EventLevel> with the Source of the request
      topic – mandatory from Level 2 on, recommended at Level 1.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set or Del for ReferenceDesignation.
    refs: [MG 9.1.10, SF-067]
    quotes:
      - ref: MG 9.1.10
        text: After a Set message arrived, the application must publish an Event message with status information about the Set command to the topic Pub/Event/<Source>/Status/<EventLevel> (8.3.6.1 Status) from compliance Level 2 on and should do so at Level 1 (7.4 Method Element) to provide feedback to the caller.
      - ref: MG 9.1.10
        text: After a Del message arrived, the application must publish an Event message with status information about the Del command to the topic Pub/Event/<Source>/Status/<EventLevel> (8.3.6.1 Status) from compliance Level 2 on and should do so at Level 1 (7.4 Method Element) to provide feedback to the caller.
    verification: [d7-test]
    inventory: [MG-9.1.10-afc50173, MG-9.1.10-d9b53ba2]
    status: reviewed
    notes: >-
      Same obligation as REQ-TOP-014/015; the last topic level is the
      EventLevel (SF-067 (g), GL-ADR-019). Event content: RES-EVENT (C-028).

  - id: REQ-RES-REFDES-010
    title: Changed ReferenceDesignation is published after a successful Set
    statement: >-
      After a successful Set ReferenceDesignation, the component publishes
      the new ReferenceDesignation of the asset to
      Pub/ReferenceDesignation/<Source> with the ReplyTo of the Set.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for ReferenceDesignation and the Set was successful.
    refs: [MG 9.1.10, SF-068]
    quotes:
      - ref: MG 9.1.10
        text: If setting ReferenceDesignation was successful, the new ReferenceDesignation must be published to the Pub/ReferenceDesignation/<Source> topic, according to the settings in PublicationList (8.3.8 PublicationList).
    verification: [d7-test]
    inventory: [MG-9.1.10-51f2cf7c]
    status: reviewed
    notes: Topic per SF-068 (b), GL-ADR-019; ReplyTo per REQ-MSG-015.

  # --- Children of an asset: Query of ReferenceDesignation (MG 8.3.13.1, 8.3.10, 1.3)
  - id: REQ-RES-REFDES-011
    title: Support of the Query of ReferenceDesignation
    statement: >-
      A component that supports the resource ReferenceDesignation supports
      the request of the children of an asset via the Query of
      ReferenceDesignation – optional at Level 1 and 2, mandatory at Level 3.
    keyword: MUST
    domain: messaging
    levels: {L1: MAY, L2: MAY, L3: MUST}
    applies_to: [application, device]
    condition: The component supports the resource ReferenceDesignation (REQ-CMP-020).
    refs: [MG 1.3, MG 8.3.13.1, GL-ADR-020, SF-069, SF-073]
    quotes:
      - ref: MG 1.3
        text: A component that supports the resource ReferenceDesignation may support the request of the children of an asset via Query at Level 1 and 2 and must support it at Level 3 (8.3.13.1 Query of ReferenceDesignation).
      - ref: MG 8.3.13.1
        text: The support of the Query of ReferenceDesignation is optional at compliance Level 1 and 2 and mandatory at Level 3 for every component that supports the resource ReferenceDesignation (1.3 Compliance Domains and Levels).
    verification: [d7-test]
    inventory: [MG-1.3-fc5dfccb, MG-8.3.13.1-18dcbb80]
    status: reviewed
    notes: >-
      PO decision in the C-027 review (2026-10-20): option (b) "OneDown" of
      SF-069, optional at L1/L2, mandatory at L3; carrier: generic Query
      (SF-073). REQ-CMP-020 makes the resource itself L2 SHOULD, L3 MUST.

  - id: REQ-RES-REFDES-012
    title: Query parameters of ReferenceDesignation
    statement: >-
      The Payload of a Query DataSetMessage on Get/ReferenceDesignation
      contains the query parameters: the mandatory
      String Parent (unencoded Identification Link of the asset whose
      children are requested) and the optional String Aspect with one of the
      values "Function", "Product" or "Location"; no other field.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    condition: The Get/ReferenceDesignation carries a Query.
    scope: [MG 4]
    refs: [MG 8.3.13.1, GL-ADR-020]
    verification: [schema, d7-validate]
    inventory: [MG-8.3.13.1-33176e50, MG-8.3.13.1-417aaa0a]
    status: reviewed
    notes: Reserved DataSetWriterId 9, WriterGroupName "Query", DataSetWriterName = requester (REQ-MSG-019). A receiver ignores undefined query parameters (REQ-QRY-002).

  - id: REQ-RES-REFDES-013
    title: Query of ReferenceDesignation only without Source
    statement: >-
      A Query is only sent on Get/ReferenceDesignation without Source; a
      receiver ignores a Query on Get/ReferenceDesignation with Source.
    keyword: MUST
    implicit: true
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester, responder]
    condition: The Get/ReferenceDesignation carries a Query.
    scope: [MG 8.3.13]
    refs: [MG 8.3.13.1, GL-ADR-020, SF-035]
    quotes:
      - ref: MG 8.3.13.1
        text: The Query of ReferenceDesignation is only meaningful in combination with the topic …/Get/ReferenceDesignation without Source; with Source it is ignored by the receiver.
    verification: [schema, d7-validate, d7-test]
    inventory: [MG-8.3.13.1-3feaca7a]
    status: reviewed
    notes: >-
      The generic placement (method Get, at most once) is REQ-QRY-001. A
      receiver tolerates the misplaced helper (REQ-MSG-046); the strict
      checker flags it at the sender (REQ-MSG-001).

  - id: REQ-RES-REFDES-014
    title: A Query of ReferenceDesignation is answered with the direct children
    statement: >-
      A component that supports the Query of ReferenceDesignation answers a
      Get/ReferenceDesignation with Query with the
      ReferenceDesignation objects of exactly those assets it provides
      ReferenceDesignation information for, whose Parent of the requested
      Aspect – without Aspect: of at least one aspect – has an
      IdentificationLink equal to the requested Parent (comparison per MG
      4.1). Only direct children are included. The answer is published like
      the answer to a Get without Source: each object in its own
      DataSetMessage on Pub/ReferenceDesignation with the MessageId of the
      Get as ReplyTo, paginated if necessary; if no asset matches, Messages
      is empty.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component supports the Query of ReferenceDesignation (REQ-RES-REFDES-011).
    scope: [MG 4.1, MG 8.3.11]
    refs: [MG 8.3.13.1, MG 9.1.10, GL-ADR-020]
    quotes:
      - ref: MG 8.3.13.1
        text: An application that supports the Query of ReferenceDesignation must answer such a Get with the ReferenceDesignation objects of exactly those assets it provides ReferenceDesignation information for, whose Parent of the requested Aspect contains an IdentificationLink equal to the requested Parent (4.1 IEC 61406-1 Identification Link).
      - ref: MG 8.3.13.1
        text: Without Aspect, an object matches if the Parent of at least one of its aspects matches.
      - ref: MG 8.3.13.1
        text: >-
          The answer is published like the answer to a Get without Source (9.1.10 ReferenceDesignation): each object in its own DataSetMessage, published to the topic …/Pub/ReferenceDesignation, with the MessageId of the Get as ReplyTo and paginated if necessary (8.3.11 Pagination).
      - ref: MG 8.3.13.1
        text: >-
          If no asset matches, the answer contains no ReferenceDesignation DataSetMessage ("Messages": []).
      - ref: MG 8.3.13.1
        text: Only the direct children are requested.
      - ref: MG 9.1.10
        text: The application answers with the matching objects as described in 8.3.13.1 Query of ReferenceDesignation, published to the topic Oi4v2/<ServiceType>/<AppId>/Pub/ReferenceDesignation.
    verification: [d7-test]
    inventory: [MG-8.3.13.1-14367aab, MG-8.3.13.1-bd151745, MG-8.3.13.1-2856ce44, MG-9.1.10-912abe06]
    status: reviewed
    notes: >-
      Children represented by other applications are requested from those
      applications (informative note of MG 8.3.13.1). Pagination: REQ-PAG-005;
      ReplyTo: REQ-MSG-015.

  - id: REQ-RES-REFDES-015
    title: Requester checks the Parent of the answer
    statement: >-
      A requester of a Query of ReferenceDesignation checks the Parent of the
      received ReferenceDesignation objects, because a component without
      support for it ignores the Query and answers with all objects.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [requester]
    condition: The requester sent a Query of ReferenceDesignation.
    refs: [MG 8.3.13.1, GL-ADR-020]
    quotes:
      - ref: MG 8.3.13.1
        text: An application that does not support it ignores the Query and answers with all ReferenceDesignation objects; therefore, a requester should check the Parent of the received objects.
    verification: [manual]
    inventory: [MG-8.3.13.1-2c0f88d0]
    status: reviewed

  - id: REQ-RES-REFDES-016
    title: IdentificationLink of the Parent is provided
    statement: >-
      The Parent of an aspect of a ReferenceDesignation contains the
      IdentificationLink of the parent asset whenever the parent asset has an
      Identification Link.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    condition: The component supports the resource ReferenceDesignation (REQ-CMP-020).
    refs: [MG 8.3.10, GL-ADR-020]
    quotes:
      - ref: MG 8.3.10
        text: Therefore, the IdentificationLink of a Parent should be provided whenever the parent asset has an Identification Link.
    verification: [manual]
    inventory: [MG-8.3.10-d8256e38]
    status: reviewed
    notes: The Query of ReferenceDesignation finds children only by Parent.IdentificationLink (REQ-RES-REFDES-014).
