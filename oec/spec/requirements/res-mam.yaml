# Requirements of area RES-MAM – resource MAM (Master Asset Model)
# (MG 5, 8.3.1, 9.1.1; ADR-0018, schema: catalog.schema.json).
# MAM is mandatory at all levels (REQ-CMP-006), Get from Level 2 on
# (REQ-CMP-017). The envelope follows area MSG, the helper DataSets areas PAG
# and LOC; this file holds the DataSet content (MG 5) and the Message Bus
# behavior of MG 9.1.1. Checked by tools/internal/payload (C-027).
# Reviewed and accepted by the PO in the C-027 review (2026-10-20).
area: RES-MAM
baseline: "1b779a7"
requirements:
  # --- DataSet content (MG 5, MG 8.3.1) ---------------------------------------
  - id: REQ-RES-MAM-001
    title: Fields of the MAM DataSet
    statement: >-
      The Payload of a MAM DataSetMessage contains the mandatory fields
      Manufacturer (LocalizedText), ManufacturerUri, Model (LocalizedText),
      ProductCode, HardwareRevision, SoftwareRevision, DeviceRevision,
      DeviceManual, DeviceClass, SerialNumber, ProductInstanceUri (String
      each) and RevisionCounter (Int32), and optionally Description
      (LocalizedText) and GlobalAssetId (String); no other field.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 5, MG 8.3.1, MG 8.2.7]
    verification: [schema, d7-validate]
    inventory: [MG-5-55a1eaaa, MG-5-80c79ba0, MG-5-b88773c8, MG-5-46140157, MG-5-a288c1d3, MG-5-755ace06, MG-5-0ec823e8, MG-5-cfb31dc9, MG-5-8774e8c0, MG-5-51c8416c, MG-5-5cddea30, MG-5-acac9e54, MG-5-661ef283, MG-5-18d7af65]
    status: reviewed
    notes: >-
      Field presence and types per REQ-CMP-025/026; LocalizedText per
      REQ-MSG-040; undefined keys per REQ-MSG-001 (strict) and REQ-MSG-046
      (tolerant). GlobalAssetId is read only and optional (MG 5, SF-064 (c),
      GL-ADR-019); its SHOULD-provide rule is REQ-RES-MAM-023.

  - id: REQ-RES-MAM-002
    title: MAM content equals the OPC UA VendorNameplate
    statement: >-
      If the vendor implements the optional VendorNameplate Interface of OPC
      UA Part 100 for the asset, the MAM carries the same data content as
      that interface, as far as the values satisfy the rules of MG 5 (in
      particular the ManufacturerUri is a domain name even if the
      VendorNameplate uses a GUID).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The vendor implements the VendorNameplate Interface of OPC UA Part 100 for the asset.
    refs: [MG 5, SF-064]
    quotes:
      - ref: MG 5
        text: If a vendor has implemented the optional VendorNameplate Interface from OPC UA Part 100, they shall use the same data content for implementing the Master Asset Model information, as far as the values satisfy the rules of this chapter.
      - ref: MG 5
        text: In particular, the ManufacturerUri must be a domain name (see below), even if the VendorNameplate uses a GUID.
    verification: [manual]
    inventory: [MG-5-411314b4, MG-5-84fb43b5, MG-5-5a8a5249]
    status: reviewed

  - id: REQ-RES-MAM-003
    title: Uniform manufacturer name
    statement: >-
      The Manufacturer is given in a uniform name representation of the
      company (the same writing for all assets of the manufacturer).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: It should be noted that uniformity in the name representation should be a goal
    verification: [manual]
    inventory: [MG-5-7f9f4557]
    status: reviewed

  - id: REQ-RES-MAM-004
    title: ManufacturerUri is a domain name without scheme
    statement: >-
      The ManufacturerUri is a valid URI according to RFC 3986 in the form of
      a domain name without scheme (e.g. provider.com, not
      https://provider.com), optionally with subdomains, and follows the rules
      of the Oi4Identifier for the ManufacturerUri (MG 4.3.1: lower case, no
      scheme, port or path).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    scope: [MG 4.3.1]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: This property shall provide a valid URI to RFC 3986.
      - ref: MG 5
        text: ManufacturerUri shall be a domain name without scheme (e.g. provider.com, not https://provider.com).
      - ref: MG 5
        text: ManufacturerUri may contain subdomains.
    verification: [schema, d7-validate]
    inventory: [MG-5-14aeb68b, MG-5-85176e42, MG-5-ee170828, MG-5-023701f4]
    status: reviewed
    notes: Counterpart of REQ-IL-023/024 (ManufacturerUri of the Oi4Identifier).

  - id: REQ-RES-MAM-005
    title: ManufacturerUri corresponds to the domain of the Identification Link
    statement: >-
      The ManufacturerUri corresponds to the domain of the Identification Link
      of the asset; in case of doubt it is given without scheme and without
      third level domain (provider.com, not www.provider.com).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: ManufacturerUri should correspond to the domain of the Identification Link of the asset.
    verification: [manual]
    inventory: [MG-5-2d5ef3c9]
    status: reviewed
    notes: Same rule as REQ-IL-034 from the view of the MAM.

  - id: REQ-RES-MAM-006
    title: Generated Oi4Identifier uses the MAM values
    statement: >-
      If an OEC application generates an Oi4Identifier as Identification Link
      of the asset, it uses the ManufacturerUri, Model, ProductCode and
      SerialNumber of the MAM for its elements, so that both stay consistent;
      for the LocalizedText Model it uses the Text in the locale en-US
      (REQ-IL-027).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application generates an Oi4Identifier as Identification Link of the asset.
    scope: [MG 4.3.1]
    refs: [MG 5, MG 4.3.1, SF-064]
    quotes:
      - ref: MG 5
        text: The ManufacturerUri given for this property shall also be used for the Oi4Identifier of the asset if an Oi4Identifier is generated as Identification Link by an OI4 Alliance-compliant application.
      - ref: MG 5
        text: The ProductCode given for this property shall also be used for the Oi4Identifier of the asset, if an Oi4Identifier is generated as Identification Link (4.3 The Oi4Identifier).
      - ref: MG 5
        text: The SerialNumber given for this property shall also be used for the Oi4Identifier of the asset, if an Oi4Identifier is generated as Identification Link (4.3 The Oi4Identifier).
    verification: [d7-validate]
    inventory: [MG-5-1d7325a6, MG-5-edaabec1, MG-5-afff2382]
    status: reviewed
    notes: >-
      Counterpart of REQ-IL-027 (dnp-encoding per REQ-IL-033 allowed); Model in
      en-US per SF-064 (d). Since 9b6b22f (PO request 2026-10-22) MG 5 no longer
      states the Model rule; it is stated in MG 4.3.1 (REQ-IL-027), MG 5 only
      requires en-US availability (REQ-RES-MAM-024).

  - id: REQ-RES-MAM-007
    title: Model is the product name
    statement: The Model provides the name of the product the MAM belongs to.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: The property Model shall provide the name of the product that the Master Asset Model belongs to.
    verification: [manual]
    inventory: [MG-5-b25459b1]
    status: reviewed

  - id: REQ-RES-MAM-008
    title: HardwareRevision
    statement: >-
      The HardwareRevision is the manufacturer-internal revision of the
      hardware and is incremented for subsequent hardware revisions; a
      physical asset without formalized or with unknown hardware revision uses
      "undefined" (also instead of the OPC UA default empty string taken
      from a VendorNameplate); a software-only asset (e.g. an application)
      uses the empty string.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 5, SF-064]
    quotes:
      - ref: MG 5
        text: If for a physical asset a manufacturer does not have a formalized hardware revision, it shall be set by default to "undefined".
      - ref: MG 5
        text: In this case, the HardwareRevision shall be set to an empty string to detect the differences between hardware- and software-only assets!
      - ref: MG 5
        text: A hardware with undefined or unknown hardware revision shall set HardwareRevision to undefined.
      - ref: MG 5
        text: If such a value is taken from the VendorNameplate of a physical asset, the Master Asset Model must use "undefined" instead (for HardwareRevision and SoftwareRevision), except for the cases with an empty string described in the notes of this chapter.
    verification: [manual]
    inventory: [MG-5-529e97c9, MG-5-3ef2d14f, MG-5-cdffb46b, MG-5-4060ce8e, MG-5-e9aff043, MG-5-37aaf3a1]
    status: reviewed
    notes: >-
      Not checked by the payload checks: whether an asset is software-only is
      not visible in the message (SF-064 (b)).

  - id: REQ-RES-MAM-009
    title: Revisions as Semantic Versioning or dot-separated four numbers
    statement: >-
      HardwareRevision and SoftwareRevision use Semantic Versioning (e.g.
      1.0.1, SemanticVersionString of OPC UA Part 100) or a dot-separated
      schema of four numbers (e.g. 1.0.1.0).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: A recommended best practice is to use Semantic Versioning (e.g. 1.0.1, SemanticVersionString of OPC UA Part 100) or a dot-separated four numbers schema.
    verification: [manual]
    inventory: [MG-5-100f4000, MG-5-fd63be36]
    status: reviewed

  - id: REQ-RES-MAM-010
    title: SoftwareRevision
    statement: >-
      The SoftwareRevision is the manufacturer-internal revision of the
      software installed on the asset and is incremented for subsequent
      software revisions; an asset without formalized software revision uses
      "undefined" (also instead of the OPC UA default empty string taken from
      a VendorNameplate, see REQ-RES-MAM-008).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 5, SF-064]
    quotes:
      - ref: MG 5
        text: If for any asset a manufacturer does not have a formalized software revision, it shall be set by default to "undefined".
    verification: [manual]
    inventory: [MG-5-420d4317, MG-5-925234e9, MG-5-a058c707]
    status: reviewed

  - id: REQ-RES-MAM-011
    title: SoftwareRevision of assets without software
    statement: >-
      An asset without software (e.g. a pure mechanical part) uses the empty
      string as SoftwareRevision.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    condition: The asset has no software.
    refs: [MG 5, SF-064]
    quotes:
      - ref: MG 5
        text: In this case, the SoftwareRevision should be set to an empty string!
    verification: [manual]
    inventory: [MG-5-7c86eedd]
    status: reviewed
    notes: '"undefined" (REQ-RES-MAM-010) applies to software without formalized revision (SF-064 (b)).'

  - id: REQ-RES-MAM-012
    title: DeviceManual points to a human-readable manual
    statement: >-
      The DeviceManual contains a URL (with scheme, e.g. https://) that
      points to a human-readable manual document of the asset; if no manual is
      available, it is the empty string; a path in a local file system is not
      used.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 5, SF-064]
    quotes:
      - ref: MG 5
        text: A DeviceManual property shall contain a URL (with scheme, e.g. https://) that points to a human-readable manual document for the asset.
      - ref: MG 5
        text: If no manual is available, the DeviceManual shall be set to an empty string.
      - ref: MG 5
        text: A path in a local file system (allowed by OPC UA Part 100) must not be used, since it can not be resolved by other participants of the Message Bus.
    verification: [schema, d7-validate]
    inventory: [MG-5-6bf83cbc, MG-5-2a2879c1, MG-5-93b822f3]
    status: reviewed
    notes: The empty string is used by the device examples of MG B1.1.11 and B1.1.12 (V-PAY-006).

  - id: REQ-RES-MAM-013
    title: DeviceManual as PDF document
    statement: The manual referenced by DeviceManual is a PDF document.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: The format of the document is currently unspecified, but a best practice would be a PDF document at the time of the writing of this document.
    verification: [manual]
    inventory: [MG-5-45674dc1]
    status: reviewed

  - id: REQ-RES-MAM-014
    title: DeviceClass of OEC applications
    statement: >-
      The DeviceClass of an OEC application names its ServiceType in the form
      Oi4.<ServiceType> (e.g. Oi4.OTConnector).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: However, best practice for OI4 Alliance-compliant applications is to name the ServiceType (7.2 ServiceType Element) here in the form of Oi4.<ServiceType>.
    verification: [d7-validate]
    inventory: [MG-5-bac38ad3]
    status: reviewed

  - id: REQ-RES-MAM-015
    title: SerialNumber identifies the instance
    statement: >-
      The SerialNumber is a unique identifier of the asset instance; if the
      asset has no unique serial number, one is generated in an appropriate
      way (e.g. from a MAC address) so that instances of equal types can be
      distinguished.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: This property shall be a unique identifier for an instance of an asset.
      - ref: MG 5
        text: If the assets do not have a unique serial number, it shall be generated in an appropriate way to be able to have instances of equal types.
    verification: [manual]
    inventory: [MG-5-cc876b07, MG-5-fdd0975a, MG-5-e2ab23f8]
    status: reviewed

  - id: REQ-RES-MAM-016
    title: ProductInstanceUri is the Identification Link of the asset
    statement: >-
      The ProductInstanceUri is the unencoded Identification Link of the asset
      as used in AppId, Source and DataSetWriterName (i.e. equal to the
      DataSetWriterName of the MAM DataSetMessage); an Identification Link
      provided by the asset is used unchanged, otherwise the generated one
      (e.g. the Oi4Identifier); a manufacturer-provided Identification Link is
      never overwritten by a generated one.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    scope: [MG 4.3.2, MG 8.2.3]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: The ProductInstanceUri shall contain the Identification Link of the asset (4 The Identification Link), i.e. the unencoded Identification Link that is used for this asset in the topic elements AppId and Source (7.3 AppId Element and 7.6 Source Element) and in the payload.
      - ref: MG 5
        text: An Identification Link provided by the manufacturer must not be overwritten by a generated Identification Link such as the Oi4Identifier.
    verification: [schema, d7-validate]
    inventory: [MG-5-7b92aa74, MG-5-8895ae9f, MG-5-8d0992fd, MG-5-f63a5307]
    status: reviewed
    notes: Counterpart of REQ-IL-031 and REQ-MSG-023; "should be used" of MG 5 is read together with "must be provided here unchanged".

  - id: REQ-RES-MAM-017
    title: ProductInstanceUri has at most 255 characters
    statement: The ProductInstanceUri does not exceed 255 characters.
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [application, device]
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: According to the OPC UA specification and 4.1 IEC 61406-1 Identification Link, the ProductInstanceUri must not exceed 255 characters.
    verification: [schema, d7-validate]
    inventory: [MG-5-3380ef85]
    status: reviewed

  - id: REQ-RES-MAM-018
    title: RevisionCounter counts configuration changes of the asset
    statement: >-
      Every change of the configuration of the asset, including changes of
      the master asset information, increments its RevisionCounter by one; a
      value taken from the VendorNameplate of the asset is used unchanged; an
      asset without revision counter uses -1.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 5, SF-064]
    quotes:
      - ref: MG 5
        text: Each change of the configuration of the asset, including changes of the master asset information, shall lead to an increment of the revision counter by one.
      - ref: MG 5
        text: A value taken from the VendorNameplate of the asset shall be used unchanged.
      - ref: MG 5
        text: If the asset does not support a revision counter, it shall be set to -1 (default of OPC UA Part 100).
    verification: [d7-monitor]
    inventory: [MG-5-1cd0e95c, MG-5-f80a56c7, MG-5-3e6c1a1b]
    status: reviewed

  - id: REQ-RES-MAM-019
    title: Detected components get an Identification Link and a MAM
    statement: >-
      Each component detected by an OEC application (physical thing or
      application) gets an Identification Link and a MAM.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    condition: The application detects or represents further components.
    refs: [MG 5]
    quotes:
      - ref: MG 5
        text: Each component, regardless if it is a physical thing or an application, which was detected by the OI4 Alliance framework, should get an Identification Link and a Master Asset Model.
    verification: [manual]
    inventory: [MG-5-0089cb54]
    status: reviewed
    notes: Publishing MAM for all subordinate assets is REQ-CMP-006.

  # --- Message Bus (MG 9.1.1) ------------------------------------------------
  - id: REQ-RES-MAM-020
    title: Get MAM carries no MAM object
    statement: >-
      A Get MAM NetworkMessage contains no MAM DataSetMessage; its Messages
      are empty or contain only the helper DataSets PaginationRequest and
      Locale.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    scope: [MG 8.3.11, MG 8.3.12]
    refs: [MG 9.1.1, SF-062]
    quotes:
      - ref: MG 9.1.1
        text: In combination with the method Get, the payload requires an empty NetworkMessage.
      - ref: MG 9.1.1
        text: A MAM object is not included.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.1-8bfafc5a]
    status: reviewed

  - id: REQ-RES-MAM-021
    title: Get MAM is answered with all addressed MAM objects
    statement: >-
      A Get MAM without Source is answered with all available MAM information
      of the application (itself and all subordinate assets), each in its own
      DataSetMessage of a single NetworkMessage published to Pub/MAM; a Get
      MAM with Source is answered with the MAM of that asset on
      Pub/MAM/<Source>.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The entity supports Get for MAM (REQ-CMP-017).
    refs: [MG 9.1.1, SF-062]
    quotes:
      - ref: MG 9.1.1
        text: A topic such as Oi4v2/<ServiceType>/<AppId>/Get/MAM must trigger a publication of all available MAM information, each in its own DataSetMessage added to a single NetworkMessage and published to the topic Oi4v2/<ServiceType>/<AppId>/Pub/MAM.
    verification: [d7-test]
    inventory: [MG-9.1.1-5cf81496]
    status: reviewed
    notes: >-
      Pagination of large answers is REQ-PAG-005, ReplyTo is REQ-MSG-015. The
      Source case follows from the Get list item of MG 9.1.1.

  - id: REQ-RES-MAM-022
    title: Pub MAM carries MAM objects and optionally Pagination
    statement: >-
      A Pub MAM NetworkMessage contains MAM DataSetMessages and optionally the
      helper DataSet Pagination; it contains no PaginationRequest and no
      DataSetMessage of another resource.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 9.1.1, SF-062]
    quotes:
      - ref: MG 9.1.1
        text: In combination with the method Pub, the payload contains DataSetMessages of type MAM and optional Pagination (8.3.11.2 Pagination).
    verification: [schema, d7-validate]
    inventory: [MG-9.1.1-4d028d73]
    status: reviewed
    notes: A Locale is only meaningful in a Get and ignored in other methods (REQ-LOC-002).

  - id: REQ-RES-MAM-023
    title: GlobalAssetId is provided for assets with an AAS
    statement: >-
      If the asset has an Asset Administration Shell, the MAM provides its
      globalAssetId (IDTA-01001) as GlobalAssetId; otherwise the field is
      omitted.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    condition: The asset has an Asset Administration Shell.
    refs: [MG 5, SF-064]
    quotes:
      - ref: MG 5
        text: It should be provided if the asset has an AAS; otherwise it is omitted.
    verification: [manual]
    inventory: [MG-5-8b8467ac]
    status: reviewed

  - id: REQ-RES-MAM-024
    title: Model available in en-US if used for the Oi4Identifier
    statement: >-
      If the Model of the MAM is used as an element of the Oi4Identifier, the
      MAM provides Model at least in the locale en-US, so that the Text in
      en-US can be taken for the Oi4Identifier (REQ-IL-027). Other locales
      are optional (OPC UA does not require en-US in general).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The Model of the MAM is used as an element of the Oi4Identifier.
    refs: [MG 5, MG 4.3.1, MG 8.3.12]
    quotes:
      - ref: MG 5
        text: If the Model is used as an element of the Oi4Identifier (4.3.1 Structure of the Oi4Identifier), it must at least be available in the locale English (en-US).
    verification: [manual]
    inventory: [MG-5-e24d1f2f]
    status: reviewed
    notes: PO request 2026-10-22 (moved from the former MG 5 Model rule, SF-064 (d)).
