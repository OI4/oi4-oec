# Requirements of area PAG – helper DataSets PaginationRequest and Pagination
# (MG 8.3.11, 8.3.11.1, 8.3.11.2 and the pagination sentences of MG 9.1.x;
# ADR-0018). Reserved DataSetWriterIds and names: REQ-MSG-019. Checked by
# tools/internal/payload (C-027).
area: PAG
baseline: "c6453c7"
requirements:
  - id: REQ-PAG-001
    title: Fields of the PaginationRequest DataSet
    statement: >-
      The Payload of a PaginationRequest DataSetMessage contains the
      mandatory fields PerPage (UInt32 > 0, maximum number of resource
      DataSetMessages per NetworkMessage of the answer) and Page (UInt32, the
      requested page); no other field.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    condition: The Get carries a PaginationRequest.
    refs: [MG 8.3.11.1, SF-063]
    quotes:
      - ref: MG 8.3.11.1
        text: The value of PerPage must be > 0.
    verification: [schema, d7-validate]
    inventory: [MG-8.3.11.1-83b892c6, MG-8.3.11.1-8cb5f159, MG-8.3.11.1-79ee4a24]
    status: draft

  - id: REQ-PAG-002
    title: A PaginationRequest is answered page by page
    statement: >-
      A Get with a PaginationRequest is answered with NetworkMessages that
      contain at most PerPage resource DataSetMessages each: with Page > 0
      only the requested page is published, with Page 0 all pages are
      published one after the other. A requested page beyond the last page is
      answered with a page without resource DataSetMessages (proposal SF-063).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester, responder]
    condition: The Get carries a PaginationRequest.
    refs: [MG 8.3.11.1, SF-063]
    quotes:
      - ref: MG 8.3.11.1
        text: A published message to the topic method Get may use PerPage to announce, how many DataSetMessages it expects maximum in the related publication.
      - ref: MG 8.3.11.1
        text: If several NetworkMessages must be published to transport the relevant DataSetMessages, the value of Page shows which page is requested.
      - ref: MG 8.3.11.1
        text: The value of Page must be > 0 to get a defined page with related information.
    verification: [d7-test]
    inventory: [MG-8.3.11.1-c4df177f, MG-8.3.11.1-cd18f8ad, MG-8.3.11.1-35d839fd, MG-8.3.11.1-6175a9d6]
    status: draft
    notes: >-
      "may use PerPage" refers to the use of the PaginationRequest as a whole;
      PerPage itself is Mandatory (SF-063).

  - id: REQ-PAG-003
    title: Fields of the Pagination DataSet
    statement: >-
      The Payload of a Pagination DataSetMessage contains the mandatory fields
      TotalCount (UInt32), PerPage (UInt32), Page (UInt32), HasNext (Boolean)
      and PaginationId (String in the form of a MessageId); no other field.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    condition: The publication carries a Pagination.
    refs: [MG 8.3.11.2, SF-063]
    verification: [schema, d7-validate]
    inventory: [MG-8.3.11.2-4e072fbd, MG-8.3.11.2-97e960a0, MG-8.3.11.2-01941170, MG-8.3.11.2-bceb2d3b, MG-8.3.11.2-8e50e6a3]
    status: draft

  - id: REQ-PAG-004
    title: Pagination values are consistent
    statement: >-
      In a Pagination, TotalCount is the number of resource DataSetMessages
      of the whole series (helper DataSets not counted), PerPage the maximum
      number of resource DataSetMessages per NetworkMessage (the requested
      PerPage when answering a PaginationRequest), Page the number of the
      published page starting at 1, HasNext true exactly if Page · PerPage <
      TotalCount, and PaginationId the MessageId of the first NetworkMessage
      of the series; a NetworkMessage contains at most PerPage resource
      DataSetMessages (proposal SF-063).
    keyword: MUST
    implicit: true
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    condition: The publication carries a Pagination.
    refs: [MG 8.3.11.2, SF-035, SF-063]
    quotes:
      - ref: MG 8.3.11.2
        text: A published message to the topic methods Pub might use TotalCount to announce, how many of the actual processed resources can be expected.
      - ref: MG 8.3.11.2
        text: A published message to the topic methods Pub may use PerPage to announce, how many of the TotalCount DataSetMessages will be included in this publication.
      - ref: MG 8.3.11.2
        text: HasNext shows if an additional NetworkMessage can be expected.
      - ref: MG 8.3.11.2
        text: The PaginationId contains the <MessageId> of the first/initial paginated NetworkMessage in this series.
    verification: [d7-validate, d7-monitor]
    inventory: [MG-8.3.11.2-f0bcbef0, MG-8.3.11.2-35875bdf, MG-8.3.11.2-1b7ec9ae, MG-8.3.11.2-2d5655ce, MG-8.3.11.2-e61bb795, MG-8.3.11.2-42fdc31a]
    status: draft
    notes: >-
      Within one NetworkMessage the payload checker verifies the field types,
      Page ≥ 1, the number of resource DataSetMessages ≤ PerPage, HasNext and
      – on Page 1 – PaginationId = MessageId; the order of a series is
      checked by D7 (monitor).

  - id: REQ-PAG-005
    title: Too many DataSetMessages are paginated
    statement: >-
      A publisher that has more resource DataSetMessages than fit into one
      NetworkMessage (by its own limit or by the PerPage of a
      PaginationRequest) publishes them in several NetworkMessages to the same
      topic, each with a Pagination, until all DataSetMessages are published.
      This applies to every resource with a list of DataSetMessages (e.g. MAM,
      Health, Profile, PublicationList, ReferenceDesignation).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 8.3.11, MG 9.1.1, MG 9.1.2, MG 9.1.7, MG 9.1.8, MG 9.1.10, SF-063]
    quotes:
      - ref: MG 8.3.11
        text: To prevent this, an optional DataSetMessage with Pagination information is available to indicate that there are other NetworkMessages with associated DataSetMessages.
      - ref: MG 9.1.1
        text: Once too many DataSetMessages are available to add to a single NetworkMessage, pagination mechanism must be used (8.3.11 Pagination).
      - ref: MG 9.1.1
        text: The publisher must publish as many NetworkMessages to the same topic, using pagination object for telling so, till all DataSetMessages are published.
    verification: [d7-monitor, d7-test]
    inventory: [MG-8.3.11-0a2549a0, MG-8.3.11-135129ca, MG-9.1.1-a242a498, MG-9.1.1-5f90ef30, MG-9.1.2-262fa218, MG-9.1.2-0af27f74, MG-9.1.7-fe765cc6, MG-9.1.7-a9a20bff, MG-9.1.8-ea9cd5b6, MG-9.1.8-03c98043, MG-9.1.10-e685d6ba, MG-9.1.10-23d0ef72]
    status: draft
    notes: >-
      For publications not triggered by a Get the publisher defines the
      maximum size on its own (MG 8.3.11). The pagination sentences of the
      other resources (Data, Event, SubscriptionList, …) are mapped in C-028.

  - id: REQ-PAG-006
    title: A subscriber re-triggers a too long publication with PaginationRequest
    statement: >-
      An application that cannot handle the size of a publication requests
      the information again via Get with a PaginationRequest.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [subscriber, requester]
    condition: A received publication is too long for the application.
    refs: [MG 8.3.11]
    quotes:
      - ref: MG 8.3.11
        text: If these messages are too long for a specific application, that application must re-trigger publication of the information by using PaginationRequest.
    verification: [manual]
    inventory: [MG-8.3.11-7898fea4]
    status: draft

  - id: REQ-PAG-007
    title: Paginated DataSetMessages are consistent
    statement: >-
      If NetworkMessages are paginated, the publisher fetches the provided
      DataSetMessages so that the series is consistent (e.g. a snapshot taken
      at the start of the series).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    condition: The publication is paginated.
    refs: [MG 8.3.11]
    verification: [manual]
    inventory: [MG-8.3.11-19ff609c]
    status: draft

  - id: REQ-PAG-008
    title: PaginationRequest only in Get, Pagination only in Pub
    statement: >-
      A NetworkMessage contains a PaginationRequest only with the method Get
      and a Pagination only with the method Pub, each at most once (proposal
      SF-062 (b)).
    keyword: MUST
    implicit: true
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher, requester, responder]
    refs: [MG 8.3.11, MG 8.3.11.1, MG 8.3.11.2, SF-035, SF-062]
    quotes:
      - ref: MG 8.3.11
        text: The Pagination object and PaginationRequest object differ for the methods Pub and Get.
      - ref: MG 8.3.11
        text: A subscriber that wants to request information via …/Get/<Resource> can add a PaginationRequest object to its payload to define the maximum number of DataSetMessages the NetworkMessage may contain so that the subscriber is able to handle it.
    verification: [schema, d7-validate]
    inventory: [MG-8.3.11-1bd35c16, MG-8.3.11-083cc809]
    status: draft
    notes: >-
      "Pagination information can be used … for every Method" (MG 8.3.11)
      contradicts the method-specific definitions of 8.3.11.1 (Get) and
      8.3.11.2 (Pub); a receiver ignores a misplaced helper (REQ-MSG-046).
