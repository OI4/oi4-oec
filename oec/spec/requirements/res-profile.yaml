# Requirements of area RES-PROFILE – resource Profile
# (MG 8.3.7, 9.1.7; ADR-0018, schema: catalog.schema.json).
# Support of Profile: REQ-CMP-018 (L2 SHOULD, L3 MUST); every supported
# resource is listed: REQ-CMP-021. Checked by tools/internal/payload (C-027).
area: RES-PROFILE
baseline: "c6453c7"
requirements:
  - id: REQ-RES-PROFILE-001
    title: Fields of the Profile DataSet
    statement: >-
      The Payload of a Profile DataSetMessage contains the mandatory field
      Resources, an array of distinct strings, each the name of a resource of
      MG 7.5.1 or of a common service of MG 7.5.2 (proposal SF-066 (a)); no
      other field.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity supports the resource Profile (REQ-CMP-018).
    scope: [MG 7.5.1, MG 7.5.2]
    refs: [MG 8.3.7, SF-066]
    verification: [schema, d7-validate]
    inventory: [MG-8.3.7-cf84476b]
    status: draft
    notes: >-
      MG 8.3.7 gives Type String with Value Range "<array of resources>"; B2.5
      describes an array of String (V-PAY-014). The closed set of names is
      REQ-TOP-012.

  - id: REQ-RES-PROFILE-002
    title: Profile lists exactly the supported resources
    statement: >-
      The Profile of an asset lists every resource the entity serves for that
      asset – the mandatory resources of its compliance level and the
      optional ones it supports – and no resource it does not support.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity supports the resource Profile (REQ-CMP-018).
    scope: [MG 1.3]
    refs: [MG 8.3.7, MG 9.1.7, SF-066]
    quotes:
      - ref: MG 8.3.7
        text: It contains an array of all mandatory and optional resources (7.5 Resource Element) which are supported.
      - ref: MG 9.1.7
        text: Which resources are mandatory depends on the compliance level of the application or device (1.3 Compliance Domains and Levels).
    verification: [d7-test]
    inventory: [MG-8.3.7-70f9d600, MG-8.3.7-954d25a2, MG-8.3.7-075358de, MG-9.1.7-dbeea681, MG-9.1.7-1694ed5f]
    status: draft
    notes: >-
      Same rule as REQ-CMP-021 from the view of the DataSet; the Profile of a
      subordinate asset lists what the representing application serves for
      it (SF-066 (c)).

  - id: REQ-RES-PROFILE-003
    title: Get Profile carries no Profile object
    statement: >-
      A Get Profile NetworkMessage contains no Profile DataSetMessage; its
      Messages are empty or contain only the helper DataSets
      PaginationRequest and Locale.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    scope: [MG 8.3.11, MG 8.3.12]
    refs: [MG 9.1.7, SF-062]
    quotes:
      - ref: MG 9.1.7
        text: In combination with the method Get, the payload requires an empty NetworkMessage.
      - ref: MG 9.1.7
        text: A Profile object is not included.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.7-688a121b]
    status: draft

  - id: REQ-RES-PROFILE-004
    title: Get Profile is answered with all addressed Profile objects
    statement: >-
      A Get Profile without Source is answered with all available Profile
      information of the application (itself and all subordinate assets), each
      in its own DataSetMessage of a single NetworkMessage published to
      Pub/Profile; a Get Profile with Source is answered with the Profile of
      that asset on Pub/Profile/<Source>.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The entity supports the resource Profile (REQ-CMP-018).
    refs: [MG 9.1.7, SF-062]
    quotes:
      - ref: MG 9.1.7
        text: Via the <Method>/<Resource>[/<Source>] combination Get/Profile[/<Source>], the publication of this information to the Pub/Profile[/<Source>] topic can be triggered.
      - ref: MG 9.1.7
        text: A topic, such as Oi4v2/<ServiceType>/<AppId>/Get/Profile, must trigger a publication of all available Profile information, each in its own DataSetMessage added to a single NetworkMessage and published to the topic Oi4v2/<ServiceType>/<AppId>/Pub/Profile.
    verification: [d7-test]
    inventory: [MG-9.1.7-1883d668, MG-9.1.7-96f1ecd8]
    status: draft
    notes: Pagination of large answers is REQ-PAG-005, ReplyTo is REQ-MSG-015.

  - id: REQ-RES-PROFILE-005
    title: Pub Profile carries Profile objects and optionally Pagination
    statement: >-
      A Pub Profile NetworkMessage contains Profile DataSetMessages and
      optionally the helper DataSet Pagination; it contains no
      PaginationRequest and no DataSetMessage of another resource.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 9.1.7, SF-062]
    quotes:
      - ref: MG 9.1.7
        text: In combination with the method Pub, the payload contains DataSetMessages of type Profile and optional Pagination (8.3.11 Pagination).
    verification: [schema, d7-validate]
    inventory: [MG-9.1.7-0df1dde4]
    status: draft
    notes: A Locale DataSet may be added to every method (MG 8.3.12, REQ-LOC-002, SF-062 (c)).
