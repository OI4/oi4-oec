# Requirements of area REG – OEC Registry (MG A1; ADR-0018). The OEC
# Registry is a platform component (REQ-PLT-008); its requirements are in
# domain platform and not graded. The main tasks of MG A1 are MUST by the
# lead-in "must fulfill" (SF-089, resolved).
# Drafted in C-030.
area: REG
baseline: "605fbb7"
requirements:
  # --- Main tasks (MG A1) ---------------------------------------------------
  - id: REQ-REG-001
    title: Registry collects MAM and Health of reachable assets
    statement: >-
      The OEC Registry collects information about the reachable assets
      (applications and devices) on the Message Bus by listening mainly to
      their MAM and Health resources.
    keyword: MUST
    domain: platform
    applies_to: [registry]
    refs: [MG A1, MG 9.1.1, MG 9.1.2, SF-089]
    quotes:
      - ref: MG A1
        text: 'The OEC Registry must fulfill the following main tasks; items marked with "(optional)" are optional:'
      - ref: MG A1
        text: It collects the data of defined Open Industry 4.0 Alliance resources from the Message Bus and provides it to others via the Message Bus and a web front-end.
      - ref: MG A1
        text: Collect information about reachable assets (applications and devices) by listening mainly to MAM and Health resources
    verification: [d8]
    inventory: [MG-A1-f2801e0d]
    status: reviewed
    notes: >-
      The main tasks are MUST by the lead-in since SF-089 (a) was resolved
      (before: implicit). D8 can check the effect via
      REQ-REG-002: an asset that published its MAM is returned by the
      Registry.

  - id: REQ-REG-002
    title: Registry republishes MAM and Health on Get
    statement: >-
      The OEC Registry answers Get requests on its own topics: a Get on
      Oi4v2/Registry/<AppId>/Get/MAM triggers the publication of the MAM of
      all available assets to Oi4v2/Registry/<AppId>/Pub/MAM, a Get on
      Oi4v2/Registry/<AppId>/Get/MAM/<Source> the publication of the MAM of
      the asset <Source> to Oi4v2/Registry/<AppId>/Pub/MAM/<Source>; the same
      applies to Health (Oi4v2/Registry/<AppId>/Get/Health[/<Source>] →
      Oi4v2/Registry/<AppId>/Pub/Health[/<Source>]). <AppId> is the encoded
      Identification Link of the Registry itself. The Registry publishes with
      its own PublisherId and DataSetWriterIds; the DataSetWriterName of each
      DataSetMessage is the Identification Link of the described asset and
      its payload is the last MAM or Health received from that asset.
      Available assets are the assets that are online (after their Birth
      message, not after their Close or Will message). A publication that
      exceeds the maximum message size is paginated.
    keyword: MUST
    domain: platform
    applies_to: [registry]
    refs: [MG A1, MG 7, MG 9.1.1, MG 9.1.2, MG 8.2.1, MG 8.2.3, MG 6.3.3, MG 6.3.4, MG 6.3.5, MG 8.3.11, SF-089]
    quotes:
      - ref: MG A1
        text: 'The OEC Registry must fulfill the following main tasks; items marked with "(optional)" are optional:'
      - ref: MG A1
        text: Whenever an application needs to know which other assets (applications and devices) are represented in Message Bus communication, the OEC Registry can provide the Identification Link, Master Asset Model (MAM), and Health information.
      - ref: MG A1
        text: 'Provide MAM and Health information of all available assets (applications and devices) to others on the Message Bus by offering services to get this information:'
      - ref: MG A1
        text: the topic Oi4v2/Registry/<AppId>/Get/MAM triggers a publication of all master data to the topic Oi4v2/Registry/<AppId>/Pub/MAM.
      - ref: MG A1
        text: the topic Oi4v2/Registry/<AppId>/Get/MAM/<Source> triggers the publication of specific master data to the topic Oi4v2/Registry/<AppId>/Pub/MAM/<Source>.
      - ref: MG A1
        text: the topic Oi4v2/Registry/<AppId>/Get/Health triggers a publication of all Health information to the topic Oi4v2/Registry/<AppId>/Pub/Health.
      - ref: MG A1
        text: the topic Oi4v2/Registry/<AppId>/Get/Health/<Source> triggers the publication of specific Health information to the topic Oi4v2/Registry/<AppId>/Pub/Health/<Source>.
      - ref: MG A1
        text: 'The OEC Registry publishes these messages as publisher of its own: the PublisherId of the NetworkMessage (8.2.1 NetworkMessage) and the DataSetWriterIds are those of the OEC Registry.'
      - ref: MG A1
        text: The DataSetWriterName of each DataSetMessage (8.2.3 DataSetMessage) is the Identification Link of the described asset, and its payload is the last MAM or Health received from that asset.
      - ref: MG A1
        text: 'Available assets are the assets that are online: an asset is available after its Birth message (6.3.3 Birth Message) and no longer available after its Close or Will message (6.3.4 Close Message, 6.3.5 Will Message).'
      - ref: MG A1
        text: If the DataSetMessages exceed the maximum size of a message, the publication is paginated (8.3.11 Pagination).
    verification: [d8]
    inventory: [MG-A1-54951c67, MG-A1-f2801e0d, MG-A1-367de753]
    status: reviewed
    notes: >-
      SF-089 (b) resolved: the publisher, the DataSetWriterName, the payload
      and "available" are now stated in MG A1 (before: proposed
      interpretation in these notes, implicit MUST). Consistent with
      REQ-MSG-021 (own DataSetWriterIds), REQ-MSG-023 (DataSetWriterName),
      REQ-LIFE-011 … 013 (online/offline) and REQ-PAG-005 (pagination).
      "can provide" describes the use for other applications, not an option
      of the Registry. Back to draft in the C-030 closure (statement
      extended).

  - id: REQ-REG-003
    title: Registry web front-end lists applications and devices
    statement: >-
      The OEC Registry provides a web front-end that lists all running OI4
      applications and all detected devices, each with its MAM, its latest
      Health information and its availability.
    keyword: MUST
    domain: platform
    applies_to: [registry]
    refs: [MG A1, SF-089]
    quotes:
      - ref: MG A1
        text: 'The OEC Registry must fulfill the following main tasks; items marked with "(optional)" are optional:'
      - ref: MG A1
        text: 'Provide a web front-end that shows relevant information to its users:'
      - ref: MG A1
        text: 'List all running Open Industry 4.0 Alliance applications:'
      - ref: MG A1
        text: 'List all detected devices:'
      - ref: MG A1
        text: incl. the latest Health information (9.1.2 Health) and availability
    verification: [manual]
    inventory: [MG-A1-f2801e0d]
    status: reviewed
    notes: >-
      The main tasks are MUST by the lead-in since SF-089 (a) was resolved
      (before: implicit).

  - id: REQ-REG-004
    title: Optional content of the Registry web front-end
    statement: >-
      The web front-end of the OEC Registry may additionally show the
      supported resources (Profile) of each application and device, the
      related publisher application of each device and the audit trail
      published via the Event resource.
    keyword: MAY
    domain: platform
    applies_to: [registry]
    refs: [MG A1, MG 9.1.6, MG 9.1.7]
    quotes:
      - ref: MG A1
        text: incl. supported resources (9.1.7 Profile) (optional)
      - ref: MG A1
        text: incl. the related publisher application (optional)
      - ref: MG A1
        text: Show the audit trail published via the Event resource on the Message Bus (9.1.6 Event) (optional)
    verification: [manual]
    inventory: [MG-A1-661d05da, MG-A1-77512b6b, MG-A1-d7b2bbc2, MG-A1-c6ad2a8c]
    status: reviewed

  # --- Optional services (MG A1) --------------------------------------------
  - id: REQ-REG-005
    title: Optional services of the Registry
    statement: >-
      The OEC Registry may offer additional services, such as storing the
      audit trail in a log file to make it available offline, checking the
      basic conformity of received messages by schema validation and showing
      the result, and showing an observed OEC Messaging Compliance level
      (REQ-CMP-013).
    keyword: MAY
    domain: platform
    applies_to: [registry]
    refs: [MG A1, MG 1.3]
    quotes:
      - ref: MG A1
        text: 'Because of its central position, it might offer additional optional services such as:'
      - ref: MG A1
        text: Store the audit trail in a log file to make it available offline (support-relevant).
      - ref: MG A1
        text: Check basic conformity, based on schema validation of received messages, and show the result.
    verification: [manual]
    inventory: [MG-A1-9306caa6, MG-A1-a76196eb]
    status: reviewed
    notes: The observed compliance level is detailed by REQ-CMP-013 (reviewed); it is informative only.

  - id: REQ-REG-006
    title: Registry started first
    statement: >-
      The OEC Registry is the application that is started first on the OEC
      platform.
    keyword: SHOULD
    domain: platform
    applies_to: [registry, platform]
    refs: [MG A1]
    quotes:
      - ref: MG A1
        text: For seamless operation, the OEC Registry should be the application that is started first on the Open Edge Computing platform.
    verification: [manual]
    inventory: [MG-A1-a54eaa47]
    status: reviewed
    notes: >-
      Applications must not rely on it: the Registry learns about assets
      started earlier from their next MAM/Health publication or by Get
      requests (MG A1 note, informative).

  - id: REQ-REG-007
    title: Registry web front-end via TLS
    statement: >-
      The OEC Registry provides its web front-end and the REST API to its
      back-end via TLS. The location of the server certificate is
      implementation-specific; a containerized Registry can use the
      certificate of the application (REQ-CNT-007, REQ-CNT-008, REQ-CNT-025).
      Without a configured certificate, it uses a self-signed certificate.
    keyword: SHOULD
    domain: platform
    applies_to: [registry]
    refs: [MG A1, RIG 4.1.2, RIG 4.1.3, GL-ADR-022, SF-089]
    quotes:
      - ref: MG A1
        text: The OEC Registry should provide its web front-end and the REST API to its back-end via TLS.
      - ref: MG A1
        text: Where the server certificate is stored is implementation-specific; a containerized OEC Registry can use the certificate of the application (OEC Runtime & Infrastructure Guideline, 4.1.2 OI4 Certificate Storage and 4.1.3 Secret Storage).
      - ref: MG A1
        text: Without a configured certificate, a self-signed certificate is used.
    verification: [manual]
    inventory: [MG-A1-5f13c344, MG-A1-f4cbd047]
    status: reviewed
    notes: >-
      SF-089 (c) resolved: TLS moved from the note on the reference
      implementation into the main text (recommendation for every Registry);
      the "defined path" is implementation-specific, with the certificate of
      the application as option (GL-ADR-022). The default ports 5798 (web
      front-end) and 5799 (REST API) of the reference implementation are
      informative. Back to draft in the C-030 closure (statement changed).
