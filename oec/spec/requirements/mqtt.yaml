# Requirements of area MQTT – general requirements on MQTT (MG 6 without
# MG 6.3.3 … 6.3.5, which are area LIFE; ADR-0018, schema: catalog.schema.json).
# Grading (MG 6 note, MG 1.3): protocol version, broker address and ports and
# security settings (MG 6.1, 6.2.1, 6.2.2) are mandatory at all levels
# (REQ-CMP-001, REQ-CMP-002); all other requirements of MG 6 are recommended
# at Levels 1 and 2 and mandatory at Level 3 (REQ-CMP-009): a MUST of these
# sections is SHOULD at Levels 1 and 2, a SHOULD stays SHOULD. Requirements on
# the broker and the platform have domain platform (MG 1.2). Drafted in C-025;
# keywords and connection details added to the guideline in C-026 (SF-057,
# SF-060).
area: MQTT
baseline: "2e32a6b"
requirements:
  # --- Protocol version (MG 6.1) --------------------------------------------
  - id: REQ-MQTT-001
    title: MQTT v3.1.1 as minimum protocol version (client)
    statement: >-
      A component connects to the Message Bus with MQTT v3.1.1 or a later MQTT
      version supported by the broker. All mechanisms of the guideline (Birth,
      Close and Will message, topic namespace, payloads) work with MQTT
      v3.1.1; a component does not depend on features of later versions (e.g.
      MQTT v5.0 user properties, response topic, correlation data, message
      expiry) for them and does not put information that other participants
      need into such features.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 6, MG 6.1, SF-060]
    quotes:
      - ref: MG 6.1
        text: Open Industry 4.0 Alliance-compliant communication must use MQTT v3.1.1 as minimum protocol version.
      - ref: MG 6.1
        text: All mechanisms defined in this guideline (e.g. Birth, Close and Will message, versioning of the topic namespace) work with MQTT v3.1.1 and do not require any MQTT v5.0 features.
      - ref: MG 6.1
        text: Therefore MQTT v3.1.1 is the minimum required version, which ensures maximum acceptance and interoperability.
      - ref: MG 6.1
        text: This guideline does not require any MQTT v5.0 features.
      - ref: MG 6.1
        text: A client may connect with a later MQTT version supported by the broker, but it must not depend on features of later versions (e.g. MQTT v5.0 user properties, response topic, correlation data, message expiry) for the mechanisms of this guideline and must not put information that other participants need into such features.
    verification: [manual, d7-test]
    inventory: [MG-6.1-460b8388, MG-6.1-5152cb4d, MG-6.1-ec7a4cff, MG-6.1-4107e48f, MG-6.1-76c661f1, MG-6-31ee6521]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-001 (mandatory at all levels). Use of later versions:
      SF-060 (a), C-026. D7 sees the protocol version of the application under
      test only with a test broker it controls.

  - id: REQ-MQTT-002
    title: Broker supports MQTT v3.1.1
    statement: >-
      The MQTT broker of an OEC platform (the Message Bus) accepts MQTT v3.1.1
      connections. It may additionally support later MQTT versions.
    keyword: MUST
    domain: platform
    applies_to: [broker, platform]
    refs: [MG 6.1, SF-060]
    quotes:
      - ref: MG 6.1
        text: The broker must support MQTT v3.1.1.
    verification: [d8]
    inventory: [MG-6.1-f1242c63, MG-6.1-460b8388]
    status: reviewed
    notes: SF-060 (a), C-026. The platform requirements of the RIG are area PLT.

  # --- Broker address and ports (MG 6.2.1) ----------------------------------
  - id: REQ-MQTT-003
    title: Broker address provided via the Message Bus storage
    statement: >-
      The platform makes the IP address or host name of the MQTT broker
      available to every container through the Message Bus storage
      (broker.json, RIG 4.1.1).
    keyword: MUST
    domain: platform
    applies_to: [platform]
    refs: [MG 6.2.1, RIG 4.1.1]
    quotes:
      - ref: MG 6.2.1
        text: The IP address or host name of the MQTT broker is system-dependent and must be made available to any container by using the Message Bus storage (OEC Runtime & Infrastructure Guideline, 4.1.1 Message Bus Storage).
    verification: [d8]
    inventory: [MG-6.2.1-7407c437]
    status: reviewed
    notes: >-
      The content of broker.json and the use of the Message Bus storage by a
      containerized application are area CNT (RIG 4.1.1, C-030). A component
      without container (device with its own MQTT client) gets the broker
      address by its own configuration.

  - id: REQ-MQTT-004
    title: Broker port 8883 by default
    statement: >-
      A component connects to the broker on port 8883 unless the Message Bus
      storage (SecurePort of broker.json, RIG 4.1.1) or, for a component
      without container, its configuration sets another port.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 6, MG 6.2.1, RIG 4.1.1, SF-057]
    quotes:
      - ref: MG 6.2.1
        text: As default setting, the port 8883 for secure communication must be used.
      - ref: MG 6.2.1
        text: Through the Message Bus storage, the default might be set to a system-dependent value (OEC Runtime & Infrastructure Guideline, 4.1.1 Message Bus Storage).
      - ref: MG 6
        text: The protocol version, the broker address and ports, the security settings as well as the birth message and the will message are mandatory for all levels.
    verification: [manual]
    inventory: [MG-6.2.1-b440c05c, MG-6-31ee6521]
    status: reviewed
    notes: Keyword added in C-026 (SF-057 (a)); graded by REQ-CMP-001.

  # --- Security settings (MG 6.2.2) -----------------------------------------
  - id: REQ-MQTT-005
    title: MQTT over TLS 1.2 or higher only
    statement: >-
      Every MQTT connection of a component to the broker is encrypted with
      TLS version 1.2 or higher. A component never uses a non-secure MQTT
      connection (e.g. port 1883).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 6, MG 6.2.1, MG 6.2.2, SF-057]
    quotes:
      - ref: MG 6.2.2
        text: The MQTT connection to the broker is always encrypted (TLS version 1.2 or higher is mandatory).
      - ref: MG 6.2.1
        text: Non-secure connections (e.g. through port 1883) must not be used by clients and must not be supported by the broker.
    verification: [d7-test, manual]
    inventory: [MG-6.2.2-5c7608e4, MG-6.2.1-be806906, MG-6-31ee6521]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-002. Keyword of the port 1883 sentence added in C-026
      (SF-057 (a)). In a D7 test environment the broker accepts TLS only
      (REQ-MQTT-006), so an application that connects uses TLS.

  - id: REQ-MQTT-006
    title: Broker accepts TLS connections only
    statement: >-
      The MQTT broker of an OEC platform accepts only connections encrypted
      with TLS 1.2 or higher; it offers no non-secure listener (e.g. port
      1883).
    keyword: MUST
    domain: platform
    applies_to: [broker, platform]
    refs: [MG 6.2.1, MG 6.2.2, SF-057]
    quotes:
      - ref: MG 6.2.2
        text: The MQTT connection to the broker is always encrypted (TLS version 1.2 or higher is mandatory).
      - ref: MG 6.2.1
        text: Non-secure connections (e.g. through port 1883) must not be used by clients and must not be supported by the broker.
    verification: [d8]
    inventory: [MG-6.2.2-5c7608e4, MG-6.2.1-be806906]
    status: reviewed

  - id: REQ-MQTT-007
    title: Broker certificate signed by a CA
    statement: >-
      The broker uses a certificate signed by a well-known (public) or a
      platform- or user-specific certificate authority (CA); self-signed
      broker certificates are not allowed. The certificate of the signing CA
      is provided as ca.pem in the OI4 certificate storage (REQ-CNT-005) or,
      for a different local CA, as broker_ca.pem in the Message Bus storage
      (REQ-CNT-001).
    keyword: MUST
    domain: platform
    applies_to: [broker, platform]
    refs: [MG 6.2.2, RIG 4.1.1, RIG 4.1.2, SF-057, SF-091]
    quotes:
      - ref: MG 6.2.2
        text: The broker must use a certificate which is signed by a well-known (public) or a platform- or user-specific certificate authority (CA); self-signed broker certificates are not allowed.
    verification: [d8, manual]
    inventory: [MG-6.2.2-986fbb0d]
    status: reviewed
    notes: >-
      "preferably shall" replaced by "should" in C-026 (SF-057 (d)). SF-091
      (g), decided by the PO in the C-030 review (2026-10-22), revises this to
      MUST: the client must verify the broker certificate against a CA
      certificate (REQ-MQTT-008). MG 6.2.2 says "must" since guideline
      fbe6173 (SF-091 implemented on PO order 2026-10-22). An own CA of the platform is only
      required if it issues certificates. Back to draft in the C-030 closure
      (SHOULD → MUST).

  - id: REQ-MQTT-008
    title: Client verifies the broker certificate
    statement: >-
      A component verifies the certificate of the broker when it sets up the
      TLS connection: the certificate chain against the CA of the Message Bus
      storage (broker_ca.pem; if no local CA is present, the CA of the OI4
      certificate storage, RIG 4.1.2) or, for a component without container,
      its configured CA, and the broker address. A connection to a broker
      whose certificate cannot be verified is not used; an insecure mode is
      never the default.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 6, MG 6.2.2, RIG 4.1.1, RIG 4.1.2, SF-060]
    quotes:
      - ref: MG 6.2.2
        text: 'The client must verify the broker certificate when it establishes the TLS connection: the certificate chain against the CA certificate (broker_ca.pem of the Message Bus storage or, if no local CA is present, the CA of the OI4 certificate storage; for a client without container, its configured CA) and the broker address.'
      - ref: MG 6.2.2
        text: The client must not use a connection to a broker whose certificate cannot be verified; a mode without this verification must not be the default.
    verification: [manual, d7-test]
    inventory: [MG-6.2.2-1c096322, MG-6.2.2-e044b5e3, MG-6-31ee6521]
    status: reviewed
    notes: >-
      Added to the guideline in C-026 (SF-060 (b)). Graded by REQ-CMP-002
      (security settings). D7 can check it only with a test broker that
      presents an untrusted certificate.

  - id: REQ-MQTT-009
    title: Client authenticates to the broker
    statement: >-
      A component authenticates itself to the Message Bus either by username
      and password or by a client certificate (mutual TLS).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 6, MG 6.2.2, RIG 4.1.2, RIG 4.1.3]
    quotes:
      - ref: MG 6.2.2
        text: The client must authenticate itself to the Message Bus either by username and password or with a client certificate (mTLS).
    verification: [d7-test, manual]
    inventory: [MG-6.2.2-418ccec1, MG-6-31ee6521]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-002. The secrets and the client certificate are
      provided via the secret storage and the OI4 certificate storage
      (RIG 4.1.2, 4.1.3, area CNT).

  - id: REQ-MQTT-010
    title: Client certificate takes precedence over username and password
    statement: >-
      If both a client certificate with its private key and a username and
      password are available, a component authenticates with the client
      certificate.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    condition: Both a client certificate with private key and username/password are available.
    refs: [MG 6, MG 6.2.2, SF-057]
    quotes:
      - ref: MG 6.2.2
        text: In case a private key for an existing client certificate and username/password is available, the client certificate based authentication must be used.
    verification: [manual]
    inventory: [MG-6.2.2-c84650d9, MG-6-31ee6521]
    status: reviewed
    notes: Keyword added in C-026 (SF-057 (c)); graded by REQ-CMP-002.

  - id: REQ-MQTT-011
    title: MQTT usernames use unreserved characters only
    statement: >-
      A username assigned for the authentication at the Message Bus contains
      only the unreserved characters of RFC 3986 (a-z, A-Z, 0-9, "-", ".",
      "_", "~") and "@". Components use the username as provided.
    keyword: MUST
    domain: platform
    applies_to: [platform]
    refs: [MG 1.2, MG 6.2.2, RIG 4.1.3, SF-060]
    quotes:
      - ref: MG 6.2.2
        text: The platform must assign usernames that only contain unreserved characters according to the RFC3986.
      - ref: MG 6.2.2
        text: In addition it is also allowed to use the @ symbol.
    verification: [d8, manual]
    inventory: [MG-6.2.2-fc14e862]
    status: reviewed
    notes: Addressed to the platform that assigns the credentials (SF-060 (d), C-026).

  - id: REQ-MQTT-012
    title: The Message Bus is the communication channel of the OEC layer
    statement: >-
      Applications and devices of the OEC layer exchange their information
      (data, events, configuration, lifecycle) with other participants via
      the MQTT broker (Message Bus); they open no other channel for this
      exchange. Field protocols between a connector and its assets are not
      affected.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 6, MG 6.1, MG 6.2.1, SF-057]
    quotes:
      - ref: MG 6.2.1
        text: All data transmissions between the participants of the Open Edge Computing layer (applications, devices with their own MQTT client and platform services) must use the MQTT broker; no other channel is used for this exchange.
      - ref: MG 6.2.1
        text: Field protocols between a connector and its assets are not affected.
      - ref: MG 6.1
        text: Edge indicated communication - no open ports, beside MQTT (6.2.1 Broker Address and Ports)
    verification: [manual]
    inventory: [MG-6.2.1-da4b7997, MG-6-31ee6521]
    status: reviewed
    notes: >-
      Keyword and scope added in C-026 (SF-057 (b)). Additional user
      interfaces or web services of an application (RIG 5.2) are not part of
      this exchange.

  # --- Client identifier (MG 6.2.3) ----------------------------------------
  - id: REQ-MQTT-013
    title: MQTT ClientId – container name or unique and stable id
    statement: >-
      A containerized application uses its container name (RIG 4.2) as MQTT
      ClientId. A component without container (e.g. a device with its own
      MQTT client) uses a ClientId that is unique on the broker and stable
      across reconnects, e.g. derived from its Identification Link within the
      length and character limits of the broker.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [component]
    refs: [MG 6, MG 6.2.3, RIG 4.2, SF-060]
    quotes:
      - ref: MG 6.2.3
        text: To avoid problems with length and character restrictions in some MQTT implementations, a name of the container should be used which is unique, present and accessible in any OI4 Alliance-compliant container (OEC Runtime & Infrastructure Guideline, 4.2 Container Name Conventions).
      - ref: MG 6.2.3
        text: A client without container (e.g. a device with its own MQTT client) should use a ClientId that is unique on the broker and stable across reconnects, e.g. derived from its Identification Link within the length and character limits of the broker.
      - ref: RIG 4.2
        text: As MQTT ClientId, as recommended in OEC Messaging Guideline, 6.2.3 Client Identifier
    verification: [manual, d8]
    inventory: [MG-6.2.3-845bb406, MG-6.2.3-e61860a9, MG-6-4c5014ad, RIG-4.2-5dfec198]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-009. Component without container: SF-060 (c), C-026.
      MQTT v3.1.1 itself requires unique ClientIds per broker.

  # --- Keep alive (MG 6.2.4) -------------------------------------------------
  - id: REQ-MQTT-014
    title: Keep alive interval configurable, default 60 seconds
    statement: >-
      The MQTT keep alive interval of a component is configurable and set to
      60 seconds by default.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [component]
    refs: [MG 6, MG 6.2.4]
    quotes:
      - ref: MG 6.2.4
        text: The keep alive interval, counted in seconds, is configurable and should be set up to a default value of 60 seconds.
    verification: [manual]
    inventory: [MG-6.2.4-122db787, MG-6-4c5014ad]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-009. The broker publishes the Will message
      (REQ-LIFE-008) when the keep alive of a client expires (MQTT v3.1.1).

  # --- Clean session (MG 6.2.5) ---------------------------------------------
  - id: REQ-MQTT-015
    title: Clean Session true by default
    statement: >-
      A component connects with the Clean Session flag set to true by
      default (no persistent session).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [component]
    refs: [MG 6, MG 6.2.5]
    quotes:
      - ref: MG 6.2.5
        text: In the context of the Open Industry 4.0 Alliance, it is highly recommended to set the Clean Session flag to TRUE by default.
    verification: [manual]
    inventory: [MG-6.2.5-f17dc4e0, MG-6-4c5014ad]
    status: reviewed
    notes: Graded by REQ-CMP-009.

  - id: REQ-MQTT-016
    title: Persistent session requires a ClientId
    statement: >-
      A component that uses a persistent session (Clean Session false) sets a
      client identifier.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: MUST}
    applies_to: [component]
    condition: The component connects with Clean Session false.
    refs: [MG 6, MG 6.2.5]
    quotes:
      - ref: MG 6.2.5
        text: To use this feature, a client identifier (6.2.3 Client Identifier) must be set.
    verification: [manual]
    inventory: [MG-6.2.5-07ffa981, MG-6-4c5014ad]
    status: reviewed
    notes: Graded by REQ-CMP-009; MQTT v3.1.1 itself rejects an empty ClientId with Clean Session false.

  # --- Quality of service (MG 6.3.1) ----------------------------------------
  - id: REQ-MQTT-017
    title: QoS 0 as default
    statement: >-
      A component publishes and subscribes with QoS 0 by default. The QoS is
      chosen per hop (publisher to broker, broker to subscriber); other QoS
      levels may be used.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [publisher, subscriber]
    refs: [MG 6, MG 6.3.1, SF-057]
    quotes:
      - ref: MG 6.3.1
        text: 'When it comes to Open Edge Computing, where there is always a strong connection on local networks, QoS 0 is sufficient: clients should use QoS 0 as the default level.'
      - ref: MG 6.3.1
        text: Therefore, different QoS levels can be used.
    verification: [d7-monitor]
    inventory: [MG-6.3.1-f257276c, MG-6.3.1-be1bf49a, MG-6-4c5014ad]
    status: reviewed
    notes: >-
      Keyword added in C-026 (SF-057 (e)). Graded by REQ-CMP-009. A
      subscriber with QoS 2 sees the QoS of the publisher.

  # --- Retained messages (MG 6.3.2) -----------------------------------------
  - id: REQ-MQTT-018
    title: No retained messages
    statement: >-
      A component does not set the Retain flag on any message it publishes,
      including its Will message.
    keyword: MUST NOT
    domain: messaging
    levels: {L1: SHOULD NOT, L2: SHOULD NOT, L3: MUST NOT}
    applies_to: [publisher]
    refs: [MG 6, MG 6.3.2]
    quotes:
      - ref: MG 6.3.2
        text: In context of the OI4 Alliance, the Retained message functionality is switched off by default and shall not be used.
    verification: [d7-test]
    inventory: [MG-6.3.2-e02730a2, MG-6-4c5014ad]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-009. Missed messages are requested with Get. D7
      detects retained messages by subscribing after the application under
      test has published.

  # --- General behavior on changes (MG 6.4) ---------------------------------
  - id: REQ-MQTT-019
    title: Changes are published immediately
    statement: >-
      A publisher publishes every change of the content of a resource (e.g. an
      updated Data tag or a changed Health status) immediately and without
      external trigger on the corresponding topic, unless a publication rule
      configured through the PublicationList (MG 8.3.8, e.g. mode or
      interval) applies.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: MUST}
    applies_to: [publisher]
    refs: [MG 6, MG 6.4]
    quotes:
      - ref: MG 6.4
        text: 'MQTT is event driven: a change of a payload must be published on its corresponding topic immediately and without any external trigger.'
      - ref: MG 6.4
        text: For example, when a Data tag is updated or the Health status changes, the related topic must be published right away.
      - ref: MG 6.4
        text: Therefore, other publication rules can be configured through PublicationList (7.5.1 Resources).
    verification: [d7-monitor, d7-test]
    inventory: [MG-6.4-61d48d6f, MG-6.4-875dd886, MG-6.4-46ef4f1e, MG-6-4c5014ad]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-009. Health must be published on every change at all
      levels (REQ-TOP-017). The publication rules of the PublicationList are
      area RES-PUBLIST (C-027).
