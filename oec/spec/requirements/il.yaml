# Requirements of area IL – Identification Link, its encoding in topics,
# the Oi4Identifier and the dnp-encoding (MG 4, MG A3; ADR-0018, schema:
# catalog.schema.json). Reference checks: spectool package internal/il,
# vectors in vectors/il/ and vectors/topic/.
area: IL
baseline: "ff1562f"
requirements:
  # --- Identification Link in general (MG 4) -------------------------------
  - id: REQ-IL-001
    title: Every asset is identified by an Identification Link
    statement: >-
      Every asset (application or device) represented on the Message Bus is
      identified by exactly one Identification Link (IL string according to
      IEC 61406-1).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 4, MG 4.1]
    quotes:
      - ref: MG 4
        text: Every asset (device or application) that is represented on the Message Bus must be identified by an Identification Link.
    verification: [d7-validate, d7-test]
    inventory: [MG-4-7bcaa186, MG-4.1-02958e7d]
    status: reviewed

  - id: REQ-IL-002
    title: Identification Link in topics is base64url-encoded
    statement: >-
      In the topic elements AppId and Source, the Identification Link is
      encoded as follows: its UTF-8 octets are encoded with base64url
      (RFC 4648, section 5), the padding characters "=" are omitted and no
      line breaks or other characters are added. The result forms exactly one
      topic level.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 4, MG 4.2]
    quotes:
      - ref: MG 4
        text: In the topic, the Identification Link must always be base64url-encoded and must form exactly one topic level
      - ref: MG 4.2
        text: Whenever an Identification Link is used as a topic element (AppId, see 7.3 AppId Element, and Source, see 7.6 Source Element), it must be encoded as follows
      - ref: MG 4.2
        text: The padding characters = are omitted
    verification: [d7-validate]
    inventory: [MG-4-30944928, MG-4.2-1b9c4809]
    status: reviewed
    notes: Topic grammar rule encoded-il (topic/topic.abnf); vectors V-IL-1xx and V-TOP-….

  - id: REQ-IL-003
    title: Standard Base64 alphabet is not used in topics
    statement: >-
      The encoded Identification Link in a topic does not use the standard
      Base64 alphabet (RFC 4648, section 4): it contains no "+" and no "/".
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [component]
    refs: [MG 4.2]
    quotes:
      - ref: MG 4.2
        text: The standard Base64 alphabet (RFC 4648, section 4) must not be used, because it contains the characters + and /, which have a special meaning in MQTT topics.
    verification: [d7-validate]
    inventory: [MG-4.2-25d30dc8, MG-4.2-4593236c]
    status: reviewed

  - id: REQ-IL-004
    title: Exactly one valid encoded representation
    statement: >-
      A topic element AppId or Source is a valid encoded Identification Link
      only if it is the canonical base64url encoding without padding of a
      valid Identification Link: it contains only A-Z, a-z, 0-9, "-" and "_",
      its length is not 1 modulo 4, the unused bits of its last character are
      zero, and the decoded string fulfills the constraints of MG 4.1
      (REQ-IL-016, REQ-IL-018, REQ-IL-019). Any other topic element is
      invalid.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 4.2]
    quotes:
      - ref: MG 4.2
        text: Therefore, there must be exactly one valid encoded representation for each Identification Link.
      - ref: MG 4.2
        text: A topic element that contains padding characters = or any character outside the base64url alphabet is not a valid encoded Identification Link.
    verification: [d7-validate]
    inventory: [MG-4.2-213ad616]
    status: reviewed
    notes: >-
      "Canonical" (zero padding bits) follows from "exactly one valid encoded
      representation": a non-canonical last character decodes to the same
      octets with lenient decoders. Grammar rules b64-tail2/b64-tail3; the
      maximum length of 340 characters follows from REQ-IL-019.

  - id: REQ-IL-005
    title: Identification Link in the payload is unencoded
    statement: >-
      In the payload (e.g. PublisherId, MessageId, ReplyTo, DataSetWriterName),
      the Identification Link is used unencoded, exactly as assigned.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher, requester, responder]
    refs: [MG 4, MG 4.2]
    quotes:
      - ref: MG 4
        text: In the payload, the Identification Link must always be used unencoded, exactly as assigned.
      - ref: MG 4.2
        text: In the payload (e.g. PublisherId, MessageId, ReplyTo and DataSetWriterName), the Identification Link must always be used unencoded (8 Payload Format).
    verification: [d7-validate]
    inventory: [MG-4-a6afa088, MG-4.2-6a030d6f]
    status: reviewed

  - id: REQ-IL-006
    title: An existing Identification Link of the asset is used
    statement: >-
      If the asset already provides an Identification Link (e.g. as OPC UA
      ProductInstanceUri or on its nameplate), this Identification Link is
      used.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    condition: The asset provides an Identification Link.
    refs: [MG 4, MG 4.3.2]
    quotes:
      - ref: MG 4
        text: If the asset already provides an Identification Link (e.g. as OPC UA ProductInstanceUri or on its nameplate), this Identification Link should be used.
      - ref: MG 4.3.2
        text: In this case, it is recommended to use this Identification Link instead of generating an Oi4Identifier (4 The Identification Link).
    verification: [manual]
    inventory: [MG-4-8284458c, MG-4.3.2-66504b27]
    status: reviewed

  - id: REQ-IL-007
    title: Otherwise an Oi4Identifier is generated
    statement: >-
      If the asset does not provide an Identification Link, an Oi4Identifier
      (MG 4.3) is generated and used as its Identification Link.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    condition: The asset does not provide an Identification Link.
    refs: [MG 4, MG 4.3]
    quotes:
      - ref: MG 4
        text: If the asset does not provide an Identification Link, it is best practice to generate an Oi4Identifier (4.3 The Oi4Identifier) and use it as the Identification Link.
      - ref: MG 4.3
        text: It is the recommended best practice for assets that do not provide an Identification Link yet.
    verification: [manual]
    inventory: [MG-4-01a80908, MG-4.3-ace187a0]
    status: reviewed

  # --- IEC 61406-1 Identification Link (MG 4.1) -----------------------------
  - id: REQ-IL-008
    title: Identification Link fulfills IEC 61406-1
    statement: >-
      An Identification Link (including an Oi4Identifier) fulfills all
      requirements of IEC 61406-1 and the constraints of MG 4.1.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, manufacturer]
    refs: [MG 4.1, MG 4.3.2]
    quotes:
      - ref: MG 4.1
        text: An Identification Link used in an Open Industry 4.0 Alliance system must fulfill all requirements of IEC 61406-1.
      - ref: MG 4.3.2
        text: It must meet all the requirements outlined in that specification and in 4.1 IEC 61406-1 Identification Link, as well as the requirements specified in this document.
    verification: [d7-validate, manual]
    inventory: [MG-4.1-3afa41eb, MG-4.3.2-5df450e6, MG-4.3.2-40fb1256, MG-4.3.2-3d2e7e48]
    status: reviewed
    notes: >-
      D7 checks the testable constraints (REQ-IL-009, REQ-IL-016, REQ-IL-018,
      REQ-IL-019); the prohibited character combinations with special
      functions of IEC 61406-1 cannot be checked (MG 4.1) and stay with the
      issuer.

  - id: REQ-IL-009
    title: Components of an Identification Link
    statement: >-
      An Identification Link has the form
      "[<scheme>://]<authority>[/<path>][?<query>][#<fragment>]" (URL syntax
      according to RFC 3986). The authority is mandatory and non-empty; it is
      the internet domain of the issuer, which is under the control of the
      issuer. Scheme, path, query and fragment are optional.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, manufacturer]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: The domain must be under the control of the issuer of the Identification Link (typically the manufacturer).
    verification: [d7-validate, manual]
    inventory: [MG-4.1-440b8efa, MG-4.1-6c978eac, MG-4.1-29fce8a3, MG-4.1-cb8c52f1]
    status: reviewed
    notes: >-
      D7 checks a non-empty authority (the part after an optional
      "<scheme>://" up to the first "/", "?" or "#"); the control of the
      domain is checked manually.

  - id: REQ-IL-010
    title: Identification Link is globally unique
    statement: >-
      An Identification Link is globally unique and assigned to only one
      asset.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, manufacturer]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: An Identification Link must be globally unique and must be assigned to only one asset.
    verification: [d7-monitor, manual]
    inventory: [MG-4.1-7410ce1d]
    status: reviewed
    notes: D7 can detect two MQTT clients that use the same AppId at the same time.

  - id: REQ-IL-011
    title: Identification Link is not reused
    statement: >-
      An Identification Link is not reused for another asset, even after the
      end of the lifetime of the asset it was assigned to.
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [application, device, manufacturer]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: An Identification Link must not be reused for another asset, even after the end of the lifetime of the asset it was assigned to.
    verification: [manual]
    inventory: [MG-4.1-d8d6cc1a]
    status: reviewed

  - id: REQ-IL-012
    title: Every application instance has its own Identification Link
    statement: >-
      Every application instance (e.g. every container instance) has its own,
      unique Identification Link.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: Therefore, every application instance (e.g. every container instance) must have its own, unique Identification Link.
    verification: [d7-monitor, manual]
    inventory: [MG-4.1-1e787dfc]
    status: reviewed

  - id: REQ-IL-013
    title: Identification Link is used exactly as assigned
    statement: >-
      An Identification Link is used exactly as assigned by the issuer: it is
      not altered, completed or normalized – no scheme is added or removed, the
      case of characters is not changed and no characters are
      (percent-)encoded or decoded.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: An Identification Link must be used exactly as it was assigned by the issuer.
      - ref: MG 4.1
        text: It must not be altered, completed or normalized in any way.
    verification: [d7-test, manual]
    inventory: [MG-4.1-bbfe604c, MG-4.1-85a3434f, MG-4.1-b797c8d0, MG-4.1-59c67bae, MG-4.1-4ec656cf]
    status: reviewed
    notes: D7 compares the decoded AppId/Source with the ProductInstanceUri of the MAM and the identifiers in the payload character by character.

  - id: REQ-IL-014
    title: Scheme https for new Identification Links
    statement: >-
      The scheme of an Identification Link is optional; a newly defined
      Identification Link uses the scheme "https://".
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, manufacturer]
    condition: A new Identification Link is defined.
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: The scheme (e.g. https://) is optional.
      - ref: MG 4.1
        text: For newly defined Identification Links, the scheme https:// is recommended.
    verification: [manual]
    inventory: [MG-4.1-b7f0b8e2, MG-4.1-b3a3a8a6, MG-4.1-9a40715b]
    status: reviewed

  - id: REQ-IL-015
    title: Identification Links are compared character by character
    statement: >-
      Two Identification Links are equal if and only if they are equal
      character by character (case-sensitive); no RFC 3986 normalization is
      applied. In particular, an Identification Link with scheme and the same
      Identification Link without scheme are different Identification Links.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: An Identification Link with scheme and the same Identification Link without scheme shall be treated as different Identification Links.
      - ref: MG 4.1
        text: Two Identification Links are equal if and only if they are equal character by character (case-sensitive).
    verification: [d7-test]
    inventory: [MG-4.1-54cd2342, MG-4.1-760625d5]
    status: reviewed

  - id: REQ-IL-016
    title: Allowed characters of an Identification Link
    statement: >-
      An Identification Link contains only the ASCII characters permitted by
      IEC 61406-1 (Annex A): letters, digits, "-", ".", "_", "~" and the
      reserved characters ":", "/", "?", "#", "[", "]", "@", "!", "$", "&",
      "'", "(", ")", "*", "+", ",", ";", "=" (according to their function in
      the URL syntax). Space, '"', "%", "<", ">", "\", "^", "`", "{", "|",
      "}", control characters and non-ASCII characters are not permitted.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, manufacturer]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: Only the ASCII characters permitted by IEC 61406-1 (Annex A) may be used.
      - ref: MG 4.1
        text: 'The following characters are not permitted: space, ", %, <, >, \, ^, , {, |, }, control characters and all non-ASCII characters.'
    verification: [d7-validate]
    inventory: [MG-4.1-67568a97, MG-4.1-771b37b4]
    status: reviewed
    notes: >-
      "Only … may be used" restricts the character set; recorded as MUST.
      Whether a reserved character is used according to its URL function
      cannot be checked in general (IEC 61406-1); D7 checks the character set.

  - id: REQ-IL-017
    title: Values with special characters are masked
    statement: >-
      If a value used in the path, query or fragment of an Identification Link
      (e.g. a serial number) contains characters that are not permitted or
      have a special function in the URL syntax, they are masked by other
      means than percent-encoding, e.g. by the dnp-encoding (MG A3).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, manufacturer]
    refs: [MG 4.1, MG A3]
    quotes:
      - ref: MG 4.1
        text: If values (e.g. a serial number) contain characters that are not permitted or have a special function in the URL syntax, they must be masked by other means.
      - ref: MG A3
        text: In case one of the reserved or prohibited characters is part of the path, query or fragment, the character must be masked out to become a machine-readable URI again.
    verification: [manual]
    inventory: [MG-4.1-2565d666, MG-A3-bb77d6ad]
    status: reviewed

  - id: REQ-IL-018
    title: Authority in lowercase
    statement: >-
      The authority (domain) of an Identification Link is written in lowercase
      characters. Path, query and fragment are case-sensitive and may contain
      uppercase characters.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, manufacturer]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: The authority (domain) must be written in lowercase characters.
    verification: [d7-validate]
    inventory: [MG-4.1-1cbd4870, MG-4.1-b820fe4c]
    status: reviewed

  - id: REQ-IL-019
    title: Identification Link has at most 255 characters
    statement: >-
      An Identification Link has at least 1 and at most 255 characters; its
      encoded topic element has at most 340 characters.
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [application, device, manufacturer]
    refs: [MG 4.1, MG 4.2]
    quotes:
      - ref: MG 4.1
        text: The Identification Link must not exceed 255 characters.
      - ref: MG 4.2
        text: An Identification Link with the maximum length of 255 characters results in an encoded topic element with 340 characters.
    verification: [d7-validate]
    inventory: [MG-4.1-9df9906b]
    status: reviewed

  - id: REQ-IL-020
    title: Identification Link is kept short
    statement: >-
      An Identification Link is kept as short as possible.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, manufacturer]
    refs: [MG 4.1]
    quotes:
      - ref: MG 4.1
        text: Keep the Identification Link as short as possible.
    verification: [manual]
    inventory: [MG-4.1-3ddf1741, MG-4.1-1299de4e]
    status: reviewed

  # --- Encoding in topics: consequences (MG 4.2) ----------------------------
  - id: REQ-IL-021
    title: Filtering by parts of the Identification Link is done by the application
    statement: >-
      A subscriber that needs assets of a specific manufacturer, model,
      product code or serial number subscribes to a specific encoded
      Identification Link or uses the single-level wildcard "+" and filters
      the received messages itself (e.g. based on the Master Asset Model); it
      does not rely on parts of the encoded topic element.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [subscriber]
    refs: [MG 4.2]
    quotes:
      - ref: MG 4.2
        text: Filtering by manufacturer, model, product code or serial number must be done by the application, e.g. based on the Master Asset Model (5 The Master Asset Model).
    verification: [manual]
    inventory: [MG-4.2-8195fcdf]
    status: reviewed

  # --- Oi4Identifier (MG 4.3) ----------------------------------------------
  - id: REQ-IL-022
    title: Structure of the Oi4Identifier
    statement: >-
      An Oi4Identifier has the form
      "<ManufacturerUri>/<Model>/<ProductCode>/<SerialNumber>" without scheme;
      all four elements are mandatory strings. The result is an Identification
      Link, so all its rules apply (REQ-IL-008, REQ-IL-016); characters that
      are not permitted or a "/" inside an element may be masked with the
      dnp-encoding (REQ-IL-033).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1]
    quotes:
      - ref: MG 4.3.1
        text: The Oi4Identifier in the form of <ManufacturerUri/Model/ProductCode/SerialNumber> represents an IEC 61406-1 compliant Identification Link (4.1 IEC 61406-1 Identification Link) without scheme.
    verification: [manual]
    inventory: [MG-4.3.1-a05c80e5, MG-4.3.1-19b2a4a1, MG-4.3.1-4183c5ed]
    status: reviewed
    notes: Reference implementation il.Oi4Identifier; vectors V-OID-….

  - id: REQ-IL-023
    title: ManufacturerUri in lowercase
    statement: >-
      The ManufacturerUri of an Oi4Identifier is written in lowercase; a
      generator converts a ManufacturerUri given with uppercase characters to
      lowercase.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1, MG A3, SF-043]
    quotes:
      - ref: MG 4.3.1
        text: In line with IEC 61406-1, the ManufacturerUri must necessarily be written in lower case.
      - ref: MG 4.3.1
        text: Uppercase characters must not be used.
    verification: [manual]
    inventory: [MG-4.3.1-53d343d5, MG-4.3.1-cd8a517d, MG-4.3.1-fa2cffdc, MG-A3-4116b7ab]
    status: reviewed
    notes: Conversion by the generator per PO decision SF-043 (d) (C-020) – MG 4.3.1 note and A3 Table 5 (Example.com → example.com).

  - id: REQ-IL-024
    title: Form of the ManufacturerUri
    statement: >-
      The ManufacturerUri is a lowercase internet domain name without scheme,
      port, path and without a leading "www.", typically of the form
      "<manufacturer>.<tld>"; a subdomain of the manufacturer's domain (e.g.
      id.provider.com) may be used.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1, SF-043]
    quotes:
      - ref: MG 4.3.1
        text: The ManufacturerUri must be the domain part of the manufacturer URL in lower case, where the scheme (e. g. https://), port and path as well as the third level domain <www.> are excluded.
      - ref: MG 4.3.1
        text: Typically, it is of the form <manufacturer>.<tld>; other subdomains may be used (see note below).
      - ref: MG 4.3.1
        text: A manufacturer may use subdomains of its internet domain for use as ManufacturerUri if it is considered necessary.
    verification: [manual]
    inventory: [MG-4.3.1-a4894201, MG-4.3.1-91913cd6, MG-4.3.1-2a7cd5d3]
    status: reviewed
    notes: PO decision SF-043 (c) (C-020); reference check il.CheckManufacturerURI.

  - id: REQ-IL-025
    title: ManufacturerUri is a domain of the manufacturer
    statement: >-
      The ManufacturerUri refers to an existing internet domain under the
      management of the manufacturer; providing data under this domain is not
      required.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, manufacturer]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1]
    quotes:
      - ref: MG 4.3.1
        text: The ManufacturerUri shall refer to an existing internet domain that is under the management of the manufacturer.
    verification: [manual]
    inventory: [MG-4.3.1-c42db4f0, MG-4.3.1-7f97a77b]
    status: reviewed

  - id: REQ-IL-026
    title: ManufacturerUri table for vendor IDs
    statement: >-
      A generator that derives the ManufacturerUri from a vendor ID (e.g. a
      protocol adapter) uses the globally available ManufacturerUri table as
      reference.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    condition: The application derives the ManufacturerUri from a vendor ID.
    refs: [MG 4.3.1, MG 4.3.2]
    quotes:
      - ref: MG 4.3.1
        text: For a generated ManufacturerUri from any kind of vendor ID, such as done by a protocol adapter, the globally available ManufacturerUri table should be used as reference (see 4.3.2 Additional Provisions Regarding the Oi4Identifier for details).
    verification: [manual]
    inventory: [MG-4.3.1-f9a592b6]
    status: reviewed
    notes: The table is announced for the future (MG 4.3.2); until it exists, the requirement cannot be applied.

  - id: REQ-IL-027
    title: Oi4Identifier elements from the Master Asset Model
    statement: >-
      If the Master Asset Model of the identified asset contains the property
      Model, ProductCode or SerialNumber when the Oi4Identifier is generated,
      that value is used for the related element.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1]
    quotes:
      - ref: MG 4.3.1
        text: If the Master Asset Model (see 5 The Master Asset Model) of the identified asset contains the Model property at the time the Oi4Identifier is generated, the value shall be used here.
    verification: [manual]
    inventory: [MG-4.3.1-b61f2818, MG-4.3.1-b7bc32f0, MG-4.3.1-b7f446fe, MG-4.3.1-7f2a02e1]
    status: reviewed

  - id: REQ-IL-028
    title: Missing Oi4Identifier elements are "nd"
    statement: >-
      An Oi4Identifier element without value is represented by "nd" (no
      data).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1, MG 4.3.2]
    quotes:
      - ref: MG 4.3.1
        text: If there are no values for a specific Oi4Identifier element, that element shall be represented by "nd" (no data).
    verification: [manual]
    inventory: [MG-4.3.1-fe26a26d, MG-4.3.2-18e8b8ab]
    status: reviewed

  - id: REQ-IL-029
    title: Oi4Identifier has at most 255 characters
    statement: >-
      The whole Oi4Identifier, including the three "/" (and the masking
      characters if the dnp-encoding is used), has at most 255 characters.
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [application]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1]
    quotes:
      - ref: MG 4.3.1
        text: The whole Oi4Identifier, including the three forward slashes, must not exceed 255 characters.
    verification: [manual]
    inventory: [MG-4.3.1-9a1fb926]
    status: reviewed

  - id: REQ-IL-030
    title: Oi4Identifier is known or retrievable
    statement: >-
      An implementation that uses an Oi4Identifier ensures that it is known to
      all involved systems or can be easily retrieved, and that its elements
      identify the asset unambiguously.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    condition: The application uses an Oi4Identifier as Identification Link.
    refs: [MG 4.3.2]
    quotes:
      - ref: MG 4.3.2
        text: For this purpose, any implementation should ensure that the Oi4Identifier for a particular asset is either known to all involved systems or can be easily retrieved.
      - ref: MG 4.3.2
        text: The information given about manufacturer, type, order number and serial number should ensure unambiguous identification.
    verification: [manual]
    inventory: [MG-4.3.2-9e876808, MG-4.3.2-cc263b0a]
    status: reviewed

  - id: REQ-IL-031
    title: Existing Identification Link is not overwritten
    statement: >-
      An existing Identification Link of an asset is not overwritten by an
      Oi4Identifier.
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [application]
    condition: The asset provides an Identification Link.
    refs: [MG 4.3.2]
    quotes:
      - ref: MG 4.3.2
        text: An existing Identification Link must not be overwritten by the Oi4Identifier.
    verification: [manual]
    inventory: [MG-4.3.2-9b53ff93]
    status: reviewed

  # --- dnp-encoding (MG A3) -------------------------------------------------
  - id: REQ-IL-032
    title: dnp-encoding
    statement: >-
      The dnp-encoding keeps the characters A-Z, a-z, 0-9, "-", ".", "_" and
      "~" and writes every other octet of the UTF-8 representation as ","
      followed by two uppercase hexadecimal digits (e.g. space → ",20",
      "/" → ",2F", "," → ",2C", "ä" → ",C3,A4").
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application dnp-encodes a value (an Oi4Identifier element, REQ-IL-033).
    refs: [MG A3, SF-043]
    quotes:
      - ref: MG A3
        text: A comma-encoding mechanism is used to represent a data octet in a component when that octet's corresponding character is outside the allowed set or is being used as a delimiter of, or within, the component.
      - ref: MG A3
        text: This also applies to control characters and to all characters outside US-ASCII, which must not be used in an Identification Link either (e.g. the tabulator becomes ,09, the character ä with the UTF-8 octets C3 A4 becomes ,C3,A4).
    verification: [manual]
    inventory: [MG-A3-ffe5198a, MG-A3-d9344f53]
    status: reviewed
    notes: >-
      Defines how the encoding works when it is used; whether it is used is
      REQ-IL-033 (MAY, SF-043 (e), C-019). Table 4 of MG A3 is the ASCII
      excerpt of the general rule for all UTF-8 octets (PO decision SF-043
      (a), (b), C-020). Reference implementation il.DnpEncode; vectors
      V-DNP-….

  - id: REQ-IL-033
    title: dnp-encoding of Oi4Identifier elements is optional
    statement: >-
      If a value of Model, ProductCode or SerialNumber contains characters
      that are not permitted in an Identification Link or a "/", the generator
      of the Oi4Identifier may mask these characters with the dnp-encoding
      (REQ-IL-032). Without masking, such a value cannot be used in an
      Oi4Identifier, because the Oi4Identifier has to fulfill all rules of an
      Identification Link (REQ-IL-008, REQ-IL-016). The dnp-encoding is not
      used anywhere else; in topics the Identification Link is base64url-encoded
      (REQ-IL-002).
    keyword: MAY
    domain: messaging
    levels: {L1: MAY, L2: MAY, L3: MAY}
    applies_to: [application]
    condition: The application generates an Oi4Identifier.
    refs: [MG 4.3.1, MG A3, SF-043]
    quotes:
      - ref: MG 4.3.1
        text: All requirements of IEC 61406-1 and 4.1 IEC 61406-1 Identification Link also apply to the Oi4Identifier.
      - ref: MG 4.3.1
        text: If a value of Model, ProductCode or SerialNumber contains characters that are not permitted in an Identification Link, or a forward slash, which separates the elements, the dnp-encoding (A3 The dnp-Encoding) may be used to mask these characters.
      - ref: MG A3
        text: In this case, these components may be dnp-encoded (see 4.3.1 Structure of the Oi4Identifier).
    verification: [manual]
    inventory: [MG-4.3.1-dd8a2dac, MG-A3-fc6806cf, MG-A3-b8922139]
    status: reviewed
    notes: PO decision SF-043 (e) (C-019, guideline 7de6cb8). Reference implementation il.Oi4Identifier applies the dnp-encoding (identity for values without such characters); vectors V-OID-….

  # --- ManufacturerUri and Identification Link (MG 4.3.1, C-020) -------------
  - id: REQ-IL-034
    title: ManufacturerUri corresponds to the Identification Link
    statement: >-
      The ManufacturerUri corresponds to the domain of the Identification Link
      of the asset. In case of doubt, it is given without scheme and without
      third level domain ("<manufacturer>.<tld>").
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    condition: The application generates an Oi4Identifier or provides a ManufacturerUri (e.g. in the MAM).
    refs: [MG 4.3.1, MG 5, SF-043]
    quotes:
      - ref: MG 4.3.1
        text: The ManufacturerUri should correspond to the domain of the Identification Link of the asset.
    verification: [manual]
    inventory: [MG-4.3.1-06757604]
    status: reviewed
    notes: >-
      PO addition to SF-043 (C-020, 2026-10-17). The same rule for the MAM
      property (MG 5 rule 3) is catalogued with area RES-MAM. Cannot be
      checked mechanically: whether a domain belongs to the manufacturer is
      not observable.
