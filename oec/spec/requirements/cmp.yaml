# Requirements of area CMP – compliance domains and levels
# (ADR-0018, schema: catalog.schema.json). Rows of the level tables are
# umbrella entries: their scope lists the sections whose detailed
# requirements (other areas) they grade per level.
area: CMP
baseline: "eb7889c"
requirements:
  # --- OEC Messaging Compliance: level table (MG 1.3) ---------------------
  - id: REQ-CMP-001
    title: MQTT connectivity to the Message Bus
    statement: >-
      A component connects to the Message Bus as MQTT client with the protocol
      version and the broker address and ports defined in MG 6.1 and MG 6.2.1.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 6.1, MG 6.2.1]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: MQTT connectivity to the Message Bus (6.1 Protocol Version, 6.2.1 Broker Address and Ports) Mandatory Mandatory Mandatory
    verification: [d7-test]
    inventory: [MG-1.3-3f04bfb1]
    status: reviewed

  - id: REQ-CMP-002
    title: MQTT over TLS and authentication
    statement: >-
      A component connects to the broker via TLS and authenticates as defined
      in MG 6.2.2.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 6.2.2]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: MQTT over TLS and authentication (6.2.2 Security Settings) Mandatory Mandatory Mandatory
    verification: [d7-test]
    inventory: [MG-1.3-3f95bc6f]
    status: reviewed

  - id: REQ-CMP-003
    title: Birth message and will message
    statement: >-
      A component publishes its birth message and registers its will message
      as defined in MG 6.3.3 and MG 6.3.5.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 6.3.3, MG 6.3.5]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Birth message and will message (6.3.3 Birth Message, 6.3.5 Will Message) Mandatory Mandatory Mandatory
    verification: [d7-monitor, d7-test]
    inventory: [MG-1.3-34c7c7de]
    status: reviewed

  - id: REQ-CMP-004
    title: Topic structure and namespace
    statement: >-
      Every topic a component publishes or subscribes to below the OI4
      namespace conforms to the topic structure and namespace elements of
      MG 7.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 7]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Conformance to the topic structure and namespace (7 Topics Definition) Mandatory Mandatory Mandatory
    verification: [d7-validate]
    inventory: [MG-1.3-03edd8a8, MG-1.3-09f509cb]
    status: reviewed

  - id: REQ-CMP-005
    title: Payload format
    statement: >-
      Every payload a component publishes is OPC UA-conform JSON and uses the
      objects defined by the OPC Foundation and the OI4 Alliance as specified
      in MG 8.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 8]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Payload format based on OPC UA-conform JSON and the objects defined by the OI4 Alliance (8 Payload Format) Mandatory Mandatory Mandatory
    verification: [schema, d7-validate]
    inventory: [MG-1.3-b63df147, MG-1.3-09f509cb]
    status: reviewed

  - id: REQ-CMP-006
    title: Publish MAM for itself and all subordinate assets
    statement: >-
      An application or device publishes the resource MAM with the method Pub
      for itself and for every subordinate asset, including every entity it
      represents (MG 1.3), as defined in MG 9.1.1.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    scope: [MG 9.1.1]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Publish MAM for itself and all subordinate assets (9.1.1 MAM (Master Asset Model)) Mandatory Mandatory Mandatory
    verification: [d7-monitor]
    inventory: [MG-1.3-4651b89a, MG-1.3-09f509cb, MG-1.3-b6aedd9a]
    status: reviewed

  - id: REQ-CMP-007
    title: Publish Health for itself and all subordinate assets
    statement: >-
      An application or device publishes the resource Health with the method
      Pub for itself and for every subordinate asset, including every entity
      it represents (MG 1.3), as defined in MG 9.1.2.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    scope: [MG 9.1.2]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Publish Health for itself and all subordinate assets (9.1.2 Health) Mandatory Mandatory Mandatory
    verification: [d7-monitor]
    inventory: [MG-1.3-e977a50d, MG-1.3-09f509cb, MG-1.3-b6aedd9a]
    status: reviewed

  - id: REQ-CMP-008
    title: Resource interaction patterns via the Method element
    statement: >-
      From Level 2 on, a component supports the resource interaction patterns
      of the Method element: requesting resources via Get, modifying resources
      via Set and Del where applicable, and publishing resources via Pub
      (MG 7.4, MG 9.1). The methods per entity type are detailed by
      REQ-CMP-014 to REQ-CMP-016, REQ-CMP-033 and REQ-CMP-034.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 7.4, MG 9.1]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: 'Resource interaction patterns via the Method element: requesting resources via Get, modifying resources via Set and Del (where applicable) and publishing resources via Pub (7.4 Method Element, 9.1 Resources) - Mandatory Mandatory'
    verification: [d7-test]
    inventory: [MG-1.3-690c85af]
    status: reviewed

  - id: REQ-CMP-009
    title: Complete MQTT client behavior
    statement: >-
      A component implements the complete MQTT client behavior of MG 6:
      client identifier, keep alive, clean session, quality of service,
      retained messages and the general behavior on changes.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: MUST}
    applies_to: [component]
    scope: [MG 6.2.3, MG 6.2.4, MG 6.2.5, MG 6.3.1, MG 6.3.2, MG 6.4]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Complete MQTT client behavior (6.2.3 Client Identifier, 6.2.4 Keep Alive, 6.2.5 Clean Session, 6.3.1 Quality of Service Level, 6.3.2 Retained Messages, 6.4 General Behavior of MQTT on Changes) Recommended Recommended Mandatory
    verification: [d7-test, d7-monitor]
    inventory: [MG-1.3-7f72acf8, MG-1.3-c7e5f15e]
    status: reviewed
    notes: >-
      Origin: GL-ADR-009 (compliance levels). This requirement is the grading
      rule of the listed sections; the effective level of each rule is given
      by the single requirements REQ-MQTT-013 … REQ-MQTT-019: at Levels 1 and
      2 all of them are SHOULD; at Level 3 a "must" of the guideline becomes
      MUST and a "should" stays SHOULD (e.g. ClientId, keep alive, clean
      session, QoS 0). Other rows can make a behavior mandatory at all levels,
      e.g. publishing Health on change (MG 9.1.2, REQ-TOP-017, REQ-CMP-007).
      PO review of C-026 (SF-061 (b)): the close message (MG 6.3.4) moved to
      its own row of MG 1.3, see REQ-CMP-046; the remaining rows of this
      requirement are unchanged. PO decision (C-026): keep this grading, the
      note only explains it.

  - id: REQ-CMP-010
    title: Complete Message Bus behavior
    statement: >-
      At Level 3, a component supports all methods, resources and common
      services (REQ-CMP-014 to REQ-CMP-021, REQ-CMP-033 to REQ-CMP-040), each with all methods MG 9 defines for it
      and conforming completely to MG 9, also for resources for which it has
      no content (REQ-CMP-041 to REQ-CMP-043). At Level 2, this is
      recommended beyond the Level 2 requirements.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [component]
    scope: [MG 9]
    refs: [MG 1.3, SF-037]
    quotes:
      - ref: MG 1.3
        text: 'Complete Message Bus behavior: all methods, resources and common services, i.e. in addition the methods Set and Del for all resources for which they are defined, the methods Call and Reply, the resources Config, Data, Metadata, Event, Profile, PublicationList, SubscriptionList and ReferenceDesignation and the common service NewDataSetWriterId, also if the component has no content for a resource (9 Message Bus Communication, 9.1 Resources) - Recommended Mandatory'
    verification: [d7-test, d7-monitor]
    inventory: [MG-1.3-0fc2e320, MG-1.3-c7e5f15e, MG-1.3-88c2af43]
    status: reviewed
    notes: SF-037 (decided by the PO in C-015, resolved in the guideline) – Level 3 requires all messages.


  # --- Declaring compliance (MG 1.3) ---------------------------------------

  - id: REQ-CMP-011
    title: Messaging compliance without stated level means Level 3
    statement: >-
      A component labeled "Open Industry 4.0 Alliance Compliant" without a
      stated compliance level fulfills Level 3 of the OEC Messaging
      Compliance. D7 uses Level 3 as declared level for such a component.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component, manufacturer]
    condition: The component is labeled compliant without stating a compliance level.
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: A component that is labeled "Open Industry 4.0 Alliance Compliant" without stating a compliance level, must fulfill Level 3 in all applicable compliance domains.
    verification: [manual, d7-test]
    inventory: [MG-1.3-193fdc81]
    status: reviewed

  - id: REQ-CMP-012
    title: Service container compliance without stated level means Level 3
    statement: >-
      A containerized application labeled "Open Industry 4.0 Alliance
      Compliant" without a stated compliance level fulfills Level 3 of the
      OEC Service Container Compliance. D8 uses Level 3 as declared level for
      such an application.
    keyword: MUST
    domain: service-container
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [container-image, manufacturer]
    condition: The application is labeled compliant without stating a compliance level.
    refs: [MG 1.3, RIG 1.3]
    quotes:
      - ref: MG 1.3
        text: must fulfill Level 3 in all applicable compliance domains
    verification: [manual, d8]
    inventory: [MG-1.3-193fdc81]
    status: reviewed

  - id: REQ-CMP-013
    title: Registry may show an observed messaging compliance level
    statement: >-
      The OEC Registry may show an observed OEC Messaging Compliance level per
      application and device, derived from the observed behavior (e.g. the
      resources listed in Profile and the answers to Get requests). The
      observed level is informative only and does not replace the declared and
      validated level.
    keyword: MAY
    domain: platform
    applies_to: [registry]
    refs: [MG 1.3, MG A1]
    quotes:
      - ref: MG 1.3
        text: The OEC Registry (A1 The OEC Registry) may additionally show an observed OEC Messaging Compliance level of each application and device.
      - ref: MG 1.3
        text: The observed level is informative only and does not replace the declared and validated compliance level.
    verification: [manual]
    inventory: [MG-1.3-886a2a1d, MG-1.3-200baca0]
    status: reviewed

  # --- Methods per level (MG 1.3) ------------------------------------------

  - id: REQ-CMP-014
    title: Method Pub
    statement: An application or device supports the method Pub.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 1.3]
    verification: [d7-monitor]
    inventory: [MG-1.3-4651b89a, MG-1.3-e977a50d, MG-1.3-690c85af, MG-1.3-88c2af43]
    status: reviewed

  - id: REQ-CMP-015
    title: Method Get
    statement: >-
      From Level 2 on, an application or device supports the method Get and
      answers every Get request for a resource it supports, also if it has no
      content for it (REQ-CMP-041).
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 1.3]
    verification: [d7-test]
    inventory: [MG-1.3-690c85af, MG-1.3-88c2af43]
    status: reviewed

  - id: REQ-CMP-016
    title: Methods Set and Del for resources offered for modification
    statement: >-
      From Level 2 on, an application or device supports the methods Set and
      Del for every resource it offers for modification by other participants
      on the Message Bus (e.g. Config) ("where applicable"). Level 1 entities are not required to support Set or Del. At
      Level 3, REQ-CMP-033 extends this to all resources.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers a resource for modification by other participants.
    refs: [MG 1.3, SF-037]
    quotes:
      - ref: MG 1.3
        text: From Level 2 on, the methods Set and Del must be supported for every resource that the component offers for modification by other participants on the Message Bus, such as Config ("where applicable").
      - ref: MG 1.3
        text: They are not required for other resources at Level 2.
    verification: [d7-test]
    inventory: [MG-1.3-78fd4a47, MG-1.3-690c85af]
    status: reviewed


  # --- Resources per level (MG 1.3) ----------------------------------------

  - id: REQ-CMP-017
    title: MAM and Health available via Get
    statement: >-
      From Level 2 on, the resources MAM and Health of the entity itself and of
      all its subordinate assets are additionally available on request via the
      method Get.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: From Level 2 on, the resources MAM and Health must additionally be available on request via the method Get.
    verification: [d7-test]
    inventory: [MG-1.3-12d8910c]
    status: reviewed

  - id: REQ-CMP-018
    title: Resource Profile
    statement: An application or device supports the resource Profile.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, device]
    refs: [MG 1.3]
    verification: [d7-test]
    inventory: [MG-1.3-0fc2e320, MG-1.3-88c2af43, MG-9.1.7-6f3f54c3]
    status: reviewed

  - id: REQ-CMP-019
    title: Resource PublicationList (applications)
    statement: >-
      An application supports the resource PublicationList. A representing
      application provides it once for itself, not per represented entity.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application]
    refs: [MG 1.3]
    verification: [d7-test]
    inventory: [MG-1.3-0fc2e320, MG-1.3-88c2af43, MG-1.3-c42cc91d]
    status: reviewed
    notes: Since GL-ADR-017, the rule for represented entities is MG 1.3 (REQ-CMP-045).

  - id: REQ-CMP-020
    title: Resource ReferenceDesignation
    statement: An application or device supports the resource ReferenceDesignation.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, device]
    refs: [MG 1.3]
    verification: [d7-test]
    inventory: [MG-1.3-0fc2e320, MG-1.3-88c2af43]
    status: reviewed

  - id: REQ-CMP-021
    title: Supported resources listed in Profile
    statement: >-
      If an application or device supports the resource Profile, its Profile
      lists every resource it supports – at least every resource required for
      its compliance level, including resources for which it has no content.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity supports the resource Profile.
    refs: [MG 9.1]
    quotes:
      - ref: MG 9.1
        text: The resource must be listed in the Profile of the entity (8.3.7 Profile), if Profile is supported.
    verification: [d7-test]
    inventory: [MG-9.1-f1ccb0c9]
    status: reviewed

  - id: REQ-CMP-022
    title: Data requires Metadata
    statement: >-
      An application or device that offers the resource Data supports the
      resource Metadata.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers the resource Data.
    refs: [SF-037]
    verification: [d7-test]
    status: deprecated
    replaced_by: REQ-CMP-037
    notes: >-
      The conditional note was removed from the former MG 7.2.1/7.2.2 with
      SF-037 (C-015);
      Metadata is now a resource of the level tables (REQ-CMP-037).

  - id: REQ-CMP-023
    title: Set or Del requires Event with category Status
    statement: >-
      An application or device that offers the method Set or Del supports the
      resource Event with the event category Status – mandatory from Level 2
      on, recommended at Level 1.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers the method Set or Del.
    refs: [MG 1.3, MG 7.4, SF-037]
    quotes:
      - ref: MG 1.3
        text: A component that supports the methods Set or Del must support the resource Event with the category Status from Level 2 on and should support it at Level 1
    verification: [d7-test]
    inventory: [MG-1.3-0c7db418]
    status: reviewed
    notes: >-
      Publishing an Event Status for every Set/Del (MG 7.4, MG 9.1; L1
      should, L2/L3 must – PO decision C-016 amending SF-037) belongs to areas
      TOP/BUS/RES-EVENT; the reaction to Set/Del on objects without content is
      REQ-CMP-043.

  - id: REQ-CMP-024
    title: Directly connected entity fulfills its claimed level itself
    statement: >-
      An entity connected to the Message Bus with its own MQTT client (an
      application or a smart device) fulfills the requirements of its claimed
      compliance level itself, including the resources and common services a
      representing application provides otherwise (REQ-CMP-019, REQ-CMP-034,
      REQ-CMP-039, REQ-CMP-040).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity has its own MQTT client connected directly to the Message Bus.
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: It must fulfill the requirements of the compliance level of the OEC Messaging Compliance it claims itself.
    verification: [d7-test]
    inventory: [MG-1.3-257ae111]
    status: reviewed
    notes: >-
      Former MG 7.2.2 rule "smart device counts as application"; MG 7.2 was
      removed by GL-ADR-017 (C-017).

  - id: REQ-CMP-025
    title: Field presence follows the Requirement attribute
    statement: >-
      In every payload object, a field whose attribute Requirement is
      Mandatory is present, and a field whose Requirement is Not used is
      absent. A field marked Optional may be present.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 1.2]
    quotes:
      - ref: MG 1.2
        text: 'The attribute Requirement of a field: Mandatory means the field must be present, Optional means the field may be present and Not used means the field must not be present.'
    verification: [schema, d7-validate]
    inventory: [MG-1.2-5d607928]
    status: reviewed

  - id: REQ-CMP-026
    title: Present fields meet Type and Value Range
    statement: >-
      Every field present in a payload object meets the format definitions of
      the field (Type and Value Range), regardless of whether the field is
      mandatory or optional.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 1.2]
    quotes:
      - ref: MG 1.2
        text: The format definitions of a field (Type, Value Range) must be met, whenever the field is present.
    verification: [schema, d7-validate]
    inventory: [MG-1.2-4c4f95c8]
    status: reviewed

  # --- OEC Service Container Compliance: level table (RIG 1.3) -------------

  - id: REQ-CMP-027
    title: OCI-compliant container
    statement: >-
      An application is packaged and deployed as an OCI-compliant container
      image (RIG 2.1).
    keyword: MUST
    domain: service-container
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [container-image]
    scope: [RIG 2.1]
    refs: [RIG 1.3, SF-038]
    quotes:
      - ref: RIG 1.3
        text: Packaging and deployment as an OCI-compliant container (2.1 Introduction to Containerization) Mandatory Mandatory Mandatory
    verification: [d8]
    inventory: [RIG-1.3-5339a24c]
    status: reviewed
    notes: >-
      RIG 1.3 defines the Service Container levels; since SF-038 (C-015) MG 1.3
      no longer suggests OCI from Level 2 only.

  - id: REQ-CMP-028
    title: Software Bill of Materials
    statement: >-
      From Level 2 on, a containerized application provides a Software Bill of
      Materials including all used software packages, their licenses and the
      license texts (RIG 4.1.4, RIG 5.3).
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [container-image]
    scope: [RIG 4.1.4, RIG 5.3]
    refs: [RIG 1.3, SF-038]
    quotes:
      - ref: RIG 1.3
        text: Software Bill of Materials (SBOM) including all used software packages, their licenses and the license texts
      - ref: RIG 1.3
        text: The compliance levels only define from which level the license information has to be provided as SBOM.
    verification: [d8]
    inventory: [RIG-1.3-93dbb58f, RIG-1.3-38bd2d09]
    status: reviewed
    notes: >-
      Independent of the level, the provider stays responsible for the
      compliance with the software licenses and the applicable law (RIG 1.3
      note, RIG 5.3).

  - id: REQ-CMP-029
    title: Container environment requirements
    statement: >-
      A containerized application follows the container environment
      requirements on storage (RIG 4.1, incl. secret handling) and the
      container name conventions (RIG 4.2).
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [container-image]
    scope: [RIG 4.1, RIG 4.2]
    refs: [RIG 1.3, SF-091]
    quotes:
      - ref: RIG 1.3
        text: Container environment requirements, such as storage conventions and secret handling (4.1 Container Storage, 4.2 Container Name Conventions) - Recommended Mandatory
    verification: [d8]
    inventory: [RIG-1.3-91015c5f, RIG-1.3-bb0b472d]
    status: reviewed
    notes: >-
      "Mandatory" at Level 3 means that the referenced chapter applies as
      stated there; its recommendations stay SHOULD (RIG 1.3 note since
      SF-091 (f), guideline fbe6173).

  - id: REQ-CMP-030
    title: Container image integrity
    statement: A containerized application meets the container image integrity requirements of RIG 4.3.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [container-image]
    scope: [RIG 4.3]
    refs: [RIG 1.3, SF-091]
    quotes:
      - ref: RIG 1.3
        text: Container image integrity (4.3 Container Image Integrity) - Recommended Mandatory
    verification: [d8]
    inventory: [RIG-1.3-aca311f4, RIG-1.3-bb0b472d]
    status: reviewed
    notes: >-
      "Mandatory" at Level 3 means that the referenced chapter applies as
      stated there; its recommendations stay SHOULD (RIG 1.3 note since
      SF-091 (f), guideline fbe6173).

  - id: REQ-CMP-031
    title: Container networks
    statement: A containerized application meets the container network requirements of RIG 4.4.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [container-image]
    scope: [RIG 4.4]
