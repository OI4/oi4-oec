# Requirements of area CMP – compliance domains, levels and minimum sets
# (ADR-0018, schema: catalog.schema.json). Rows of the level tables are
# umbrella entries: their scope lists the sections whose detailed
# requirements (other areas) they grade per level.
area: CMP
baseline: 5cb109e
requirements:
  # --- OEC Messaging Compliance: level table (MG 1.3) ---------------------
  - id: REQ-CMP-001
    title: MQTT connectivity to the Message Bus
    statement: >-
      A component connects to the Message Bus as MQTT client with the protocol
      version and the broker address and ports defined in MG 6.1 and MG 6.2.1.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 6.1, MG 6.2.1]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: MQTT connectivity to the Message Bus (6.1 Protocol Version, 6.2.1 Broker Address and Ports) Mandatory Mandatory Mandatory
    verification: [d7-test]
    inventory: [MG-1.3-3f04bfb1]
    status: draft

  - id: REQ-CMP-002
    title: MQTT over TLS and authentication
    statement: >-
      A component connects to the broker via TLS and authenticates as defined
      in MG 6.2.2.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 6.2.2]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: MQTT over TLS and authentication (6.2.2 Security Settings) Mandatory Mandatory Mandatory
    verification: [d7-test]
    inventory: [MG-1.3-3f95bc6f]
    status: draft

  - id: REQ-CMP-003
    title: Birth message and will message
    statement: >-
      A component publishes its birth message and registers its will message
      as defined in MG 6.3.3 and MG 6.3.5.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 6.3.3, MG 6.3.5]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Birth message and will message (6.3.3 Birth Message, 6.3.5 Will Message) Mandatory Mandatory Mandatory
    verification: [d7-monitor, d7-test]
    inventory: [MG-1.3-34c7c7de]
    status: draft

  - id: REQ-CMP-004
    title: Topic structure and namespace
    statement: >-
      Every topic a component publishes or subscribes to below the OI4
      namespace conforms to the topic structure and namespace elements of
      MG 7.1.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 7.1]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Conformance to the topic structure and namespace (7.1 Topic Namespace Elements) Mandatory Mandatory Mandatory
    verification: [d7-validate]
    inventory: [MG-1.3-f76428e2, MG-1.3-09f509cb]
    status: draft

  - id: REQ-CMP-005
    title: Payload format
    statement: >-
      Every payload a component publishes is OPC UA-conform JSON and uses the
      objects defined by the OPC Foundation and the OI4 Alliance as specified
      in MG 8.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 8]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Payload format based on OPC UA-conform JSON and the objects defined by the OI4 Alliance (8 Payload Format) Mandatory Mandatory Mandatory
    verification: [schema, d7-validate]
    inventory: [MG-1.3-b63df147, MG-1.3-09f509cb]
    status: draft

  - id: REQ-CMP-006
    title: Publish MAM for itself and all subordinate assets
    statement: >-
      An application or device publishes the resource MAM with the method Pub
      for itself and for every subordinate asset it represents, as defined in
      MG 9.1.1.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    scope: [MG 9.1.1]
    refs: [MG 1.3, MG 7.2, MG 7.2.1, MG 7.2.2]
    quotes:
      - ref: MG 1.3
        text: Publish MAM for itself and all subordinate assets (9.1.1 MAM (Master Asset Model)) Mandatory Mandatory Mandatory
      - ref: MG 7.2.1
        text: At Level 1, the resources MAM and Health must be published for the application itself and all subordinate assets.
      - ref: MG 7.2.2
        text: At Level 1, the resources MAM and Health must be published for the device itself and all subordinate assets.
    verification: [d7-monitor]
    inventory:
      - MG-1.3-4651b89a
      - MG-1.3-09f509cb
      - MG-7.2-bc168d66
      - MG-7.2.1-82103a01
      - MG-7.2.1-ab3e38f3
      - MG-7.2.1-3717a6e0
      - MG-7.2.2-4158cefa
      - MG-7.2.2-60a01b4e
      - MG-7.2.2-4f9f4db6
    status: draft

  - id: REQ-CMP-007
    title: Publish Health for itself and all subordinate assets
    statement: >-
      An application or device publishes the resource Health with the method
      Pub for itself and for every subordinate asset it represents, as defined
      in MG 9.1.2.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    scope: [MG 9.1.2]
    refs: [MG 1.3, MG 7.2, MG 7.2.1, MG 7.2.2]
    quotes:
      - ref: MG 1.3
        text: Publish Health for itself and all subordinate assets (9.1.2 Health) Mandatory Mandatory Mandatory
      - ref: MG 7.2
        text: 'Level 1 (Minimal): The entity publishes MAM and Health for itself and all subordinate assets using the method Pub.'
    verification: [d7-monitor]
    inventory:
      - MG-1.3-e977a50d
      - MG-1.3-09f509cb
      - MG-7.2-bc168d66
      - MG-7.2.1-82103a01
      - MG-7.2.1-c6157fc7
      - MG-7.2.1-3717a6e0
      - MG-7.2.2-4158cefa
      - MG-7.2.2-d37e58f4
      - MG-7.2.2-4f9f4db6
    status: draft

  - id: REQ-CMP-008
    title: Resource interaction patterns via the Method element
    statement: >-
      From Level 2 on, a component supports the resource interaction patterns
      of the Method element: requesting resources via Get, modifying resources
      via Set and Del where applicable, and publishing resources via Pub
      (MG 7.1.4, MG 9.1). The methods per entity type are detailed by
      REQ-CMP-014 to REQ-CMP-016, REQ-CMP-033 and REQ-CMP-034.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 7.1.4, MG 9.1]
    refs: [MG 1.3, MG 7.2]
    quotes:
      - ref: MG 1.3
        text: 'Resource interaction patterns via the Method element: requesting resources via Get, modifying resources via Set and Del (where applicable) and publishing resources via Pub (7.1.4 Method Element, 9.1 Resources) - Mandatory Mandatory'
    verification: [d7-test]
    inventory: [MG-1.3-24be5cc5]
    status: draft


  - id: REQ-CMP-009
    title: Complete MQTT client behavior
    statement: >-
      A component implements the complete MQTT client behavior of MG 6:
      client identifier, keep alive, clean session, quality of service,
      retained messages, close message and the general behavior on changes.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: MUST}
    applies_to: [component]
    scope: [MG 6.2.3, MG 6.2.4, MG 6.2.5, MG 6.3.1, MG 6.3.2, MG 6.3.4, MG 6.4]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: Complete MQTT client behavior (6.2.3 Client Identifier, 6.2.4 Keep Alive, 6.2.5 Clean Session, 6.3.1 Quality of Service Level, 6.3.2 Retained Messages, 6.3.4 Close Message, 6.4 General Behavior of MQTT on Changes) Recommended Recommended Mandatory
    verification: [d7-test, d7-monitor]
    inventory: [MG-1.3-40996d3e, MG-1.3-0745092e]
    status: draft

  - id: REQ-CMP-010
    title: Complete Message Bus behavior
    statement: >-
      At Level 3, a component supports all methods, resources and common
      services required for its entity type (REQ-CMP-014 to REQ-CMP-021,
      REQ-CMP-033 to REQ-CMP-040), each with all methods MG 9 defines for it
      and conforming completely to MG 9, also for resources for which it has
      no content (REQ-CMP-041 to REQ-CMP-043). At Level 2, this is
      recommended beyond the Level 2 minimum set.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [component]
    scope: [MG 7.2, MG 9]
    refs: [MG 1.3, MG 7.2, SF-037]
    quotes:
      - ref: MG 1.3
        text: 'Complete Message Bus behavior: all methods, resources and common services, i.e. in addition the methods Set and Del for all resources for which they are defined, the methods Call and Reply, the resources Config, Data, Metadata, Event, Profile, PublicationList, SubscriptionList and ReferenceDesignation and the common service NewDataSetWriterId, also if the component has no content for a resource (7.2 Minimum Set of Topic Elements for Open Industry 4.0 Alliance Compliance, 9 Message Bus Communication) - Recommended Mandatory'
      - ref: MG 7.2
        text: 'Level 3 (Full): The entity supports all methods, resources and common services listed in the following sub-chapters, each with all methods defined for it in 9 Message Bus Communication.'
    verification: [d7-test, d7-monitor]
    inventory: [MG-1.3-2f5f05fb, MG-1.3-0745092e, MG-7.2-9e0478b4]
    status: draft
    notes: SF-037 (decided by the PO in C-015, resolved in the guideline) – Level 3 requires all messages.


  # --- Declaring compliance (MG 1.3) ---------------------------------------
  - id: REQ-CMP-011
    title: Messaging compliance without stated level means Level 3
    statement: >-
      A component labeled "Open Industry 4.0 Alliance Compliant" without a
      stated compliance level fulfills Level 3 of the OEC Messaging
      Compliance. D7 uses Level 3 as declared level for such a component.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [component, manufacturer]
    condition: The component is labeled compliant without stating a compliance level.
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: A component that is labeled "Open Industry 4.0 Alliance Compliant" without stating a compliance level, must fulfill Level 3 in all applicable compliance domains.
    verification: [manual, d7-test]
    inventory: [MG-1.3-193fdc81]
    status: draft

  - id: REQ-CMP-012
    title: Service container compliance without stated level means Level 3
    statement: >-
      A containerized application labeled "Open Industry 4.0 Alliance
      Compliant" without a stated compliance level fulfills Level 3 of the
      OEC Service Container Compliance. D8 uses Level 3 as declared level for
      such an application.
    keyword: MUST
    domain: service-container
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [container-image, manufacturer]
    condition: The application is labeled compliant without stating a compliance level.
    refs: [MG 1.3, RIG 1.2]
    quotes:
      - ref: MG 1.3
        text: must fulfill Level 3 in all applicable compliance domains
    verification: [manual, d8]
    inventory: [MG-1.3-193fdc81]
    status: draft

  - id: REQ-CMP-013
    title: Registry may show an observed messaging compliance level
    statement: >-
      The OEC Registry may show an observed OEC Messaging Compliance level per
      application and device, derived from the observed behavior (e.g. the
      resources listed in Profile and the answers to Get requests). The
      observed level is informative only and does not replace the declared and
      validated level.
    keyword: MAY
    domain: platform
    applies_to: [registry]
    refs: [MG 1.3, MG A1]
    quotes:
      - ref: MG 1.3
        text: The OEC Registry (A1 The OEC Registry) may additionally show an observed OEC Messaging Compliance level of each application and device.
      - ref: MG 1.3
        text: The observed level is informative only and does not replace the declared and validated compliance level.
    verification: [manual]
    inventory: [MG-1.3-886a2a1d, MG-1.3-200baca0]
    status: draft

  # --- Minimum set of methods (MG 7.2.1, MG 7.2.2) --------------------------
  - id: REQ-CMP-014
    title: Method Pub
    statement: An application or device supports the method Pub.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 7.2.1, MG 7.2.2]
    verification: [d7-monitor]
    inventory:
      - MG-7.2.1-7a6b0ec0
      - MG-7.2.1-b05a6f3b
      - MG-7.2.1-b59aab84
      - MG-7.2.2-92086376
      - MG-7.2.2-9212363a
      - MG-7.2.2-39e90186
    status: draft

  - id: REQ-CMP-015
    title: Method Get
    statement: >-
      From Level 2 on, an application or device supports the method Get and
      answers every Get request for a resource it supports, also if it has no
      content for it (REQ-CMP-041).
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 7.2, MG 7.2.1, MG 7.2.2]
    verification: [d7-test]
    inventory:
      - MG-7.2.1-7a6b0ec0
      - MG-7.2.1-b05a6f3b
      - MG-7.2.1-16990ca8
      - MG-7.2.2-92086376
      - MG-7.2.2-9212363a
      - MG-7.2.2-53f04d8a
    status: draft


  - id: REQ-CMP-016
    title: Methods Set and Del for resources offered for modification
    statement: >-
      From Level 2 on, an application or device supports the methods Set and
      Del for every resource it offers for modification by other participants
      on the Message Bus (e.g. Config) – "Where applicable" in the method
      tables. Level 1 entities are not required to support Set or Del. At
      Level 3, REQ-CMP-033 extends this to all resources.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers a resource for modification by other participants.
    refs: [MG 7.2, MG 7.2.1, MG 7.2.2, SF-037]
    quotes:
      - ref: MG 7.2
        text: '"Where applicable" requirements must be fulfilled for every resource the entity offers for modification by other participants on the Message Bus and are not required otherwise'
      - ref: MG 7.2.1
        text: From Level 2 on, Set and Del must be supported for all resources that are offered for modification by other participants on the Message Bus, such as Config
      - ref: MG 7.2.2
        text: From Level 2 on, Set and Del must be supported for all resources that are offered for modification by other participants on the Message Bus, such as Config
    verification: [d7-test]
    inventory:
      - MG-7.2-c5492774
      - MG-7.2.1-9feb5375
      - MG-7.2.1-ab6c8f8b
      - MG-7.2.1-aecfb3e9
      - MG-7.2.2-a42b3293
      - MG-7.2.2-e4b7c5ad
      - MG-7.2.2-c1248a42
    status: draft


  # --- Minimum set of resources (MG 7.2.1, MG 7.2.2) ------------------------
  - id: REQ-CMP-017
    title: MAM and Health available via Get
    statement: >-
      From Level 2 on, the resources MAM and Health of the entity itself and of
      all its subordinate assets are additionally available on request via the
      method Get.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [application, device]
    refs: [MG 7.2.1, MG 7.2.2]
    quotes:
      - ref: MG 7.2.1
        text: From Level 2 on, they must additionally be available on request via the method Get.
    verification: [d7-test]
    inventory: [MG-7.2.1-9d5856fd, MG-7.2.2-d9962e8c]
    status: draft

  - id: REQ-CMP-018
    title: Resource Profile
    statement: An application or device supports the resource Profile.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, device]
    refs: [MG 7.2.1, MG 7.2.2]
    verification: [d7-test]
    inventory: [MG-7.2.1-82103a01, MG-7.2.1-f52bdde1, MG-7.2.2-4158cefa, MG-7.2.2-d945d203]
    status: draft

  - id: REQ-CMP-019
    title: Resource PublicationList (applications)
    statement: >-
      An application supports the resource PublicationList. Devices without
      an own MQTT client are not required to support it.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application]
    refs: [MG 7.2.1, MG 7.2.2]
    verification: [d7-test]
    inventory: [MG-7.2.1-82103a01, MG-7.2.1-04015cf3]
    status: draft
    notes: The resource table of MG 7.2.2 (devices) has no PublicationList row.

  - id: REQ-CMP-020
    title: Resource ReferenceDesignation
    statement: An application or device supports the resource ReferenceDesignation.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, device]
    refs: [MG 7.2.1, MG 7.2.2]
    verification: [d7-test]
    inventory: [MG-7.2.1-82103a01, MG-7.2.1-e163b5cc, MG-7.2.2-4158cefa, MG-7.2.2-80d3def5]
    status: draft

  - id: REQ-CMP-021
    title: Supported resources listed in Profile
    statement: >-
      If an application or device supports the resource Profile, its Profile
      lists every resource it supports – at least every resource required for
      its compliance level, including resources for which it has no content.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity supports the resource Profile.
    refs: [MG 7.2, MG 7.2.1, MG 7.2.2]
    quotes:
      - ref: MG 7.2.1
        text: are required depending on the compliance level and must be listed in Profile (8.3.7 Profile), if Profile is supported
      - ref: MG 7.2
        text: The resource must be listed in the Profile of the entity (8.3.7 Profile), if Profile is supported.
    verification: [d7-test]
    inventory: [MG-7.2.1-82103a01, MG-7.2.2-4158cefa, MG-7.2-a8701c9a]
    status: draft


  - id: REQ-CMP-022
    title: Data requires Metadata
    statement: >-
      An application or device that offers the resource Data supports the
      resource Metadata.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers the resource Data.
    refs: [MG 7.2.1, MG 7.2.2, SF-037]
    verification: [d7-test]
    status: deprecated
    replaced_by: REQ-CMP-037
    notes: >-
      The conditional note was removed from MG 7.2.1/7.2.2 with SF-037 (C-015);
      Metadata is now a resource of the level tables (REQ-CMP-037).


  - id: REQ-CMP-023
    title: Set or Del requires Event with category Status
    statement: >-
      An application or device that offers the method Set or Del supports the
      resource Event with the event category Status, independent of its
      compliance level.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers the method Set or Del.
    refs: [MG 7.2.1, MG 7.2.2, MG 7.1.4, SF-037]
    quotes:
      - ref: MG 7.2.1
        text: Including the methods Set or Del to an application, makes support for the resource Event and category Status mandatory, independent of the compliance level.
      - ref: MG 7.2.2
        text: Including the methods Set or Del to a device representation, makes support for the resource Event and category Status mandatory, independent of the compliance level.
    verification: [d7-test]
    inventory: [MG-7.2.1-ddfffb17, MG-7.2.2-3d539ed2]
    status: draft
    notes: >-
      Publishing an Event Status for every Set/Del is MUST since SF-037 (MG
      7.1.4, MG 9.1) and belongs to areas TOP/BUS/RES-EVENT; the reaction to
      Set/Del on objects without content is REQ-CMP-043.


  - id: REQ-CMP-024
    title: Smart device with own MQTT client counts as application
    statement: >-
      A smart device that is connected directly to the Message Bus with its
      own MQTT client fulfills the requirements for applications (MG 7.2.1),
      including REQ-CMP-019, REQ-CMP-034, REQ-CMP-039 and REQ-CMP-040.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [device]
    condition: The device has its own MQTT client connected directly to the Message Bus.
    refs: [MG 7.2.2]
    quotes:
      - ref: MG 7.2.2
        text: A smart device that is connected directly to the Message Bus with its own MQTT client must fulfill the requirements of 7.2.1 For Applications.
    verification: [d7-test]
    inventory: [MG-7.2.2-96b56eb1]
    status: draft
    notes: The guideline used "has to" (implicit, SF-035) until C-015; now "must".


  # --- Field conventions (MG 1.2) -----------------------------------------
  - id: REQ-CMP-025
    title: Field presence follows the Requirement attribute
    statement: >-
      In every payload object, a field whose attribute Requirement is
      Mandatory is present, and a field whose Requirement is Not used is
      absent. A field marked Optional may be present.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 1.2]
    quotes:
      - ref: MG 1.2
        text: 'The attribute Requirement of a field: Mandatory means the field must be present, Optional means the field may be present and Not used means the field must not be present.'
    verification: [schema, d7-validate]
    inventory: [MG-1.2-5d607928]
    status: draft

  - id: REQ-CMP-026
    title: Present fields meet Type and Value Range
    statement: >-
      Every field present in a payload object meets the format definitions of
      the field (Type and Value Range), regardless of whether the field is
      mandatory or optional.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 1.2]
    quotes:
      - ref: MG 1.2
        text: The format definitions of a field (Type, Value Range) must be met, whenever the field is present.
    verification: [schema, d7-validate]
    inventory: [MG-1.2-4c4f95c8]
    status: draft

  # --- OEC Service Container Compliance: level table (RIG 1.2) -------------
  - id: REQ-CMP-027
    title: OCI-compliant container
    statement: >-
      An application is packaged and deployed as an OCI-compliant container
      image (RIG 2.1).
    keyword: MUST
    domain: service-container
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [container-image]
    scope: [RIG 2.1]
    refs: [RIG 1.2, SF-038]
    quotes:
      - ref: RIG 1.2
        text: Packaging and deployment as an OCI-compliant container (2.1 Introduction to Containerization) Mandatory Mandatory Mandatory
    verification: [d8]
    inventory: [RIG-1.2-c392f9f8]
    status: draft
    notes: >-
      RIG 1.2 defines the Service Container levels; since SF-038 (C-015) MG 1.3
      no longer suggests OCI from Level 2 only.

  - id: REQ-CMP-028
    title: Software Bill of Materials
    statement: >-
      From Level 2 on, a containerized application provides a Software Bill of
      Materials including all used software packages, their licenses and the
      license texts (RIG 4.1.4, RIG 5.3).
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [container-image]
    scope: [RIG 4.1.4, RIG 5.3]
    refs: [RIG 1.2, SF-038]
    quotes:
      - ref: RIG 1.2
        text: Software Bill of Materials (SBOM) including all used software packages, their licenses and the license texts
      - ref: RIG 1.2
        text: The compliance levels only define from which level the license information has to be provided as SBOM.
