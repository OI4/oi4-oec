  # --- Resources without content (MG 9.1; SF-037, C-015) --------------------

  - id: REQ-CMP-041
    title: Get of a resource without content is answered with an empty list
    statement: >-
      If an entity supports a resource but has no content for it, it answers a
      Get of the resource with a NetworkMessage on the related Pub topic that
      contains no DataSetMessage ("Messages": []). The same applies to a Get
      whose Filter matches no content of a Source the entity provides; a Get
      for a Source the entity does not provide is REQ-CMP-047.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity supports Get for the resource and has no content for it.
    scope: [MG 8.2.1]
    refs: [MG 9.1, SF-037, SF-099]
    quotes:
      - ref: MG 9.1
        text: Supporting a resource does not require that the entity has content for it.
      - ref: MG 9.1
        text: must be answered with an empty list
      - ref: MG 9.1
        text: This also applies to a Get whose Filter matches no content of a Source the entity provides.
    verification: [d7-test]
    inventory: [MG-9.1-434d2112, MG-9.1-90f67b00]
    status: reviewed
    notes: >-
      SF-099 (PO decision in the C-036 review 2026-10-25, guideline a42a132):
      the Filter case was added to the statement; the Pub of every resource
      may therefore carry no DataSetMessage (schemas pub-<resource>).

  - id: REQ-CMP-042
    title: No unsolicited publication of a resource without content
    statement: >-
      As long as an entity has no content for a resource, it does not publish
      the resource on its own (i.e. without a preceding Get).
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [application, device]
    condition: The entity has no content for the resource.
    refs: [MG 9.1, SF-037]
    quotes:
      - ref: MG 9.1
        text: As long as the entity has no content for a resource, it must not publish the resource on its own (without a Get).
    verification: [d7-monitor]
    inventory: [MG-9.1-6757358a]
    status: reviewed

  - id: REQ-CMP-043
    title: Set or Del on an unknown or non-modifiable object is answered with Event Status Bad
    statement: >-
      An entity answers a Set or Del addressing an object it does not have or
      does not offer for modification with an Event of the category Status and
      the level Bad (e.g. BadNotFound or BadNotWritable, MG 8.3.6.1) –
      mandatory from Level 2 on, recommended at Level 1. If the Source of the
      Set or Del addresses an asset that the entity neither is nor
      represents, the Event is published with the Source of the entity
      itself (AppId).
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers the method Set or Del.
    scope: [MG 8.3.6.1]
    refs: [MG 9.1, SF-037, SF-108]
    quotes:
      - ref: MG 9.1
        text: From Level 2 on, a Set or Del addressing an object, which the entity does not have or does not offer for modification, must be answered with an Event of the category Status and the level Bad
      - ref: MG 9.1
        text: The same applies to the status Event of a Set or Del whose Source addresses such an asset.
    verification: [d7-test]
    inventory: [MG-9.1-ebe69434, MG-9.1-2e6777c7]
    status: reviewed
    notes: >-
      SF-108, decided by the PO in the C-056 review (2026-10-27) as proposed
      and implemented on PO order in 2e32a6b: if the Source of the Set or Del
      addresses an asset that the entity neither is nor represents, the
      status Event is published with the Source of the entity itself
      (AppId), Pub/Event/<AppId>/Status/Bad; the requester finds it through
      the ReplyTo. The quoted sentence refers to the Get rule of
      REQ-CMP-047 (same inventory item).

  - id: REQ-CMP-044
    title: Get of Metadata without Data – no Metadata, optional Event Status Bad
    statement: >-
      An entity does not answer a Get of Metadata for a Source and Filter for
      which it provides no Data with Metadata. It may answer such a Get with
      an Event of the category Status and the level Bad (BadNotFound). A
      requester (and D7) requests Metadata only for Data announced in the
      PublicationList; silence on other Metadata requests is conformant.
    keyword: MAY
    domain: messaging
    levels: {L1: MAY, L2: MAY, L3: MAY}
    applies_to: [application, device]
    condition: The entity supports the resource Metadata and receives a Get for a Source/Filter without Data.
    scope: [MG 9.1.5, MG 8.3.6.1]
    refs: [MG 9.1, SF-039]
    quotes:
      - ref: MG 9.1
        text: The entity may answer such a Get with an Event of the category Status and the level Bad (BadNotFound).
    verification: [d7-test]
    inventory: [MG-9.1-379b5763]
    status: reviewed
    notes: Decided by the PO in C-016 (SF-039, option a + may).

  - id: REQ-CMP-045
    title: Represented entities match the level of the representing application
    statement: >-
      An application that represents entities without an own MQTT client on
      the Message Bus (e.g. field devices behind a connector or gateway) and
      provides information for them publishes and answers on their behalf; a
      represented entity does not communicate on the Message Bus itself. The
      application fulfills the requirements of its own compliance level for
      each represented entity: the resources and methods
      it offers for a represented entity (Source = the entity's identifier)
      match its own level. PublicationList, SubscriptionList and the common
      services are provided once by the representing application, not per
      represented entity.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application]
    condition: The application represents entities without an own MQTT client.
    scope: [MG 7.6]
    refs: [MG 1.3]
    quotes:
      - ref: MG 1.3
        text: The representing application publishes and answers on behalf of the represented entity.
      - ref: MG 1.3
        text: An application that provides information for individual represented entities must fulfill the requirements of its compliance level for each of these entities, i.e. the resources and methods it offers for a represented entity must match its own compliance level.
      - ref: MG 1.3
        text: The representing application must provide the resources PublicationList and SubscriptionList and the common services once for itself; they are not required per represented entity.
    verification: [d7-test, d7-monitor]
    inventory: [MG-1.3-bf3a41de, MG-1.3-b6aedd9a, MG-1.3-c42cc91d]
    status: reviewed
    notes: GL-ADR-017 (PO request, C-017) replaced the former MG 7.2.1/7.2.2 split into applications and devices. PO review (C-017) – confirmed; a represented entity never acts itself, the representing service always answers on its behalf.

  # --- Added in C-026 (SF-061) ------------------------------------------------
  - id: REQ-CMP-046
    title: Close message
    statement: >-
      A component publishes its close message as defined in MG 6.3.4: it is
      recommended at Level 1 and mandatory from Level 2 on.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [component]
    scope: [MG 6.3.4]
    refs: [MG 1.3, MG 6, SF-061]
    quotes:
      - ref: MG 1.3
        text: Close message (6.3.4 Close Message) Recommended Mandatory Mandatory
      - ref: MG 6
        text: The close message is recommended for Level 1 and mandatory from Level 2 on.
    verification: [d7-test]
    inventory: [MG-1.3-eca45af7, MG-6-eafd1d73]
    status: reviewed
    notes: >-
      PO review of C-026 (SF-061 (b)): the Close message is mandatory from
      Level 2 on (before: part of REQ-CMP-009, mandatory only at Level 3).

  # --- Added in C-036 addendum 2 (SF-099) -------------------------------------
  - id: REQ-CMP-047
    title: Get for an unknown asset – no Pub, Event Status Bad under the own AppId recommended
    statement: >-
      An entity does not answer a Get whose Source addresses an asset that the
      entity neither is nor represents on the related Pub topic. It should
      answer such a Get with an Event of the category Status and the level
      Bad (BadNotFound, MG 8.3.6.1). Because the entity does not represent the
      addressed asset, this Event is published with the Source of the entity
      itself (AppId): Pub/Event/<AppId>/Status/Bad; the requester finds it
      through the ReplyTo.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    condition: The entity receives a Get whose Source is neither its own identifier nor that of an entity it represents.
    scope: [MG 8.3.6.1, MG 1.3]
    refs: [MG 9.1, SF-099, SF-108]
    quotes:
      - ref: MG 9.1
        text: A Get whose Source addresses an asset that the entity neither is nor represents is not answered on the related Pub topic. The entity should answer such a Get with an Event of the category Status and the level Bad (BadNotFound, see 8.3.6.1 Status).
      - ref: MG 9.1
        text: Because the entity does not represent the addressed asset, this Event is published with the Source of the entity itself (AppId); the requester finds it through the ReplyTo.
    verification: [d7-test]
    inventory: [MG-9.1-2e6777c7]
    status: reviewed
    notes: >-
      SF-099, decided by the PO in the C-036 review (2026-10-25, revised
      against the proposal) and implemented on PO order in a42a132. A Get of
      a known Source without content is REQ-CMP-041 (empty list); a Get of
      Metadata without Data is REQ-CMP-044. SF-108, decided by the PO in the
      C-056 review (2026-10-27) as proposed and implemented on PO order in
      2e32a6b: the Status event carries a Source the entity is or
      represents, so a subscriber does not take the addressed asset for a
      subordinate asset without MAM and Health (MG 1.3, REQ-CMP-006/007);
      the DataSetWriterName of the Event is the AppId. The same rule for Set
      and Del is part of REQ-CMP-043.
