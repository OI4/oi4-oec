  # --- Resources without content (MG 7.2; SF-037, C-015) --------------------
  - id: REQ-CMP-041
    title: Get of a resource without content is answered with an empty list
    statement: >-
      If an entity supports a resource but has no content for it, it answers a
      Get of the resource with a NetworkMessage on the related Pub topic that
      contains no DataSetMessage ("Messages": []).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity supports Get for the resource and has no content for it.
    scope: [MG 8.2.1]
    refs: [MG 7.2, SF-037]
    quotes:
      - ref: MG 7.2
        text: Supporting a resource does not require that the entity has content for it.
      - ref: MG 7.2
        text: must be answered with an empty list
    verification: [d7-test]
    inventory: [MG-7.2-2cf92b04, MG-7.2-6fa96daa]
    status: draft

  - id: REQ-CMP-042
    title: No unsolicited publication of a resource without content
    statement: >-
      As long as an entity has no content for a resource, it does not publish
      the resource on its own (i.e. without a preceding Get).
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [application, device]
    condition: The entity has no content for the resource.
    refs: [MG 7.2, SF-037]
    quotes:
      - ref: MG 7.2
        text: As long as the entity has no content for a resource, it must not publish the resource on its own (without a Get).
    verification: [d7-monitor]
    inventory: [MG-7.2-c5d97f58]
    status: draft

  - id: REQ-CMP-043
    title: Set or Del on an unknown or non-modifiable object is answered with Event Status Bad
    statement: >-
      An entity answers a Set or Del addressing an object it does not have or
      does not offer for modification with an Event of the category Status and
      the level Bad (e.g. BadNotFound or BadNotWritable, MG 8.3.6.1).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The entity offers the method Set or Del.
    scope: [MG 8.3.6.1]
    refs: [MG 7.2, SF-037]
    quotes:
      - ref: MG 7.2
        text: which the entity does not have or does not offer for modification, must be answered with an Event of the category Status and the level Bad
    verification: [d7-test]
    inventory: [MG-7.2-69a1578f]
    status: draft
