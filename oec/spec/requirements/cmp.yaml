  # --- Level 3: all messages (MG 7.2, MG 7.2.1, MG 7.2.2; SF-037, C-015) ------
  - id: REQ-CMP-033
    title: Methods Set and Del for all resources at Level 3
    statement: >-
      At Level 3, an application supports Set for Config, Data, Metadata,
      PublicationList, SubscriptionList and ReferenceDesignation and Del for
      SubscriptionList and ReferenceDesignation; a device representation
      supports Set for Config, Data, Metadata and ReferenceDesignation and Del
      for ReferenceDesignation (all resources for which MG 9.1 defines the
      method).
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: none, L3: MUST}
    applies_to: [application, device]
    scope: [MG 9.1]
    refs: [MG 7.2.1, MG 7.2.2, SF-037]
    quotes:
      - ref: MG 7.2.1
        text: At Level 3, Set and Del must be supported for all resources for which they are defined
      - ref: MG 7.2.2
        text: At Level 3, Set and Del must be supported for all resources for which they are defined
    verification: [d7-test]
    inventory:
      - MG-7.2.1-9feb5375
      - MG-7.2.1-ab6c8f8b
      - MG-7.2.1-36ca7255
      - MG-7.2.2-a42b3293
      - MG-7.2.2-e4b7c5ad
      - MG-7.2.2-5670c67b
    status: draft
    notes: At Level 2, Set and Del are required only where applicable (REQ-CMP-016).

  - id: REQ-CMP-034
    title: Methods Call and Reply as responder of the common services
    statement: >-
      An application supports the methods Call and Reply as responder of the
      common services it offers (REQ-CMP-040): it subscribes to the Call topic
      and answers every Call with a Reply.
    keyword: MUST
    domain: messaging
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application]
    scope: [MG 7.1.4, MG 9.2]
    refs: [MG 7.2.1, SF-037]
    verification: [d7-test]
    inventory: [MG-7.2.1-58d22fbb]
    status: draft
    notes: >-
      Devices are not listed (MG 7.2.2); the common services are offered by
      the representing application. A smart device with its own MQTT client
      is an application (REQ-CMP-024).

