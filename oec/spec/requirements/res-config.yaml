# Requirements of area RES-CONFIG – resource Config
# (MG 8.3.3 incl. 8.3.3.1/8.3.3.2, 9.1.3; ADR-0018, schema: catalog.schema.json).
# Support: REQ-CMP-035 (resource Config: L1 none, L2 SHOULD, L3 MUST).
# DataSetClassId: predefined 9d5983db-440d-4474-9fd7-1cd7a6c8b6c2 (MG A2,
# REQ-MSG-010/011). The Status event after a Set is REQ-RES-CONFIG-021
# (content: RES-EVENT, REQ-RES-EVENT-005; B1.1.3 example V-PAY-076).
# Checked by tools/internal/payload (C-029).
# Drafted in C-029; SF-084 … SF-088 resolved in the guideline after the PO
# review of C-029 (masking of sensitive values: GL-ADR-021).
area: RES-CONFIG
baseline: "a3e4677"
requirements:
  # --- DataSet content (MG 8.3.3, 8.3.3.1, 8.3.3.2) ---------------------------
  - id: REQ-RES-CONFIG-001
    title: An asset may have several Config DataSets
    statement: >-
      A component may publish several Config DataSets per asset, one per
      context, each with its own Filter (REQ-RES-CONFIG-015).
    keyword: MAY
    domain: messaging
    levels: {L1: MAY, L2: MAY, L3: MAY}
    applies_to: [application, device]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 8.3.3, MG 9.1.3]
    quotes:
      - ref: MG 8.3.3
        text: Several Config DataSetMessages may exist for an asset.
      - ref: MG 9.1.3
        text: Several configuration DataSetMessages may exist for an asset.
    verification: [manual]
    inventory: [MG-8.3.3-64a9097d, MG-9.1.3-c463268f]
    status: reviewed

  - id: REQ-RES-CONFIG-002
    title: Structure of the Config DataSet (Pub)
    statement: >-
      The Payload of a published Config DataSetMessage contains one or more
      groups – keys <GroupName> whose value is a Group object – and
      optionally the key Context. A Group contains Name (LocalizedText),
      optionally Description (LocalizedText) and one or more configuration
      objects – keys <ConfigName> whose value is a Config object. A Config
      object contains Type, Value and Name (LocalizedText) and optionally
      Unit (String), DefaultValue, Mandatory (Boolean, default false),
      Sensitive (Boolean, default false), Description (LocalizedText) and
      Validation. A Validation object contains the optional keys Length
      (UInt32), Min and Max (Real, a JSON number), Pattern (String) and
      Values (array of String). Context contains Name (LocalizedText) and
      optionally Description (LocalizedText). Config, Validation and Context
      objects contain no other keys.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 8.3.3, MG 8.3.3.1, MG 9.1.3, SF-084]
    quotes:
      - ref: MG 8.3.3
        text: The complete Config object has the same structure for the methods Pub and Set. However, they differ in which properties are mandatory.
      - ref: MG 8.3.3
        text: The keys of the Payload other than Context are Group objects, the keys of a Group other than Name and Description are Config objects. Config, Validation and Context objects contain no other keys than listed.
      - ref: MG 8.3.3.1
        text: A configuration object can only be added to a Group. Therefore at least one Group is mandatory, even when it contains only one single configuration object or several objects, which are not tightly coupled.
      - ref: MG 8.3.3.1
        text: Several Group objects can be added to a single DataSetMessage of type Config.
      - ref: MG 8.3.3.1
        text: A DisplayName for this Group object shall be given as localized text.
      - ref: MG 8.3.3.1
        text: A DisplayName for this Config object shall be given as localized text.
    verification: [schema, d7-validate]
    inventory: [MG-8.3.3-1c34a2be, MG-8.3.3.1-ff239c31, MG-8.3.3.1-ce7454d2, MG-8.3.3.1-a6e70e34, MG-8.3.3.1-3252fe76, MG-8.3.3.1-29da9752, MG-8.3.3.1-ab90ce46, MG-8.3.3.1-f52ec9eb, MG-8.3.3.1-db47c71a, MG-8.3.3.1-126ff9aa, MG-8.3.3.1-39df3233, MG-8.3.3.1-be3ae5c6, MG-8.3.3.1-d03cc921, MG-8.3.3.1-6015d8a2, MG-8.3.3.1-51d6f600, MG-8.3.3.1-27f5627b, MG-8.3.3.1-fc37558b, MG-8.3.3.1-af59cd36, MG-8.3.3.1-b91fda59, MG-8.3.3.1-d8646dba, MG-8.3.3.1-ccfb0db5, MG-8.3.3.1-2bcfa794, MG-8.3.3.1-0a897b4b, MG-8.3.3.1-4c862c5c, MG-8.3.3.1-23cbfa5a, MG-8.3.3.1-d7495ce2, MG-8.3.3.1-bb506b94, MG-8.3.3.1-ead395b9, MG-8.3.3.1-2b8af458, MG-8.3.3-c25cf82c, MG-8.3.3-565fc688]
    status: reviewed
    notes: >-
      The nesting (payload → <GroupName>/Context, Group →
      Name/Description/<ConfigName>, Config → Type … Validation, Validation
      → Length … Values) is the structure overview of MG 8.3.3 (SF-084 (a));
      Values is an "Array of String" (SF-084 (c)). Min and Max ("Real") are
      JSON numbers. Field presence and types per REQ-CMP-025/026;
      LocalizedText per REQ-MSG-040. Sensitive values are masked
      (REQ-RES-CONFIG-024).

  - id: REQ-RES-CONFIG-003
    title: Structure of the Config DataSet in a Set
    statement: >-
      The Payload of the Config DataSetMessage of a Set has the structure of
      REQ-RES-CONFIG-002 with these differences: the Name of a Group and Type
      and Name of a Config object are optional; Value stays mandatory in
      every Config object. It contains at least one group with at least one
      configuration object and may contain a subset of the groups of the
      addressed Config DataSet and, within a group, of its configuration
      objects (mandatory objects: REQ-RES-CONFIG-011); further properties
      are optional and may be taken from the published Config.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 8.3.3, MG 8.3.3.2, MG 9.1.3, SF-084, SF-086]
    quotes:
      - ref: MG 8.3.3.2
        text: A configuration object can only be added to a Group. Therefore at least one Group is mandatory, even when it contains only one single configuration object or several objects, which are not tightly coupled.
      - ref: MG 8.3.3.2
        text: 'A Set of Config is a partial update: the Payload contains at least one Group object with at least one Config object, and every mandatory Config object (see Mandatory) of each contained Group object. Group and Config objects which are not contained stay unchanged. Besides the Value, a Config object may repeat the read-only properties received through Pub/Config unchanged.'
      - ref: MG 9.1.3
        text: In addition, it may also contain the other properties received through Pub/Config.
    verification: [schema, d7-validate]
    inventory: [MG-8.3.3.2-92c9fd11, MG-8.3.3.2-44186564, MG-8.3.3.2-d295d815, MG-8.3.3.2-cc495a35, MG-8.3.3.2-38cd3bc9, MG-8.3.3.2-19812558, MG-8.3.3.2-3a584eb7, MG-8.3.3.2-3e3b85d6, MG-8.3.3.2-09688626, MG-8.3.3.2-4b6e2cdb, MG-8.3.3.2-84044ccd, MG-8.3.3.2-5914ee8d, MG-8.3.3.2-ca8e10c5, MG-8.3.3.2-c4c1f04f, MG-8.3.3.2-074c74ca, MG-8.3.3.2-26bdd0b2, MG-8.3.3.2-374ae62e, MG-8.3.3.2-d9274546, MG-8.3.3.2-00be2a42, MG-8.3.3.2-6187166d, MG-8.3.3.2-1cc9d955, MG-8.3.3.2-d9c2fcee, MG-8.3.3.2-edd4c24c, MG-8.3.3.2-edad7393, MG-8.3.3.2-c9217183, MG-8.3.3.2-9d0c7d81, MG-8.3.3.2-31bdf83e, MG-8.3.3.2-0ea05119, MG-9.1.3-36d1a38e, MG-8.3.3.2-506e3d6e, MG-8.3.3.2-76395973]
    status: reviewed
    notes: >-
      "If given, a DisplayName … shall be given as localized text" (MG
      8.3.3.2, SF-084 (g)). A Set of a subset of the groups/configuration
      objects is a partial update – the exception to the complete key frame
      of REQ-MSG-030 and the "updated resource object" of REQ-BUS-004 (SF-086
      (a)). A sensitive object may carry the mask (REQ-RES-CONFIG-025).

  - id: REQ-RES-CONFIG-004
    title: Character set of GroupName and ConfigName
    statement: >-
      Every GroupName and ConfigName is a non-empty string of the characters
      a–z, A–Z, 0–9, "-" and "_" that does not start with a digit or "-". A
      GroupName is not "Context", a ConfigName neither "Name" nor
      "Description".
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 8.3.3.1, MG 8.3.3.2, SF-084]
    quotes:
      - ref: MG 8.3.3.1
        text: To avoid problems on JSON parsing in different languages, the GroupName must contain only the characters <a..z>, <A..Z>, <0..9>, <-> and <_>. The GroupName must not start with a number (0..9) or with a minus (-).
      - ref: MG 8.3.3.1
        text: To avoid problems on JSON parsing in different languages, the ConfigName must contain only the characters <a..z>, <A..Z>, <0..9>, <-> and <_>. The ConfigName must not start with a number (0..9) or with a minus (-).
      - ref: MG 8.3.3.1
        text: A GroupName must not be Context.
      - ref: MG 8.3.3.1
        text: A ConfigName must not be Name or Description.
    verification: [schema, d7-validate]
    inventory: [MG-8.3.3.1-ec257974, MG-8.3.3.1-1e400088, MG-8.3.3.1-c6309630, MG-8.3.3.1-cbc11847, MG-8.3.3.2-7c86dbf5, MG-8.3.3.2-47e3c53f, MG-8.3.3.2-9e8bf02f, MG-8.3.3.2-04062350, MG-8.3.3.1-e2f7095a, MG-8.3.3.1-f1d934b9, MG-8.3.3.2-e7996b9d, MG-8.3.3.2-b0867894]
    status: reviewed
    notes: >-
      The reserved names (Context; Name, Description) avoid keys that cannot
      be told apart from the properties of the same level (SF-084 (b)). The
      checker reports names outside the character set.

  - id: REQ-RES-CONFIG-005
    title: Groups and configuration objects are defined by the owner only
    statement: >-
      Only the component that owns a Config DataSet defines its groups and
      configuration objects; a Set uses the published GroupNames and
      ConfigNames and does not add, rename or remove groups or
      configuration objects.
    keyword: MUST NOT
    domain: messaging
    levels: {L1: MUST NOT, L2: MUST NOT, L3: MUST NOT}
    applies_to: [requester]
    refs: [MG 8.3.3.1, MG 8.3.3.2, MG 9.1.3]
    quotes:
      - ref: MG 8.3.3.1
        text: The group name must not be changed from outside the service specifying it, but the object group has elements which allow read/write access!
      - ref: MG 8.3.3.1
        text: The config name must not be changed from outside the service specifying it, but the object Config has elements which allow read/write access!
      - ref: MG 9.1.3
        text: As the device or application providing the resource is the owner of the configuration object, it is the only instance which can remove objects from within the config object.
    verification: [d7-test]
    inventory: [MG-8.3.3.1-59c566b4, MG-8.3.3.1-70cb55b3, MG-8.3.3.2-5920d940, MG-8.3.3.2-c2918061, MG-9.1.3-ddbafedb]
    status: reviewed
    notes: >-
      A Set with an unknown group or configuration object is rejected
      (REQ-RES-CONFIG-023, REQ-CMP-043). Names are compared exactly
      (case-sensitive); the device example of MG B1.1.3 uses "unit" and
      "common" in every message since SF-088 (a).

  - id: REQ-RES-CONFIG-006
    title: Type is one of five OPC UA base types
    statement: >-
      The Type of a configuration object is one of Boolean, ByteString,
      DateTime, Number and String (subset of the OPC UA base types, Part 5
      12.2.1 Table 154 and Part 3 8).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, requester]
    refs: [MG 8.3.3.1, MG 8.3.3.2]
    quotes:
      - ref: MG 8.3.3.1
        text: A subset of OPC UA base types, defined in OPC UA Part 5-12.2.1-Table 154 and more detailed in Part 3-8 shall be used as Type.
      - ref: MG 8.3.3.1
        text: The allowed subset is Boolean, ByteString, DateTime, Number and String.
    verification: [schema, d7-validate]
    inventory: [MG-8.3.3.1-0c91156e, MG-8.3.3.2-6e8b3808]
    status: reviewed
    notes: >-
      A requester that repeats Type in a Set uses the published one
      (REQ-RES-CONFIG-023). Further restrictions of a type (e.g. a value
      range) are expressed with Validation; MG 8.3.3.1 mentions arbitrary
      data types via Pattern.

  - id: REQ-RES-CONFIG-007
    title: Value and DefaultValue are strings in the representation of Type
    statement: >-
      Value and DefaultValue are JSON strings. A non-empty one represents a
      value of Type: Boolean "true" or "false", Number a decimal number in
      JSON number syntax, DateTime an ISO 8601 date-time (RFC 3339),
      ByteString base64 and String any text. An empty Value means that the
      configuration object is not set. Exception: the mask of a sensitive
      configuration object (REQ-RES-CONFIG-024/025) is not interpreted with
      Type.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, requester]
    refs: [MG 8.3.3.1, MG 8.3.3.2, SF-084]
    quotes:
      - ref: MG 8.3.3.1
        text: The Value of a configuration item must always be a string, which must be interpreted with help of the Type information.
      - ref: MG 8.3.3.1
        text: The DefaultValue of a configuration item must always be a string, which must be interpreted with help of the Type information.
      - ref: MG 8.3.3.1
        text: 'Each type is presented as string in the Value and the DefaultValue:'
      - ref: MG 8.3.3.1
        text: An empty string means that the value is not set.
      - ref: MG 8.3.3.1
        text: 'Exception: the mask `********` of a sensitive Config object (see Sensitive).'
    verification: [schema, d7-validate]
    inventory: [MG-8.3.3.1-fda68158, MG-8.3.3.1-7641aa0a, MG-8.3.3.2-5ece4201, MG-8.3.3.2-c0ca9c8c]
    status: reviewed
    notes: >-
      The representations per Type are listed in MG 8.3.3.1/8.3.3.2 (SF-084
      (d), in line with the JSON encoding of OPC UA Part 6 5.4). The checker
      checks them where Type and Value are in the same object (Pub, Set with
      Type) and skips the mask of a sensitive object.

  - id: REQ-RES-CONFIG-008
    title: A set Value satisfies the Validation
    statement: >-
      A non-empty Value satisfies the Validation of its configuration
      object: at most Length characters, for Type Number a number between
      Min and Max (inclusive), a match of the regular expression Pattern and
      one of Values, as far as these keys are given. The mask of a sensitive
      configuration object (REQ-RES-CONFIG-024/025) is not checked against
      the Validation.
    keyword: MUST
    implicit: true
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device, requester]
    refs: [MG 8.3.3.1, MG 8.3.3.2, SF-035, SF-084]
    quotes:
      - ref: MG 8.3.3.1
        text: The Min contains the minimal value, a Value can get.
      - ref: MG 8.3.3.1
        text: The Max contains the maximum value, a Value can get.
      - ref: MG 8.3.3.1
        text: A type of enumeration to show, which values are allowed.
      - ref: MG 8.3.3.1
        text: The Length contains the max length of a Value, counted in characters.
    verification: [d7-validate]
    inventory: [MG-8.3.3.1-4bc68317, MG-8.3.3.1-f17be68d, MG-8.3.3.1-17f15d4d, MG-8.3.3.2-d15fa833, MG-8.3.3.2-6fb4d812, MG-8.3.3.2-8a6ca709]
    status: reviewed
    notes: >-
      Length counts characters (Unicode code points); Min and Max apply to
      the Type Number (SF-084 (d)). Patterns should be interoperable
      (MG 8.3.3.1 note); the checker evaluates a Pattern with Go RE2 and
      skips patterns it cannot compile. A Set that violates the Validation
      is rejected (REQ-RES-CONFIG-023).

  - id: REQ-RES-CONFIG-009
    title: Unit is an EngineeringUnit DisplayName
    statement: >-
      The Unit of a configuration object is the DisplayName of an
      EngineeringUnit of OPC UA Part 8 5.6.3 (UNECE Recommendation N° 20); a
      unit that does not exist there may be self-defined (preferably
      industry-specific).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    condition: The configuration object has a unit.
    refs: [MG 8.3.3.1, MG 8.3.3.2]
    quotes:
      - ref: MG 8.3.3.1
        text: The Unit should contain the DisplayName of one of the EngineeringUnits defined in OPC UA Part 8-5.6.3 (see UNECE Recommendation N° 20 for a good overview).
      - ref: MG 8.3.3.1
        text: However, when a very rare unit does not exist in the list of EngineeringUnits, a self defined (or better industry specific) unit may be used here.
    verification: [manual]
    inventory: [MG-8.3.3.1-8488db27, MG-8.3.3.1-f0f59ab3, MG-8.3.3.2-f0d82434, MG-8.3.3.2-ee0cf174]
    status: reviewed
    notes: >-
      The B1.1.3 device example had "Unit": "Temperature" (a quantity, no
      unit); removed with SF-088 (c).

  # --- Set semantics (MG 8.3.3, 9.1.3) ------------------------------------------
  - id: REQ-RES-CONFIG-010
    title: A value is unset with an empty string, there is no Del
    statement: >-
      A requester unsets ("deletes") a configuration value with a Set that
      carries an empty string as its Value; Config has no Del.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 8.3.3.1, MG 8.3.3.2, MG 9.1.3]
    quotes:
      - ref: MG 8.3.3.1
        text: To delete, or better, unset a configuration, the related value must be overwritten with an empty string.
      - ref: MG 9.1.3
        text: However, to “delete” or better unset a configured object, the sender must send a value with an empty string with the Set method.
      - ref: MG 9.1.3
        text: To do so, the sender must send a Set with an empty value of the config object.
    verification: [d7-validate]
    inventory: [MG-8.3.3.1-225f710d, MG-8.3.3.2-4419a9e8, MG-9.1.3-3350ff5c, MG-9.1.3-516d732b]
    status: reviewed
    notes: Del Config is not allowed (matrix, REQ-TOP-013). Examples MG B1.1.3 "empty existing values".

  - id: REQ-RES-CONFIG-011
    title: Mandatory configuration objects are contained in every Set of their group
    statement: >-
      A configuration object with Mandatory = true is contained, with its
      Value, in every Set that contains its group; without Mandatory a
      configuration object is not mandatory (default false).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 8.3.3.1, MG 8.3.3.2, MG 9.1.3, SF-086]
    quotes:
      - ref: MG 8.3.3.1
        text: If Mandatory is set to true, this Config object must be part of the Group in every Set which contains the Group, including its Value. An empty Value of a mandatory Config object is a valid message; the application may reject it with a status Event with the EventLevel Bad.
      - ref: MG 8.3.3.1
        text: If it does not exist, the default behavior is the same as Mandatory = false.
      - ref: MG 9.1.3
        text: 'A Set message is a partial update: it contains at least one group with at least one config element, and all config elements of a contained group which are mandatory ("Mandatory": true) must be provided!'
      - ref: MG 9.1.3
        text: The payload must contain the values of the mandatory config names of each contained group.
    verification: [d7-validate]
    inventory: [MG-8.3.3.1-bc1d417b, MG-8.3.3.1-629dca2b, MG-8.3.3.1-269a6962, MG-8.3.3.2-ddc33ac3, MG-8.3.3.2-f3e06630, MG-8.3.3.2-aeff2f0d, MG-9.1.3-1d957d86, MG-9.1.3-7c151900, MG-9.1.3-cf25bdf3]
    status: reviewed
    notes: >-
      An empty Value of a mandatory object is a valid Set; the application
      may reject it (REQ-RES-CONFIG-023) – B1.1.3 unsets the mandatory
      objects aut0-r3fr3sh and protocol (SF-086 (b)). A mandatory sensitive
      object can be sent with the mask (REQ-RES-CONFIG-025). Checkable only
      against the published Config (Mandatory flags), not per message.

  - id: REQ-RES-CONFIG-012
    title: Front-ends hide the value of a sensitive configuration object
    statement: >-
      An application that displays or edits configuration values (e.g. a
      web front-end) hides the value of a configuration object with
      Sensitive = true (type "password"), also when a new value is entered.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application]
    condition: The application displays or edits Config values.
    refs: [MG 8.3.3.1, MG 8.3.3.2, GL-ADR-021, SF-087]
    quotes:
      - ref: MG 8.3.3.1
        text: In context with the available OPC UA base types, the OI4 Alliance is missing type "password" which can be used to hide the value of an object (e.g. in user interfaces, such as web front-ends) if necessary.
      - ref: MG 8.3.3.1
        text: Front-end applications should hide it as well, e.g. when a new value is entered.
    verification: [manual]
    inventory: [MG-8.3.3.1-6ab60217, MG-8.3.3.2-16781fc2, MG-8.3.3.1-e2e7bd23]
    status: reviewed
    notes: >-
      The Message Bus side is REQ-RES-CONFIG-024 (masking in every Pub) and
      REQ-RES-CONFIG-025 (mask in a Set). MAY → SHOULD with GL-ADR-021: the
      note of MG 8.3.3.1 recommends hiding the value in front-ends.

  - id: REQ-RES-CONFIG-013
    title: A Group collects configuration objects configured at once
    statement: >-
      A component puts configuration objects that should be configured at
      once into one Group (e.g. group eth0 with ip_address, subnet_mask and
      standard_gateway).
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 8.3.3.1, MG 8.3.3.2]
    quotes:
      - ref: MG 8.3.3.1
        text: The Group helps to group configuration elements which should be configured at once, e.g. the group eth0 might contain configuration objects called ip_address, subnet_mask and standard_gateway.
    verification: [manual]
    inventory: [MG-8.3.3.1-0300b49d, MG-8.3.3.2-08b07130]
    status: reviewed
    notes: MG B1.1.3 "More complex example with two groups" (device1, common).

  - id: REQ-RES-CONFIG-014
    title: The group of common configuration objects is named common
    statement: >-
      A component that collects common configuration objects in a Group
      names this group common.
    keyword: SHOULD
    domain: messaging
    levels: {L1: SHOULD, L2: SHOULD, L3: SHOULD}
    applies_to: [application, device]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 8.3.3.1, MG 8.3.3.2]
    quotes:
      - ref: MG 8.3.3.1
        text: It is best practice to name the Group that collects all common configuration objects common.
      - ref: MG 8.3.3.1
        text: Configuration objects in this group do not necessarily have to be grouped this way, but it is a way to make it clear that these objects belong to the "common settings".
    verification: [manual]
    inventory: [MG-8.3.3.1-31537929, MG-8.3.3.1-d95dbf3d, MG-8.3.3.2-6a638141, MG-8.3.3.2-3be484bd]
    status: reviewed
    notes: Best practice → SHOULD (MG 1.2). B1.1.3 uses "common" in every message since SF-088 (a).

  - id: REQ-RES-CONFIG-015
    title: The Filter of a Config DataSet is its context name
    statement: >-
      Each Config DataSet of an asset has its own Filter, the name of its
      context, used as topic Filter (REQ-TOP-022) and WriterGroupName
      (REQ-MSG-024). The Filter is chosen by the owning component, unique
      among the Config DataSets of the Source and independent of the
      requested Locale; Context.Name, if present, is its display name.
    keyword: MUST
    implicit: true
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 8.3.3.1, MG 9.1.3, SF-035, SF-085]
    quotes:
      - ref: MG 8.3.3.1
        text: The Context helps to define an overall name for the included Group objects.
      - ref: MG 8.3.3.1
        text: The Filter (and the WriterGroupName) of a Config DataSetMessage is a stable, non-localized name chosen by the owner of the configuration, unique among the Config DataSetMessages of the Source. The Name of the Context is the display name of this Filter and can be localized; the Filter does not change with the requested Locale.
    verification: [d7-validate]
    inventory: [MG-8.3.3.1-ed5a8ff3, MG-8.3.3.2-066620fe]
    status: reviewed
    notes: >-
      Defined in MG 8.3.3.1/8.3.3.2 since SF-085; MG 9.1.3 writes the Filter
      as <Filter>. In B1.1.3 Filter and Context.Name (en-US) are equal
      ("Network settings", "Overall device settings"). The definition has
      no keyword (implicit MUST).

  # --- Message Bus (MG 9.1.3) ---------------------------------------------------
  - id: REQ-RES-CONFIG-016
    title: Get Config carries no Config object
    statement: >-
      A Get Config NetworkMessage contains no Config DataSetMessage; its
      Messages are empty or contain only the helper DataSets
      PaginationRequest and Locale.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    scope: [MG 8.3.11, MG 8.3.12]
    refs: [MG 9.1.3]
    quotes:
      - ref: MG 9.1.3
        text: In combination with the method Get, the payload requires an empty NetworkMessage. The NetworkMessage can alternatively contain DataSetMessages for PaginationRequest (8.3.11.1 PaginationRequest) and Locale (8.3.12 Locale). A Config object is not included.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.3-10d496aa]
    status: reviewed
    notes: >-
      Config has no Query (GL-ADR-020, REQ-QRY-001); new query parameters
      would need a PO order. Get with Locale: MG B1.1.3 (REQ-LOC-*).

  - id: REQ-RES-CONFIG-017
    title: Get Config is answered with all addressed Config DataSets
    statement: >-
      A Get Config is answered with every Config DataSet addressed by the
      topic – without Source all Config DataSets of all assets of the
      component, with Source all of that asset, with Source and Filter that
      one – each in its own DataSetMessage of a single NetworkMessage
      published to the corresponding Pub topic.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 9.1.3]
    quotes:
      - ref: MG 9.1.3
        text: A topic such as Oi4v2/<ServiceType>/<AppId>/Get/Config must trigger a publication of all available Config information, each in its own DataSetMessage added to a single NetworkMessage and published to the topic Oi4v2/<ServiceType>/<AppId>/Pub/Config.
    verification: [d7-test]
    inventory: [MG-9.1.3-b89cf9e2]
    status: reviewed
    notes: >-
      Pagination of large answers is REQ-PAG-005, ReplyTo is REQ-MSG-015,
      the DataSetClassId REQ-MSG-010/011. A component without configuration
      answers with an empty list (REQ-CMP-041).

  - id: REQ-RES-CONFIG-018
    title: Pub Config carries Config DataSets and optionally Pagination
    statement: >-
      A Pub Config NetworkMessage contains Config DataSetMessages and
      optionally the helper DataSet Pagination; it contains no
      PaginationRequest and no DataSetMessage of another resource.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    refs: [MG 9.1.3]
    quotes:
      - ref: MG 9.1.3
        text: In combination with the method Pub, the payload contains DataSetMessages of type Config and optional Pagination (8.3.11.2 Pagination).
    verification: [schema, d7-validate]
    inventory: [MG-9.1.3-6859d952]
    status: reviewed

  - id: REQ-RES-CONFIG-019
    title: Set Config addresses exactly one Config DataSet
    statement: >-
      A Set Config is sent to Set/Config/<Source>/<Filter> and its
      NetworkMessage contains exactly one Config DataSetMessage – the one
      addressed by the topic; several Config DataSets cannot be set at
      once.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1.3, SF-079]
    quotes:
      - ref: MG 9.1.3
        text: In combination with the method Set, the payload contains a single DataSetMessages of type Config. A topic with method Set must contain Resource, Source and Filter to be valid.
      - ref: MG 9.1.3
        text: Each publication, using the method Set must be done explicitly.
      - ref: MG 9.1.3
        text: Setting multiple DataSetMessages at once via Oi4v2/<ServiceType>/<AppId>/Set/Config is not possible due to security reasons because it can not be validated via an access control list by the Message Bus.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.3-b1dfe637, MG-9.1.3-8b7226fb, MG-9.1.3-c61b6741]
    status: reviewed
    notes: >-
      PublisherId = requester (REQ-MSG-006); header of the DataSetMessage
      (DataSetWriterId of the addressed Config DataSet, Source, Filter, no
      SequenceNumber) per REQ-BUS-010. Which Config DataSets are writable is
      announced by the component (MG B1.1.3 note).

  - id: REQ-RES-CONFIG-020
    title: Set Config is protected by ACL
    statement: >-
      The operator of the Message Bus prevents Set Config by unauthorized
      communication participants via the ACL of the broker.
    keyword: MUST
    domain: platform
    applies_to: [broker, platform]
    refs: [MG 9.1.3]
    quotes:
      - ref: MG 9.1.3
        text: To prevent write access by unauthorized communication participants, the operator must prevent this via ACL.
    verification: [d8]
    inventory: [MG-9.1.3-2444e5a1, MG-9.1.3-da560694]
    status: reviewed

  - id: REQ-RES-CONFIG-021
    title: Status event after Set Config
    statement: >-
      After a Set Config, the component publishes an Event of the category
      Status about the command on Pub/Event/<Source>/Status/<EventLevel>
      with the Source of the Set topic – mandatory from Level 2 on,
      recommended at Level 1.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for Config.
    refs: [MG 9.1.3, MG 7.4]
    quotes:
      - ref: MG 9.1.3
        text: After a Set message arrived, the application must publish an Event message with status information about the Set command to the topic Pub/Event/<Source>/Status/<EventLevel> (8.3.6.1 Status) from compliance Level 2 on and should do so at Level 1 (7.4 Method Element) to provide feedback to the caller.
    verification: [d7-test]
    inventory: [MG-9.1.3-c083f27e]
    status: reviewed
    notes: >-
      Same obligation as REQ-TOP-014; ReplyTo and content per
      REQ-RES-EVENT-005. Example MG B1.1.3 (golden vector V-PAY-076).

  - id: REQ-RES-CONFIG-022
    title: Changed Config is published after a successful Set
    statement: >-
      After a successful Set Config, the component publishes the new Config
      DataSet to Pub/Config/<Source>/<Filter> with the ReplyTo of the Set;
      the values of sensitive configuration objects are masked as in every
      Pub (REQ-RES-CONFIG-024).
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for Config and the Set was successful.
    refs: [MG 9.1.3, GL-ADR-021]
    quotes:
      - ref: MG 9.1.3
        text: If setting Config was successful, the new Config must be published to the Pub/Config[/<Source>[/<Filter>]] topic, according to the settings in PublicationList (8.3.8 PublicationList).
      - ref: MG 9.1.3
        text: As in every publication of Config, the values of sensitive config elements are masked.
    verification: [d7-test]
    inventory: [MG-9.1.3-f44495ea]
    status: reviewed
    notes: >-
      Read like REQ-RES-DATA-012 and REQ-RES-PUBLIST-025: the answer to the
      Set goes to the topic with Source and Filter of the Set and contains
      the complete Config DataSet (REQ-RES-CONFIG-002); publications
      configured in the PublicationList follow on their own. General rule:
      REQ-BUS-006. Example: MG B1.1.3 "Pub explicit Config tag after a
      successful set request" (V-PAY-114).

  - id: REQ-RES-CONFIG-023
    title: A Set Config is applied completely or rejected
    statement: >-
      A component applies a Set Config completely or not at all. It rejects
      the Set with a Status event of EventLevel Bad (REQ-RES-CONFIG-021) if
      the Set addresses a group or configuration object the Config DataSet
      does not have, changes a read-only property (every property except
      Value), lacks a mandatory configuration object of a contained group
      or carries a Value that does not represent its Type or violates its
      Validation (except the mask of a sensitive configuration object,
      REQ-RES-CONFIG-025); repeated unchanged read-only properties are
      accepted.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for Config.
    refs: [MG 8.3.3.2, MG 9.1.3, SF-035, SF-086]
    quotes:
      - ref: MG 8.3.3.2
        text: The receiving application applies a Set completely or not at all
      - ref: MG 9.1.3
        text: The Set is applied completely or not at all.
      - ref: MG 9.1.3
        text: the Set must be rejected and the status Event must have the EventLevel Bad. Read-only properties which are repeated unchanged from Pub/Config are accepted.
    verification: [d7-test]
    inventory: [MG-9.1.3-7d1e4d10, MG-8.3.3.2-3a8c3bb0]
    status: reviewed
    notes: >-
      Stated in MG 8.3.3.2 and MG 9.1.3 since SF-086 (c)/(d), in line with PublicationList
      (REQ-RES-PUBLIST-016, SF-067 (f)) and REQ-CMP-043 (unknown object →
      Bad, e.g. BadNotFound, BadNotWritable, BadOutOfRange). The
      application may additionally reject a value it cannot apply (e.g. an
      empty Value of a mandatory object, REQ-RES-CONFIG-011).

  - id: REQ-RES-CONFIG-024
    title: Sensitive configuration values are masked in every Pub
    statement: >-
      In every publication of a Config DataSet (answer to a Get, publication
      after a successful Set, publication configured in the PublicationList
      and any other publication), the publisher replaces a non-empty Value
      and a non-empty DefaultValue of a configuration object with
      Sensitive = true by the mask "********" (eight asterisks). An empty
      Value or DefaultValue is published as empty string. The mask is not
      interpreted with Type and not checked against Validation.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Config (REQ-CMP-035).
    refs: [MG 8.3.3.1, MG 9.1.3, GL-ADR-021, SF-087]
    quotes:
      - ref: MG 8.3.3.1
        text: If Sensitive is set to true, the publisher must replace a non-empty Value and a non-empty DefaultValue of this Config object by the mask `********` (eight asterisks) in every publication of the Config (Pub/Config) – in the answer to a Get, in the publication after a successful Set and in any other publication. An empty Value or DefaultValue is published as empty string, so a consumer can see whether the value is set.
      - ref: MG 9.1.3
        text: 'In every publication of Config, the publisher must replace a non-empty Value and DefaultValue of a sensitive config element ("Sensitive": true) by the mask `********`'
      - ref: MG 8.3.3.1
        text: The value of a sensitive Config object is not published on the Message Bus; it can only be set
    verification: [d7-validate, d7-test]
    inventory: [MG-8.3.3.1-72d258a9, MG-8.3.3.1-3f9abadb, MG-9.1.3-a94653f3, MG-8.3.3.1-8912ceb4]
    status: reviewed
    notes: >-
      New with GL-ADR-021 (SF-087). Levels follow the Config DataSet: a
      component that offers Config masks always. The checker reports a
      non-empty Value/DefaultValue other than the mask of a sensitive
      object in a Pub. Examples: MG B1.1.3 (V-PAY-099, V-PAY-114).

  - id: REQ-RES-CONFIG-025
    title: The mask in a Set leaves a sensitive value unchanged
    statement: >-
      A component that receives a Set Config whose Value of a configuration
      object with Sensitive = true is the mask "********" leaves this value
      unchanged and does not check the mask against Type and Validation. A
      sensitive value cannot be set to the mask itself; an empty Value
      unsets it as for every configuration object.
    keyword: MUST
    implicit: true
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for Config.
    refs: [MG 8.3.3.2, MG 9.1.3, GL-ADR-021, SF-035, SF-087]
    quotes:
      - ref: MG 8.3.3.2
        text: If Sensitive is set to true, a Set whose Value of this Config object is the mask `********` leaves the value unchanged; the mask is not checked against Type and Validation. So a requester can send back a published Config unchanged and can include a mandatory sensitive Config object without knowing its value.
      - ref: MG 9.1.3
        text: A Set with the mask `********` as Value of a sensitive config element leaves the value unchanged
    verification: [d7-test]
    inventory: [MG-8.3.3.2-c58a8f66, MG-8.3.3.2-6f1a91a8]
    status: reviewed
    notes: >-
      New with GL-ADR-021 (SF-087). Levels as REQ-RES-CONFIG-023 (Set
      handling). A requester can send a published Config back unchanged
      (REQ-RES-CONFIG-003) and can include a mandatory sensitive object
      (REQ-RES-CONFIG-011) without knowing its value.

  - id: REQ-RES-CONFIG-026
    title: The operator restricts read access to Set/Config
    statement: >-
      Because a Set Config carries new sensitive values in clear text, the
      operator restricts, besides the write access, also the read access to
      the Set/Config topics via ACL.
    keyword: SHOULD
    domain: platform
    applies_to: [broker, platform]
    condition: Components on the Message Bus offer Set for Config with sensitive configuration objects.
    refs: [MG 8.3.3.2, MG 9.1.3, GL-ADR-021, SF-087]
    quotes:
      - ref: MG 8.3.3.2
        text: A Set carries a new sensitive value in clear text. Besides the write access, the operator should therefore also restrict the read access to the Set/Config topics via ACL
      - ref: MG 9.1.3
        text: A Set carries new values of sensitive config elements in clear text. The operator should therefore also restrict the read access to the Set/Config topics via ACL.
    verification: [d8]
    inventory: [MG-8.3.3.2-62425f11, MG-9.1.3-ac3a3f16]
    status: reviewed
    notes: >-
      New with GL-ADR-021 (SF-087). Operator duty like the write ACL of
      REQ-RES-CONFIG-020; checked by the infrastructure CLI (D8).
