# Requirements of area RES-META – resource Metadata
# (MG 8.3.5, 9.1.5; ADR-0018, schema: catalog.schema.json).
# Support: REQ-CMP-037 (resource Metadata; REQ-CMP-022 Data ⇒ Metadata is
# deprecated since SF-037, C-031 consistency review). The structure of DataSetMetaData
# is REQ-MSG-032 … 041 (MG 8.2.2), its DataSetClassId REQ-MSG-012 (SF-074);
# Metadata in the PublicationList: REQ-RES-PUBLIST-* (ON_REQUEST_FILTER_9);
# Get of Metadata without Data: REQ-CMP-044. MG 8.3.5 is descriptive only
# (no inventory item). Checked by tools/internal/payload (C-028).
# Drafted in C-028, reviewed in the C-028 review; SF-078 (templates of MG
# 9.1.5) and SF-079 (DataSetMetaData header of a Set request) resolved in the
# guideline (baseline b2f0fe7).
area: RES-META
baseline: "df752cd"
requirements:
  - id: REQ-RES-META-001
    title: Get Metadata addresses one DataSet and carries an empty DataSetMetaData
    statement: >-
      A Get Metadata is sent to Get/Metadata/<Source>/<Tag> and its
      NetworkMessage is a ua-metadata message whose MetaData is the empty
      object {}.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1.5]
    quotes:
      - ref: MG 9.1.5
        text: In combination with the method Get, the payload requires an empty DataSetMetaData. The topic must contain Resource, Source and Filter to be valid.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.5-ff9f8200]
    status: reviewed
    notes: >-
      Example V-PAY-020 (MG B1.1.5): the header addresses the Data DataSet
      (DataSetWriterId, WriterGroupName = Tag, DataSetWriterName = Source).
      The second part of the item (no Metadata for a Source/Filter without
      Data, optional Status Bad) is REQ-CMP-044. A ua-metadata message has
      no Messages, hence no helper DataSet (no Pagination or Locale).

  - id: REQ-RES-META-002
    title: Get Metadata is answered on the Pub topic of the same DataSet
    statement: >-
      A Get/Metadata/<Source>/<Tag> for a Data DataSet the component provides
      is answered with its filled DataSetMetaData on
      Pub/Metadata/<Source>/<Tag>, with the ReplyTo of the Get.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component publishes Data and supports the resource Metadata (REQ-CMP-036, REQ-CMP-037).
    refs: [MG 9.1.5]
    quotes:
      - ref: MG 9.1.5
        text: Via the <Method>/<Resource>/<Source>/<Filter> combination Get/Metadata/<Source>/<Tag>, the publication of this information to the Pub/Metadata/<Source>/<Tag> topic can be triggered.
    verification: [d7-test]
    inventory: [MG-9.1.5-bba195d4]
    status: reviewed
    notes: ReplyTo per REQ-MSG-015. Example V-PAY-020/021 (MG B1.1.5).

  - id: REQ-RES-META-003
    title: Pub Metadata carries the filled DataSetMetaData of one Data DataSet
    statement: >-
      Metadata is published to Pub/Metadata/<Source>/<Tag> as a ua-metadata
      message whose MetaData is the filled DataSetMetaData of exactly the
      Data DataSet published with the same Source and Tag.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [publisher]
    condition: The component publishes Data and supports the resource Metadata (REQ-CMP-036, REQ-CMP-037).
    refs: [MG 9.1.5, MG 8.3.5]
    quotes:
      - ref: MG 9.1.5
        text: In combination with the method Pub, the payload contains a filled DataSetMetaData. The topic must contain Resource, Source and Filter to be valid, because Metadata is always published for a single Data object (8.3.8 PublicationList, ON_REQUEST_FILTER_9).
    verification: [schema, d7-validate]
    inventory: [MG-9.1.5-cbd58b97]
    status: reviewed
    notes: >-
      The content rules of DataSetMetaData are REQ-MSG-032 … 041, the
      header link to the DataSet REQ-MSG-033 (same DataSetWriterId,
      WriterGroupName, DataSetWriterName as the Data DataSetMessage). The
      fields of the Data DataSet must match the Fields of the Metadata
      (REQ-RES-DATA-001).

  - id: REQ-RES-META-004
    title: Set Metadata addresses one DataSet with a filled DataSetMetaData
    statement: >-
      A Set Metadata is sent to Set/Metadata/<Source>/<Tag> and its
      NetworkMessage is a ua-metadata message whose MetaData is the complete,
      filled DataSetMetaData of the addressed Data DataSet.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester]
    refs: [MG 9.1.5, SF-078, SF-079]
    quotes:
      - ref: MG 9.1.5
        text: In combination with the method Set, the payload contains a filled DataSetMetaData. The topic must contain Resource, Source and Filter to be valid.
      - ref: MG 9.1.5
        text: Each publication using the method Set must be done explicitly. That means Set/Metadata is only possible by using a complete topic containing Resource, Source and Filter, such as Oi4v2/<ServiceType>/<AppId>/Set/Metadata/<Source>/<Tag>.
    verification: [schema, d7-validate]
    inventory: [MG-9.1.5-589a70ef, MG-9.1.5-c88db582]
    status: reviewed
    notes: >-
      PublisherId = requester (REQ-MSG-006; MG 9.1.5 Set template since
      SF-078 (b)); header per REQ-BUS-010 (MG 8.2.3 since SF-079).

  - id: REQ-RES-META-005
    title: Set Metadata is protected by ACL
    statement: >-
      The operator of the Message Bus prevents Set Metadata by unauthorized
      communication participants via the ACL of the broker.
    keyword: MUST
    domain: platform
    applies_to: [broker, platform]
    refs: [MG 9.1.5]
    quotes:
      - ref: MG 9.1.5
        text: To prevent write access by unauthorized communication participants, the operator must prevent this via ACL.
    verification: [d8]
    inventory: [MG-9.1.5-0ebe87ac]
    status: reviewed

  - id: REQ-RES-META-006
    title: Status event after Set Metadata
    statement: >-
      After a Set Metadata, the component publishes an Event of the category
      Status about the command on Pub/Event/<Source>/Status/<EventLevel> with
      the Source of the Set topic – mandatory from Level 2 on, recommended at
      Level 1.
    keyword: MUST
    domain: messaging
    levels: {L1: SHOULD, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for Metadata.
    refs: [MG 9.1.5, MG 7.4]
    quotes:
      - ref: MG 9.1.5
        text: After a Set message arrived, the application must publish an Event message with status information about the Set command to the topic Pub/Event/<Source>/Status/<EventLevel> (8.3.6.1 Status) from compliance Level 2 on and should do so at Level 1 (7.4 Method Element) to provide feedback to the caller.
    verification: [d7-test]
    inventory: [MG-9.1.5-553935ed]
    status: reviewed
    notes: Same obligation as REQ-TOP-014; ReplyTo and content per REQ-RES-EVENT-005. Example MG B1.1.5.

  - id: REQ-RES-META-007
    title: Changed Metadata is published after a successful Set
    statement: >-
      After a successful Set Metadata, the component publishes the new
      DataSetMetaData to Pub/Metadata/<Source>/<Tag> with the ReplyTo of the
      Set.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [application, device]
    condition: The component offers Set for Metadata and the Set was successful.
    refs: [MG 9.1.5]
    quotes:
      - ref: MG 9.1.5
        text: If setting Metadata was successful, the new Metadata must be published to the Pub/Metadata/<Source>/<Tag> topic, according to the settings in PublicationList (8.3.8 PublicationList).
    verification: [d7-test]
    inventory: [MG-9.1.5-ccacb85a]
    status: reviewed
    notes: >-
      Read like REQ-RES-PUBLIST-025 and REQ-RES-REFDES-010 (reviewed in
      C-027). A change of the Metadata updates its ConfigurationVersion
      (REQ-MSG-036). General rule: REQ-BUS-006.
