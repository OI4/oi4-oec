# Requirements of area CNT – container environment (RIG 2, RIG 4; ADR-0018).
# Grading (RIG 1.3, RIG 4 note): requirements on the container image or the
# application use domain service-container – license and SBOM storage L1 –,
# L2 MUST, L3 MUST; all other RIG 4 requirements L1 –, L2 SHOULD, L3 MUST
# (umbrellas REQ-CMP-028 … 031). The host side of the storages and the
# container name assignment are requirements on the platform (domain platform,
# not graded, RIG 1.3).
# Drafted in C-030; secret storage (REQ-CNT-007 … 009, 024, 025) reworked with
# GL-ADR-022 (C-030 addendum 1).
area: CNT
baseline: "168e1d1"
requirements:
  # --- Message Bus storage (RIG 4.1.1) --------------------------------------
  - id: REQ-CNT-001
    title: Platform provides the Message Bus storage
    statement: >-
      The platform maps a host-defined path, mounted read-only, to the target
      path /etc/oi4/mqtt of every container. The Message Bus storage contains
      at least broker.pem (public certificate of the broker), broker.json
      (settings of the broker, REQ-CNT-003) and, if the broker certificate
      was signed by a local CA other than the CA of ca.pem in the OI4
      certificate storage (REQ-CNT-005), broker_ca.pem (that CA); otherwise
      clients verify the broker certificate against ca.pem.
    keyword: MUST
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.1, SF-091]
    quotes:
      - ref: RIG 4.1.1
        text: The Message Bus storage shall be used to make the public certificate and the settings of the MQTT broker available to the container and their MQTT clients.
      - ref: RIG 4.1.1
        text: The target path is the path inside the container, which must be mapped to a host-defined path inside the host system.
      - ref: RIG 4.1.1
        text: The host path shall be mounted read only!
      - ref: RIG 4.1.1
        text: 'The Message Bus storage shall contain at least the following files:'
    verification: [d8]
    inventory: [RIG-4.1.1-723b5b51, RIG-4.1.1-15bd8eb6, RIG-4.1.1-e577eb27, RIG-4.1.1-078a70a1]
    status: reviewed
    notes: >-
      broker_ca.pem is present only for a local CA other than the CA of
      ca.pem (RIG 4.1.1 since SF-091 (a), guideline fbe6173). With
      REQ-CNT-005 a CA certificate for the verification of the broker
      certificate (REQ-MQTT-008) is always available. The broker address in
      broker.json is also required by REQ-MQTT-003. Back to draft in the
      C-030 review (SF-091 revised 2026-10-22).

  - id: REQ-CNT-002
    title: No private keys in the Message Bus and certificate storages
    statement: >-
      The platform stores no private keys in the Message Bus storage
      (/etc/oi4/mqtt) and in the OI4 certificate storage (/etc/oi4/certs);
      private keys are provided via the secret storage (REQ-CNT-008).
    keyword: SHOULD
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.1, RIG 4.1.2]
    quotes:
      - ref: RIG 4.1.1
        text: Folder which contains the MQTT settings and the public certificate of the broker RECOMMENDED Do not store any private keys here!
      - ref: RIG 4.1.2
        text: Storage for certificates. Such as the certificates of the applications (see 4.1.3 Secret Storage) and CA certificate to validate other certificates. RECOMMENDED Do not store any private keys here!
    verification: [d8]
    inventory: [RIG-4.1.1-4edf0c5a, RIG-4.1.2-3fbacc96]
    status: reviewed

  - id: REQ-CNT-003
    title: Content of broker.json
    statement: >-
      broker.json in the Message Bus storage is a JSON object with the
      mandatory fields Address (String, IP address or host name of the
      broker: an IPv4 address in dotted-decimal form without leading zeros,
      an IPv6 address in the text form of RFC 4291 without brackets and
      without zone index, or a host name of RFC 1123 – labels of 1 to 63
      letters, digits and "-" that do not start or end with "-", the last
      label not all digits, at most 253 characters, no trailing "." –; no
      port, scheme or path), SecurePort (UINT16, 1 … 65535, port on which the
      broker listens for TLS connections) and MaxPacketSize (INT32, maximum
      size of an MQTT payload in bytes, at least 262144 and at most
      268435455). It may contain further elements. The broker accepts
      payloads up to MaxPacketSize.
    keyword: MUST
    domain: platform
    applies_to: [platform, broker]
    refs: [RIG 4.1.1, MG 6.2.1, SF-091, SF-100]
    quotes:
      - ref: RIG 4.1.1
        text: broker.json JSON coded file containing the settings of the MQTT broker.
      - ref: RIG 4.1.1
        text: Address contains no port, no scheme and no path.
      - ref: RIG 4.1.1
        text: Defines the maximum size of a MQTT payload in bytes.
      - ref: RIG 4.1.1
        text: The minimum value of MaxPacketSize is 262144 (256 KiB)
      - ref: RIG 4.1.1
        text: The intention of the MaxPacketSize is to protect the Message Bus broker and client.
      - ref: RIG 4.1.1
        text: Clients ignore elements of broker.json they do not know.
    verification: [d8]
    inventory: [RIG-4.1.1-58d0cc4a, RIG-4.1.1-516de8c7, RIG-4.1.1-bf0c6b45, RIG-4.1.1-77f0d05d]
    status: draft
    notes: >-
      That the broker accepts payloads up to MaxPacketSize follows from the
      purpose of the field (publishers may use the full size, REQ-PAG-005).
      The upper bound 268435455 (maximum remaining length of an MQTT v3.1.1
      packet) replaced "INT32max" with SF-091 (b) (guideline fbe6173). The
      forms of Address, the range of SecurePort and the further elements
      follow SF-100 (guideline 168e1d1); that clients ignore unknown elements
      is REQ-CNT-004. Implemented by the JSON Schema
      oec/schema/v2/platform/broker.schema.json and the oracle
      internal/platform (vectors V-BRK-001 … 018, C-039).

  - id: REQ-CNT-004
    title: Application uses the Message Bus storage
    statement: >-
      A containerized application takes the broker address (Address), the
      port (SecurePort) and the MaxPacketSize from /etc/oi4/mqtt/broker.json
      and verifies the broker certificate with broker_ca.pem or, if not
      present, with the CA of the OI4 certificate storage; it needs no other
      configuration of these settings. It ignores elements of broker.json it
      does not know.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, container-image]
    refs: [RIG 4.1.1, RIG 1.3, SF-100]
    quotes:
      - ref: RIG 4.1.1
        text: The Message Bus storage shall be used to make the public certificate and the settings of the MQTT broker available to the container and their MQTT clients.
      - ref: RIG 4.1.1
        text: Clients ignore elements of broker.json they do not know.
    verification: [d8, manual]
    inventory: [RIG-4.1.1-723b5b51, RIG-4.1.1-77f0d05d]
    status: draft
    notes: >-
      Graded by REQ-CMP-029. The client side of the messaging domain already
      requires the port (REQ-MQTT-004), the certificate verification
      (REQ-MQTT-008) and a NetworkMessage within MaxPacketSize (REQ-PAG-005)
      at every messaging level.

  # --- OI4 certificate storage (RIG 4.1.2) ----------------------------------
  - id: REQ-CNT-005
    title: Platform always provides a CA certificate in the certificate storage
    statement: >-
      The platform provides the OI4 certificate storage /etc/oi4/certs
      (REQ-CNT-006) to every container, with ca.pem: the certificate of the CA
      used to validate certificates. If the broker certificate was not signed
      by this CA, the CA that signed it is provided as broker_ca.pem
      (REQ-CNT-001). Every container can thus verify the broker certificate
      (REQ-MQTT-008).
    keyword: MUST
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.2, RIG 4.1.1, MG 6.2.2, SF-035, SF-091]
    quotes:
      - ref: RIG 4.1.2
        text: 'The platform shall make the certificate of the certificate authority (CA) used to validate certificates, in particular the broker certificate (OEC Messaging Guideline, 6.2.2 Security Settings), and the certificates of the applications available by storing them as follows:'
      - ref: RIG 4.1.2
        text: An own CA of the platform is only required if the platform issues certificates, e.g. the certificates of the applications.
      - ref: MG 6.2.2
        text: 'The client must verify the broker certificate when it establishes the TLS connection: the certificate chain against the CA certificate (broker_ca.pem of the Message Bus storage or, if no local CA is present, the CA of the OI4 certificate storage; for a client without container, its configured CA) and the broker address.'
    verification: [d8]
    inventory: [RIG-4.1.2-70fa2141, RIG-4.1.2-f5aa1987, RIG-4.1.2-1d32cac8]
    status: reviewed
    notes: >-
      TLS is mandatory (REQ-MQTT-005/006) and every client must verify the
      broker certificate against broker_ca.pem or ca.pem (REQ-MQTT-008, MUST
      at every level); without a CA certificate no containerized client could
      connect. Implicit MUST per SF-091 (c)/(g) (C-030 review, 2026-10-22),
      explicit "shall" in RIG 4.1.2 since guideline fbe6173 (before: "In case
      the system provides a CA … should"); the first draft was SHOULD with a
      condition. ca.pem may be a well-known (public) or a platform-specific
      CA; an own CA that issues certificates is only needed for client
      certificates and certificates of the applications (REQ-CNT-007).

  - id: REQ-CNT-006
    title: Content and mount of the certificate storage
    statement: >-
      The platform maps a host-defined path, mounted read-only, to the target
      path /etc/oi4/certs of every container. The OI4 certificate storage
      contains at least ca.pem (CA for the validation of
      certificates) and, for a container with a certificate, the certificate
      of its application (REQ-CNT-007).
    keyword: MUST
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.2, SF-091]
    quotes:
      - ref: RIG 4.1.2
        text: The target path is the path inside the Docker container, which must be mapped to a host-defined path inside the host system.
      - ref: RIG 4.1.2
        text: The host path shall be mounted read only!
      - ref: RIG 4.1.2
        text: 'The certificate storage shall contain at least the following files:'
      - ref: RIG 4.1.2
        text: ca.pem CA used for validation of certificates.
    verification: [d8]
    inventory: [RIG-4.1.2-aff2fc7b, RIG-4.1.2-9e0b30f0, RIG-4.1.2-e191918f, RIG-4.1.2-54831f39]
    status: reviewed
    notes: >-
      The storage is always provided (REQ-CNT-005, SF-091 (c) revised in the
      C-030 review; before: conditional), its content "shall"; the certificate of the application is only needed
      if the application uses it, e.g. for client certificate authentication
      (REQ-MQTT-009/010) or the other uses of REQ-CNT-025 (GL-ADR-022).

  - id: REQ-CNT-007
    title: Certificate of the application named after the container
    statement: >-
      The certificate of the application of a container (its identity, with
      the private key in the secret storage, REQ-CNT-008) is stored in the OI4
      certificate storage as <containername>.pem, with the container name of
      RIG 4.2.
    keyword: SHOULD
    domain: platform
    applies_to: [platform]
    condition: The application of the container has a certificate.
    refs: [RIG 4.1.2, RIG 4.2, GL-ADR-022]
    quotes:
      - ref: RIG 4.1.2
        text: <containername>.pem Certificate of a specific application (its identity, see 4.1.3 Secret Storage) should be named as described in 4.2 Container Name Conventions.
    verification: [d8]
    inventory: [RIG-4.1.2-7bd3e5d6]
    status: reviewed
    notes: >-
      Called "client certificate" until GL-ADR-022; the certificate is the
      identity of the application for all its uses (REQ-CNT-025).

  # --- Secret storage (RIG 4.1.3) -------------------------------------------
  - id: REQ-CNT-008
    title: Platform provides the secrets of the identity of the application
    statement: >-
      The platform makes the secrets of the identity of the application of a
      container available in the secret storage /run/secrets/oi4, mapped from
      a host-defined path and mounted read-only: credentials
      (base64(<username>:<password>)), private_key.pem (PEM-encoded private
      key of the certificate of the application, <containername>.pem in the
      OI4 certificate storage, REQ-CNT-007) and, if the key is encrypted,
      passphrase (base64-encoded passphrase). Each file is present only if
      used; at least one means of authentication is provided – the
      credentials or the private key together with the certificate. The
      folder contains only these files; further secrets of the application
      are provided outside of it.
    keyword: MUST
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.3, MG 6.2.2, GL-ADR-022]
    quotes:
      - ref: RIG 4.1.3
        text: 'In an Open Industry 4.0 Alliance-compliant platform, the secrets of the identity of an application shall be made available to its container under the following paths:'
      - ref: RIG 4.1.3
        text: 'The platform shall provide at least one means of authentication: the credentials or the private key together with the certificate of the application.'
      - ref: RIG 4.1.3
        text: The target path is the path inside the Docker container, which must be mapped to a host-defined path inside the host system.
      - ref: RIG 4.1.3
        text: The host path shall be mounted read only!
      - ref: RIG 4.1.3
        text: The folder /run/secrets/oi4 is reserved for the files of Table 7.
    verification: [d8]
    inventory: [RIG-4.1.3-3ccf87cc, RIG-4.1.3-2494f946, RIG-4.1.3-04e70172, RIG-4.1.3-0b3ec5ba]
    status: reviewed
    notes: >-
      GL-ADR-022 (PO order 2026-10-22) replaced /run/secrets/mqtt_credentials,
      mqtt_private_key.pem and mqtt_passphrase by the folder /run/secrets/oi4
      and resolved SF-091 (d) (addressee platform, at least one means of
      authentication). The usernames follow REQ-MQTT-011.

  - id: REQ-CNT-009
    title: Application uses the certificate and secret storages
    statement: >-
      A containerized application takes the secrets of its identity from
      /run/secrets/oi4: the username and password by base64-decoding
      credentials and splitting at the first ":", the private key of its
      certificate from private_key.pem (decrypted with the base64-decoded
      passphrase, if present) and its certificate from
      /etc/oi4/certs/<containername>.pem. It uses them for the authentication
      at the Message Bus and needs no other configuration of these secrets.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application, container-image]
    refs: [RIG 4.1.3, RIG 4.1.2, RIG 1.3, MG 6.2.2, GL-ADR-022]
    quotes:
      - ref: RIG 4.1.3
        text: To obtain the username and the password, the application shall decode the content of credentials (base64) and split the result at the first colon (:).
      - ref: RIG 4.1.3
        text: The username does not contain a colon (OEC Messaging Guideline, 6.2.2 Security Settings), the password may contain colons.
      - ref: RIG 4.1.3
        text: With this identity, the application authenticates itself at the Message Bus (OEC Messaging Guideline, 6.2.2 Security Settings).
    verification: [d8, manual]
    inventory: [RIG-4.1.3-7745248f, RIG-4.1.3-fabb06b7]
    status: reviewed
    notes: >-
      Graded by REQ-CMP-029 (secret handling). Which means is used if both
      are available: REQ-MQTT-010. The decoding is explicit since GL-ADR-022
      (SF-091 (d)); a username contains no ":" (REQ-MQTT-011).

  # --- Application specific storages (RIG 4.1.4) ----------------------------
  - id: REQ-CNT-010
    title: Application uses the OI4 application storage paths
    statement: >-
      If the system provides a persistent layer, a containerized application
      that needs persistent configuration or data stores its configuration in
      /etc/oi4/app and its data in /opt/oi4/app.
    keyword: SHOULD
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: SHOULD}
    applies_to: [application, container-image]
    condition: The system provides a persistent layer and the application needs persistent configuration or data.
    refs: [RIG 4.1.4, SF-091]
    quotes:
      - ref: RIG 4.1.4
        text: In case the system provides a persistent layer, the application should use the following paths to make use of it.
      - ref: RIG 4.1.4
        text: /etc/oi4/app Storage for application specific configuration
      - ref: RIG 4.1.4
        text: /opt/oi4/app Storage for application specific data
    verification: [manual]
    inventory: [RIG-4.1.4-ffa2fd84, RIG-4.1.4-b206a9a5, RIG-4.1.4-a5f1c4d1]
    status: reviewed
    notes: 'The paths are recommended (SF-091 (e)); the table said "shall be stored here" until guideline fbe6173.'

  - id: REQ-CNT-011
    title: Application storages are mapped and owned by one container
    statement: >-
      If the platform provides a persistent layer, it maps a host-defined
      path to /etc/oi4/app and /opt/oi4/app of a container; only this one
      container has access to its own application specific volume.
    keyword: MUST
    domain: platform
    applies_to: [platform]
    condition: The platform provides a persistent layer.
    refs: [RIG 4.1.4, SF-091]
    quotes:
      - ref: RIG 4.1.4
        text: The target paths /etc/oi4/app and /opt/oi4/app are paths inside the Docker container, which must be mapped to a host-defined path inside the host system.
      - ref: RIG 4.1.4
        text: Attention must be paid to access permissions; to guarantee the data ownership, only one container shall have access to its own application specific volume.
    verification: [d8]
    inventory: [RIG-4.1.4-9177c92c, RIG-4.1.4-4d7c9a08]
    status: reviewed
    notes: The host mapping does not apply to /opt/oi4/licenses (REQ-CNT-017, SF-091 (e); stated in the RIG 4.1.4 note since guideline fbe6173).

  - id: REQ-CNT-012
    title: Application detects manipulation of its stored data
    statement: >-
      A containerized application takes measures to detect manipulation of
      the data in its application specific storages and protects it (e.g. by
      encryption) if necessary.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application]
    condition: The application uses an application specific storage.
    refs: [RIG 4.1.4]
    quotes:
      - ref: RIG 4.1.4
        text: Because container volumes are not protected against external access to read/write in general, the application has to take measures to detect data manipulation and might protect it (e.g. encryption) if necessary.
    verification: [manual]
    inventory: [RIG-4.1.4-4d2eb4a9]
    status: reviewed
    notes: Graded by REQ-CMP-029.

  # --- License and SBOM storage (RIG 4.1.4) ---------------------------------
  - id: REQ-CNT-013
    title: SBOM in /opt/oi4/licenses
    statement: >-
      A containerized application provides a Software Bill of Materials
      (SBOM) describing the licenses of all its software components in the
      folder /opt/oi4/licenses: either SPDX (ISO/IEC 5962:2021) as
      sbom.spdx.json or CycloneDX (ECMA-424) as sbom.cdx.json, each in the
      JSON serialization of the format. Exactly one of these two files is
      present.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [container-image]
    refs: [RIG 4.1.4, RIG 4, RIG 1.3, RIG 5.2, GL-ADR-002]
    quotes:
      - ref: RIG 4.1.4
        text: Instead, every Open Industry 4.0 Alliance-compliant application shall provide this information in the folder /opt/oi4/licenses.
      - ref: RIG 4.1.4
        text: 'The licenses of all software components used in the application shall be described in a Software Bill of Materials (SBOM) in one of the following formats:'
      - ref: RIG 4.1.4
        text: 'The SBOM shall use the JSON serialization of the selected format and shall be stored with a canonical file name, so that it can be detected without further configuration:'
      - ref: RIG 4.1.4
        text: Exactly one of these SBOM files shall be present.
      - ref: RIG 4
        text: The license and SBOM storage (4.1.4 Application Specific Storages) is mandatory from Level 2 on.
    verification: [d8]
    inventory: [RIG-4.1.4-0a58da0d, RIG-4.1.4-0b9c4e0b, RIG-4.1.4-97a172ef, RIG-4.1.4-e49f19d5, RIG-4.1.4-d208c6fb, RIG-4-686e2ed9, RIG-5.2-1b1e9b90]
    status: reviewed
    notes: Detail of REQ-CMP-028 (reviewed umbrella).

  - id: REQ-CNT-014
    title: License texts in the SBOM or as <License-ID>.txt
    statement: >-
      Every license text is either part of the SBOM or stored as
      /opt/oi4/licenses/<License-ID>.txt, where <License-ID> is the SPDX
      license identifier of the license or the LicenseRef- identifier used in
      the SBOM for a license without SPDX identifier.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [container-image]
    refs: [RIG 4.1.4, RIG 1.3, GL-ADR-002]
    quotes:
      - ref: RIG 4.1.4
        text: The license texts shall either be part of the SBOM or be stored as separate text files /opt/oi4/licenses/<License-ID>.txt.
      - ref: RIG 4.1.4
        text: This way, each license text is clearly assignable to the corresponding license in the SBOM.
    verification: [d8]
    inventory: [RIG-4.1.4-9ffd2b93]
    status: reviewed

  - id: REQ-CNT-015
    title: SBOM and license texts are part of the image
    statement: >-
      The SBOM and the license texts are part of the container image; they
      are static and change only with a new version of the image.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: MUST, L3: MUST}
    applies_to: [container-image]
    refs: [RIG 4.1.4, RIG 1.3]
    quotes:
      - ref: RIG 4.1.4
        text: The SBOM and the license texts shall be part of the container image. They are static and only change with a new version of the image.
    verification: [d8]
    inventory: [RIG-4.1.4-f4837530]
    status: reviewed

  - id: REQ-CNT-016
    title: SBOM is created during the image build
    statement: The SBOM is created automatically as part of the build process of the image.
    keyword: SHOULD
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: SHOULD}
    applies_to: [container-image, manufacturer]
    refs: [RIG 4.1.4]
    quotes:
      - ref: RIG 4.1.4
        text: Create the SBOM automatically as part of the build process of the image.
    verification: [manual]
    inventory: [RIG-4.1.4-f8ef731d]
    status: reviewed

  - id: REQ-CNT-017
    title: /opt/oi4/licenses is not overlaid by a host mount
    statement: >-
      The platform does not overlay /opt/oi4/licenses of a container with a
      host-defined mount; the content comes from the image.
    keyword: MUST NOT
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.4]
    quotes:
      - ref: RIG 4.1.4
        text: The content of /opt/oi4/licenses is provided by the image and not by the host. Therefore, it shall not be overlaid by a host-defined mount.
      - ref: RIG 4.1.4
        text: 'The path /opt/oi4/licenses is not part of the persistent layer: it is provided by the image and is required independent of a persistent layer'
    verification: [d8]
    inventory: [RIG-4.1.4-db5179b6, RIG-4.1.4-ae9db98e]
    status: reviewed

  - id: REQ-CNT-018
    title: Platform may read the license folder
    statement: >-
      The platform may read the content of /opt/oi4/licenses, e.g. by
      mounting the path as a read-only volume that is populated from the
      image.
    keyword: MAY
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.4]
    quotes:
      - ref: RIG 4.1.4
        text: A platform may read the content, e.g. by mounting the path as a read-only volume that is populated from the image.
    verification: [manual]
    inventory: [RIG-4.1.4-150063ec]
    status: reviewed

  # --- Container name (RIG 4.2) ---------------------------------------------
  - id: REQ-CNT-019
    title: Unique container name set as hostname
    statement: >-
      When a container is created, the platform assigns it a well-defined
      container name that is unique within the OEC platform, has at most 63
      characters and follows the host name rules of RFC 1123 (letters, digits
      and hyphens only), and sets the container hostname to this name.
    keyword: MUST
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.2, SF-090]
    quotes:
      - ref: RIG 4.2
        text: Each OI4 Alliance-compliant container shall have a well-defined name for identification.
      - ref: RIG 4.2
        text: To meet these requirements, the container name must be unique within the Open Edge Computing platform, while also not exceeding 63 characters.
      - ref: RIG 4.2
        text: The platform assigns the container name when the container is created and shall make it available to the container by setting the container hostname.
      - ref: RIG 4.2
        text: 'The RFC 1123 rules for assigning a host name must also be followed for container names so that DNS resolution works correctly: letters, digits and hyphens only.'
    verification: [d8]
    inventory: [RIG-4.2-36a1dde9, RIG-4.2-997b0f1d, RIG-4.2-75e6ea8e, RIG-4.2-f4e41f77]
    status: reviewed
    notes: >-
      SF-090 (b), (c) resolved: "unique within the Open Edge Computing
      platform" (before: "globally unique according to the definition of the
      OI4 Alliance") and the platform as addressee. Back to draft in the
      C-030 closure (uniqueness scope changed).

  - id: REQ-CNT-020
    title: Container name with a UUID postfix
    statement: >-
      The container name consists of a self-defined default container name
      of at most 26 characters with a UUID as postfix, separated by a hyphen
      (<DefaultContainerName>-<uuid>), so that several instances never get
      the same name and the name is unique beyond the platform as well.
    keyword: SHOULD
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.2, SF-090]
    quotes:
      - ref: RIG 4.2
        text: Best practice is to use a naming scheme such as <DefaultContainerName>-<uuid>; the UUID also makes the container name unique beyond the platform.
      - ref: RIG 4.2
        text: With a UUID of 36 characters and the separator, the <DefaultContainerName> has at most 26 characters.
      - ref: RIG 4.2
        text: To avoid several instances of a container with the same container name, it is best practice to use a UUID as postfix on top of a self-defined container name such as <DefaultContainerName>-<uuid>.
    verification: [d8]
    inventory: [RIG-4.2-7935e203, RIG-4.2-21db7fba]
    status: reviewed
    notes: >-
      SF-090 (a), (e) resolved: separator "-" instead of "_" (RFC 1123), at
      most 26 characters for the default container name. Back to draft in the
      C-030 closure (separator changed).

  - id: REQ-CNT-021
    title: Application uses its container name
    statement: >-
      A containerized application determines its container name from its
      hostname and uses it as name of its certificate (REQ-CNT-007) and, if
      it uses the Oi4Identifier as Identification Link, as SerialNumber in
      the Oi4Identifier.
    keyword: MUST
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: MUST}
    applies_to: [application]
    refs: [RIG 4.2, MG 4.3.1, RIG 1.3, SF-090]
    quotes:
      - ref: RIG 4.2
        text: 'The application shall determine its container name from its hostname and shall use it as follows:'
      - ref: RIG 4.2
        text: As the name of the certificate of the application (4.1.2 OI4 Certificate Storage)
      - ref: RIG 4.2
        text: As a serial number inside the Oi4Identifier (OEC Messaging Guideline, 4.3 The Oi4Identifier), if the Oi4Identifier is used as Identification Link and thus as AppId (OEC Messaging Guideline, 7.3 AppId Element)
      - ref: MG 4.3.1
        text: When deploying a container which by its nature has no serial number and can be instantiated multiple times, use the container name as SerialNumber as defined in OEC Runtime & Infrastructure Guideline, 4.2 Container Name Conventions.
    verification: [manual, d8]
    inventory: [RIG-4.2-9b5221a1]
    status: reviewed
    notes: >-
      SF-090 (d) resolved: explicit "shall" (before: implicit MUST). The MQTT
      ClientId is no longer part of this requirement: RIG 4.2 now refers to
      the recommendation of MG 6.2.3 (REQ-MQTT-013, SHOULD at all levels).
      Graded by REQ-CMP-029. Back to draft in the C-030 closure (ClientId
      removed, no longer implicit).

  # --- Container image integrity (RIG 4.3) ----------------------------------
  - id: REQ-CNT-022
    title: Digest where an immutable image version is needed
    statement: >-
      Container images are referenced by tag by default. Where a dedicated,
      immutable version of an image is needed (e.g. the same image on several
      edge computers), the image is referenced by its digest (SHA256).
    keyword: SHOULD
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: SHOULD}
    applies_to: [container-image, platform]
    condition: A dedicated, immutable version of the image is needed.
    refs: [RIG 4.3, RIG 3, SF-091]
    quotes:
      - ref: RIG 4.3
        text: Therefore, the usage of tags within the OI4 Alliance is permitted and the default.
      - ref: RIG 4.3
        text: In cases where a dedicated, immutable version of an image is needed, digests can be used. A digest is the unique identifier of an image as a SHA256 hash.
    verification: [manual]
    inventory: [RIG-4.3-b9c787bb, RIG-4.3-37a27c8a, RIG-3-d124e0fb]
    status: reviewed
    notes: >-
      The only RIG 4.3 statement with a keyword is the recommendation (tip
      box); REQ-CMP-030 (L3 Mandatory) therefore grades a recommendation,
      which stays SHOULD at Level 3 (SF-091 (f)).
      Addressed to whoever installs the image (operator, platform) and to the
      provider, who publishes the digests.

  # --- Container networks (RIG 4.4) -----------------------------------------
  - id: REQ-CNT-023
    title: Bridge network preferred
    statement: >-
      A container is attached to a bridge network rather than to the host
      network, unless it needs low-level Ethernet communication.
    keyword: SHOULD
    domain: service-container
    levels: {L1: none, L2: SHOULD, L3: SHOULD}
    applies_to: [container-image, platform]
    refs: [RIG 4.4, SF-091]
    quotes:
      - ref: RIG 4.4
        text: For the use of containers in an OI4 Alliance-compliant Edge Computing environment, the use of bridge network types should be preferred.
      - ref: RIG 4.4
        text: Low level Ethernet communication is possible.
    verification: [d8, manual]
    inventory: [RIG-4.4-fbcccae3]
    status: reviewed
    notes: >-
      The exception for low-level Ethernet (OT connectors) is derived from
      the advantage/disadvantage tables (host network, bridge network).
      REQ-CMP-031 (L3 Mandatory) grades this recommendation, which stays
      SHOULD at Level 3 (SF-091 (f)).

  # --- Secret storage (RIG 4.1.3), added with GL-ADR-022 --------------------
  - id: REQ-CNT-024
    title: One secret storage per container
    statement: >-
      Every container has its own secret storage; the platform does not make
      the secret storage of a container available to another container.
    keyword: MUST NOT
    domain: platform
    applies_to: [platform]
    refs: [RIG 4.1.3, GL-ADR-022]
    quotes:
      - ref: RIG 4.1.3
        text: Every container has its own secret storage.
      - ref: RIG 4.1.3
        text: The platform shall not make the secret storage of a container available to another container.
    verification: [d8, manual]
    inventory: [RIG-4.1.3-c4b8fd9f, RIG-4.1.3-fb9febc6]
    status: reviewed
    notes: >-
      New with GL-ADR-022: the private key is the identity of one application;
      the OI4 certificate storage, which holds only public data, may be shared
      (REQ-CNT-007).

  - id: REQ-CNT-025
    title: Application may use its identity for other purposes
    statement: >-
      Besides the authentication at the Message Bus, an application may use
      its identity (certificate and secrets, REQ-CNT-008/009) for other
      purposes, e.g. for signing messages, for the authentication at other
      systems or as server certificate of a web server (HTTPS) it provides.
    keyword: MAY
    domain: service-container
    levels: {L1: none, L2: MAY, L3: MAY}
    applies_to: [application]
    refs: [RIG 4.1.3, GL-ADR-022]
    quotes:
      - ref: RIG 4.1.3
        text: The application may also use its identity for other purposes, e.g. for signing messages, for the authentication at other systems or as server certificate of a web server (HTTPS) that the application provides.
    verification: [manual]
    inventory: [RIG-4.1.3-71d36c2a]
    status: reviewed
    notes: >-
      New with GL-ADR-022. Which purposes a certificate supports depends on
      its key usage and extended key usage set by the issuer (note in
      RIG 4.1.3, e.g. serverAuth and the host name for a web server); the
      guideline does not require the platform to issue such certificates.
      Levels as the other application uses of the container storages
      (REQ-CNT-009).
