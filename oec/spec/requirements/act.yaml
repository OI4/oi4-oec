  - id: REQ-ACT-022
    title: NewDataSetWriterId response fields DataSetWriterId and Ttl
    statement: >-
      The Payload of a successful NewDataSetWriterId ActionResponse contains
      DataSetWriterId (UInt16, a new, so far unused DataSetWriterId of the
      Responder, i.e. >= 10 per REQ-MSG-020) and Ttl (UInt32, seconds). This
      DataSetWriterId is not the DataSetWriterId of the ActionResponse
      itself, which is always 8.
    keyword: MUST
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [responder]
    condition: The component provides the common service NewDataSetWriterId.
    refs: [MG 8.4.1, MG 9.2.1]
    quotes:
      - ref: MG 8.4.1
        text: The service NewDataSetWriterId requests a new, so far unused, DataSetWriterId from the publisher, which executes this Action.
      - ref: MG 8.4.1
        text: This response field must not be confused with the DataSetWriterId of the ActionResponse itself, which always contains the reserved DataSetWriterId 8 of the Action NewDataSetWriterId.
    verification: [schema, d7-validate, d7-test]
    inventory: [MG-8.4.1-c57f4602, MG-8.4.1-bba9d024, MG-8.4.1-fbc43f91]
    status: reviewed

  - id: REQ-ACT-023
    title: Provided DataSetWriterId is valid for Ttl seconds
    statement: >-
      The DataSetWriterId provided by NewDataSetWriterId can be used for the
      first time only within Ttl seconds after the response; the Responder
      keeps it reserved during this period and accepts its initial use (e.g.
      in a Set) only within it.
    keyword: MUST
    implicit: true
    domain: messaging
    levels: {L1: MUST, L2: MUST, L3: MUST}
    applies_to: [requester, responder]
    condition: The component requests or provides the common service NewDataSetWriterId.
    refs: [MG 8.4.1, SF-035]
    quotes:
      - ref: MG 8.4.1
        text: Ttl contains a value, which describes the time to live of the provided DataSetWriterId in seconds. Initial usage of the provided DataSetWriterId is only possible during this period of time.
    verification: [d7-test]
    status: reviewed
    notes: >-
      Whether the Responder rejects a later initial use is not stated
      explicitly; "only possible" is read as such (implicit, SF-035).
