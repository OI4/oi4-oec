    kind: table-row
    basis: table
    text: Compliance level | Graded scope of requirements within a compliance domain. Level 1 (Minimal), Level 2 (Intermediate) and Level 3 (Full) are distinguished, each including all requirements of the lower levels of the same compliance domain. The levels of the two compliance domains are independent of each other. Level 3 equals full compliance with the respective guideline document (OEC Messaging Guideline or OEC Runtime & Infrastructure Guideline) (see OEC Messaging Guideline, 1.3 Compliance Domains and Levels).
