    text: 'Value Range: `<DeviceHealthEnumeration>`; Type: DeviceHealthEnumeration has TypeOf enumeration. It is defined for OPC UA-JSON as `<name>_<value>` (OPC UA Part 6-5.4.4).; Access: Read only; Requirement: Mandatory'
  - key: MG-8.3.2-b75c4616
