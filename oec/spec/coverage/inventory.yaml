    terms:
      - can
    text: A publisher that has too many `DataSetMessages` for a single `NetworkMessage` can publish part of the `DataSetMessages` and add a `Pagination` object, which tells all subscribers “This message contains 10 out of 100 DataSetMessages - we are on Page 5 now”. The subscriber then knows that five other publications will follow until all related information has been published.
  - key: MG-8.3.11-083cc809
