    text: In combination with the method `Get`, the payload requires an empty `NetworkMessage`. The `NetworkMessage` can alternatively contain `DataSetMessages` for `PaginationRequest` (8.3.11.1 PaginationRequest) and `Locale` (8.3.12 Locale) and, without `Source`, a `DataSetMessage` for `Query` (8.3.13.1 Query of ReferenceDesignation). A `ReferenceDesignation` object is not included. The `Source` can be used to request only the `ReferenceDesignation` objects of a specific asset. Without `Source`, all `ReferenceDesignation` objects will be requested, or with a `Query` only those of the children of the requested asset.
