    text: '`Code`: The numeric status code as defined in OPC UA Part 4-7.38, encoded as JSON number (UInt32). The `Code` is omitted if the numeric code is 0 (Good). Because the `Status` of a `DataSetMessage` is only sent if it is not Good (see note below), the `Code` is always present in this context.'
