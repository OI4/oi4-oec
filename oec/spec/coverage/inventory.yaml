      - MUST
    text: 'Value Range: `<Group object>`; Type: Object of type `Group`; Access: Read/Write; Requirement: Mandatory'
  - key: MG-8.3.3.1-0300b49d
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 17
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - should
    text: The `Group` helps to group configuration elements which should be configured at once, e.g. the group eth0 might contain configuration objects called ip_address, subnet_mask and standard_gateway.
  - key: MG-8.3.3.1-b1e3aee3
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 17
    kind: sentence
    heading: '`<GroupName>`'
    basis: implicit
    terms:
      - cannot
    text: The group name cannot be changed from outside the service specifying it, but the object group has elements which allow read/write access!
  - key: MG-8.3.3.1-ce7454d2
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 20
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: A configuration object can only be added to a `Group`.
  - key: MG-8.3.3.1-a6e70e34
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 20
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - MUST
    terms:
      - mandatory
    text: Therefore at least one `Group` is mandatory, even when it contains only one single configuration object or several objects, which are not tightly coupled.
  - key: MG-8.3.3.1-3252fe76
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 22
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Several `Group` objects can be added to a single `DataSetMessage` of type `Config`.
  - key: MG-8.3.3.1-31537929
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 24
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - best practice
    text: It is best practice to name the `Group` that collects all common configuration objects common.
  - key: MG-8.3.3.1-d95dbf3d
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 24
    kind: sentence
    heading: '`<GroupName>`'
    basis: implicit
    terms:
      - have to
    text: Configuration objects in this group do not necessarily have to be grouped this way, but it is a way to make it clear that these objects belong to the "common settings".
  - key: MG-8.3.3.1-3d906d59
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 27
    kind: sentence
    heading: '`<GroupName>`'
    admonition: note
    basis: implicit
    terms:
      - are allowed
    text: To avoid problems on JSON parsing in different languages, only the characters <a..z>, <A..Z>, <0..9>, <-> and <_> are allowed for the `GroupName`.
  - key: MG-8.3.3.1-13255f8f
    section: MG 8.3.3.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-1-config-pub.md
    line: 27
    kind: sentence
    heading: '`<GroupName>`'
    admonition: note
    basis: implicit
    terms:
      - not allowed
    text: It is not allowed to start the `GroupName` with a number (0..9) or with a minus (-).
  - key: MG-8.3.3.1-c732cae9
