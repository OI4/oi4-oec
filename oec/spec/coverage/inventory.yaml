    file: docs/guideline/appendix-a/a4-glossary.md
    line: 45
    kind: table-row
    basis: implicit
    terms:
      - publishes
    text: 'Term: Responder | Definition: Communication participant which executes an Action and publishes the `ua-action-response` (see Action).'
  - key: MG-A4-143439ae
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 46
    kind: table-row
    basis: table
    text: 'Term: SBOM | Definition: Software Bill of Materials; A machine-readable list of all software components of an application, including their licenses (see OEC Runtime & Infrastructure Guideline, 4.1.4 Application Specific Storages).'
  - key: MG-A4-83c79460
