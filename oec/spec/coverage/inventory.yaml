    text: In combination with the method `Del`, a `ReferenceDesignation` object is not included. The requested information is identified via the `Source` (encoded Identification Link) contained in the topic. The `Del` deletes the complete `ReferenceDesignation` of the asset. A topic with method `Del` must contain `Resource` and `Source` to be valid.
