    text: In combination with the method `Set`, the payload contains a single `DataSetMessages` of type `ReferenceDesignation` (8.3.10 ReferenceDesignation). The `Set` replaces the complete `ReferenceDesignation` of the asset; aspects (`Function`, `Product`, `Location`) which are not contained are removed. A topic with method `Set` must contain `Resource` and `Source` to be valid.
