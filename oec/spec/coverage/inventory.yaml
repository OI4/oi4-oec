    line: 40
    kind: table-row
    basis: table
    text: 'Term: OOC | Definition: Open Operator Cloud platform; The Open Operator Cloud platform is one of the four high level architecture layers of the OI4 Alliance. The Open Operator Cloud platform defines the services and interfaces run on a manufacturer''s IT platform for interaction with the other layers in an Alliance’ compliant system.'
