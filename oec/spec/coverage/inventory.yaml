    line: 46
    kind: sentence
    heading: DataSetWriterName
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: In Open Industry 4.0 Alliance context, the `DataSetWriterName` must always describe the asset providing the information.
  - key: MG-8.2.3-23de9f9f
    section: MG 8.2.3
    file: docs/guideline/8-payload-format/8.2 OPC UA Objects - Defined by OPC Foundation/8-2-3-datasetmessage.md
