      - must
    text: A component that supports the resource `ReferenceDesignation` may support the request of the children of an asset via `Query` at Level 1 and 2 and must support it at Level 3 (8.3.13.1 Query of ReferenceDesignation).
  - key: MG-1.3-257ae111
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
    line: 73
    kind: list-item
    heading: Directly Connected and Represented Entities
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: 'Directly connected: The entity is connected to the Message Bus with its own MQTT client, e.g. an application or a smart device. It must fulfill the requirements of the compliance level of the OEC Messaging Compliance it claims itself.'
  - key: MG-1.3-bf3a41de
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
    line: 74
    kind: list-item
    heading: Directly Connected and Represented Entities
    basis: implicit
    terms:
      - publishes
      - answers
    text: 'Represented: The entity has no MQTT client of its own, e.g. a field device connected via a fieldbus, and is represented on the Message Bus by an application, e.g. a connector or gateway application. The representing application publishes and answers on behalf of the represented entity. The topic elements `Namespace`, `ServiceType` and `AppId` are those of the representing application, the topic element `Source` identifies the represented entity (7.6 Source Element).'
  - key: MG-1.3-b6aedd9a
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
    line: 76
    kind: sentence
    heading: Directly Connected and Represented Entities
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: An application that provides information for individual represented entities must fulfill the requirements of its compliance level for each of these entities, i.e. the resources and methods it offers for a represented entity must match its own compliance level.
  - key: MG-1.3-c42cc91d
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
    line: 76
    kind: sentence
    heading: Directly Connected and Represented Entities
    basis: keyword
    keywords:
      - MUST
      - none
    terms:
      - must
      - not required
    text: The representing application must provide the resources `PublicationList` and `SubscriptionList` and the common services once for itself; they are not required per represented entity.
  - key: MG-1.3-193fdc81
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
