  - key: MG-8.2.20-b300beac
    section: MG 8.2.20
    file: docs/guideline/8-payload-format/8.2 OPC UA Objects - Defined by OPC Foundation/8-2-20-actionstate.md
    line: 20
    kind: list-item
    basis: implicit
    terms:
      - publishes
    text: The Requestor publishes a `ua-action-request` with `ActionState` 1 (`Executing`) to the `Call` topic of the Responder (7.1.4 Method Element).
  - key: MG-8.2.20-538935de
    section: MG 8.2.20
    file: docs/guideline/8-payload-format/8.2 OPC UA Objects - Defined by OPC Foundation/8-2-20-actionstate.md
    line: 21
    kind: list-item
    basis: implicit
    terms:
      - publishes
      - reply
    text: Optionally, the Responder publishes one or more `ua-action-response` messages with `ActionState` 1 (`Executing`) to the `ResponseAddress` (`Reply` topic) to indicate the progress.
  - key: MG-8.2.20-001fd6fb
    section: MG 8.2.20
    file: docs/guideline/8-payload-format/8.2 OPC UA Objects - Defined by OPC Foundation/8-2-20-actionstate.md
    line: 22
    kind: list-item
    basis: implicit
    terms:
      - publishes
    text: The Responder publishes a `ua-action-response` with `ActionState` 2 (`Done`), the `Status` and the `Payload` with the result to the `ResponseAddress`.
  - key: MG-8.2.20-a3eab17f
    section: MG 8.2.20
