    text: Level 1 (Minimal) offers the lowest entry barrier into Open Edge Computing, e.g. for smart devices and lightweight services. In the OEC Messaging Compliance, a Level 1 component is interoperable regarding topic structure and payload format and provides the minimum mandatory information flows (`MAM` and `Health`).
