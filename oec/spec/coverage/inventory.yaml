    line: 42
    kind: table-row
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: 'Term: Open Edge Connectivity | Definition: The Open Edge Connectivity layer is one of the four high level architecture layers of the OI4 Alliance Reference Architecture. Open Edge Connectivity mainly provides network bridges from non-Ethernet-based communication to Ethernet-based communication, which can then be further processed by an Open Edge Computing layer (see OEC).'
  - key: MG-A4-2de359c7
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 43
    kind: table-row
    basis: table
    text: 'Term: Process Values | Definition: In context of the OI4 Alliance, a DataSetMessage called “Process Values” (Oi4Pv, see 8.3.4 Data) is available. In contrast to Primary Value, known from Process Industry, the Process Values might have a more complex structure, containing several data combined in a DataSetMessage.'
  - key: MG-A4-d0039be7
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 44
    kind: table-row
    basis: table
    text: 'Term: Requestor | Definition: Communication participant which requests the execution of an Action by publishing a `ua-action-request` (see Action).'
  - key: MG-A4-3ac7320a
