    line: 10
    kind: sentence
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Besides the most severe status of the asset, `Details` allows providing several concurrent statuses including further diagnostic information, which can be retrieved at any time via `Get/Health`.
  - key: MG-8.3.2-4017a916
