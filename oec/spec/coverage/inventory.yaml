    section: MG 9.1
    file: docs/guideline/9-message-bus-communication/9.1 Resources/index.md
    line: 47
    kind: list-item
    heading: Resources Without Content
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: 'A `Get` of a resource, for which the entity has no content, must be answered with an empty list: the `NetworkMessage` published on the related `Pub` topic contains no `DataSetMessage` of the resource (`"Messages": []`, see 8.2.1 NetworkMessage). This also applies to a `Get` whose `Filter` matches no content of a `Source` the entity provides.'
  - key: MG-9.1-2e6777c7
    section: MG 9.1
    file: docs/guideline/9-message-bus-communication/9.1 Resources/index.md
    line: 48
    kind: list-item
    heading: Resources Without Content
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - should
    text: A `Get` whose `Source` addresses an asset that the entity neither is nor represents is not answered on the related `Pub` topic. The entity should answer such a `Get` with an `Event` of the category `Status` and the level `Bad` (`BadNotFound`, see 8.3.6.1 Status). Because the entity does not represent the addressed asset, this `Event` is published with the `Source` of the entity itself (`AppId`); the requester finds it through the `ReplyTo`. The same applies to the status `Event` of a `Set` or `Del` whose `Source` addresses such an asset.
  - key: MG-9.1-6757358a
    section: MG 9.1
    file: docs/guideline/9-message-bus-communication/9.1 Resources/index.md
    line: 49
    kind: list-item
    heading: Resources Without Content
    basis: keyword
    keywords:
      - MUST NOT
    terms:
      - must not
    text: As long as the entity has no content for a resource, it must not publish the resource on its own (without a `Get`).
  - key: MG-9.1-ebe69434
    section: MG 9.1
    file: docs/guideline/9-message-bus-communication/9.1 Resources/index.md
    line: 50
    kind: list-item
    heading: Resources Without Content
    basis: keyword
    keywords:
      - MUST
      - SHOULD
    terms:
      - must
      - should
    text: From Level 2 on, a `Set` or `Del` addressing an object, which the entity does not have or does not offer for modification, must be answered with an `Event` of the category `Status` and the level `Bad` (e.g. `BadNotFound` or `BadNotWritable`, see 8.3.6.1 Status). At Level 1, it should be answered this way.
  - key: MG-9.1-379b5763
    section: MG 9.1
    file: docs/guideline/9-message-bus-communication/9.1 Resources/index.md
    line: 51
    kind: list-item
    heading: Resources Without Content
    basis: keyword
    keywords:
      - MAY
    terms:
      - may
    text: 'A `Get` of `Metadata` for a `Source` and `Filter`, for which the entity provides no `Data`, is not answered with `Metadata`: `Metadata` only exists for `Data` the entity provides (9.1.5 Metadata). The entity may answer such a `Get` with an `Event` of the category `Status` and the level `Bad` (`BadNotFound`). A requester therefore requests `Metadata` only for `Data` announced in the `PublicationList` of the entity, and the absence of an answer to other `Metadata` requests is conformant.'
