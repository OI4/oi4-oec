    text: Level 3 (Full) is designed for full interoperability. It requires the complete implementation of the respective guideline (OEC Messaging Guideline for the OEC Messaging Compliance, OEC Runtime & Infrastructure Guideline for the OEC Service Container Compliance). Level 3 is identical to the full Open Industry 4.0 Alliance compliance as defined by former versions of the OEC Development Guideline.
