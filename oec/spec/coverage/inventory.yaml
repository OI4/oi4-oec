    kind: sentence
    admonition: note
    basis: keyword
    keywords:
      - MUST NOT
    terms:
      - must not
    text: If a request cannot be decoded or addressed (e.g. unknown `DataSetWriterId` or `ActionTargetId`), or is rejected for security reasons, the Responder must not send a response (Part 14-6.2.11.2).
  - key: MG-8.3.2-9b7b79a1
    section: MG 8.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-2-health.md
    line: 10
    kind: sentence
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Besides the status of the asset with the highest priority, `Details` allows providing several concurrent statuses including further diagnostic information, which can be retrieved at any time via `Get/Health`.
  - key: MG-8.3.2-4017a916
