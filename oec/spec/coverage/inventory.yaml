    keywords:
      - MAY
    text: 'Value Range: `<Byte>`; Type: Byte in a range of 0..100 %; Access: Read only; Requirement: Optional'
  - key: MG-8.3.2-9ffc3c06
    section: MG 8.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-2-health.md
    line: 53
    kind: sentence
    heading: HealthScore
    admonition: note
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Depending on an asset, its implementation, used technology/protocol/etc. and the use case it is made for, a `HealthScore` of 30 % can coexist with a `Health` of `NORMAL_0`, e.g. when a yearly service has to be done in short term.
  - key: MG-8.3.2-d2f6bc0e
