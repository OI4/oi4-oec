  - key: MG-8.2.3-1f34caa9
    section: MG 8.2.3
    file: docs/guideline/8-payload-format/8.2 OPC UA Objects - Defined by OPC Foundation/8-2-3-datasetmessage.md
    line: 67
    kind: sentence
    heading: WriterGroupName
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: For the resources `PublicationList` and `SubscriptionList`, the `WriterGroupName` of each `DataSetMessage` must be `<ResourceType>[/<Tag>]`, i.e. the `Filter` which addresses this entry in the topic (7.7 Filter Element), e.g. `Data/oee`, `Event/Syslog/Notice` or `MAM`.
  - key: MG-8.2.3-f4f917b9
    section: MG 8.2.3
    file: docs/guideline/8-payload-format/8.2 OPC UA Objects - Defined by OPC Foundation/8-2-3-datasetmessage.md
    line: 67
    kind: sentence
    heading: WriterGroupName
    basis: implicit
    terms:
      - published
    text: This also applies, if the entry is published on a topic without `Filter` (e.g. `Pub/PublicationList`).
  - key: MG-8.2.3-ccd2bdd2
