    terms:
      - must
    text: From Level 2 on, the resources `MAM` and `Health` must additionally be available on request via the method `Get`.
  - key: MG-1.3-78fd4a47
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
    line: 64
    kind: list-item
    heading: Compliance Levels / OEC Messaging Compliance
    basis: keyword
    keywords:
      - MUST
      - none
    terms:
      - must
      - not required
    text: From Level 2 on, the methods `Set` and `Del` must be supported for every resource that the component offers for modification by other participants on the Message Bus, such as `Config` ("where applicable"). They are not required for other resources at Level 2. At Level 3, `Set` and `Del` must be supported for all resources for which they are defined (9.1 Resources).
  - key: MG-1.3-0c7db418
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
