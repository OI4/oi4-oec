    basis: implicit
    terms:
      - cannot
      - rejected
      - sent
    text: If a request cannot be decoded or addressed (e.g. unknown `DataSetWriterId` or `ActionTargetId`), or is rejected for security reasons, no response is sent (Part 14-6.2.11.2).
  - key: MG-8.3.2-2d1ee307
