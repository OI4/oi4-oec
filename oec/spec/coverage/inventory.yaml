    kind: sentence
    heading: Health
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - best practice
    text: The best practice is to combine the five states `NORMAL_0`, `FAILURE_1`, `CHECK_FUNCTION_2`, `OFF_SPEC_3` and `MAINTENANCE_REQUIRED_4` with the symbol/color definitions made by NAMUR NE107 (Table 3).
  - key: MG-8.3.2-8f5d5ddc
