    file: docs/guideline/appendix-a/a4-glossary.md
    line: 47
    kind: table-row
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: 'Term: smart device | Definition: A resource-constrained device that is connected directly to the Message Bus with its own MQTT client. A smart device that is not deployed as a container can only fulfill the OEC Messaging Compliance, at any of its levels (see 1.3 Compliance Domains and Levels).'
