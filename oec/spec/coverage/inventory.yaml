    text: 'ManufacturerUri: *Upper cases in ManufacturerUri are prohibited by IEC 61406-1 (formerly DIN SPEC 91406). This rule is covered in chapter 4.3 The Oi4Identifier! When the `Oi4Identifier` is generated, a `ManufacturerUri` given with upper-case characters is converted to lower case. All Oi4Identifier are validated with the external DIN SPEC 91406 validator.'
  - key: MG-A4-2bbe604d
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 12
    kind: table-row
    basis: table
    text: 'Term: AAS | Definition: Asset Administration Shell; The Asset Administration Shell is a concept developed by Plattform Industrie 4.0. It aims at standardizing a reference to assets in manufacturing plants. The Master Asset Model in the context of the OI4 Alliance is closely related to the AAS identification submodel.'
  - key: MG-A4-e7c5820f
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 13
    kind: table-row
    basis: implicit
    terms:
      - reply
      - publishes
      - answers
    text: 'Term: Action | Definition: OPC UA PubSub mechanism for the call/reply pattern, defined in OPC UA Part 14 V1.05. A Requestor publishes a `ua-action-request`, the Responder executes the Action and answers with a `ua-action-response`. In the context of the OI4 Alliance, Actions are used with the methods `Call` and `Reply` (see 8.1.3 Overview of the OPC UA Conforming MessageTypes ua-action-request and ua-action-response).'
  - key: MG-A4-2fe4593b
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 14
    kind: table-row
    basis: table
    text: 'Term: Asset | Definition: An asset is an identifiable and relevant entity within the system. It might be a whole machine, a single physical component or a software/application. In the context of the OI4 Alliance, each asset has its own Identification Link and a MAM.'
  - key: MG-A4-9c48a14e
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 15
    kind: table-row
    basis: table
    text: 'Term: base64url | Definition: Base64 encoding with URL and filename safe alphabet according to RFC 4648. It is used to encode Identification Links in topics (see 4.2 Encoding of the Identification Link in Topics).'
  - key: MG-A4-f415c84f
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 16
    kind: table-row
    basis: table
    text: 'Term: Birth message | Definition: A specific MQTT message type, used in the lifecycle of an MQTT client (see section 6.3.3 Birth Message for details).'
  - key: MG-A4-b89658f5
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 17
    kind: table-row
    basis: table
    text: 'Term: CCC | Definition: Common Cloud Central; The Common Cloud Central layer is one of the four high level architecture layers of the OI4 Alliance.'
  - key: MG-A4-479f77ec
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 18
    kind: table-row
    basis: table
    text: 'Term: Close message | Definition: A specific MQTT message type, used in the lifecycle of an MQTT client (see section 6.3.4 Close Message for details).'
  - key: MG-A4-216e83d4
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 19
    kind: table-row
    basis: table
    text: 'Term: Compliance level | Definition: Graded scope of requirements within a compliance domain. Level 1 (Minimal), Level 2 (Intermediate) and Level 3 (Full) are distinguished, each including all requirements of the lower levels of the same compliance domain. The levels of the two compliance domains are independent of each other. Level 3 equals full compliance with the respective guideline document (OEC Messaging Guideline or OEC Runtime & Infrastructure Guideline) (see 1.3 Compliance Domains and Levels).'
  - key: MG-A4-89036fcd
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 20
    kind: table-row
    basis: table
    text: 'Term: CycloneDX | Definition: An OWASP standard for Software Bill of Materials, standardized as ECMA-424.'
  - key: MG-A4-06a4e176
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 21
    kind: table-row
    basis: table
    text: 'Term: DIN SPEC 27070 | Definition: A German standard for requirements and reference architecture of a security gateway for the exchange of industry data and services.'
  - key: MG-A4-368904e1
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 22
    kind: table-row
    basis: table
    text: 'Term: DIN SPEC 91406 | Definition: Predecessor of IEC 61406-1. A German standard for automatic identification of physical objects and information on physical objects in IT systems, particularly IoT systems (see A3 The dnp-Encoding for details).'
  - key: MG-A4-bd19daa1
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 23
    kind: table-row
    basis: table
    text: 'Term: dnp-encoding | Definition: An url-encoding like mechanism to mask characters that are not permitted in an Identification Link according to IEC 61406-1. Used for the elements of the `Oi4Identifier` if they contain such characters (see A3).'
  - key: MG-A4-9cf63391
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 24
    kind: table-row
    basis: table
    text: 'Term: edge computer | Definition: An edge computer that fulfills the functional criteria described in this guideline. It is located in the OEC layer. It is alternatively referred to as an "edge device" or "edge gateway". To maintain consistency and prevent potential confusion, this guideline exclusively employs the term "edge computer".'
  - key: MG-A4-014c8d19
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 25
    kind: table-row
    basis: table
    text: 'Term: field device | Definition: An automation component with connectivity towards the edge layer.'
  - key: MG-A4-0d044ca6
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 26
    kind: table-row
    basis: table
    text: 'Term: IEC 61406-1 | Definition: An international standard on "Identification Link - Part 1: General requirements". It defines the Identification Link and is the successor of DIN SPEC 91406.'
  - key: MG-A4-258fb542
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 27
    kind: table-row
    basis: table
    text: 'Term: IEC 62443 | Definition: An international series of standards on "Industrial communication networks - IT security for networks and systems". The standard is divided into different sections and describes both technical and processor-related aspects of industrial cyber security.'
  - key: MG-A4-d277b0a7
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 28
    kind: table-row
    basis: table
    text: 'Term: IEC 81346 | Definition: An international series of standards on "Industrial systems, installations and equipment and industrial products – structuring principles and reference designations" defines the rules for reference designation systems (RDS).'
  - key: MG-A4-9cc94b25
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 29
    kind: table-row
    basis: table
    text: 'Term: Identification Link | Definition: Globally unique, URL-based identifier of an asset according to IEC 61406-1 (IL). Every asset on the Message Bus is identified by an Identification Link (see chapter 4 The Identification Link for details).'
  - key: MG-A4-c78841fd
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 30
    kind: table-row
    basis: table
    text: 'Term: MAM | Definition: Master Asset Model; The Master Asset Model is a basic concept of the OI4 Alliance that provides a critical subset of information about an asset that interacts in an OI4 Alliance’ context. It is closely modeled after the device information defined in OPC UA Part 100 and is described in detail in chapter 5 The Master Asset Model.'
  - key: MG-A4-b353a959
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 31
    kind: table-row
    basis: table
    text: 'Term: NE107 | Definition: NAMUR standard for Self-Monitoring and Diagnosis of Field Devices'
  - key: MG-A4-52e8e113
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 32
    kind: table-row
    basis: table
    text: 'Term: OCI | Definition: Open Container Initiative; Defines open industry standards for container image formats, runtimes and distribution (opencontainers.org). Deploying an application as OCI-compliant container is part of the OEC Service Container Compliance.'
  - key: MG-A4-02ba5405
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 33
    kind: table-row
    basis: table
    text: 'Term: OEC | Definition: Open Edge Computing; The Open Edge Computing layer is one of the four high level architecture layers of the OI4 Alliance. Open Edge Computing mainly deals with the containerized software environment that OI4 Alliance’ compliant edge computers run.'
  - key: MG-A4-be0662c2
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 34
    kind: table-row
    basis: table
    text: 'Term: OEC Messaging Compliance | Definition: Compliance domain covering the communication via the Message Bus: MQTT connectivity and security, topic structure, payload format and Message Bus behavior. It applies to smart devices, applications and any other component connected to the Message Bus (see 1.3 Compliance Domains and Levels).'
  - key: MG-A4-6742f6d3
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 35
    kind: table-row
    basis: table
    text: 'Term: OEC Messaging Guideline | Definition: Part of the OEC guideline of the OI4 Alliance (this document) that defines the communication model and the behavior on the Message Bus (see 1.1 Scope).'
  - key: MG-A4-4e9fcd9b
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 36
    kind: table-row
    basis: keyword
    keywords:
      - MUST
    terms:
      - mandatory
    text: 'Term: OEC Registry | Definition: Mandatory functionality within an Open Industry 4.0 Alliance Open Edge Computing platform that collects information about connected devices, installed applications and dedicated services provided by them. The OEC Registry offers information which it gains by listening to the Message Bus.'
  - key: MG-A4-543f46a4
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 37
    kind: table-row
    basis: table
    text: 'Term: OEC Runtime & Infrastructure Guideline | Definition: Part of the OEC guideline of the OI4 Alliance that defines the requirements on the container environment and the Open Edge Computing platform (see 1.1 Scope and OEC Runtime & Infrastructure Guideline).'
  - key: MG-A4-265097ff
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 38
    kind: table-row
    basis: table
    text: 'Term: OEC Service Container Compliance | Definition: Compliance domain covering the runtime requirements of containerized applications: OCI-compliant container packaging, license handling and the container environment (see 1.3 Compliance Domains and Levels and OEC Runtime & Infrastructure Guideline, 1.3 OEC Service Container Compliance).'
  - key: MG-A4-eeb2fa75
    section: MG A4
    file: docs/guideline/appendix-a/a4-glossary.md
    line: 39
    kind: table-row
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - recommended
      - best practice
    text: 'Term: Oi4Identifier | Definition: One possible implementation of an Identification Link according to IEC 61406-1, generated from the nameplate information of an asset. It is the recommended best practice for assets that do not provide an Identification Link (see chapter 4.3 The Oi4Identifier for details).'
  - key: MG-A4-aebf57d2
    section: MG A4
