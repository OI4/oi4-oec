  - key: MG-8.3.3.2-506e3d6e
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 10
    kind: sentence
    basis: keyword
    keywords:
      - MUST
    terms:
      - mandatory
    text: 'A `Set` of `Config` is a partial update: the `Payload` contains at least one `Group` object with at least one `Config` object, and every mandatory `Config` object (see `Mandatory`) of each contained `Group` object.'
  - key: MG-8.3.3.2-76395973
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 10
    kind: sentence
    basis: keyword
    keywords:
      - MAY
    terms:
      - may
    text: Besides the `Value`, a `Config` object may repeat the read-only properties received through `Pub/Config` unchanged.
  - key: MG-8.3.3.2-5b17fa49
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 10
    kind: sentence
    basis: keyword
    keywords:
      - MUST
    terms:
      - mandatory
    text: 'The receiving application applies a `Set` completely or not at all: if the `Set` contains an unknown `Group` or `Config` object, changes a read-only property, lacks a mandatory `Config` object of a contained `Group` object or carries a `Value` which does not match its `Type` or `Validation`, the `Set` is rejected with a status `Event` with the `StatusCode` `Bad` (9.1.3 Config).'
  - key: MG-8.3.3.2-92c9fd11
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 18
    kind: field
    heading: '`<GroupName>`'
    basis: field
    keywords:
      - MUST
    text: 'Value Range: `<Group object>`; Type: Object of type `Group`; Access: Read/Write; Requirement: Mandatory'
  - key: MG-8.3.3.2-08b07130
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 26
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - should
    text: The `Group` helps to group configuration elements which should be configured at once, e.g. the group eth0 might contain configuration objects called ip_address, subnet_mask and standard_gateway.
  - key: MG-8.3.3.2-5920d940
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 26
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - MUST NOT
    terms:
      - must not
    text: The group name must not be changed from outside the service specifying it, but the object group has elements which allow read/write access!
  - key: MG-8.3.3.2-44186564
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 29
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: A configuration object can only be added to a `Group`.
  - key: MG-8.3.3.2-d295d815
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 29
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - MUST
    terms:
      - mandatory
    text: Therefore at least one `Group` is mandatory, even when it contains only one single configuration object or several objects, which are not tightly coupled.
  - key: MG-8.3.3.2-cc495a35
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
    line: 31
    kind: sentence
    heading: '`<GroupName>`'
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Several `Group` objects can be added to a single `DataSetMessage` of type `Config`.
  - key: MG-8.3.3.2-6a638141
    section: MG 8.3.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.3 Config/8-3-3-2-config-set.md
