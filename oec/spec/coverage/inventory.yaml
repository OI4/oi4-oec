      - should
      - shall
    text: '`Symbol`: The symbolic name of the status code (e.g. `"BadInvalidArgument"` for `0x80AB0000`), encoded as JSON string. The `Symbol` is optional, but should be provided. Receivers shall only evaluate the `Code`.'
  - key: MG-8.2.3-101d62fb
