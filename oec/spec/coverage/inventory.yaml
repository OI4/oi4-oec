    text: 'Value Range: `<PrecisionObject>`; Type: Object; Access: Read/Write; Requirement: Optional (all `Precisions` = `0` (publish on change) if not present)'
  - key: MG-8.3.8-ac7f1fff
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 244
    kind: sentence
    heading: Precisions
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - should
    text: Each entry of the `Precisions` object defines the minimum deviation (+/-), a specific value of a given `DataSet` should have, before it gets published again.
  - key: MG-8.3.8-42cb238d
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 244
    kind: sentence
    heading: Precisions
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - should
    text: This is useful for floating analog values, e.g., when only value changes >= 0.2 digits should be published. 0 means publish every value change - `Precisions` is switched off. > 0.0 means publish again only when the set delta occurs.
  - key: MG-8.3.8-5afb0ffd
