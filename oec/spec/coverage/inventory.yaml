  - key: RIG-A1-3710fa76
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 14
    kind: table-row
    basis: table
    text: 'Term: Compliance level | Definition: Graded scope of requirements within a compliance domain. Level 1 (Minimal), Level 2 (Intermediate) and Level 3 (Full) are distinguished, each including all requirements of the lower levels of the same compliance domain. The levels of the two compliance domains are independent of each other. Level 3 equals full compliance with the respective guideline document (OEC Messaging Guideline or OEC Runtime & Infrastructure Guideline) (see OEC Messaging Guideline, 1.3 Compliance Domains and Levels).'
  - key: RIG-A1-c3ad00af
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 15
    kind: table-row
    basis: table
    text: 'Term: CycloneDX | Definition: An OWASP standard for Software Bill of Materials, standardized as ECMA-424.'
  - key: RIG-A1-ac66ce86
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 16
    kind: table-row
    basis: table
    text: 'Term: DIN SPEC 27070 | Definition: A German standard for requirements and reference architecture of a security gateway for the exchange of industry data and services.'
  - key: RIG-A1-12dcc353
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 17
    kind: table-row
    basis: table
    text: 'Term: edge computer | Definition: An edge computer that fulfills the functional criteria described in the OEC guideline. It is located in the OEC layer. It is alternatively referred to as an "edge device" or "edge gateway". To maintain consistency and prevent potential confusion, the OEC guideline exclusively employs the term "edge computer".'
  - key: RIG-A1-67536da2
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 18
    kind: table-row
    basis: table
    text: 'Term: IEC 62443 | Definition: An international series of standards on "Industrial communication networks - IT security for networks and systems". The standard is divided into different sections and describes both technical and processor-related aspects of industrial cyber security.'
  - key: RIG-A1-c7f0c67b
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 19
    kind: table-row
    basis: table
    text: 'Term: Identification Link | Definition: Globally unique, URL-based identifier of an asset according to IEC 61406-1 (IL). Every asset on the Message Bus is identified by an Identification Link (see OEC Messaging Guideline, 4 The Identification Link for details).'
  - key: RIG-A1-eb7bb366
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 20
    kind: table-row
    basis: table
    text: 'Term: OCI | Definition: Open Container Initiative; Defines open industry standards for container image formats, runtimes and distribution (opencontainers.org). Deploying an application as OCI-compliant container is part of the OEC Service Container Compliance.'
  - key: RIG-A1-3d5a5f4e
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 21
    kind: table-row
    basis: table
    text: 'Term: OEC | Definition: Open Edge Computing; The Open Edge Computing layer is one of the four high level architecture layers of the OI4 Alliance. Open Edge Computing mainly deals with the containerized software environment that OI4 Alliance’ compliant edge computers run.'
  - key: RIG-A1-aedec112
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 22
    kind: table-row
    basis: table
    text: 'Term: OEC Messaging Compliance | Definition: Compliance domain covering the communication via the Message Bus: MQTT connectivity and security, topic structure, payload format and Message Bus behavior. It applies to smart devices, applications and any other component connected to the Message Bus (see OEC Messaging Guideline, 1.3 Compliance Domains and Levels).'
  - key: RIG-A1-1f76c07b
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 23
    kind: table-row
    basis: table
    text: 'Term: OEC Messaging Guideline | Definition: Part of the OEC guideline of the OI4 Alliance that defines the communication model and the behavior on the Message Bus (see 1.1 Scope and OEC Messaging Guideline).'
  - key: RIG-A1-515789f3
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 24
    kind: table-row
    basis: keyword
    keywords:
      - MUST
    terms:
      - mandatory
    text: 'Term: OEC Registry | Definition: Mandatory functionality within an Open Industry 4.0 Alliance Open Edge Computing platform that collects information about connected devices, installed applications and dedicated services provided by them. The OEC Registry offers information which it gains by listening to the Message Bus.'
  - key: RIG-A1-fd8ff259
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 25
    kind: table-row
    basis: table
    text: 'Term: OEC Runtime & Infrastructure Guideline | Definition: Part of the OEC guideline of the OI4 Alliance (this document) that defines the requirements on the container environment and the Open Edge Computing platform (see 1.1 Scope).'
  - key: RIG-A1-ce23a12e
    section: RIG A1
    file: docs/infrastructure-guideline/appendix-a/a1-glossary.md
    line: 26
