    text: 'Value Range: `<<EnumName>_<EnumValue>>`; Type: Enumeration (It is defined for OPC UA-JSON as `<name>_<value>` (OPC UA Part 6-5.4.4)).; Access: Read/Write; Requirement: Optional (`Mode` = `ON_REQUEST_1` if not present)'
  - key: MG-8.3.8-1ac7726d
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 110
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY
      - SHOULD
    terms:
      - may
      - should
    text: A `DataSetMessage` may be available in an application/device, but the way it should be published may differ depending on the use case.
  - key: MG-8.3.8-b1593845
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 114
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MUST NOT
    terms:
      - must not
    text: With `OFF_0` the `DataSetMessage` must not be accessible via the Message Bus and must not be published at all.
  - key: MG-8.3.8-8015bc38
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 114
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: This mode can be used when a `DataSetMessage` is not relevant for the driven use cases.
  - key: MG-8.3.8-d3bb12e3
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 118
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: With `ON_REQUEST_1` the `DataSetMessage` can be requested via the Message Bus with `Oi4v2/<ServiceType>/<AppId>/Get/<Resource>[/<Source>[/<Filter>]]`.
  - key: MG-8.3.8-e6a91522
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 118
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MUST NOT
    terms:
      - must not
    text: The `DataSetMessage` must not be published in any way other than by a request.
  - key: MG-8.3.8-46a3d0cc
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 118
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY
    terms:
      - may
    text: This mode may be used when a `DataSetMessage` is not relevant to the driven use case, but may be of interest to acyclic requests.
  - key: MG-8.3.8-92e1afeb
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 124
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: With `APPLICATION_2` the `DataSetMessage` must be published with other `DataSetMessages` of the same resource (7.5 Resource Element) and same application (7.3 AppId Element).
  - key: MG-8.3.8-570d2e69
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 124
    kind: sentence
    heading: Mode
    basis: implicit
    terms:
      - published
    text: For example, all `DataSetMessages` for the resource `MAM` known by an application are published together in a single `NetworkMessage` via `Oi4v2/<ServiceType>/<AppId>/Pub/MAM`.
  - key: MG-8.3.8-13308f1d
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 124
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Additionally, the single `DataSetMessage` can be requested via the Message Bus.
  - key: MG-8.3.8-59e01efb
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 130
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: With `SOURCE_3` the `DataSetMessage` must be published with other `DataSetMessages` of the same resource (7.5 Resource Element), same source (7.6 Source Element) and same application (7.3 AppId Element).
  - key: MG-8.3.8-26ac5f28
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 130
    kind: sentence
    heading: Mode
    basis: implicit
    terms:
      - published
    text: For example, all `DataSetMessages` for the resource `Data` known by a particular asset are published together in a single `NetworkMessage` via `Oi4v2/<ServiceType>/<AppId>/Pub/Data/<Source>`.
  - key: MG-8.3.8-bc2a71a3
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 130
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Additionally, the single `DataSetMessage` can be requested via the Message Bus.
  - key: MG-8.3.8-4833ce71
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 136
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: With `FILTER_4` the `DataSetMessage` must be published separately in an own `NetworkMessage`.
  - key: MG-8.3.8-6945d194
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 136
    kind: sentence
    heading: Mode
    basis: implicit
    terms:
      - published
    text: For example, a `DataSetMessages` named "temperature" for the resource `Data`, belonging to a particular asset, is published to a `NetworkMessage` via `Oi4v2/<ServiceType>/<AppId>/Pub/Data/<Source>/temperature`.
  - key: MG-8.3.8-4be48d44
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 136
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Additionally, the single `DataSetMessage` can be requested via the Message Bus.
  - key: MG-8.3.8-dd632f21
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 184
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: For resources that can be requested with `Get` (9.1 Resources), the `DataSetMessage` can be requested with `Get` with every `Mode` except `OFF_0`.
  - key: MG-8.3.8-b1ebc429
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 184
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - should
    text: For these resources, the values combining `ON_REQUEST_1` with publishing modes are equivalent to the publishing modes alone; publishers should use the combined values to make the availability on request explicit.
  - key: MG-8.3.8-2e85e573
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 190
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: 'The `Mode` of an entry must enable only publication forms that exist for its resource (9.1 Resources):'
  - key: MG-8.3.8-0708060d
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 192
    kind: list-item
    heading: Mode
    basis: keyword
    keywords:
      - MUST
      - MAY?
    terms:
      - must
      - can
    text: An entry of the resource `Event` must have the `Mode` `OFF_0` or `FILTER_4`, because an `Event` is published only with `Source` and `Filter` and can not be requested.
  - key: MG-8.3.8-f8e8a679
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 193
    kind: list-item
    heading: Mode
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: An entry of the resource `Metadata` must have the `Mode` `ON_REQUEST_FILTER_9` (see note above).
  - key: MG-8.3.8-11e1835d
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 194
    kind: list-item
    heading: Mode
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: An entry of the resources `MAM` and `Health` must have a `Mode` that enables `APPLICATION_2`, `SOURCE_3` or `FILTER_4`, because these resources must be published without request.
  - key: MG-8.3.8-8ae37b21
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 197
    kind: sentence
    heading: Mode
    admonition: note
    basis: implicit
    terms:
      - publishes
    text: For resources without `Filter` (e.g. `MAM`, `Health`), `FILTER_4` publishes the single `DataSetMessage` of the `Source` in its own `NetworkMessage` via `Oi4v2/<ServiceType>/<AppId>/Pub/<Resource>/<Source>` and therefore has the same effect as `SOURCE_3`.
  - key: MG-8.3.8-6ca0c9bc
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 208
    kind: field
    heading: Interval
    basis: field
    keywords:
      - MAY
    text: 'Value Range: `0…<n>`; Type: UInt32; Access: Read/Write; Requirement: Optional (`Interval` = 0 if not present)'
  - key: MG-8.3.8-26f5e655
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 216
    kind: sentence
    heading: Interval
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: By default, any `DataSet` must be published on change => interval = 0.
  - key: MG-8.3.8-320c9e9a
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 216
    kind: sentence
    heading: Interval
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: If set to > 0 ms it must be published after the interval has expired, regardless of whether a change in value has occurred in the meantime.
  - key: MG-8.3.8-fe56725e
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 221
    kind: sentence
    heading: Interval
    admonition: note
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: In combination with `Precisions` is unequal to 0 and `Interval` > 0 ms, the value must be published when `Interval` has expired - regardless if minimum deviation has reached.
  - key: MG-8.3.8-45fd34bf
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 221
    kind: sentence
    heading: Interval
    admonition: note
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: Therefore `Precisions` must be ignored, when `Interval` > 0 ms.
  - key: MG-8.3.8-1f4ea694
