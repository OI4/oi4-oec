    basis: field
    keywords:
      - MAY
    text: 'Value Range: `<<EnumName>_<EnumValue>>`; Type: Enumeration (It is defined for OPC UA-JSON as `<name>_<value>` (OPC UA Part 6-5.4.4)).; Access: Read/Write; Requirement: Optional (`Mode` = `ON_REQUEST_1` if not present)'
  - key: MG-8.3.8-1ac7726d
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 68
    kind: sentence
    heading: Mode
    basis: keyword
    keywords:
      - MAY
      - SHOULD
    terms:
      - may
      - should
    text: A `DataSetMessage` may be available in an application/device, but the way it should be published may differ depending on the use case.
  - key: MG-8.3.8-3607317b
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 72
    kind: sentence
    heading: OFF_0
    basis: implicit
    terms:
      - published
    text: With `OFF_0` the `DataSetMessage` is not accessible via the Message Bus and is not published at all.
  - key: MG-8.3.8-51ee5db7
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 72
    kind: sentence
    heading: OFF_0
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: This mode can be used when a `DataSetMessage` is not relevant for the driven use cases.
  - key: MG-8.3.8-3465ed10
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 76
    kind: sentence
    heading: ON_REQUEST_1
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: With `ON_REQUEST_1` the `DataSetMessage` can be requested via the Message Bus with `Oi4v2/<ServiceType>/<AppId>/Get/<Resource>[/<Source>[/<Filter>]]`.
  - key: MG-8.3.8-21e8cead
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 76
    kind: sentence
    heading: ON_REQUEST_1
    basis: implicit
    terms:
      - published
    text: The `DataSetMessage` is not published in any way other than by a request.
  - key: MG-8.3.8-dacdadfd
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 76
    kind: sentence
    heading: ON_REQUEST_1
    basis: keyword
    keywords:
      - MAY
    terms:
      - may
    text: This mode may be used when a `DataSetMessage` is not relevant to the driven use case, but may be of interest to acyclic requests.
  - key: MG-8.3.8-c0845ce9
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 82
    kind: sentence
    heading: APPLICATION_2
    basis: implicit
    terms:
      - published
    text: With `APPLICATION_2` the `DataSetMessage` will be published with other `DataSetMessages` of the same resource (7.1.5 Resource Element) and same application (7.1.3 AppId Element).
  - key: MG-8.3.8-0260e61c
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 82
    kind: sentence
    heading: APPLICATION_2
    basis: implicit
    terms:
      - published
    text: For example, all `DataSetMessages` for the resource `MAM` known by an application are published together in a single `NetworkMessage` via `Oi4v2/<ServiceType>/<AppId>/Pub/MAM`.
  - key: MG-8.3.8-242c977b
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 82
    kind: sentence
    heading: APPLICATION_2
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Additionally, the single `DataSetMessage` can be requested via the Message Bus.
  - key: MG-8.3.8-4a60c798
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 88
    kind: sentence
    heading: SOURCE_3
    basis: implicit
    terms:
      - published
    text: With `SOURCE_3` the `DataSetMessage` will be published with other `DataSetMessages` of the same resource (7.1.5 Resource Element), same source (7.1.6 Source Element) and same application (7.1.3 AppId Element).
  - key: MG-8.3.8-d2000452
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 88
    kind: sentence
    heading: SOURCE_3
    basis: implicit
    terms:
      - published
    text: For example, all `DataSetMessages` for the resource `Data` known by a particular asset are published together in a single `NetworkMessage` via `Oi4v2/<ServiceType>/<AppId>/Pub/Data/<Source>`.
  - key: MG-8.3.8-1b645328
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 88
    kind: sentence
    heading: SOURCE_3
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Additionally, the single `DataSetMessage` can be requested via the Message Bus.
  - key: MG-8.3.8-ec911ffa
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 94
    kind: sentence
    heading: FILTER_4
    basis: implicit
    terms:
      - published
    text: With `FILTER_4` the `DataSetMessage` will be published separately in an own `NetworkMessage`.
  - key: MG-8.3.8-b8f0cde9
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 94
    kind: sentence
    heading: FILTER_4
    basis: implicit
    terms:
      - published
    text: For example, a `DataSetMessages` named "temperature" for the resource `Data`, belonging to a particular asset, is published to a `NetworkMessage` via `Oi4v2/<ServiceType>/<AppId>/Pub/Data/<Source>/temperature`.
  - key: MG-8.3.8-3e5224b8
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 94
    kind: sentence
    heading: FILTER_4
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Additionally, the single `DataSetMessage` can be requested via the Message Bus.
  - key: MG-8.3.8-6ca0c9bc
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 148
    kind: field
    heading: Interval
    basis: field
    keywords:
      - MAY
    text: 'Value Range: `0…<n>`; Type: UInt32; Access: Read/Write; Requirement: Optional (`Interval` = 0 if not present)'
  - key: MG-8.3.8-29982e9d
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 153
    kind: sentence
    heading: Interval
    basis: implicit
    terms:
      - published
    text: By default, any `DataSet` gets published on change => interval = 0.
  - key: MG-8.3.8-a64c5926
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 153
    kind: sentence
    heading: Interval
    basis: implicit
    terms:
      - published
    text: If set to > 0 ms it gets published after the interval has expired, regardless of whether a change in value has occurred in the meantime.
  - key: MG-8.3.8-451c74bf
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 158
    kind: sentence
    heading: Interval
    admonition: note
    basis: implicit
    terms:
      - published
    text: In combination with `Precisions` is unequal to 0 and `Interval` > 0 ms, the value gets published when `Interval` has expired - regardless if minimum deviation has reached.
  - key: MG-8.3.8-baf67e74
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
    line: 158
    kind: sentence
    heading: Interval
    admonition: note
    basis: implicit
    terms:
      - ignored
    text: Therefore `Precisions` gets ignored, when `Interval` > 0 ms.
  - key: MG-8.3.8-1f4ea694
    section: MG 8.3.8
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-8-publicationlist.md
