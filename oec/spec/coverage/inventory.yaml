  - key: MG-8.3.10-d8256e38
    section: MG 8.3.10
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-10-referencedesignation.md
    line: 400
    kind: sentence
    heading: Location / Parent / IdentificationLink
    admonition: note
    basis: keyword
    keywords:
      - SHOULD
    terms:
      - should
    text: Therefore, the `IdentificationLink` of a `Parent` should be provided whenever the parent asset has an Identification Link.
  - key: MG-8.3.10-f5ceed18
    section: MG 8.3.10
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-10-referencedesignation.md
    line: 404
    kind: sentence
    heading: Location / Parent / IdentificationLink
    admonition: note
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: Therefore, it must be persisted on an application-specific basis.
  - key: MG-8.3.10-c4dc0834
    section: MG 8.3.10
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-10-referencedesignation.md
    line: 407
    kind: sentence
    heading: Location / Parent / IdentificationLink
    basis: implicit
    terms:
      - always
    text: 'The `ReferenceDesignation` object of an asset is always handled as a whole: a `Set` replaces the complete object, i.e. aspects (`Function`, `Product`, `Location`) which are not contained in the `Set` are removed, and a `Del` deletes the complete `ReferenceDesignation` of the asset (9.1.10 ReferenceDesignation).'
  - key: MG-8.3.11-41c125f9
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 9
    kind: sentence
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: Several of these messages can be packed for transmission in a `NetworkMessage` (8.2.1 NetworkMessage).
  - key: MG-8.3.11-8700e38d
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 11
    kind: sentence
    basis: keyword
    keywords:
      - MAY
    terms:
      - may
    text: Under these circumstances, a `NetworkMessage` may become excessively long.
  - key: MG-8.3.11-0a2549a0
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 11
    kind: sentence
    basis: keyword
    keywords:
      - MAY
    terms:
      - optional
    text: To prevent this, an optional `DataSetMessage` with `Pagination` information is available to indicate that there are other `NetworkMessages` with associated `DataSetMessages`.
  - key: MG-8.3.11-e37f5999
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 15
    kind: sentence
    basis: implicit
    terms:
      - published
    text: Via `…/Get/MAM` over the Message Bus, each `MAM` would be added to a single `NetworkMessage` and published via `…/Pub/MAM` - this could damage the publisher, the subscriber and even the broker or the system, when it runs out of resources.
  - key: MG-8.3.11-1d50c8a1
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 17
    kind: sentence
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: 'To avoid this, both the publisher and the subscriber can make use of the `Pagination` mechanism:'
  - key: MG-8.3.11-135129ca
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 19
    kind: list-item
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: A publisher that has too many `DataSetMessages` for a single `NetworkMessage` can publish part of the `DataSetMessages` and add a `Pagination` object, which tells all subscribers “This message contains 10 out of 100 DataSetMessages - we are on Page 5 now”. The subscriber then knows that five other publications will follow until all related information has been published.
  - key: MG-8.3.11-083cc809
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 20
    kind: list-item
    basis: keyword
    keywords:
      - MAY?
      - MAY
    terms:
      - can
      - may
    text: A subscriber that wants to request information via `…/Get/<Resource>` can add a `PaginationRequest` object to its payload to define the maximum number of `DataSetMessages` the `NetworkMessage` may contain so that the subscriber is able to handle it.
  - key: MG-8.3.11-2316f9db
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 22
    kind: sentence
    basis: keyword
    keywords:
      - MUST NOT
    terms:
      - must not
    text: A `NetworkMessage` must not exceed the `MaxPacketSize` of the Message Bus (OEC Runtime & Infrastructure Guideline, 4.1.1 Message Bus Storage, at least 262144 bytes).
  - key: MG-8.3.11-d1b705f1
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 22
    kind: sentence
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: In this case, it must use the `Pagination` mechanism.
  - key: MG-8.3.11-7898fea4
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 24
    kind: sentence
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: If these messages are too long for a specific application, that application must re-trigger publication of the information by using `PaginationRequest`.
  - key: MG-8.3.11-1d3f1c80
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 26
    kind: sentence
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: '`Pagination` information can be used in combination with every `Resource` that is published as a list of `DataSetMessages`.'
  - key: MG-8.3.11-f112da9b
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 26
    kind: sentence
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: A `PaginationRequest` must only be used with the method `Get` and a `Pagination` only with the method `Pub`, each at most once per `NetworkMessage`.
  - key: MG-8.3.11-f1ca1333
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 26
    kind: sentence
    basis: implicit
    terms:
      - ignored
    text: A `PaginationRequest` or `Pagination` in a `NetworkMessage` of another method is ignored by the receiver.
  - key: MG-8.3.11-0cb431c2
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 28
    kind: sentence
    basis: keyword
    keywords:
      - MUST
      - SHOULD
    terms:
      - must
      - should
    text: A single `DataSetMessage` must fit into one `NetworkMessage`; a provider should keep large `DataSets` well below the `MaxPacketSize`, e.g. by splitting a large `Config` into several contexts.
  - key: MG-8.3.11-19ff609c
    section: MG 8.3.11
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/index.md
    line: 32
    kind: sentence
    basis: keyword
    keywords:
      - MUST
    terms:
      - shall
    text: ATTENTION If `NetworkMessages` has to be paginated, the provided `DataSetMessages` shall be fetched in a way, that they are consistent.
  - key: MG-8.3.11.1-83b892c6
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 16
    kind: field
    heading: PerPage
    basis: field
    keywords:
      - MUST
    text: 'Value Range: `<number>`; Type: UInt32; Access: Read only; Requirement: Mandatory'
  - key: MG-8.3.11.1-b256a266
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 24
    kind: sentence
    heading: PerPage
    basis: keyword
    keywords:
      - MAY
      - MUST
    terms:
      - may
      - must
    text: A published message to the topic method `Get` may use a `PaginationRequest`; if it does, the `PaginationRequest` must contain `PerPage`.
  - key: MG-8.3.11.1-ce9aec11
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 24
    kind: sentence
    heading: PerPage
    basis: keyword
    keywords:
      - MAY
    terms:
      - may
    text: '`PerPage` is the requested page size, i.e. the maximum number of resource `DataSetMessages` (without helper `DataSets` such as `Pagination` or `Locale`) a `NetworkMessage` of the related publication may contain.'
  - key: MG-8.3.11.1-8cb5f159
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 27
    kind: sentence
    heading: PerPage
    admonition: note
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: The value of `PerPage` must be > 0.
  - key: MG-8.3.11.1-79ee4a24
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 38
    kind: field
    heading: Page
    basis: field
    keywords:
      - MUST
    text: 'Value Range: `<number>`; Type: UInt32; Access: Read only; Requirement: Mandatory'
  - key: MG-8.3.11.1-cd18f8ad
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 46
    kind: sentence
    heading: Page
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: If several `NetworkMessages` must be published to transport the relevant `DataSetMessages`, the value of `Page` shows which page is requested.
  - key: MG-8.3.11.1-b66d8c5d
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 46
    kind: sentence
    heading: Page
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: A requested page beyond the last page must be answered with a page without resource `DataSetMessages` and `HasNext` false.
  - key: MG-8.3.11.1-35d839fd
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 49
    kind: sentence
    heading: Page
    admonition: note
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: The value of `Page` must be > 0 to get a defined page with related information.
  - key: MG-8.3.11.1-a9803b99
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 53
    kind: sentence
    heading: Page
    admonition: note
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: The value of `Page` must be 0 to request all information in a fragmented way with a maximal count of `PerPage` `DataSetMessages` for each fragment.
  - key: MG-8.3.11.1-4d823c40
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 53
    kind: sentence
    heading: Page
    admonition: note
    basis: implicit
    terms:
      - publishes
    text: The publisher then publishes all pages one after the other, numbered from 1.
  - key: MG-8.3.11.1-6db49b65
    section: MG 8.3.11.1
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-1-paginationrequest.md
    line: 57
    kind: sentence
    heading: Page
    admonition: note
    basis: implicit
    terms:
      - answered
    text: A `Get` without `PaginationRequest` is answered with the complete result, which is paginated by the publisher, if necessary (8.3.11 Pagination).
  - key: MG-8.3.11.2-4e072fbd
    section: MG 8.3.11.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-2-pagination.md
    line: 16
    kind: field
    heading: TotalCount
    basis: field
    keywords:
      - MUST
    text: 'Value Range: `<number>`; Type: UInt32; Access: Read only; Requirement: Mandatory'
  - key: MG-8.3.11.2-4b6b231f
    section: MG 8.3.11.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-2-pagination.md
    line: 24
    kind: sentence
    heading: TotalCount
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: A published message to the topic methods `Pub` uses `TotalCount` to announce, how many of the actual processed resources can be expected.
  - key: MG-8.3.11.2-e698e9f8
    section: MG 8.3.11.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-2-pagination.md
    line: 24
    kind: sentence
    heading: TotalCount
    basis: keyword
    keywords:
      - MAY?
    terms:
      - can
    text: The amount of included `DataSetMessages` out of `TotalCount` can be calculated from existing `NetworkMessage` or is given by the key `PerPage`.
  - key: MG-8.3.11.2-97e960a0
    section: MG 8.3.11.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-2-pagination.md
    line: 35
    kind: field
    heading: PerPage
    basis: field
    keywords:
      - MUST
    text: 'Value Range: `<number>`; Type: UInt32; Access: Read only; Requirement: Mandatory'
  - key: MG-8.3.11.2-3a789a14
    section: MG 8.3.11.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3.11 Pagination/8-3-11-2-pagination.md
    line: 43
    kind: sentence
    heading: PerPage
    basis: implicit
    terms:
      - published
    text: A published message to the topic methods `Pub` uses `PerPage` to announce the page size, i.e. the maximum number of the `TotalCount` `DataSetMessages` which are included in each `NetworkMessage` of the series.
  - key: MG-8.3.11.2-d6ec42cf
