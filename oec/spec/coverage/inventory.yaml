    text: For the `DataSetMessages` with reserved `DataSetWriterIds` 1 to 3 and 9, the `WriterGroupName` must contain the name of the helper `DataSet` (`PaginationRequest`, `Pagination`, `Locale` or `Query`) and the `DataSetWriterName` must contain the Identification Link of the application, which publishes the `NetworkMessage` (e.g. the requester for `PaginationRequest`, `Locale` and `Query`, the responder for `Pagination`).
  - key: MG-8.2.3-00dee0fa
    section: MG 8.2.3
    file: docs/guideline/8-payload-format/8.2 OPC UA Objects - Defined by OPC Foundation/8-2-3-datasetmessage.md
    line: 25
    kind: sentence
    heading: DataSetWriterId
    basis: implicit
    terms:
      - published
    text: In a `Set` or `Del` request, the `DataSetMessage` carries the `DataSetWriterId` of the addressed `DataSet` as published by the addressed application (for `PublicationList` and `SubscriptionList` the common `DataSetWriterId` of the list), the `Source` of the topic as `DataSetWriterName` and the `Filter` of the topic as `WriterGroupName` (an empty string for resources without `Filter`); it carries no `SequenceNumber`.
  - key: MG-8.2.3-839937ac
