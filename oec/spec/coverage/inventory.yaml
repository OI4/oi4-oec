    line: 84
    kind: sentence
    heading: Details
    basis: keyword
    keywords:
      - MUST
    terms:
      - must
    text: The `Health` of the asset must reflect the status with the highest priority of all `Details`.
  - key: MG-8.3.2-8b8f5239
    section: MG 8.3.2
    file: docs/guideline/8-payload-format/8.3 OPC UA Objects, Defined by the OI4 Alliance/8-3-2-health.md
    line: 84
    kind: sentence
    heading: Details
    basis: keyword
    keywords:
      - MUST
    terms:
      - required
    text: 'The order of priority is `FAILURE_1` > `CHECK_FUNCTION_2` > `OFF_SPEC_3` > `MAINTENANCE_REQUIRED_4` > `NORMAL_0`: an invalid signal (failure) comes before a temporarily invalid signal (check function), an uncertain signal (out of specification) and a valid signal (maintenance required).'
  - key: MG-8.3.2-e992ce79
