    kind: list-item
    heading: Compliance Levels / OEC Messaging Compliance
    basis: keyword
    keywords:
      - MUST
      - SHOULD
    terms:
      - must
      - should
    text: A component that supports the methods `Set` or `Del` must support the resource `Event` with the category `Status` from Level 2 on and should support it at Level 1 (7.4 Method Element).
  - key: MG-1.3-fc5dfccb
    section: MG 1.3
    file: docs/guideline/1-introduction-and-scope/1-3-compliance-domains-and-levels.md
