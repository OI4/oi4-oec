    terms:
      - must
    text: To avoid problems on JSON parsing in different languages, the `GroupName` must contain only the characters <a..z>, <A..Z>, <0..9>, <-> and <_>.
  - key: MG-8.3.3.2-47e3c53f
    section: MG 8.3.3.2
