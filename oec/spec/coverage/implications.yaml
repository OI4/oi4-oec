# Implication map of umbrella requirements (ADR-0019 §9, C-034; schema:
# implications.schema.json). The oracle reports the detail REQs, and lint
# requires `violates` = oracle result, so no vector names an umbrella in
# `violates`. An umbrella counts as covered by vectors when every detail is
# covered (reviewed positive and negative vector, or itself derived). The
# remainder is the part of the umbrella that no detail implies; it stays with
# the other verification methods of the umbrella and is not covered by
# vectors. 'spectool coverage' writes coverage/vectors.md from this map.
implications:
  - umbrella: REQ-MSG-004
    details: [REQ-MSG-003, REQ-MSG-005, REQ-MSG-011]
    remainder: none – the content mask is not on the wire; its effect is the field presence of the NetworkMessage (details).
  - umbrella: REQ-MSG-017
    details: [REQ-MSG-016, REQ-MSG-018, REQ-MSG-024, REQ-MSG-029, REQ-MSG-031]
    remainder: none – the content mask is not on the wire; its effect is the field presence of the DataSetMessage and the VerboseEncoding of the fields (details).
  - umbrella: REQ-BUS-004
    details: [REQ-BUS-010, REQ-MSG-030, REQ-TOP-013, REQ-RES-CONFIG-003, REQ-RES-CONFIG-019, REQ-RES-DATA-009, REQ-RES-META-004, REQ-RES-PUBLIST-022, REQ-RES-REFDES-006, REQ-RES-SUBLIST-010]
    remainder: That the object is a resource object of the addressed component and the Set carries its complete updated state needs the publications of that component (d7-test, REQ-BUS-002).
  - umbrella: REQ-BUS-005
    details: [REQ-BUS-010, REQ-TOP-013, REQ-RES-REFDES-007, REQ-RES-SUBLIST-011]
    remainder: That the addressed object exists at the addressed component needs its publications (d7-test, REQ-BUS-002).
  # C-036: the Pub content rule of a resource (MG 9.1.x) is the sum of its
  # DataSetClassId, the content of its DataSet and the helper rules; an empty
  # Pub is valid as the answer to a Get without content (SF-099).
  - umbrella: REQ-RES-MAM-022
    details: [REQ-MSG-010, REQ-RES-MAM-001, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without MAM DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource shows only as a violation of the MAM content (REQ-RES-MAM-001).
  - umbrella: REQ-RES-HEALTH-007
    details: [REQ-MSG-010, REQ-RES-HEALTH-001, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without Health DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource shows only as a violation of the Health content (REQ-RES-HEALTH-001).
  - umbrella: REQ-RES-PROFILE-005
    details: [REQ-MSG-010, REQ-RES-PROFILE-001, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without Profile DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource shows only as a violation of the Profile content (REQ-RES-PROFILE-001).
  - umbrella: REQ-RES-PUBLIST-021
    details: [REQ-MSG-010, REQ-RES-PUBLIST-001, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without PublicationList DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource shows only as a violation of the PublicationList content (REQ-RES-PUBLIST-001).
  - umbrella: REQ-RES-REFDES-005
    details: [REQ-MSG-010, REQ-RES-REFDES-001, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without ReferenceDesignation DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource shows only as a violation of the ReferenceDesignation content (REQ-RES-REFDES-001).
  # C-038: Data, Event and SubscriptionList (MG 8.3.4, 8.3.6, 8.3.9, 9.1.4,
  # 9.1.6, 9.1.9).
  - umbrella: REQ-RES-DATA-001
    details: [REQ-MSG-016, REQ-MSG-030, REQ-MSG-031]
    remainder: That the fields are described by the Metadata of the same Source and Tag needs that Metadata (d7-test, REQ-CMP-037); an application-defined DataSet has no structure of its own on the wire.
  - umbrella: REQ-RES-DATA-003
    details: [REQ-MSG-024, REQ-RES-DATA-004]
    remainder: That no other DataSet uses the Tag Oi4Pv shows as a violation of the Oi4Pv content (REQ-RES-DATA-004); an Oi4Pv DataSet published under another Tag is not recognizable from one message (manual, REQ-RES-DATA-002).
  - umbrella: REQ-RES-DATA-008
    details: [REQ-RES-DATA-001, REQ-RES-DATA-004, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without Data DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource is not recognizable, since Data has no predefined DataSetClassId and an application-defined DataSet may have any fields (REQ-RES-DATA-001).
  - umbrella: REQ-RES-EVENT-009
    details: [REQ-RES-EVENT-001, REQ-RES-EVENT-002]
    remainder: The meaning of the Number and the structure of the Details of a Generic Event are application-defined (REQ-RES-EVENT-010, manual).
  - umbrella: REQ-RES-EVENT-011
    details: [REQ-TOP-013, REQ-MSG-023, REQ-MSG-024]
    remainder: none – the method is a topic rule (REQ-TOP-013), Source, EventCategory and EventLevel of every DataSetMessage are the equalities of DataSetWriterName and WriterGroupName with the topic (REQ-MSG-023, REQ-MSG-024).
  - umbrella: REQ-RES-SUBLIST-009
    details: [REQ-MSG-010, REQ-RES-SUBLIST-001, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without SubscriptionList DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource shows only as a violation of the SubscriptionList content (REQ-RES-SUBLIST-001).
  # C-039: Config (MG 8.3.3, 9.1.3).
  - umbrella: REQ-RES-CONFIG-010
    details: [REQ-TOP-013, REQ-RES-CONFIG-003, REQ-RES-CONFIG-007]
    remainder: That the receiver unsets the value on an empty string is behavior of the responder (d7-test, REQ-RES-CONFIG-023); the message side is the absent Del Config (REQ-TOP-013), the mandatory Value of every configuration object of a Set (REQ-RES-CONFIG-003) and the empty string as valid Value of every Type (REQ-RES-CONFIG-007).
  - umbrella: REQ-RES-CONFIG-018
    details: [REQ-MSG-010, REQ-RES-CONFIG-002, REQ-PAG-008, REQ-LOC-003, REQ-QRY-001]
    remainder: That a Pub without Config DataSetMessage only answers a Get (REQ-CMP-042, d7-monitor); a DataSetMessage of another resource shows only as a violation of the Config content (REQ-RES-CONFIG-002).
  # C-040: the conformance umbrellas of MG 1.2/1.3, MG 4 and MG 7.1. D7
  # validate checks them through their details; the remainders need several
  # messages or are not checkable.
  - umbrella: REQ-CMP-004
    details: [REQ-TOP-001, REQ-TOP-005, REQ-TOP-009, REQ-TOP-011, REQ-TOP-012, REQ-TOP-013, REQ-TOP-018, REQ-TOP-019, REQ-TOP-021, REQ-TOP-022, REQ-TOP-023, REQ-IL-002, REQ-IL-003, REQ-IL-004, REQ-ACT-020]
    remainder: The topic rules that relate a topic to other messages or to the component (ServiceType and AppId of the destination or publisher REQ-TOP-006/010, Reply topic of the Call REQ-TOP-016, no other traffic in the namespace REQ-TOP-003; d7-monitor/d7-test). White space in a Filter level (REQ-TOP-020) is a recommendation, D7 reports it as a warning.
  - umbrella: REQ-CMP-025
    details: [REQ-MSG-001, REQ-MSG-003, REQ-MSG-016, REQ-MSG-027, REQ-MSG-032, REQ-MSG-035, REQ-MSG-036, REQ-MSG-037, REQ-MSG-040, REQ-MSG-041, REQ-MSG-042, REQ-MSG-043, REQ-MSG-044, REQ-MSG-045, REQ-ACT-002, REQ-ACT-010, REQ-ACT-012, REQ-ACT-021, REQ-ACT-022, REQ-BUS-010, REQ-LOC-001, REQ-PAG-001, REQ-PAG-003, REQ-RES-CONFIG-002, REQ-RES-CONFIG-003, REQ-RES-DATA-004, REQ-RES-EVENT-001, REQ-RES-HEALTH-001, REQ-RES-MAM-001, REQ-RES-PROFILE-001, REQ-RES-PUBLIST-001, REQ-RES-REFDES-001, REQ-RES-SUBLIST-001]
    remainder: none – every payload object of MG 8/9 states the Requirement attribute of its fields in its "Fields of …" requirement (details); a field marked Not used or not defined is an undefined key (REQ-MSG-001).
  - umbrella: REQ-CMP-026
    details: [REQ-MSG-003, REQ-MSG-005, REQ-MSG-016, REQ-MSG-027, REQ-MSG-031, REQ-MSG-032, REQ-MSG-035, REQ-MSG-036, REQ-MSG-037, REQ-MSG-039, REQ-MSG-040, REQ-MSG-041, REQ-MSG-042, REQ-MSG-043, REQ-MSG-044, REQ-MSG-045, REQ-ACT-002, REQ-ACT-010, REQ-ACT-012, REQ-ACT-021, REQ-ACT-022, REQ-BUS-010, REQ-LOC-001, REQ-PAG-001, REQ-PAG-003, REQ-RES-CONFIG-002, REQ-RES-CONFIG-003, REQ-RES-CONFIG-004, REQ-RES-CONFIG-006, REQ-RES-CONFIG-007, REQ-RES-DATA-004, REQ-RES-EVENT-001, REQ-RES-HEALTH-001, REQ-RES-MAM-001, REQ-RES-MAM-004, REQ-RES-MAM-017, REQ-RES-PROFILE-001, REQ-RES-PUBLIST-001, REQ-RES-REFDES-001, REQ-RES-REFDES-012, REQ-RES-SUBLIST-001]
    remainder: none – Type and Value Range of every field are stated by the "Fields of …" requirement of its object and the type and encoding requirements (details); calendar validity of a DateTime is checked by the rule layer (R-4) under the same requirements.
  - umbrella: REQ-CMP-005
    details: [REQ-MSG-001, REQ-MSG-002, REQ-MSG-003, REQ-MSG-005, REQ-MSG-016, REQ-MSG-031, REQ-MSG-034, REQ-CMP-025, REQ-CMP-026]
    remainder: Strict JSON syntax (UTF-8, no duplicate keys, one JSON value) has no vector of its own; D7 validate reports a payload that is no strict JSON under this requirement (layer parse).
  - umbrella: REQ-TOP-002
    details: [REQ-CMP-004, REQ-CMP-005]
    remainder: Conformance that needs several messages (series, request and answer, lifecycle) is checked by D7 monitor and test.
  - umbrella: REQ-IL-001
    details: [REQ-IL-002, REQ-IL-004, REQ-IL-009, REQ-IL-016, REQ-IL-018, REQ-IL-019, REQ-TOP-009, REQ-TOP-018, REQ-MSG-006, REQ-MSG-023]
    remainder: That an asset is identified by exactly one Identification Link across all its messages (d7-test; REQ-IL-010, REQ-IL-012, REQ-IL-013).
  - umbrella: REQ-IL-008
    details: [REQ-IL-009, REQ-IL-016, REQ-IL-018, REQ-IL-019]
    remainder: The character combinations with special functions of IEC 61406-1 cannot be checked (MG 4.1) and stay with the issuer (manual).
