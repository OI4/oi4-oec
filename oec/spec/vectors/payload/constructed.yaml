# Constructed payload vectors (C-024, C-027, C-028, C-029): validation modes of SF-052 (strict/tolerant) and violations of the resource content checks (C-027, reviewed; V-PAY-081 … 087 drafted in C-028, reviewed by the PO 2026-10-21; V-PAY-103 … 113 (Config) drafted in C-029, reviewed by the PO (C-029 review), descriptions synced with SF-088 (e); V-PAY-115/116 (masking, GL-ADR-021) drafted in the C-029 review; V-PAY-122 … 126 drafted in the C-031 consistency review).
# Format: vectors/vectors.schema.json; checked by spectool lint (reference checks: tools/internal/payload).
kind: payload
baseline: "223fb51"
description: >-
  Constructed payload vectors for the two validation modes of MG 8 (SF-052):
  strict validation reports every key that is not defined for the object
  (REQ-MSG-001, conformance of the sender), tolerant validation ignores such
  keys (REQ-MSG-046, view of a tolerant receiver). Without mode a vector is
  checked strictly. Since C-027 also invalid variants of golden vectors that
  each violate one rule of the resource content checks (Health, Pagination,
  MAM, PublicationList; since C-028 Event, Oi4Pv, SubscriptionList and Get
  Metadata; since C-029 Config).
