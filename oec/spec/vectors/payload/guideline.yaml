# Golden payload vectors (C-023/C-024/C-025/C-027, ADR-0018 amendments C-013, C-023 and C-024); V-PAY-001 … 022 reviewed by the PO (C-024), V-PAY-023 … 025 reviewed by the PO (C-026; drafted in C-025, verbatim since C-026); V-PAY-026 … 047 drafted in C-027.
# Format: vectors/vectors.schema.json; checked by spectool lint (reference checks: tools/internal/payload).
kind: payload
baseline: "c6453c7"
description: >-
  Golden payload vectors taken from Appendix B (MG B1.1.1, B1.1.2, B1.1.5,
  B1.1.7, B1.1.8, B1.1.10, B1.1.11, B1.1.12, B1.2.1): topic and message of the
  Message Bus, including the Birth, Close and Will messages (MG 6.3.3 … 6.3.5,
  C-025); and the predefined MetaData of the Alliance resources (MG B2.1 …
  B2.8) as bare DataSetMetaDataType objects. The reference checks cover the
  envelope of MG 8 (areas MSG and ACT) and, since C-027, the DataSet content of
  MAM, Health, Profile, PublicationList, ReferenceDesignation and the helper
  DataSets Pagination, PaginationRequest and Locale (areas RES-MAM … LOC); the
  remaining resources follow in C-028. A vector that differs from its example
  keeps the verbatim example in original and lists every change in edits.
vectors:
  - id: V-PAY-001
    title: "B1.1.2: Get Health of an explicit asset"
    expected: valid
    reqs: [REQ-MSG-002, REQ-MSG-003, REQ-MSG-005, REQ-MSG-006, REQ-MSG-007, REQ-MSG-010, REQ-MSG-011, REQ-MSG-015]
    origin: {kind: guideline, ref: MG B1.1.2}
    status: reviewed
    notes: >-
      A request addresses the application in the topic (MG 7.3); the PublisherId
      and the MessageId are those of the requesting IT connector. The Source of
      the topic is the application itself. A Get without helper DataSets has an
      empty Messages array and an empty ReplyTo.
    topic: "Oi4v2/OTConnector/cHJvdmlkZXIuY29tL0ZpZWxkRGF0YVNlcnZpY2UvRkRTLTAwMS8xMjAwLTAzNDU/Get/Health/cHJvdmlkZXIuY29tL0ZpZWxkRGF0YVNlcnZpY2UvRkRTLTAwMS8xMjAwLTAzNDU"
    payload: |-
      {
        "MessageId": "1639693510000-ITConnector/https://id.consumer.com/MEService/Inst07322",
        "MessageType": "ua-data",
        "PublisherId": "ITConnector/https://id.consumer.com/MEService/Inst07322",
        "DataSetClassId": "d8e7b6df-42ba-448a-975a-199f59e8ffeb",
        "ReplyTo": "",
