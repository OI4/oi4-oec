# Test vectors of kind broker-json (C-039): content of broker.json in the
# Message Bus storage (RIG 4.1.1). Format: vectors/vectors.schema.json;
# checked by spectool lint (reference check internal/platform).
kind: broker-json
baseline: "57ebe91"
description: >-
  Content of the file broker.json of the Message Bus storage (RIG 4.1.1,
  REQ-CNT-003): the mandatory elements Address (IP address or host name),
  SecurePort (UINT16, 1 … 65535) and MaxPacketSize (INT32, 262144 …
  268435455). RIG 4.1.1 has no example of the file; all vectors are
  constructed. The syntax of Address, further elements and SecurePort 0
  follow SF-100 (RIG 4.1.1 since guideline 168e1d1).
vectors:
  - id: V-BRK-001
    title: "Minimal broker.json with host name and the smallest MaxPacketSize"
    expected: valid
    reqs: [REQ-CNT-003]
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      The three mandatory elements of RIG 4.1.1; Address as a single-label host name
      (e.g. the container name of the broker), MaxPacketSize at its minimum 262144
      (256 KiB).
    content: |-
      {
        "Address": "mqtt-broker",
        "SecurePort": 8883,
        "MaxPacketSize": 262144
      }

  - id: V-BRK-002
    title: "broker.json with IPv4 address and the largest MaxPacketSize"
    expected: valid
    reqs: [REQ-CNT-003]
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      MaxPacketSize at its maximum 268435455, the maximum remaining length of an MQTT
      v3.1.1 packet (SF-091 (b)).
    content: |-
      {
        "Address": "192.168.10.5",
        "SecurePort": 8883,
        "MaxPacketSize": 268435455
      }

  - id: V-BRK-003
    title: "broker.json with IPv6 address"
    expected: valid
    reqs: [REQ-CNT-003]
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      IPv6 address in text form without brackets (SF-100 (b)); any
      SecurePort of the range.
    content: |-
      {
        "Address": "fd00:10::5",
        "SecurePort": 443,
        "MaxPacketSize": 1048576
      }

  - id: V-BRK-004
    title: "broker.json with a fully qualified host name and a further element"
    expected: valid
    reqs: [REQ-CNT-003]
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      RIG 4.1.1 lists the elements broker.json contains; a further element is allowed
      and ignored by the clients (SF-100 (a)).
    content: |-
      {
        "Address": "broker.plant-1.example.com",
        "SecurePort": 8883,
        "MaxPacketSize": 524288,
        "Comment": "provisioned by the platform"
      }

  - id: V-BRK-005
    title: "broker.json without Address"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "Address is a mandatory element of broker.json (RIG 4.1.1)."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 without Address.
    content: |-
      {
        "SecurePort": 8883,
        "MaxPacketSize": 262144
      }

  - id: V-BRK-006
    title: "broker.json without SecurePort"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "SecurePort is a mandatory element of broker.json (RIG 4.1.1)."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 without SecurePort.
    content: |-
      {
        "Address": "mqtt-broker",
        "MaxPacketSize": 262144
      }

  - id: V-BRK-007
    title: "broker.json without MaxPacketSize"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "MaxPacketSize is a mandatory element of broker.json (RIG 4.1.1)."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 without MaxPacketSize.
    content: |-
      {
        "Address": "mqtt-broker",
        "SecurePort": 8883
      }

  - id: V-BRK-008
    title: "MaxPacketSize below the minimum"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "The minimum value of MaxPacketSize is 262144 (RIG 4.1.1)."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with MaxPacketSize one below the minimum.
    content: |-
      {
        "Address": "mqtt-broker",
        "SecurePort": 8883,
        "MaxPacketSize": 262143
      }

  - id: V-BRK-009
    title: "MaxPacketSize above the maximum"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "The maximum value of MaxPacketSize is 268435455 (RIG 4.1.1, SF-091 (b))."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-002 with MaxPacketSize one above the maximum.
    content: |-
      {
        "Address": "192.168.10.5",
        "SecurePort": 8883,
        "MaxPacketSize": 268435456
      }

  - id: V-BRK-010
    title: "MaxPacketSize as a string"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "MaxPacketSize is an INT32 (RIG 4.1.1), a JSON number."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with MaxPacketSize as a JSON string.
    content: |-
      {
        "Address": "mqtt-broker",
        "SecurePort": 8883,
        "MaxPacketSize": "262144"
      }

  - id: V-BRK-011
    title: "SecurePort above the UINT16 range"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "SecurePort is a UINT16 (RIG 4.1.1)."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with SecurePort 65536.
    content: |-
      {
        "Address": "mqtt-broker",
        "SecurePort": 65536,
        "MaxPacketSize": 262144
      }

  - id: V-BRK-012
    title: "SecurePort as a string"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "SecurePort is a UINT16 (RIG 4.1.1), a JSON number."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with SecurePort as a JSON string.
    content: |-
      {
        "Address": "mqtt-broker",
        "SecurePort": "8883",
        "MaxPacketSize": 262144
      }

  - id: V-BRK-013
    title: "SecurePort 0"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "SecurePort is the port the broker listens on; port 0 is no such port (SF-100 (c))."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with SecurePort 0, the lower bound of UINT16 (SF-100 (c)).
    content: |-
      {
        "Address": "mqtt-broker",
        "SecurePort": 0,
        "MaxPacketSize": 262144
      }

  - id: V-BRK-014
    title: "Address with port"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "Address is an IP address or host name (RIG 4.1.1); the port is the element SecurePort."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with the port appended to the host name.
    content: |-
      {
        "Address": "mqtt-broker:8883",
        "SecurePort": 8883,
        "MaxPacketSize": 262144
      }

  - id: V-BRK-015
    title: "Address as a URL"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "Address is an IP address or host name (RIG 4.1.1), not a URL."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with a URL with scheme mqtts.
    content: |-
      {
        "Address": "mqtts://mqtt-broker",
        "SecurePort": 8883,
        "MaxPacketSize": 262144
      }

  - id: V-BRK-016
    title: "Empty Address"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "Address is an IP address or host name (RIG 4.1.1); the empty string is neither."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with an empty Address.
    content: |-
      {
        "Address": "",
        "SecurePort": 8883,
        "MaxPacketSize": 262144
      }

  - id: V-BRK-017
    title: "Element names not in PascalCase"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "The elements of broker.json are written in PascalCase (RIG 1.2, RIG 4.1.1); with camelCase names the mandatory elements are missing."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 with camelCase element names; the three names count as further
      elements (SF-100 (a)), the mandatory elements are missing.
    content: |-
      {
        "address": "mqtt-broker",
        "securePort": 8883,
        "maxPacketSize": 262144
      }

  - id: V-BRK-018
    title: "broker.json is no JSON object"
    expected: invalid
    violates: [REQ-CNT-003]
    reason: "broker.json is a JSON object with the elements of RIG 4.1.1."
    origin: {kind: constructed, ref: RIG 4.1.1}
    status: reviewed
    notes: >-
      V-BRK-001 wrapped in an array.
    content: |-
      [
        {
          "Address": "mqtt-broker",
          "SecurePort": 8883,
          "MaxPacketSize": 262144
        }
      ]
