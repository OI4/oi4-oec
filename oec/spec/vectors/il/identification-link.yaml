# Test vectors of kind identification-link (C-018, ADR-0018); reviewed by the PO (C-022, 2026-10-17).
# Format: vectors/vectors.schema.json; checked by spectool lint.
kind: identification-link
baseline: "f951bcb"
description: >-
  Identification Link vectors: valid examples of MG 4.1, MG 4.2 and MG A3 with
  their base64url encoding, and invalid strings and encoded topic elements
  with the expected violation codes.
vectors:
  - id: V-IL-001
    title: "MG 4.2 example provider.com/FieldDataService/FDS-001/1200-0345"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: guideline, ref: MG 4.2}
    status: reviewed
    il: "provider.com/FieldDataService/FDS-001/1200-0345"
    encoded: "cHJvdmlkZXIuY29tL0ZpZWxkRGF0YVNlcnZpY2UvRkRTLTAwMS8xMjAwLTAzNDU"

  - id: V-IL-002
    title: "MG 4.2 example https://id.consumer.com/MEService/Inst07322"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: guideline, ref: MG 4.2}
    status: reviewed
    il: "https://id.consumer.com/MEService/Inst07322"
    encoded: "aHR0cHM6Ly9pZC5jb25zdW1lci5jb20vTUVTZXJ2aWNlL0luc3QwNzMyMg"

  - id: V-IL-003
    title: "MG 4.2 example company.id/A87BAD34H"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: guideline, ref: MG 4.2}
    status: reviewed
    il: "company.id/A87BAD34H"
    encoded: "Y29tcGFueS5pZC9BODdCQUQzNEg"

  - id: V-IL-004
    title: "MG 4.2 example https://company.id/A87BAD34H"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: guideline, ref: MG 4.2}
    status: reviewed
    il: "https://company.id/A87BAD34H"
    encoded: "aHR0cHM6Ly9jb21wYW55LmlkL0E4N0JBRDM0SA"

  - id: V-IL-005
    title: "MG 4.2 example https://example.com/~sn?S=1000"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: guideline, ref: MG 4.2}
    status: reviewed
    il: "https://example.com/~sn?S=1000"
    encoded: "aHR0cHM6Ly9leGFtcGxlLmNvbS9-c24_Uz0xMDAw"

  - id: V-IL-006
    title: "MG 4.1 example with query (IEC 61406-1)"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: guideline, ref: MG 4.1}
    status: reviewed
    il: "https://www.domain-abc.com/sd09fqw4?1P=productcode&S=serialnumber"
    encoded: "aHR0cHM6Ly93d3cuZG9tYWluLWFiYy5jb20vc2QwOWZxdzQ_MVA9cHJvZHVjdGNvZGUmUz1zZXJpYWxudW1iZXI"

  - id: V-IL-007
    title: "MG A3 example with dnp-encoded query and fragment"
    expected: valid
    reqs: [REQ-IL-016, REQ-IL-017]
    origin: {kind: guideline, ref: MG A3}
    status: reviewed
    il: "https://example.com/myproducts?myquery=Edge,20Gateway,20,3E4GB#,2320815,212205,2B1432"
    encoded: "aHR0cHM6Ly9leGFtcGxlLmNvbS9teXByb2R1Y3RzP215cXVlcnk9RWRnZSwyMEdhdGV3YXksMjAsM0U0R0IjLDIzMjA4MTUsMjEyMjA1LDJCMTQzMg"

  - id: V-IL-008
    title: "One character"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: constructed}
    status: reviewed
    il: "a"
    encoded: "YQ"

  - id: V-IL-009
    title: "255 characters"
    expected: valid
    reqs: [REQ-IL-019]
    origin: {kind: constructed}
    status: reviewed
    il: "example.com/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    encoded: ""

  - id: V-IL-010
    title: "All reserved characters in path, query and fragment"
    expected: valid
    reqs: [REQ-IL-002, REQ-IL-009, REQ-IL-016]
    origin: {kind: constructed}
    status: reviewed
    il: "http://provider.com/a:b@c!$&'()*+,;=/x?y=[1]#z"
    encoded: "aHR0cDovL3Byb3ZpZGVyLmNvbS9hOmJAYyEkJicoKSorLDs9L3g_eT1bMV0jeg"

  - id: V-IL-011
    title: "Upper case in path, query and fragment"
    expected: valid
    reqs: [REQ-IL-018]
    origin: {kind: constructed}
    status: reviewed
    il: "provider.com/ABC?Q=X#F"
    encoded: "cHJvdmlkZXIuY29tL0FCQz9RPVgjRg"

  - id: V-IL-012
    title: "Upper-case scheme is not normalized"
    expected: valid
    reqs: [REQ-IL-013, REQ-IL-018]
    origin: {kind: constructed}
    status: reviewed
    il: "HTTPS://provider.com/x"
    encoded: "SFRUUFM6Ly9wcm92aWRlci5jb20veA"
    notes: "The authority is lower case; the scheme is kept as assigned (REQ-IL-013) and makes a different Identification Link than https://provider.com/x (REQ-IL-015)."

  - id: V-IL-101
    title: "Empty string"
    expected: invalid
    violates: [REQ-IL-019]
    reason: "An Identification Link has at least one character."
    origin: {kind: constructed}
    status: reviewed
    il: ""
    violations: [empty]

  - id: V-IL-102
    title: "256 characters"
    expected: invalid
    violates: [REQ-IL-019]
    reason: "An Identification Link has at most 255 characters."
    origin: {kind: constructed}
    status: reviewed
    il: "example.com/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    violations: [too-long]

  - id: V-IL-103
    title: "Space"
    expected: invalid
    violates: [REQ-IL-016]
    reason: "Space is not permitted."
    origin: {kind: constructed}
    status: reviewed
    il: "company.id/A 1"
    violations: [forbidden-character]

  - id: V-IL-104
    title: "Percent-encoding"
    expected: invalid
    violates: [REQ-IL-016]
    reason: "% is not permitted (no percent-encoding)."
    origin: {kind: constructed}
    status: reviewed
    il: "company.id/A%201"
    violations: [forbidden-character]

  - id: V-IL-105
    title: "Non-ASCII character"
    expected: invalid
    violates: [REQ-IL-016]
    reason: "Non-ASCII characters are not permitted."
    origin: {kind: constructed}
    status: reviewed
    il: "company.id/Gerät"
    violations: [forbidden-character]

  - id: V-IL-106
    title: "Quotation mark and braces"
    expected: invalid
    violates: [REQ-IL-016]
    reason: "The characters \" { } are not permitted."
    origin: {kind: constructed}
    status: reviewed
    il: "company.id/{\"a\"}"
    violations: [forbidden-character]

  - id: V-IL-107
    title: "Empty authority after scheme"
    expected: invalid
    violates: [REQ-IL-009]
    reason: "The authority is mandatory."
    origin: {kind: constructed}
    status: reviewed
    il: "https:///A87BAD34H"
    violations: [empty-authority]

  - id: V-IL-108
    title: "Path only"
    expected: invalid
    violates: [REQ-IL-009]
    reason: "The authority is mandatory."
    origin: {kind: constructed}
    status: reviewed
    il: "/A87BAD34H"
    violations: [empty-authority]

  - id: V-IL-109
    title: "Upper-case authority"
    expected: invalid
    violates: [REQ-IL-018]
    reason: "The authority is lower case."
    origin: {kind: constructed}
    status: reviewed
    il: "Company.id/A87BAD34H"
    violations: [uppercase-authority]

  - id: V-IL-110
    title: "Upper-case authority after scheme"
    expected: invalid
    violates: [REQ-IL-018]
    reason: "The authority is lower case."
    origin: {kind: constructed}
    status: reviewed
    il: "https://ID.consumer.com/MEService/Inst07322"
    violations: [uppercase-authority]

  - id: V-IL-111
    title: "Encoded with padding"
    expected: invalid
    violates: [REQ-IL-004]
    reason: "Padding characters = are omitted."
    origin: {kind: constructed}
    status: reviewed
    encoded: "Y29tcGFueS5pZC9BODdCQUQzNEg="
    violations: [encoding]

  - id: V-IL-112
    title: "Encoded with the standard Base64 alphabet"
    expected: invalid
    violates: [REQ-IL-003]
    reason: "The standard Base64 alphabet contains + and /."
    origin: {kind: constructed}
    status: reviewed
    encoded: "aHR0cHM6Ly9leGFtcGxlLmNvbS9+c24/Uz0xMDAw"
    violations: [encoding]

  - id: V-IL-113
    title: "Non-canonical last character"
    expected: invalid
    violates: [REQ-IL-004]
    reason: "The unused bits of the last character are not zero."
    origin: {kind: constructed}
    status: reviewed
    encoded: "Y29tcGFueS5pZC9BODdCQUQzNEh"
    violations: [encoding]

  - id: V-IL-114
    title: "Length 1 modulo 4"
    expected: invalid
    violates: [REQ-IL-004]
    reason: "No base64url string without padding has this length."
    origin: {kind: constructed}
    status: reviewed
    encoded: "YWJjZ"
    violations: [encoding]

  - id: V-IL-115
    title: "Line break inside"
    expected: invalid
    violates: [REQ-IL-002]
    reason: "No line breaks are added."
    origin: {kind: constructed}
    status: reviewed
    encoded: "Y29tcGFu\neS5pZC9BODdCQUQzNEg"
    violations: [encoding]

  - id: V-IL-116
    title: "Empty encoded element"
    expected: invalid
    violates: [REQ-IL-002]
    reason: "An empty topic level is no encoded Identification Link."
    origin: {kind: constructed}
    status: reviewed
    encoded: ""
    violations: [encoding]

  - id: V-IL-117
    title: "Decodes to an upper-case authority"
    expected: invalid
    violates: [REQ-IL-018]
    reason: "The decoded Identification Link has an upper-case authority."
    origin: {kind: constructed}
    status: reviewed
    encoded: "Q29tcGFueS5pZC9BODdCQUQzNEg"
    violations: [uppercase-authority]
