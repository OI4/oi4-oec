[package]
name = "oec-core"
description = "Sans-IO protocol logic of the OI4 OEC v2 SDK (D2): Identification Link, Oi4Identifier, topic model, message model, embedded schemas. Internal crate of `oec`; no stability promise of its own (ADR-0026)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Validates messages against the embedded D1 schemas (ADR-0019 §7, ADR-0020
# §13, ADR-0023): on in the SDK's own tests and examples.
strict-validation = ["dep:jsonschema"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
jsonschema = { workspace = true, optional = true }

[lints]
workspace = true
