[package]
name = "oec-api-sketch"
version = "0.0.0"
edition = "2021"
publish = false
description = "P3 spike (C-042): compile-checked public API sketch of the OEC Rust SDK (D2, ADR-0020). Not product code: every body is unimplemented!()."
license = "MIT"

# The sketch is named `oec` so that the examples read exactly like future SDK code.
[lib]
name = "oec"
path = "src/lib.rs"

# Deliberately no dependencies: oec/check.sh compiles the sketch offline.
[dependencies]
