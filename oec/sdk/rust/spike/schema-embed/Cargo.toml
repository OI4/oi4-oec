[package]
name = "oec-schema-embed-spike"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "P3 spike (C-043, ADR-0023): D2 embeds the OEC JSON Schemas at compile time (build.rs + include_str!, ADR-0019 §7) and validates with jsonschema-rs from memory, without file or network access. Not product code."

[dependencies]
jsonschema = { version = "=0.60.1", default-features = false }
serde_json = "1"
