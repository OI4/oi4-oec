# Cargo workspace of the Rust SDK D2 (ADR-0011, ADR-0023, ADR-0026 proposed).
# Members grow with the P4 increments: oec-core (sans-IO protocol logic, from
# C-046), oec (runtime + public API, ADR-0020, from C-048) and oec-ffi (C ABI,
# ADR-0021) later. The P3 sketch and spikes stay stand-alone crates with their
# own lock files until the crate `oec` replaces them (ADR-0020 §1).
[workspace]
resolver = "3"
members = ["oec-core", "oec"]
exclude = ["sketch", "spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
repository = "https://github.com/OI4/oec"

[workspace.dependencies]
# Runtime dependencies of oec-core (ADR-0023, ADR-0026: I/O-free crates only).
oec-core = { path = "oec-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
# =-pinned together with the schema gate oec/schema/tools/rust-check
# (ADR-0019 §8, ADR-0023).
jsonschema = { version = "=0.60.1", default-features = false }
# Runtime dependencies of oec (ADR-0023, ADR-0026 amendment C-048).
thiserror = "2"
log = "0.4"
# Transport of oec (ADR-0023 §1, amendment C-050): tokio without `full`,
# rustls/tokio-rustls without default features; the crypto provider is chosen
# by the features of oec (aws-lc-rs default, `crypto-ring`).
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync", "signal"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false }
rustls-pki-types = { version = "1.15", default-features = false, features = ["std"] }
# Encrypted private keys of the secret storage (REQ-CNT-008/009, ADR-0023
# amendment C-050): PKCS#8 PBES2 only (no `des-insecure`/`sha1-insecure`).
pkcs8 = { version = "0.11", default-features = false, features = ["std", "pem", "encryption"] }
# Dev dependency of oec: the test PKI of the runtime tests (ADR-0023
# amendment C-050).
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
# Dev dependency of oec-core: property tests of codec, session and lifecycle
# (ADR-0023 amendment C-049). Without the default features fork/timeout
# (no rusty-fork, no tempfile).
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Doc comments use the CamelCase terms of the guideline (ManufacturerUri,
# PublicationList, ...) as prose, not as code items.
doc_markdown = "allow"
