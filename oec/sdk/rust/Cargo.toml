# Cargo workspace of the Rust SDK D2 (ADR-0011, ADR-0023, ADR-0026 proposed).
# Members grow with the P4 increments: oec-core (sans-IO protocol logic) now,
# oec (runtime + public API, ADR-0020) and oec-ffi (C ABI, ADR-0021) later.
# The P3 sketch and spikes stay stand-alone crates with their own lock files
# until the crate `oec` replaces them (ADR-0020 §1).
[workspace]
resolver = "3"
members = ["oec-core"]
exclude = ["sketch", "spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
repository = "https://github.com/OI4/oec"

[workspace.dependencies]
# Runtime dependencies of oec-core (ADR-0023, ADR-0026: I/O-free crates only).
oec-core = { path = "oec-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
# =-pinned together with the schema gate oec/schema/tools/rust-check
# (ADR-0019 §8, ADR-0023).
jsonschema = { version = "=0.60.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Doc comments use the CamelCase terms of the guideline (ManufacturerUri,
# PublicationList, ...) as prose, not as code items.
doc_markdown = "allow"
