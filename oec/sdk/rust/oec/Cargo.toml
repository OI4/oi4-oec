[package]
name = "oec"
description = "OI4 OEC v2 SDK (D2): the public API of ADR-0020 – choose the Messaging compliance level, describe the application, the SDK does the protocol. Wraps the sans-IO core `oec-core`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Validates against the embedded D1 schemas (ADR-0019 §7, ADR-0020 §13,
# ADR-0023): on in the SDK's own tests and examples.
strict-validation = ["oec-core/strict-validation"]

[dependencies]
oec-core.workspace = true
thiserror.workspace = true
log.workspace = true
serde_json.workspace = true

[lints]
workspace = true
