[package]
name = "oec-ffi"
description = "OI4 OEC v2 SDK (D2): the C ABI of ADR-0021 over the Rust API `oec` – opaque handles, builder setters, JSON values; the header include/oec.h is generated by cbindgen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
# Shared and static library for C (ADR-0021 §9); rlib for the Rust tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["crypto-aws-lc-rs"]
# The crypto provider of oec (ADR-0023 §1), passed through.
crypto-aws-lc-rs = ["oec/crypto-aws-lc-rs"]
crypto-ring = ["oec/crypto-ring"]
# Validates against the embedded D1 schemas (ADR-0020 §13).
strict-validation = ["oec/strict-validation"]

[dependencies]
oec = { path = "../oec", default-features = false }
serde.workspace = true
serde_json.workspace = true
# The runtime of oec_app_start (a current_thread runtime on an SDK thread).
tokio.workspace = true

[dev-dependencies]
# The in-process TLS test broker of oec (oec/tests/testbroker, ADR-0023
# amendment C-050).
oec-core.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
pkcs8.workspace = true

# The test broker of the Go SDK tests (oec/sdk/go, ADR-0027 §9): the test
# broker above as a program, built by oec/sdk/check.sh.
[[example]]
name = "go-testbroker"
path = "tests/go/testbroker.rs"
test = false

# The workspace lints, but `unsafe_code` is `deny` instead of `forbid`: each
# FFI module allows it with a reason (ADR-0021, ADR-0026 §4).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
